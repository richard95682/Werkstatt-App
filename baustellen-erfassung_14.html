<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ---------------------------- CLOUD-SYNC (Firebase) ---------------------------- */
const WERKSTATT_ID = 'eqeig2timcdpjoqsr6t7zkkn';
const firebaseConfig = {
  apiKey: "AIzaSyDjfTAg4lSNT0hNd49BoA0sdxp2hE0GEdg",
  authDomain: "werkstatt-sync-8aafb.firebaseapp.com",
  projectId: "werkstatt-sync-8aafb",
  storageBucket: "werkstatt-sync-8aafb.firebasestorage.app",
  messagingSenderId: "318676868019",
  appId: "1:318676868019:web:a67a3ff720164b6b5109c6"
};
let cloudDb = null, cloudVerbunden = false;
try{
  firebase.initializeApp(firebaseConfig);
  cloudDb = firebase.firestore();
  cloudDb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // erlaubt Warteschlange bei fehlendem Internet, sendet automatisch nach, sobald wieder online
  cloudVerbunden = true;
}catch(e){ console.warn('Cloud-Sync nicht verfügbar:', e); }
const cloudPfad = teil => cloudDb.collection('werkstaetten').doc(WERKSTATT_ID).collection(teil);
async function cloudSchreibeZeit(eintrag){
  if(!cloudVerbunden) return;
  try{ await cloudPfad('zeiten').doc(eintrag.id).set(eintrag); }
  catch(err){ console.warn('Cloud-Sync (Zeit) fehlgeschlagen, bleibt aber lokal gespeichert:', err); }
}
async function cloudSchreibeMaterial(eintrag){
  if(!cloudVerbunden) return;
  try{ await cloudPfad('material').doc(eintrag.id).set(eintrag); }
  catch(err){ console.warn('Cloud-Sync (Material) fehlgeschlagen, bleibt aber lokal gespeichert:', err); }
}
async function cloudSchreibeKantenIst(auftragId, daten){
  if(!cloudVerbunden) return;
  try{ await cloudPfad('kantenIst').doc(auftragId).set(daten); }
  catch(err){ console.warn('Cloud-Sync (Kanten) fehlgeschlagen, bleibt aber lokal gespeichert:', err); }
}
async function neueZeitErfassung(eintrag){
  DB.zeiten.push(eintrag);
  await cloudSchreibeZeit(eintrag); // bewusst abgewartet, bevor die App-Oberfläche weitermacht — verhindert, dass ein
  // schnelles Schließen der App direkt nach dem Speichern (typisch nach Stoppuhr-Stopp) die Cloud-Übertragung abbricht
  return eintrag;
}
async function neueMaterialErfassung(eintrag){
  DB.material.push(eintrag);
  await cloudSchreibeMaterial(eintrag);
  return eintrag;
}
let cloudNachholSyncLief = false;
async function cloudNachholSync(){
  // Sendet ALLE lokal vorhandenen Zeiten/Material einmalig nach — wichtig für Einträge, die entstanden sind,
  // bevor die Cloud-Anbindung überhaupt existierte (die kamen beim ursprünglichen Erfassen ja nie in die Cloud).
  // .set() ist idempotent (überschreibt anhand der ID), mehrfaches Ausführen ist unbedenklich, keine Duplikate.
  // WICHTIG: Löscht absichtlich NICHTS in der Cloud — das würde bei leerem lokalen Speicher (z.B. neues Gerät,
  // App-Reset) sonst versehentlich ALLE Cloud-Daten löschen. Einzelne Löschungen laufen bereits sicher über
  // die jeweiligen ✕-Buttons direkt beim Löschen.
  if(!cloudVerbunden || cloudNachholSyncLief) return;
  cloudNachholSyncLief = true;
  try{
    for(const z of DB.zeiten){ await cloudPfad('zeiten').doc(z.id).set(z); }
    for(const m of DB.material){ await cloudPfad('material').doc(m.id).set(m); }
    for(const [auftragId, daten] of Object.entries(DB.kantenIst||{})){
      await cloudPfad('kantenIst').doc(auftragId).set({auftragId, ...daten, aktualisiertAm:new Date().toISOString()});
    }
  }catch(err){ console.warn('Cloud-Nachhol-Sync fehlgeschlagen:', err); }
}
let cloudAuftraegeListenerAktiv = false;
function cloudAuftraegeListenerStarten(){
  if(!cloudVerbunden || cloudAuftraegeListenerAktiv) return;
  cloudAuftraegeListenerAktiv = true;
  cloudPfad('auftraege').onSnapshot(snap=>{
    let geaendert = false;
    snap.docChanges().forEach(change=>{
      if(change.type==='removed'){
        const nochDa = DB.auftraege.some(a=>a.id===change.doc.id);
        if(nochDa){
          DB.auftraege = DB.auftraege.filter(a=>a.id!==change.doc.id);
          if(DB.aktiverAuftragId===change.doc.id) DB.aktiverAuftragId = null;
          geaendert = true;
        }
        return;
      }
      const cloudAuftrag = {id:change.doc.id, ...change.doc.data()};
      const bestehend = DB.auftraege.find(a=>a.id===cloudAuftrag.id);
      if(bestehend){
        bestehend.name = cloudAuftrag.name; bestehend.kunde = cloudAuftrag.kunde; bestehend.status = cloudAuftrag.status||'Kalkulation';
        bestehend.sollProSchritt = cloudAuftrag.sollProSchritt||{};
        bestehend.materialien = cloudAuftrag.materialien||[]; bestehend.beschlaege = cloudAuftrag.beschlaege||[];
      } else {
        DB.auftraege.push({id:cloudAuftrag.id, name:cloudAuftrag.name, kunde:cloudAuftrag.kunde, status:cloudAuftrag.status||'Kalkulation', sollProSchritt:cloudAuftrag.sollProSchritt||{}, materialien:cloudAuftrag.materialien||[], beschlaege:cloudAuftrag.beschlaege||[]});
      }
      geaendert = true;
    });
    if(geaendert){ speichereJetzt(); render(); }
  }, err=>console.warn('Cloud-Aufträge-Listener Fehler:', err));
  cloudPfad('katalog').doc('aktuell').onSnapshot(doc=>{
    if(!doc.exists) return;
    const daten = doc.data();
    DB.materialKatalog = daten.materialKatalog || [];
    DB.beschlagKatalog = daten.beschlagKatalog || [];
    speichereJetzt();
    render();
  }, err=>console.warn('Cloud-Katalog-Listener Fehler:', err));
}
</script>

<script>
window.addEventListener('error', e=>{
  console.error('Unerwarteter Fehler:', e.error||e.message);
  if(document.getElementById('app') && document.getElementById('app').children.length){
    alert('⚠️ Unerwarteter Fehler: ' + (e.error?.message||e.message) + '\n\nBitte prüfe, ob die App in echtem Safari läuft (nicht in einer Vorschau/privatem Modus) und lade sie ggf. neu.');
  }
});
/* ============================= SPEICHER (IndexedDB) ============================= */
let DBH = null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const timeoutId = setTimeout(()=>{
      reject(new Error('IndexedDB antwortet nicht (Zeitüberschreitung) — vermutlich blockiert diese Ansicht den lokalen Speicher.'));
    }, 4000);
    let req;
    try{
      req = indexedDB.open('baustellen_erfassung_db', 1);
    }catch(err){
      clearTimeout(timeoutId);
      reject(err);
      return;
    }
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    req.onsuccess = e=>{ clearTimeout(timeoutId); DBH = e.target.result; resolve(); };
    req.onerror = ()=>{ clearTimeout(timeoutId); reject(req.error); };
  });
}
function idbGet(key){
  return new Promise((resolve,reject)=>{
    const tx = DBH.transaction('kv','readonly'); const st = tx.objectStore('kv');
    const r = st.get(key);
    r.onsuccess = ()=>resolve(r.result); r.onerror = ()=>reject(r.error);
  });
}
function idbSet(key,val){
  return new Promise((resolve,reject)=>{
    const tx = DBH.transaction('kv','readwrite'); const st = tx.objectStore('kv');
    const r = st.put(val,key);
    r.onsuccess = ()=>resolve(); r.onerror = ()=>reject(r.error);
  });
}

const STANDARD_SCHRITTE = ['AV','Zuschnitt','Kanten','Zusammenbau','CNC-Bearbeitung','Oberfläche'];
const BAUSTELLE_SCHRITT = 'Baustellenmontage';
function alleSchritte(){
  const a = aktuellerAuftrag();
  // Grundliste: Bei vorhandener Kalkulation aus MöbelKalk die dort geplanten Fertigungsschritte,
  // sonst die generische Standardliste (z.B. bei direkt in der App angelegten Aufträgen).
  const grundliste = (a?.sollProSchritt && Object.keys(a.sollProSchritt).length) ? Object.keys(a.sollProSchritt) : STANDARD_SCHRITTE;
  // Eigene, für DIESEN Auftrag manuell verwendete Sonder-Schritte bleiben zusätzlich bestehen — nur
  // Schritte von einem GANZ ANDEREN Auftrag werden nicht mit übernommen.
  const eigene = [...new Set(DB.zeiten.filter(z=>z.auftragId===a?.id).map(z=>z.schritt).filter(s=>s && !grundliste.includes(s)))];
  return [...grundliste, ...eigene];
}

const DB = {
  mitarbeiter: '',
  bekannteMitarbeiter: [],  // Namen, zwischen denen gewechselt werden kann (z.B. aus MöbelKalk importiert oder manuell ergänzt)
  materialKatalog: [],      // alle Materialnamen aus MöbelKalk (nicht nur die des aktuellen Auftrags)
  beschlagKatalog: [],       // [{name, einheit}] alle Beschläge aus MöbelKalk
  auftraege: [],       // {id, name, kunde}
  aktiverAuftragId: null,
  zeiten: [],          // {id, auftragId, mitarbeiter, datum, schritt, dauerMin, notiz, quelle:'stoppuhr'|'manuell'}
  material: [],         // {id, auftragId, mitarbeiter, datum, bezeichnung, menge, einheit}
  kantenIst: {},         // {[auftragId]: {lfm, puVerleimung}} — direkt an MöbelKalks Nachkalkulation übertragen
  fotos: [],            // {id, auftragId, mitarbeiter, datum, dataUrl, notiz}
  stoppuhr: null,        // {startZeit, auftragId, schritt, pausiertSeit, pausenMs} oder null
  exportiertBis: null,   // ISO-Zeitstempel der letzten Export-Erstellung (nur Info)
  nurFertigungAnzeigen: false, // Filter: nur Aufträge zeigen, die in MöbelKalk auf "Fertigung" stehen
};

async function ladeAlles(){
  const gespeichert = await idbGet('daten');
  if(gespeichert) Object.assign(DB, gespeichert);
}
let speicherTimer = null;
function speichereBald(){
  if(speicherTimer) clearTimeout(speicherTimer);
  speicherTimer = setTimeout(speichereJetzt, 250);
}
async function speichereJetzt(versuch=1){
  if(speicherTimer){ clearTimeout(speicherTimer); speicherTimer = null; }
  const { mitarbeiter, auftraege, aktiverAuftragId, zeiten, material, kantenIst, fotos, stoppuhr, exportiertBis } = DB;
  try{
    await idbSet('daten', { mitarbeiter, auftraege, aktiverAuftragId, zeiten, material, kantenIst, fotos, stoppuhr, exportiertBis });
  }catch(err){
    const nachricht = String(err?.message||err);
    // "Script execution context has stopped" passiert meist harmlos, wenn die Seite kurz pausiert wird
    // (z.B. während sich ein Download-/Teilen-Dialog öffnet) — hier automatisch nochmal versuchen, statt sofort zu alarmieren.
    const istVoruebergehend = nachricht.includes('execution context') || nachricht.includes('context has stopped');
    if(istVoruebergehend && versuch<4){
      setTimeout(()=>speichereJetzt(versuch+1), versuch*400);
      return;
    }
    alert('⚠️ Speichern fehlgeschlagen: ' + nachricht + '\n\nDeine Eingabe ist evtl. nicht dauerhaft gesichert. Bitte prüfe, ob die App im privaten Modus läuft (das blockiert lokale Speicherung) und öffne sie ggf. normal in Safari.');
  }
}

function fmtDatum(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});
}
function fmtDauer(min){
  const h = Math.floor(min/60), m = Math.round(min%60);
  return h>0 ? `${h} Std. ${m>0?m+' Min.':''}`.trim() : `${m} Min.`;
}
function fmtUhrzeit(ms){
  const totalSek = Math.floor(ms/1000);
  const h = String(Math.floor(totalSek/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSek%3600)/60)).padStart(2,'0');
  const s = String(totalSek%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function fmtUhrzeitHHMM(zeitstempelMs){
  const d = new Date(zeitstempelMs);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function eingabeDialog({titel, label, wert='', typ='text', abbrechenText='Abbrechen', okText='Übernehmen'}){
  return new Promise(resolve=>{
    const backdrop = document.createElement('div');
    backdrop.className = 'sheet-backdrop';
    backdrop.innerHTML = `<div class="sheet">
      <div class="sheet-handle"></div>
      <h3>${titel}</h3>

      </div>
    </div>`;
    document.body.appendChild(backdrop);
    const feld = backdrop.querySelector('#eingabe_dialog_feld');
    feld.focus(); feld.select();
    const schliessen = ergebnis=>{ backdrop.remove(); resolve(ergebnis); };
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) schliessen(null); });
    backdrop.querySelector('#eingabe_dialog_abbrechen').addEventListener('click', ()=>schliessen(null));
    backdrop.querySelector('#eingabe_dialog_ok').addEventListener('click', ()=>schliessen(feld.value));

  });

let gewaehlterSchritt = null; // aktuell im UI ausgewählter Fertigungsschritt (nicht gespeichert, nur UI-Status)

function stoppuhrElapsedMs(){
  if(!DB.stoppuhr) return 0;
  const angesammelt = DB.stoppuhr.angesammelteMs||0;
  if(DB.stoppuhr.pausiert) return angesammelt;
  return angesammelt + (Date.now()-DB.stoppuhr.startZeit);
}

function renderZeitTab(){
  const a = aktuellerAuftrag();
  const laeuft = DB.stoppuhr && DB.stoppuhr.auftragId===a.id;
  const pausiert = laeuft && DB.stoppuhr.pausiert;
  if(laeuft) gewaehlterSchritt = DB.stoppuhr.schritt;
  const verfuegbareSchritte = alleSchritte();
  if(!gewaehlterSchritt || !verfuegbareSchritte.includes(gewaehlterSchritt)) gewaehlterSchritt = verfuegbareSchritte[0];
  const istBaustelle = gewaehlterSchritt === BAUSTELLE_SCHRITT;
  const eintraege = DB.zeiten.filter(z=>z.auftragId===a.id).sort((x,y)=>y.datum.localeCompare(x.datum));
  const gesamtMin = eintraege.reduce((s,z)=>s+(z.dauerMin||0),0);
  // Zusammenfassung je Fertigungsschritt für diesen Auftrag
  const jeSchritt = {};
  eintraege.forEach(z=>{ jeSchritt[z.schritt] = (jeSchritt[z.schritt]||0) + (z.dauerMin||0); });
  const sollAktuellerSchritt = a.sollProSchritt?.[gewaehlterSchritt];
  const istAktuellerSchritt = (jeSchritt[gewaehlterSchritt]||0)/60;
  const kmGesamt = eintraege.filter(z=>z.schritt===BAUSTELLE_SCHRITT).reduce((s,z)=>s+(z.km||0),0);

  return `
    <div class="card">
      <h2>Fertigungsschritt</h2>
      <div class="schritt-chips">
        ${verfuegbareSchritte.map(s=>`<button class="chip ${s===gewaehlterSchritt?'active':''}" data-schritt="${escapeHtml(s)}" ${laeuft?'disabled':''}>${escapeHtml(s)}</button>`).join('')}
        <button class="chip chip-neu" id="schritt_neu_btn" ${laeuft?'disabled':''}>+ eigener</button>
      </div>
      <div class="schritt-chips" style="margin-top:8px">
        <button class="chip chip-baustelle ${istBaustelle?'active':''}" data-schritt="${BAUSTELLE_SCHRITT}" ${laeuft?'disabled':''}>🚐 Baustellenmontage</button>
      </div>
      ${sollAktuellerSchritt!==undefined ? `<div class="soll-vergleich">
        <span>Soll ${sollAktuellerSchritt.toFixed(2)} Std.</span>
        <span class="trenner">·</span>
        <span>Ist ${istAktuellerSchritt.toFixed(2)} Std.</span>
        <span class="trenner">·</span>
        <span class="${istAktuellerSchritt>sollAktuellerSchritt?'ueber':'unter'}">Δ ${(istAktuellerSchritt-sollAktuellerSchritt).toFixed(2)} Std.</span>
      </div>` : ''}
      ${istBaustelle && kmGesamt>0 ? `<div class="soll-vergleich"><span>🚐 Bisher erfasste Kilometer: <b>${kmGesamt} km</b></span></div>` : ''}
    </div>
    <div class="card">
      <h2>Stoppuhr — ${escapeHtml(gewaehlterSchritt)}</h2>
      <div class="stoppuhr">
        <div class="zeit" id="stoppuhr_anzeige">${laeuft ? fmtUhrzeit(stoppuhrElapsedMs()) : '00:00:00'}</div>
        <div class="status">${laeuft ? (pausiert ? '⏸ pausiert' : 'läuft') : 'bereit'}</div>
      </div>
      ${laeuft ? `
      <div class="btn-row" style="margin-top:16px">
        <button class="btn ${pausiert?'primary':''}" style="flex:1;padding:16px" id="stoppuhr_pause_btn">${pausiert ? '▶ Weiter' : '⏸ Pause'}</button>
        <button class="btn danger" style="flex:1;padding:16px" id="stoppuhr_btn">⏹ Stoppen</button>
      </div>` : `
      <button class="big-btn start" id="stoppuhr_btn">▶ Starten</button>`}
    </div>
    <div class="card">
      <h2>Manuell eintragen — ${escapeHtml(gewaehlterSchritt)}</h2>
      <div class="field-row">
        <div><label>Stunden</label><input id="man_std" type="number" min="0" step="0.25" inputmode="decimal" placeholder="0"></div>
        <div><label>Datum</label><input id="man_datum" type="date" value="${heute()}"></div>
      </div>
      ${istBaustelle ? `<label>Kilometer (Fahrtstrecke)</label><input id="man_km" type="number" min="0" step="1" inputmode="numeric" placeholder="0">` : ''}
      <label>Notiz (optional)</label>
      <input id="man_notiz" placeholder="z. B. Sonderanfertigung Griffe …">
      <button class="btn primary full" id="man_add">+ Hinzufügen</button>
    </div>
    <div class="card">
      <h2>Erfasste Zeit — ${escapeHtml(a.name)}</h2>
      <div class="stat-row" style="margin-bottom:12px">
        <div class="stat"><div class="n">${(gesamtMin/60).toFixed(1)}</div><div class="l">Std. gesamt</div></div>
        <div class="stat"><div class="n">${eintraege.length}</div><div class="l">Einträge</div></div>
      </div>
      ${Object.keys(jeSchritt).length ? `<div class="schritt-summary">
        ${Object.entries(jeSchritt).map(([s,min])=>`<div class="schritt-summary-row"><span>${escapeHtml(s)}</span><b>${(min/60).toFixed(2)} Std.</b></div>`).join('')}
      </div>` : ''}
      ${(()=>{
        // Nach Tag + Tätigkeit gruppieren, statt jeden einzelnen Stoppuhr-/Manuell-Eintrag separat aufzulisten
        const gruppen = {};
        eintraege.forEach(z=>{
          const key = z.datum+'|'+z.schritt;
          if(!gruppen[key]) gruppen[key] = {datum:z.datum, schritt:z.schritt, dauerMin:0, km:0, mitarbeiterSet:new Set(), notizen:[], ids:[], startZeit:z.startZeit, endZeit:z.endZeit};
          gruppen[key].dauerMin += (z.dauerMin||0);
          gruppen[key].km += (z.km||0);
          gruppen[key].mitarbeiterSet.add(z.mitarbeiter);
          if(z.notiz) gruppen[key].notizen.push(z.notiz);
          gruppen[key].ids.push(z.id);
        });
        const gruppenListe = Object.values(gruppen).sort((x,y)=>y.datum.localeCompare(x.datum));
        // Tagesgesamt je Datum berechnen, um es zusätzlich als eigene Zeile pro Tag einzufügen
        const tagesgesamt = {};
        gruppenListe.forEach(g=>{ tagesgesamt[g.datum] = (tagesgesamt[g.datum]||0) + g.dauerMin; });
        let letztesDatum = null;
        return gruppenListe.length ? gruppenListe.map(g=>{
          const tagWechsel = g.datum !== letztesDatum;
          letztesDatum = g.datum;
          const monatKurz = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][parseInt(g.datum.slice(5,7),10)-1];
          const tagNr = parseInt(g.datum.slice(8,10),10);
          // Start-/Endzeit bei jedem Einzeleintrag anzeigen (auch nachträglich eintragbar, falls noch nicht
          // gespeichert) — bei mehreren zusammengefassten Einträgen wäre eine einzelne Zeit nicht eindeutig.
          const zeitenEditierbar = g.ids.length===1;
          return `${tagWechsel ? `<div class="checkline" style="border-top:1px dashed var(--line);padding-top:8px;margin-top:8px"><b class="small">${fmtDatum(g.datum)}</b><span class="small" style="margin-left:auto;opacity:.75">Tagesgesamt: ${fmtDauer(tagesgesamt[g.datum])}</span></div>` : ''}
          <div class="listitem">
            <div class="icon" style="flex-direction:column;line-height:1;padding:2px 0">
              <span style="font-size:8px;font-weight:700;color:var(--danger,#c0504d);text-transform:uppercase">${monatKurz}</span>
              <span style="font-size:15px;font-weight:800">${tagNr}</span>
            </div>
            <div class="main">
              <div class="title">${escapeHtml(g.schritt)} · ${fmtDauer(g.dauerMin)}${g.km?` · ${g.km} km`:''}</div>
              <div class="meta">${[...g.mitarbeiterSet].map(escapeHtml).join(', ')}${g.notizen.length?' · '+g.notizen.map(escapeHtml).join('; '):''}${g.ids.length>1?` · ${g.ids.length} Einträge`:''}</div>
              ${zeitenEditierbar ? `<div style="display:flex;align-items:center;gap:6px;margin-top:4px">
                <input type="time" value="${g.startZeit||''}" data-zeit-start="${g.ids[0]}" style="width:auto;margin:0;padding:5px 8px;font-size:13px">
                <span class="small">–</span>
                <input type="time" value="${g.endZeit||''}" data-zeit-end="${g.ids[0]}" style="width:auto;margin:0;padding:5px 8px;font-size:13px">
                ${!g.startZeit ? `<span class="small" style="opacity:.6">← Uhrzeit eintragen</span>` : ''}
              </div>` : ''}
            </div>
            <div class="del" data-del-zeitgruppe="${g.ids.join(',')}">✕</div>
          </div>`;}).join('') : `<div class="empty">Noch keine Zeit erfasst.</div>`;
      })()}
    </div>`;
}
function bindZeitTab(){
  const a = aktuellerAuftrag();
  document.querySelectorAll('[data-schritt]').forEach(b=>b.addEventListener('click', ()=>{
    if(DB.stoppuhr) return;
    gewaehlterSchritt = b.dataset.schritt;
    render();
  }));
  document.getElementById('schritt_neu_btn').addEventListener('click', async ()=>{
    if(DB.stoppuhr) return;
    const neu = await eingabeDialog({titel:'Neuer Fertigungsschritt', label:'Name', okText:'Anlegen'});
    if(neu && neu.trim()){ gewaehlterSchritt = neu.trim(); render(); }
  });

  document.getElementById('stoppuhr_btn').addEventListener('click', async ()=>{
    if(DB.stoppuhr && DB.stoppuhr.auftragId===a.id){
      const dauerMin = stoppuhrElapsedMs()/60000;
      if(dauerMin>=0.5){
        let km = 0;
        if(DB.stoppuhr.schritt===BAUSTELLE_SCHRITT){
          const kmEingabe = await eingabeDialog({titel:'Kilometer erfassen', label:'Fahrtstrecke (km)', wert:'0', typ:'number', okText:'Speichern'});
          km = parseFloat(kmEingabe)||0;
        }
        const startUhrzeit = fmtUhrzeitHHMM(DB.stoppuhr.startZeit);
        const endUhrzeit = fmtUhrzeitHHMM(Date.now());
        await neueZeitErfassung({id:uid(), auftragId:a.id, mitarbeiter:DB.mitarbeiter, datum:heute(), schritt:DB.stoppuhr.schritt, dauerMin:Math.round(dauerMin*4)/4, km, notiz:'', quelle:'stoppuhr', startZeit:startUhrzeit, endZeit:endUhrzeit});
      }
      DB.stoppuhr = null;
      if(stoppuhrIntervall){ clearInterval(stoppuhrIntervall); stoppuhrIntervall=null; }
      await speichereJetzt();
      render();
      zeigeToast('Zeit gespeichert ✓');
    } else {
      DB.stoppuhr = {startZeit:Date.now(), auftragId:a.id, schritt:gewaehlterSchritt, pausiert:false, angesammelteMs:0};
      await speichereJetzt();
      render();
      starteStoppuhrAnzeige();
    }
  });
  document.getElementById('stoppuhr_pause_btn')?.addEventListener('click', async ()=>{
    if(!DB.stoppuhr) return;
    if(DB.stoppuhr.pausiert){
      // Weiter: neuer Zeitabschnitt beginnt jetzt
      DB.stoppuhr.startZeit = Date.now();
      DB.stoppuhr.pausiert = false;
      starteStoppuhrAnzeige();
    } else {
      // Pause: aktuellen Abschnitt einrechnen und anhalten
      DB.stoppuhr.angesammelteMs = (DB.stoppuhr.angesammelteMs||0) + (Date.now()-DB.stoppuhr.startZeit);
      DB.stoppuhr.pausiert = true;
      if(stoppuhrIntervall){ clearInterval(stoppuhrIntervall); stoppuhrIntervall=null; }
    }
    await speichereJetzt();
    render();
  });
  if(DB.stoppuhr && DB.stoppuhr.auftragId===a.id && !DB.stoppuhr.pausiert) starteStoppuhrAnzeige();

  document.getElementById('man_add').addEventListener('click', async ()=>{
    const std = parseFloat(document.getElementById('man_std').value);
    if(!std || std<=0) return;
    const datum = document.getElementById('man_datum').value || heute();
    const notiz = document.getElementById('man_notiz').value.trim();
    const kmFeld = document.getElementById('man_km');
    const km = kmFeld ? (parseFloat(kmFeld.value)||0) : 0;
    await neueZeitErfassung({id:uid(), auftragId:a.id, mitarbeiter:DB.mitarbeiter, datum, schritt:gewaehlterSchritt, dauerMin:std*60, km, notiz, quelle:'manuell'});
    await speichereJetzt();
    render();
    zeigeToast('Eingetragen ✓');
  });
  document.querySelectorAll('[data-del-zeitgruppe]').forEach(b=>b.addEventListener('click', async ()=>{
    const ids = b.dataset.delZeitgruppe.split(',');
    if(ids.length>1){
      const ok = await bestaetigenDialog({titel:'Ganzen Tag löschen?', text:`Diese Zusammenfassung enthält ${ids.length} einzelne Erfassungen. Wirklich alle zusammen löschen?`});
      if(!ok) return;
    }
    DB.zeiten = DB.zeiten.filter(z=>!ids.includes(z.id));
    if(cloudVerbunden){
      for(const id of ids){
        try{ await cloudPfad('zeiten').doc(id).delete(); }
        catch(err){ console.warn('Cloud-Löschen (Zeit) fehlgeschlagen:', err); }
      }
    }
    await speichereJetzt(); render();
  }));
  const aktualisiereZeitAusUhrzeiten = async (id) => {
    const z = DB.zeiten.find(x=>x.id===id);
    if(!z) return;
    const startFeld = document.querySelector(`[data-zeit-start="${id}"]`);
    const endFeld = document.querySelector(`[data-zeit-end="${id}"]`);
    if(!startFeld?.value || !endFeld?.value) return;
    const [startH, startM] = startFeld.value.split(':').map(Number);
    const [endH, endM] = endFeld.value.split(':').map(Number);
    let dauerMin = (endH*60+endM) - (startH*60+startM);
    if(dauerMin<0) dauerMin += 24*60; // über Mitternacht hinweg (selten, aber möglich)
    z.startZeit = startFeld.value; z.endZeit = endFeld.value; z.dauerMin = dauerMin;
    await speichereJetzt();
    if(cloudVerbunden){
      try{ await cloudPfad('zeiten').doc(id).set(z); }
      catch(err){ console.warn('Cloud-Update (Zeit-Uhrzeiten) fehlgeschlagen:', err); }
    }
    render();
  };
  document.querySelectorAll('[data-zeit-start]').forEach(inp=>inp.addEventListener('change', ()=>aktualisiereZeitAusUhrzeiten(inp.dataset.zeitStart)));
  document.querySelectorAll('[data-zeit-end]').forEach(inp=>inp.addEventListener('change', ()=>aktualisiereZeitAusUhrzeiten(inp.dataset.zeitEnd)));
}
function starteStoppuhrAnzeige(){
  if(stoppuhrIntervall) clearInterval(stoppuhrIntervall);
  stoppuhrIntervall = setInterval(()=>{
    const el = document.getElementById('stoppuhr_anzeige');
    if(!el || !DB.stoppuhr || DB.stoppuhr.pausiert){ clearInterval(stoppuhrIntervall); return; }
    el.textContent = fmtUhrzeit(stoppuhrElapsedMs());
  }, 1000);
}

      ${(DB.materialKatalog.length || DB.beschlagKatalog.length) ? `<button class="btn ghost full" id="katalog_such_btn" style="margin-bottom:14px">🔍 Andere Materialien/Beschläge wählen</button>` : ''}

function bindMaterialTab(){
  const a = aktuellerAuftrag();
  function speichereKantenIst(){
    const lfm = parseFloat(document.getElementById('kanten_lfm').value)||0;
    const puVerleimung = document.getElementById('kanten_pu').checked;
    if(!DB.kantenIst) DB.kantenIst = {};
    DB.kantenIst[a.id] = {lfm, puVerleimung};
    speichereJetzt();
    cloudSchreibeKantenIst(a.id, {auftragId:a.id, lfm, puVerleimung, aktualisiertAm:new Date().toISOString()});
  }
  document.getElementById('kanten_lfm').addEventListener('change', speichereKantenIst);
  document.getElementById('kanten_pu').addEventListener('change', speichereKantenIst);
  function pruefeStueckUmrechnung(){
    const bez = document.getElementById('mat_bez').value.trim().toLowerCase();
    const treffer = DB.materialKatalog.find(m=>m.name.toLowerCase()===bez && m.m2ProStueck>0);
    const zeile = document.getElementById('mat_stueck_zeile');
    if(treffer){
      zeile.style.display = '';
      document.getElementById('mat_stueck_hinweis').textContent = `1 Stück = ${treffer.m2ProStueck.toString().replace('.',',')} m² (aus MöbelKalk hinterlegt)`;
      zeile.dataset.m2ProStueck = treffer.m2ProStueck;
    } else {
      zeile.style.display = 'none';
      document.getElementById('mat_stueck').value = '';
    }
  }
  document.getElementById('mat_bez').addEventListener('input', pruefeStueckUmrechnung);
  pruefeStueckUmrechnung();
  document.getElementById('mat_stueck').addEventListener('input', e=>{
    const m2ProStueck = parseFloat(document.getElementById('mat_stueck_zeile').dataset.m2ProStueck)||0;
    const stk = parseFloat(e.target.value)||0;
    document.getElementById('mat_menge').value = stk && m2ProStueck ? (stk*m2ProStueck).toFixed(2) : '';
    const einheitSelect = document.getElementById('mat_einheit');
    if([...einheitSelect.options].some(o=>o.value==='m²')) einheitSelect.value = 'm²';
  });
  document.querySelectorAll('[data-mat-schnellwahl]').forEach(chip=>chip.addEventListener('click', ()=>{
    document.getElementById('mat_bez').value = chip.dataset.matSchnellwahl;
    pruefeStueckUmrechnung();
    document.getElementById('mat_stueck_zeile').style.display!=='none' ? document.getElementById('mat_stueck').focus() : document.getElementById('mat_menge').focus();
  }));
  document.querySelectorAll('[data-besch-name-wahl]').forEach(span=>span.addEventListener('click', ()=>{
    document.getElementById('mat_bez').value = span.dataset.beschNameWahl;
    pruefeStueckUmrechnung();
    const einheitSelect = document.getElementById('mat_einheit');
    const einheit = span.dataset.beschNameEinheit;
    if(einheit && [...einheitSelect.options].some(o=>o.value===einheit)) einheitSelect.value = einheit;
    document.getElementById('mat_menge').focus();
  }));
  document.querySelectorAll('[data-besch-check]').forEach(cb=>cb.addEventListener('change', async e=>{
    if(!e.target.checked){
      // Absichtlich keine automatische Löschung — ein Häkchen entfernt nichts, nur "+ Hinzufügen" bzw. das ✕ in der Liste räumt auf.
      e.target.checked = true;
      return;
    }
    const bezeichnung = e.target.dataset.beschCheck;
    const menge = parseFloat(e.target.dataset.beschCheckMenge)||0;
    const einheit = e.target.dataset.beschCheckEinheit;
    await neueMaterialErfassung({id:uid(), auftragId:a.id, mitarbeiter:DB.mitarbeiter, datum:heute(), bezeichnung, menge, einheit});
    await speichereJetzt();
    render();
    zeigeToast(`${bezeichnung} · ${menge} ${einheit} eingetragen ✓`);
  }));
  document.getElementById('katalog_such_btn')?.addEventListener('click', oeffneKatalogSuche);
  document.getElementById('mat_add').addEventListener('click', async ()=>{
    const bezeichnung = document.getElementById('mat_bez').value.trim();
    const menge = parseFloat(document.getElementById('mat_menge').value);
    if(!bezeichnung || !menge) return;
    const einheit = document.getElementById('mat_einheit').value;
    await neueMaterialErfassung({id:uid(), auftragId:a.id, mitarbeiter:DB.mitarbeiter, datum:heute(), bezeichnung, menge, einheit});
    await speichereJetzt();
    render();
    zeigeToast('Eingetragen ✓');
  });
  document.querySelectorAll('[data-del-material]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.dataset.delMaterial;
    DB.material = DB.material.filter(m=>m.id!==id);
    if(cloudVerbunden){
      try{ await cloudPfad('material').doc(id).delete(); }
      catch(err){ console.warn('Cloud-Löschen (Material) fehlgeschlagen:', err); }
    }
    await speichereJetzt(); render();
  }));
  document.querySelectorAll('[data-menge-edit]').forEach(el=>el.addEventListener('click', async e=>{
    const eintrag = DB.material.find(m=>m.id===e.currentTarget.dataset.mengeEdit);
    if(!eintrag) return;
    const neueMenge = await eingabeDialog({titel:'Menge ändern', label:`${eintrag.bezeichnung} (${eintrag.einheit})`, wert:eintrag.menge, typ:'number', okText:'Speichern'});
    if(neueMenge===null) return;
    const wert = parseFloat(String(neueMenge).replace(',','.'));
    if(isNaN(wert) || wert<0) return;
    eintrag.menge = wert;

function verkleinereBild(file){
  return new Promise(resolve=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        const maxSeite = 1280;
        let {width, height} = img;
        if(width>height && width>maxSeite){ height = height*maxSeite/width; width = maxSeite; }
        else if(height>maxSeite){ width = width*maxSeite/height; height = maxSeite; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function spieleSicherungEin(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const daten = JSON.parse(text);
    if(daten.typ !== 'werkstatt-erfassung-sicherung'){
      alert('⚠️ Das ist keine gültige Sicherungsdatei dieser App.');
      return;
    }
    const ok = await bestaetigenDialog({titel:'Sicherung einspielen?', text:'Den aktuellen Stand auf diesem Handy komplett durch die Sicherung ersetzen? Nicht gesicherte, neuere Daten gehen dabei verloren.', okText:'Einspielen', gefaehrlich:true});
    if(!ok) return;
    DB.mitarbeiter = daten.mitarbeiter || DB.mitarbeiter;
    DB.bekannteMitarbeiter = daten.bekannteMitarbeiter || [];
    DB.materialKatalog = daten.materialKatalog || DB.materialKatalog;
    DB.beschlagKatalog = daten.beschlagKatalog || DB.beschlagKatalog;
    DB.auftraege = daten.auftraege || [];
    DB.zeiten = daten.zeiten || [];
    DB.material = daten.material || [];
    DB.fotos = daten.fotos || [];
    DB.stoppuhr = daten.stoppuhr || null;
    DB.exportiertBis = daten.exportiertBis || null;
    DB.aktiverAuftragId = null;
    await speichereJetzt();
    zeigeToast('Sicherung eingespielt ✓');
    render();
  }catch(err){
    alert('⚠️ Datei konnte nicht gelesen werden: ' + (err.message||err));
  }
}
/* ============================= TAB: KONTO (persönliches Zeitkonto) ============================= */
let kontoCloudDaten = null; // zuletzt aus der Cloud geladene Zeitkonto-Einstellungen (mitarbeiter1/2)
async function ladeKontoCloudDaten(){
  if(!cloudVerbunden) return null;
  try{
    const doc = await cloudPfad('zeitkonto').doc('aktuell').get();
    return doc.exists ? doc.data() : null;
  }catch(err){ console.warn('Zeitkonto-Laden fehlgeschlagen:', err); return null; }
}
function findeEigenenZeitkontoEintrag(daten){
  if(!daten || !DB.mitarbeiter) return null;
  const eigenerName = DB.mitarbeiter.trim().toLowerCase();
  if(daten.mitarbeiter1?.name && daten.mitarbeiter1.name.trim().toLowerCase()===eigenerName) return daten.mitarbeiter1;
  if(daten.mitarbeiter2?.name && daten.mitarbeiter2.name.trim().toLowerCase()===eigenerName) return daten.mitarbeiter2;
  return null;
}
function renderKontoTab(){
  if(!cloudVerbunden){
    return `<div class="card"><div class="empty"><div class="big">☁️</div>Keine Internetverbindung. Das Zeitkonto braucht eine Verbindung zur Cloud, um die aktuellen Werte zu holen.</div></div>`;
  }
  const eintrag = findeEigenenZeitkontoEintrag(kontoCloudDaten);
  if(!eintrag || !eintrag.monatslohn || !eintrag.satz){
    return `<div class="card"><div class="empty"><div class="big">📊</div>Kein Zeitkonto eingerichtet. Für deinen Namen ist in MöbelKalk noch kein Monatslohn/Stundenlohn hinterlegt — das müsste der Chef dort einmalig eintragen.</div></div>`;
  }
  const sollMonat = (eintrag.sollMonatManuell!==null && eintrag.sollMonatManuell!==undefined && eintrag.sollMonatManuell!=='') ? parseFloat(eintrag.sollMonatManuell) : eintrag.monatslohn/eintrag.satz;
  let monate = 1;
  if(eintrag.beginn){
    const start = new Date(eintrag.beginn), heute = new Date();
    monate = Math.max(1, (heute.getFullYear()-start.getFullYear())*12 + (heute.getMonth()-start.getMonth()) + 1);
  }
  const sollGesamt = sollMonat*monate;
  const istAutomatisch = (kontoIstAutomatisch||0);
  const istGesamt = istAutomatisch + (eintrag.basisStunden||0);
  const diff = istGesamt-sollGesamt;
  const balkenProzent = sollGesamt>0 ? Math.min(100, (istGesamt/sollGesamt)*100) : 0;
  return `<div class="card">
    <h2>📊 Mein Zeitkonto</h2>
    <div class="small" style="margin-bottom:14px">Läuft automatisch aus den in MöbelKalk hinterlegten Werten und deinen tatsächlich erfassten Stunden.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:14px;font-size:15px">
      <div>
        <div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;opacity:.6;margin-bottom:8px">Soll</div>
        <div style="margin-bottom:6px">Monate seit Beginn: <b>${monate}</b></div>
        <div style="margin-bottom:6px">Soll-Std./Monat: <b>${sollMonat.toFixed(1)}</b></div>
        <div>Soll-Stunden gesamt: <b>${fmtDauer(sollGesamt*60)}</b></div>
      </div>
      <div>
        <div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;opacity:.6;margin-bottom:8px">Ist</div>
        <div style="margin-bottom:6px">Automatisch erfasst: <b>${fmtDauer(istAutomatisch*60)}</b></div>
        ${eintrag.basisStunden ? `<div style="margin-bottom:6px">Basis-Stunden: <b>${fmtDauer(eintrag.basisStunden*60)}</b></div>` : ''}
        <div>Ist-Stunden gesamt: <b>${fmtDauer(istGesamt*60)}</b></div>
      </div>
    </div>
    <div style="background:var(--card-2);border-radius:8px;height:30px;overflow:hidden;position:relative;margin-bottom:8px">
      <div style="background:${diff>=0?'#7a9471':'#a4453a'};height:100%;width:${balkenProzent}%;transition:width .3s"></div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${fmtDauer(istGesamt*60)} / ${fmtDauer(sollGesamt*60)}</div>
    </div>
    <div style="font-size:14px">Δ <b style="color:${diff>=0?'#7a9471':'#a4453a'}">${diff>=0?'+':''}${fmtDauer(Math.abs(diff)*60)}</b> ${diff>=0?'über Soll':'unter Soll'}</div>
  </div>`;
}
let kontoIstAutomatisch = 0;
function bindKontoTab(){
  // Absichtlich leer: das eigentliche Laden passiert einmalig beim Tab-Wechsel (siehe bindTabbar),
  // nicht bei jedem Render-Durchlauf — sonst würde sich render() und das Nachladen gegenseitig endlos antriggern.

async function ladeKontoDatenUndRender(){

        .map(d=>d.data())
        .filter(z=>(z.mitarbeiter||'').trim().toLowerCase()===eigenerName)
        .reduce((sum,z)=>sum+(z.dauerMin||0)/60, 0);

  }
  if(aktiverTab==='konto') render(); // nur neu zeichnen, falls der Nutzer den Tab in der Zwischenzeit nicht verlassen hat
}

      zeiten: DB.zeiten.filter(z=>ausgewaehlteIds.has(z.auftragId)),

      fotos: DB.fotos.filter(f=>ausgewaehlteIds.has(f.auftragId)),

    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a2 = document.createElement('a');
    const datumStr = new Date().toISOString().slice(0,10);
    a2.href = url;
    a2.download = `Werkstatt-Export_${DB.mitarbeiter.replace(/\s+/g,'-')}_${datumStr}.json`;
    document.body.appendChild(a2); a2.click(); a2.remove();
    URL.revokeObjectURL(url);
    DB.exportiertBis = new Date().toISOString();

    render();
    zeigeToast('Export erstellt ✓');

  document.getElementById('sichern_btn').addEventListener('click', ()=>{
    const payload = {
      typ: 'werkstatt-erfassung-sicherung',

    document.body.appendChild(a3); a3.click(); a3.remove();
    URL.revokeObjectURL(url);
    zeigeToast('Sicherung erstellt ✓');

  document.getElementById('ruecksichern_btn').addEventListener('click', ()=>document.getElementById('ruecksichern_input').click());

/* ============================= HELPER ============================= */
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function bereinigeVerwaisteAuftraege(){
  // Der Echtzeit-Listener fängt Löschungen nur ab, während die App aktiv verbunden ist. War die App beim
  // Löschen in MöbelKalk geschlossen, bleibt der Auftrag sonst dauerhaft lokal hängen — hier beim Start
  // einmalig gegen den aktuellen Cloud-Stand abgleichen (analog zur Bereinigung auf der MöbelKalk-Seite).
  if(!cloudVerbunden || !DB.auftraege.length) return;
  try{
    const cloudSnap = await cloudPfad('auftraege').get();
    const cloudIds = new Set(cloudSnap.docs.map(d=>d.id));
    const vorherAnzahl = DB.auftraege.length;
    DB.auftraege = DB.auftraege.filter(a=>cloudIds.has(a.id));
    if(DB.auftraege.length!==vorherAnzahl){
      if(DB.aktiverAuftragId && !DB.auftraege.some(a=>a.id===DB.aktiverAuftragId)) DB.aktiverAuftragId = null;
      await speichereJetzt();
      render();
    }
  }catch(err){ console.warn('Abgleich verwaister Aufträge fehlgeschlagen:', err); }
}
(async function init(){
  try{
    await openDB();
    await ladeAlles();
    render();
    cloudAuftraegeListenerStarten();
    cloudNachholSync();
    bereinigeVerwaisteAuftraege();
  }catch(err){
    document.getElementById('app').innerHTML = `<div style="padding:30px;color:#f3ead9;font-family:sans-serif">
      <h2>⚠️ Start fehlgeschlagen</h2>
      <p>Die App konnte nicht korrekt starten. Das passiert manchmal, wenn die Seite in einer eingeschränkten Vorschau geöffnet wurde (z. B. direkt aus einer Nachricht/Mail) statt in echtem Safari, oder im privaten Modus.</p>
      <p style="opacity:.7;font-size:13px">Technische Meldung: ${err.message||err}</p>
      <p><b>Bitte:</b> Datei erst herunterladen, dann über die Dateien-App oder das Downloads-Symbol bewusst in Safari öffnen (nicht privater Modus), dann nochmal versuchen.</p>
    </div>`;
  }
})();
