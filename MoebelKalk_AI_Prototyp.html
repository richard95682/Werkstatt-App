<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MöbelKalk AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2ece0;
  --panel:#fbf7ef;
  --panel-2:#ffffff;
  --sidebar:#231b15;
  --sidebar-2:#332619;
  --sidebar-line:#4a3826;
  --accent:#b8763c;
  --accent-dark:#8f5a2a;
  --accent-soft:#e9d3b5;
  --sage:#77896c;
  --danger:#a4453a;
  --text:#241d16;
  --text-muted:#7a6c5c;
  --border:#e0d3bd;
  --shadow:0 1px 2px rgba(35,27,21,.06),0 8px 24px -12px rgba(35,27,21,.18);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
.mono{font-family:'JetBrains Mono',monospace;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px;flex-shrink:0;background:
    repeating-linear-gradient(180deg, var(--sidebar) 0px, var(--sidebar) 3px, var(--sidebar-2) 3px, var(--sidebar-2) 6px);
  color:#efe4d5;padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  border-right:1px solid var(--sidebar-line);
  position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px 8px;}
.brand-mark{width:34px;height:34px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow);}
.brand-text{font-family:'Space Grotesk';font-weight:700;font-size:15.5px;letter-spacing:.2px;line-height:1.1;}
.brand-text span{display:block;font-family:'Inter';font-weight:400;font-size:10.5px;color:#c9b79c;letter-spacing:.6px;text-transform:uppercase;margin-top:2px;}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#e4d7c2;background:transparent;border:none;text-align:left;font-size:13.5px;font-weight:500;cursor:pointer;font-family:'Inter';transition:.12s;}
.nav-btn:hover{background:rgba(255,255,255,.06);}
.nav-btn.active{background:var(--accent);color:#221a13;font-weight:600;}
.nav-icon{width:18px;text-align:center;font-size:15px;}
.sidebar-foot{margin-top:auto;padding:10px 8px;font-size:11px;color:#8f7f6a;border-top:1px solid var(--sidebar-line);padding-top:12px;}

/* Main */
.main{flex:1;padding:30px 38px;max-width:1180px;}
.view{display:none;animation:fade .18s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.pagehead h1{font-size:23px;margin:0 0 4px 0;font-weight:600;}
.pagehead p{margin:0;color:var(--text-muted);font-size:13.5px;}

.card{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px;}

/* Kompaktes Layout für die Kalkulation — alle Felder bleiben sichtbar, nur enger gesetzt */
.kalk-kompakt .card{padding:12px 16px;margin-bottom:10px;}
.kalk-kompakt .card h3{margin:0 0 8px 0;font-size:13px;}
.kalk-kompakt .field{margin-bottom:0;}
.kalk-kompakt label{margin-bottom:3px;font-size:10.5px;}
.kalk-kompakt .grid{gap:8px 10px;}
.kalk-kompakt .checkline{padding:4px 0;font-size:12.5px;}
.kalk-kompakt .small{font-size:11px;}
.kalk-kompakt input,.kalk-kompakt select{padding:6px 8px;font-size:12.5px;}
.kalk-kompakt .btn-row{margin-top:8px;gap:6px;}
.card h3{margin:0 0 14px 0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:800px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

label{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;font-family:'Inter';background:var(--panel);color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
/* Maßeingabe: Pfeile/Spinner entfernen, manuelle Eingabe bleibt möglich */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
.field{margin-bottom:2px;}
textarea{resize:vertical;min-height:60px;}

.btn{padding:9px 16px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter';display:inline-flex;align-items:center;gap:7px;}
.btn-primary{background:var(--accent);color:#231a12;}
.btn-primary:hover{background:var(--accent-dark);color:#fff;}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--panel);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px 10px;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
.table-compact th, .table-compact td{padding:4px 6px;}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.chip-anfrage{background:#e5e0d8;color:#5c5344;}
.chip-kalkulation{background:#e9d3b5;color:#8f5a2a;}
.chip-angebot{background:#d9e3d3;color:#4d6244;}
.chip-auftrag{background:#cfe0d8;color:#2f6249;}
.chip-fertigung{background:#dccfe8;color:#5f3f8f;}
.chip-fertig{background:#cfe8d3;color:#2f6b3a;}
.chip-abgeschlossen{background:#232323;color:#fff;}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(1,1fr);}}
.stat{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
.stat b{font-family:'Space Grotesk';font-size:22px;display:block;}
.stat span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;}

.hint{background:#f3ead9;border:1px solid var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:11px 14px;font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;}
.hint b{color:var(--accent-dark);}
.hint.warn{background:#f6e6df;border-color:#e2b8a4;border-left-color:var(--danger);}
.hint.ok{background:#e9efe4;border-color:#c6d8b8;border-left-color:var(--sage);}

.partlist{border:1px dashed var(--border);border-radius:10px;overflow:hidden;}
.parttotal{display:flex;justify-content:space-between;padding:12px 14px;background:var(--panel);font-weight:600;font-size:13.5px;border-top:2px dashed var(--border);}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv b{font-family:'JetBrains Mono';}
.kv.total{font-weight:700;font-size:16px;padding-top:12px;border-top:2px solid var(--text);margin-top:4px;}
.kv.total b{color:var(--accent-dark);}
.fotoGalerie{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px;}
.fotoThumb{position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:#fff;}
.fotoThumb img{width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer;}
.fotoThumb .fotoMeta{font-size:10.5px; color:var(--text-muted); padding:4px 6px; background:var(--panel-2);}
.fotoThumb .fotoDel{position:absolute; top:4px; right:4px; background:rgba(0,0,0,.55); color:#fff; border:none; width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:12px;}
.fotoLightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out;}
.fotoLightbox img{max-width:100%; max-height:100%; border-radius:8px;}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--accent-dark);border-bottom-color:var(--accent);}

.empty{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty div.ico{font-size:32px;margin-bottom:10px;}
.small{font-size:12px;color:var(--text-muted);}
.checkline{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.checkline:last-child{border-bottom:none;}
.checkline input[type=checkbox]{width:auto;}
.checkline input[type=number]{width:60px;padding:5px 6px;}
.qty-price{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--text-muted);font-size:12px;}
a.linklike{color:var(--accent-dark);cursor:pointer;font-weight:600;text-decoration:none;}
a.linklike:hover{text-decoration:underline;}
.badge-count{background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px;font-size:10.5px;margin-left:auto;}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d8c9ab;border-radius:6px}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">🪚</div>
      <div class="brand-text">MöbelKalk<span>Werkstatt · Prototyp</span></div>
    </div>
    <div id="sidebarProjektAuswahl" style="padding:0 4px 10px"></div>
    <div id="nav"></div>
    <button class="nav-btn" id="globalBackupBtn" style="border:1px solid var(--sidebar-line);margin-top:8px">💾 Alles sichern</button>
    <button class="nav-btn" id="globalRestoreBtn" style="border:1px solid var(--sidebar-line);margin-top:6px">⬆️ Alles zurücksichern</button>
    <input type="file" id="globalRestoreInput" accept=".json" style="display:none">
    <button class="nav-btn" id="globalCloudBackupBtn" style="border:1px solid var(--sidebar-line);margin-top:6px">☁️ Cloud-Daten sichern</button>
    <button class="nav-btn" id="globalCloudRestoreBtn" style="border:1px solid var(--sidebar-line);margin-top:6px;font-size:11px;opacity:.75">☁️⬆️ Cloud-Sicherung zurückschreiben</button>
    <input type="file" id="globalCloudRestoreInput" accept=".json" style="display:none">
    <button class="nav-btn" id="globalOrdnerBtn" style="border:1px solid var(--sidebar-line);margin-top:6px;font-size:11px;opacity:.75">📁 Sicherungsordner wählen</button>
    <div class="sidebar-foot" id="speicherHinweis">Lädt …</div>
    <div id="sicherungsStatus" style="padding:0 12px 10px"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ---------------------------- FEHLERANZEIGE (sichtbar ohne F12) ---------------------------- */
(function(){
  const meldungen = [];
  function zeige(text){
    meldungen.push(text);
    let el = document.getElementById('fehlerLeiste');
    if(!el){
      el = document.createElement('div'); el.id = 'fehlerLeiste';
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:100000;background:#7a1f12;color:#fff;font:12px/1.4 ui-monospace,Consolas,monospace;padding:8px 12px;max-height:35vh;overflow:auto';
      document.body.appendChild(el);
    }
    el.innerHTML = '<b>⚠️ Programmfehler</b> (bitte Screenshot an Claude) <a href="#" id="fehlerZu" style="color:#fff;float:right">schließen</a><br>' + meldungen.slice(-4).map(m=>m.replace(/</g,'&lt;')).join('<br>');
    el.querySelector('#fehlerZu').onclick = e=>{ e.preventDefault(); el.remove(); };
  }
  window.addEventListener('error', e=>{ if(e.message && !/ResizeObserver|Script error/.test(e.message)) zeige(e.message + ' (Zeile '+e.lineno+')'); });
  window.addEventListener('unhandledrejection', e=>{ const m = e.reason && (e.reason.message||e.reason); if(m) zeige('Promise: '+m); });
  window.__zeigeFehler = zeige;
})();
</script>
<script>
/* ---------------------------- CLOUD-SYNC (Firebase) ---------------------------- */
const WERKSTATT_ID = 'eqeig2timcdpjoqsr6t7zkkn';
const firebaseConfig = {
  apiKey: "AIzaSyDjfTAg4lSNT0hNd49BoA0sdxp2hE0GEdg",
  authDomain: "werkstatt-sync-8aafb.firebaseapp.com",
  projectId: "werkstatt-sync-8aafb",
  storageBucket: "werkstatt-sync-8aafb.firebasestorage.app",
  messagingSenderId: "318676868019",
  appId: "1:318676868019:web:a67a3ff720164b6b5109c6"
};
let cloudDb = null, cloudVerbunden = false;
try{
  firebase.initializeApp(firebaseConfig);
  cloudDb = firebase.firestore();
  cloudDb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // Offline-Warteschlange, falls unterstützt
  cloudVerbunden = true;
}catch(e){ console.warn('Cloud-Sync nicht verfügbar:', e); }
const cloudPfad = teil => cloudDb.collection('werkstaetten').doc(WERKSTATT_ID).collection(teil);

async function cloudSyncProjekt(p){
  if(!cloudVerbunden || !p || p.status==='abgeschlossen') return;
  const geplant = projektGeplantGesamt(p);
  const matIds = new Set();
  [geplant.materialKorpusId, geplant.materialFrontId, geplant.materialRueckwandId].forEach(id=>{ if(id) matIds.add(id); });
  (geplant.zusatzPlatten||[]).forEach(pl=>{ if(pl.materialId) matIds.add(pl.materialId); });
  const materialien = [...matIds].map(id=>{ const m = DB.materials.find(x=>x.id===id); return m ? m.name : null; }).filter(Boolean);
  const beschlaege = Object.entries(geplant.beschlagQty||{}).filter(([id,menge])=>menge>0).map(([id,menge])=>{
    const b = DB.beschlaege.find(x=>x.id===id);
    return b ? { name:b.name, sollMenge:menge, einheit:b.einheit||'Stk' } : null;
  }).filter(Boolean);
  await cloudPfad('auftraege').doc(p.id).set({
    id:p.id, name:p.name, kunde:p.kunde||'', status:p.status||'Kalkulation', sollProSchritt: geplant.az||{}, schrittReihenfolge: Object.keys(geplant.az||{}), materialien, beschlaege,
    aktualisiertAm: new Date().toISOString()
  });
}
let cloudKatalogSyncTimer = null;
function cloudSyncKatalogDebounced(){
  if(!cloudVerbunden) return;
  if(cloudKatalogSyncTimer) clearTimeout(cloudKatalogSyncTimer);
  cloudKatalogSyncTimer = setTimeout(async ()=>{
    await cloudPfad('katalog').doc('aktuell').set({
      materialKatalog: DB.materials.map(m=>({name:m.name, m2ProStueck:m.m2ProStueck||0, preis:m.preis||0})),
      beschlagKatalog: DB.beschlaege.map(b=>({name:b.name, einheit:b.einheit||'Stk', kategorie:b.kategorie||'Sonstige', preis:b.preis||0})),
      aktualisiertAm: new Date().toISOString()
    });
  }, 1500);
}
let cloudZeitkontoSyncTimer = null;
function cloudSyncZeitkontoDebounced(){
  // Überträgt die Zeitkonto-Einstellungen (Monatslohn, Stundenlohn, Beschäftigt seit, Basis-Stunden) in die Cloud,
  // damit jeder Mitarbeiter sein eigenes Zeitkonto direkt in der Werkstatt-App sehen kann.
  if(!cloudVerbunden) return;
  if(cloudZeitkontoSyncTimer) clearTimeout(cloudZeitkontoSyncTimer);
  cloudZeitkontoSyncTimer = setTimeout(async ()=>{
    const s = DB.settings;
    await cloudPfad('zeitkonto').doc('aktuell').set({
      mitarbeiter1: {name:s.mitarbeiter1Name, monatslohn:s.mitarbeiter1Monatslohn||0, satz:s.mitarbeiter1StundenlohnTatsaechlich||0, beginn:s.mitarbeiter1Beginn||'', basisStunden:s.mitarbeiter1BasisStunden||0, sollMonatManuell:s.mitarbeiter1SollMonatManuell||null},
      mitarbeiter2: {name:s.mitarbeiter2Name, monatslohn:s.mitarbeiter2Monatslohn||0, satz:s.mitarbeiter2StundenlohnTatsaechlich||0, beginn:s.mitarbeiter2Beginn||'', basisStunden:s.mitarbeiter2BasisStunden||0, sollMonatManuell:s.mitarbeiter2SollMonatManuell||null},
      aktualisiertAm: new Date().toISOString()
    });
  }, 1500);
}

let cloudListenerAktiv = false;
function cloudListenerStarten(){
  if(!cloudVerbunden || cloudListenerAktiv) return;
  cloudListenerAktiv = true;
  cloudPfad('zeiten').onSnapshot(snap=>{
    const projekteBetroffen = new Set();
    snap.docChanges().forEach(change=>{
      const daten = change.doc.data();
      if(daten.auftragId) projekteBetroffen.add(daten.auftragId);
      if(change.type==='added' && !(DB.werkstattImportierteIds||[]).includes(change.doc.id)){
        cloudProtokolliereNeuenZeitEintrag({id:change.doc.id, ...daten});
      }
    });
    projekteBetroffen.forEach(projId=>cloudNeuBerechneStundenFuerProjekt(projId));
  }, err=>console.warn('Cloud-Zeiten-Listener Fehler:', err));
  cloudPfad('material').onSnapshot(snap=>{
    snap.docChanges().forEach(async change=>{
      if(change.type==='removed'){ await cloudEntferneMaterialEintrag(change.doc.id); return; }
      if(change.type!=='added') return;
      const m = {id:change.doc.id, ...change.doc.data()};
      await cloudVerarbeiteMaterialEintrag(m);
    });
  }, err=>console.warn('Cloud-Material-Listener Fehler:', err));
  cloudPfad('kantenIst').onSnapshot(snap=>{
    snap.docChanges().forEach(async change=>{
      if(change.type==='removed') return;
      const daten = change.doc.data();
      await cloudVerarbeiteKantenIst(change.doc.id, daten);
    });
  }, err=>console.warn('Cloud-Kanten-Listener Fehler:', err));
}
async function cloudVerarbeiteKantenIst(auftragId, daten){
  // Direkte Ist-Werte (kein Aufsummieren wie bei Stunden) — die App meldet den kompletten, aktuellen Stand.
  const projekt = DB.projects.find(p=>p.id===auftragId);
  if(!projekt) return;
  let nk = DB.nachkalkulation.find(x=>x.projId===auftragId);
  if(!nk){ nk = {projId:auftragId, azIst:[]}; DB.nachkalkulation.push(nk); }
  nk.kantenLfmIst = daten.lfm||0;
  nk.puVerleimungIst = !!daten.puVerleimung;
  await save('nachkalkulation');
  if(current==='nachkalkulation') renderMain();
}
function cloudProtokolliereNeuenZeitEintrag(z){
  // Nur für die "Werkstatt-Verlauf"-Anzeige (informativ) — die eigentliche Stundenberechnung läuft
  // komplett unabhängig davon über cloudNeuBerechneStundenFuerProjekt (deterministische Neuberechnung).
  if(!DB.werkstattImportierteIds) DB.werkstattImportierteIds = [];
  if(DB.werkstattImportierteIds.includes(z.id)) return;
  DB.werkstattImportierteIds.push(z.id);
  if(!DB.werkstattImportHistorie) DB.werkstattImportHistorie = [];
  DB.werkstattImportHistorie.push({projId:z.auftragId, importZeitpunkt:new Date().toISOString(), stunden:Math.round((z.dauerMin/60)*100)/100, schritte:[{name:z.schritt, std:Math.round((z.dauerMin/60)*100)/100}], material:[], mitarbeiterListe:z.mitarbeiter?[z.mitarbeiter]:[], quelle:'cloud'});
  save('werkstattImportierteIds'); save('werkstattImportHistorie');
}
async function cloudNeuBerechneStundenFuerProjekt(projektId){
  // Holt ALLE Zeiterfassungen dieses Projekts aus der Cloud. Um sowohl Mehrfachaufrufe sicher zu machen
  // ALS AUCH manuell in der Nachkalkulation eingetragene Werte nicht zu überschreiben, wird nicht einfach der
  // volle Cloud-Wert eingesetzt — stattdessen wird die DIFFERENZ zum zuletzt bekannten Cloud-Stand aufaddiert.
  // Hat der Nutzer nichts manuell geändert, ist das gleichbedeutend mit direktem Setzen. Hat er manuell etwas
  // eingetragen, bleibt das erhalten und nur der neue Cloud-Zuwachs kommt obendrauf.
  if(!cloudVerbunden) return;
  const projekt = DB.projects.find(p=>p.id===projektId);
  if(!projekt) return;
  let zeitenSnap;
  try{ zeitenSnap = await cloudPfad('zeiten').where('auftragId','==',projektId).get(); }
  catch(err){ console.warn('Neuberechnung fehlgeschlagen für', projektId, err); return; }
  let nk = DB.nachkalkulation.find(x=>x.projId===projektId);
  if(!nk){ nk = {projId:projektId, azIst:[]}; DB.nachkalkulation.push(nk); }
  if(!nk.azIst) nk.azIst = [];
  if(!nk._cloudSchatten) nk._cloudSchatten = {az:{}, bm:{std:0,std2:0,km:0}, ob:{std:0,std2:0}};
  // Für die informative "Werkstatt-Verlauf"-Anzeige (mit einzelnen Notizen) — komplett unabhängig von der
  // eigentlichen, delta-basierten Stundenberechnung oben; wird bei jedem Abruf einfach neu aus dem aktuellen
  // Cloud-Stand aufgebaut (kein Delta nötig, da rein informativ, nicht in irgendeine Berechnung eingerechnet).
  nk.werkstattVerlauf = zeitenSnap.docs.map(doc=>{
    const z = doc.data();
    return {id:doc.id, datum:z.datum, schritt:z.schritt, dauerMin:z.dauerMin||0, mitarbeiter:z.mitarbeiter||'', notiz:z.notiz||''};
  });
  const weitereMitarbeiter = (DB.settings.mitarbeiterListe||[]).filter(m=>m.id!=='m1' && m.id!=='m2');
  // Ordnet einen Namen aus der Werkstatt-App der passenden Mitarbeiter-ID zu ('m2' oder die ID eines weiteren
  // Mitarbeiters) — alles andere (inkl. unbekannter Namen) fällt weiterhin auf Mitarbeiter 1 zurück, wie bisher.
  const ordneMitarbeiterZu = name => {
    if(!name) return 'm1';
    const n = name.trim().toLowerCase();
    if(DB.settings.mitarbeiter2Name && n===DB.settings.mitarbeiter2Name.trim().toLowerCase()) return 'm2';
    const treffer = weitereMitarbeiter.find(m=>m.name && n===m.name.trim().toLowerCase());
    return treffer ? treffer.id : 'm1';
  };
  const summeM1 = {}, summeM2 = {}, summeWeitere = {}; // summeWeitere[schritt][mitarbeiterId] = Stunden
  let bmM1=0, bmM2=0, bmKm=0;
  const bmWeitere = {}; // bmWeitere[mitarbeiterId] = Stunden
  zeitenSnap.docs.forEach(doc=>{
    const z = doc.data();
    const stunden = (z.dauerMin||0)/60;
    const maId = ordneMitarbeiterZu(z.mitarbeiter);
    if(z.schritt==='Baustellenmontage'){
      if(maId==='m2') bmM2 += stunden;
      else if(maId==='m1') bmM1 += stunden;
      else bmWeitere[maId] = (bmWeitere[maId]||0) + stunden;
      bmKm += z.km||0;
    } else {
      // "Oberfläche" läuft jetzt wie jede normale Position (keine Sonderbehandlung mehr) —
      // wird über eine eigene Position in der Kalkulation erfasst statt über das separate Feature.
      if(maId==='m2') summeM2[z.schritt] = (summeM2[z.schritt]||0) + stunden;
      else if(maId==='m1') summeM1[z.schritt] = (summeM1[z.schritt]||0) + stunden;
      else {
        if(!summeWeitere[z.schritt]) summeWeitere[z.schritt] = {};
        summeWeitere[z.schritt][maId] = (summeWeitere[z.schritt][maId]||0) + stunden;
      }
    }
  });
  const alleSchritte = new Set([...Object.keys(summeM1), ...Object.keys(summeM2), ...Object.keys(summeWeitere), ...nk.azIst.map(r=>r.name), ...Object.keys(nk._cloudSchatten.az)]);
  alleSchritte.forEach(schritt=>{
    let pos = nk.azIst.find(r=>r.name===schritt);
    if(!pos){ pos = {name:schritt, std:0, std2:0}; nk.azIst.push(pos); }
    const altSchatten = nk._cloudSchatten.az[schritt] || {std:0, std2:0, weitere:{}};
    if(!altSchatten.weitere) altSchatten.weitere = {};
    const neuM1 = summeM1[schritt]||0, neuM2 = summeM2[schritt]||0;
    pos.std = Math.round(((pos.std||0) + (neuM1 - altSchatten.std))*100)/100;
    pos.std2 = Math.round(((pos.std2||0) + (neuM2 - altSchatten.std2))*100)/100;
    const neueWeitereSchatten = {};
    weitereMitarbeiter.forEach(m=>{
      const neu = summeWeitere[schritt]?.[m.id] || 0;
      const alt = altSchatten.weitere[m.id] || 0;
      if(!pos.weitereStunden) pos.weitereStunden = {};
      pos.weitereStunden[m.id] = Math.round(((pos.weitereStunden[m.id]||0) + (neu - alt))*100)/100;
      neueWeitereSchatten[m.id] = neu;
    });
    nk._cloudSchatten.az[schritt] = {std:neuM1, std2:neuM2, weitere:neueWeitereSchatten};
  });
  nk.baustellenmontageIst = Math.round(((parseFloat(nk.baustellenmontageIst)||0) + (bmM1 - nk._cloudSchatten.bm.std))*100)/100;
  nk.baustellenmontageIst2 = Math.round(((parseFloat(nk.baustellenmontageIst2)||0) + (bmM2 - nk._cloudSchatten.bm.std2))*100)/100;
  nk.baustellenmontageKmIst = Math.round((parseFloat(nk.baustellenmontageKmIst)||0) + (bmKm - nk._cloudSchatten.bm.km));
  if(!nk._cloudSchatten.bm.weitere) nk._cloudSchatten.bm.weitere = {};
  const neueBmWeitereSchatten = {};
  weitereMitarbeiter.forEach(m=>{
    const neu = bmWeitere[m.id]||0;
    const alt = nk._cloudSchatten.bm.weitere[m.id]||0;
    if(!nk.baustellenmontageIstWeitere) nk.baustellenmontageIstWeitere = {};
    nk.baustellenmontageIstWeitere[m.id] = Math.round(((nk.baustellenmontageIstWeitere[m.id]||0) + (neu - alt))*100)/100;
    neueBmWeitereSchatten[m.id] = neu;
  });
  nk._cloudSchatten.bm = {std:bmM1, std2:bmM2, km:bmKm, weitere:neueBmWeitereSchatten};
  await save('nachkalkulation');
  if(current==='nachkalkulation') renderMain();
}
async function cloudVerarbeiteMaterialEintrag(m){
  if(!DB.werkstattImportierteIds) DB.werkstattImportierteIds = [];
  if(DB.werkstattImportierteIds.includes(m.id)) return;
  DB.werkstattImportierteIds.push(m.id); // sofort markieren, siehe Kommentar bei cloudVerarbeiteZeitEintrag
  const projekt = DB.projects.find(p=>p.id===m.auftragId);
  if(!projekt) return;
  let nk = DB.nachkalkulation.find(x=>x.projId===projekt.id);
  if(!nk){ nk = {projId:projekt.id}; DB.nachkalkulation.push(nk); }
  const passenderBeschlag = DB.beschlaege.find(x=>x.name===m.bezeichnung);
  if(passenderBeschlag){
    // Bezeichnung passt zu einem Beschlag aus deinem Katalog — direkt in die Soll-vs-Ist-Liste eintragen,
    // unabhängig davon, ob er für dieses Projekt geplant war. Menge wird aufaddiert (mehrere Meldungen möglich).
    if(!nk.beschlagIstQty) nk.beschlagIstQty = {};
    const bisher = nk.beschlagIstQty[passenderBeschlag.id] ?? 0;
    nk.beschlagIstQty[passenderBeschlag.id] = Math.round((bisher + m.menge)*100)/100;
  } else {
    if(!nk.zusatzpositionenExtra) nk.zusatzpositionenExtra = [];
    const passendesMaterial = DB.materials.find(x=>x.name===m.bezeichnung);
    // Vom Handy mitgeschickten Preis bevorzugen (v.a. wichtig bei eigenen/unbekannten Materialien, die
    // nicht im Katalog stehen) — nur wenn keiner mitkam, aus dem Katalog raten.
    const gefundenerPreis = (m.preis!==undefined && m.preis!==null) ? m.preis : (passendesMaterial ? (passendesMaterial.preis||0) : 0);
    nk.zusatzpositionenExtra.push({name:`${m.bezeichnung} (Werkstatt)`, menge:m.menge, preis:gefundenerPreis, cloudMaterialId:m.id});
  }
  await save('nachkalkulation'); await save('werkstattImportierteIds');
  if(current==='nachkalkulation') renderMain();
}
async function cloudEntferneMaterialEintrag(materialId){
  // Wird aufgerufen, wenn ein Material-Eintrag in der Werkstatt-App gelöscht wurde — entfernt die
  // entsprechende, zuvor automatisch angelegte Zusatzposition wieder aus der Nachkalkulation.
  let geaendert = false;
  DB.nachkalkulation.forEach(nk=>{
    if(!nk.zusatzpositionenExtra) return;
    const vorherAnzahl = nk.zusatzpositionenExtra.length;
    nk.zusatzpositionenExtra = nk.zusatzpositionenExtra.filter(pos=>pos.cloudMaterialId!==materialId);
    if(nk.zusatzpositionenExtra.length!==vorherAnzahl) geaendert = true;
  });
  if(!DB.werkstattImportierteIds) DB.werkstattImportierteIds = [];
  DB.werkstattImportierteIds = DB.werkstattImportierteIds.filter(id=>id!==materialId); // wieder "unverarbeitet", falls derselbe Eintrag später erneut angelegt wird
  if(geaendert){ await save('nachkalkulation'); if(current==='nachkalkulation') renderMain(); }
  await save('werkstattImportierteIds');
}
async function cloudDatenSichern(){
  if(!cloudVerbunden){ alert('⚠️ Cloud-Sync ist nicht verbunden.'); return; }
  const [auftraegeSnap, zeitenSnap, materialSnap, kantenIstSnap] = await Promise.all([
    cloudPfad('auftraege').get(), cloudPfad('zeiten').get(), cloudPfad('material').get(), cloudPfad('kantenIst').get()
  ]);
  const payload = {
    typ: 'moebelkalk-cloud-sicherung', version:1, sicherungZeitpunkt: new Date().toISOString(),
    auftraege: auftraegeSnap.docs.map(d=>({id:d.id, ...d.data()})),
    zeiten: zeitenSnap.docs.map(d=>({id:d.id, ...d.data()})),
    material: materialSnap.docs.map(d=>({id:d.id, ...d.data()})),
    kantenIst: kantenIstSnap.docs.map(d=>({id:d.id, ...d.data()})),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Cloud-Sicherung_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function cloudDatenAusSicherungWiederherstellen(file){
  // Schreibt Zeiten/Material aus einer "Cloud-Daten sichern"-Datei zurück in die Cloud — für den Notfall,
  // dass in der Cloud versehentlich Daten verloren gingen. .set() anhand der Original-ID ist idempotent:
  // schon vorhandene (neuere) Einträge werden dabei nicht dupliziert, nur fehlende kommen wieder hinzu.
  if(!cloudVerbunden){ alert('⚠️ Cloud-Sync ist nicht verbunden.'); return; }
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ alert('⚠️ Ungültige Datei.'); return; }
  if(data.typ!=='moebelkalk-cloud-sicherung'){ alert('⚠️ Das ist keine gültige Cloud-Sicherungsdatei.'); return; }
  let anzahl = 0;
  for(const z of (data.zeiten||[])){ const {id, ...rest} = z; await cloudPfad('zeiten').doc(id).set(rest); anzahl++; }
  for(const m of (data.material||[])){ const {id, ...rest} = m; await cloudPfad('material').doc(id).set(rest); anzahl++; }
  alert(`✅ ${anzahl} Einträge aus der Sicherung zurück in die Cloud geschrieben. Die Nachkalkulation aktualisiert sich in Kürze automatisch (oder Seite neu laden).`);
}
async function cloudDatenJetztAbrufen(erzwingen=false){
  if(!cloudVerbunden){ alert('⚠️ Cloud-Sync ist nicht verbunden.'); return {neu:0, uebersprungen:0}; }
  // Holt alle Zeiten/Material EINMALIG direkt ab (dieselbe bewährte Abfrage wie bei "Cloud-Daten sichern")
  // und wendet sie sofort an — als zuverlässige Alternative/Ergänzung zum Hintergrund-Listener,
  // falls dieser aus irgendeinem Grund (z.B. Verbindungsaussetzer beim ersten Laden) etwas verpasst hat.
  const [zeitenSnap, materialSnap, kantenIstSnap] = await Promise.all([cloudPfad('zeiten').get(), cloudPfad('material').get(), cloudPfad('kantenIst').get()]);
  if(!DB.werkstattImportierteIds) DB.werkstattImportierteIds = [];
  let verwaisteAuftraegeEntfernt = 0;
  if(erzwingen){
    const alleIds = new Set([...zeitenSnap.docs.map(d=>d.id), ...materialSnap.docs.map(d=>d.id)]);
    DB.werkstattImportierteIds = DB.werkstattImportierteIds.filter(id=>!alleIds.has(id));
    // Verwaiste Aufträge aufräumen: in der Cloud vorhanden, aber lokal nicht mehr existent (z.B. weil vor der
    // Lösch-Synchronisierung gelöscht wurde) — sollten in der Werkstatt-App nicht mehr auftauchen.
    const cloudAuftraegeSnap = await cloudPfad('auftraege').get();
    const lokaleProjektIds = new Set(DB.projects.map(p=>p.id));
    for(const doc of cloudAuftraegeSnap.docs){
      if(!lokaleProjektIds.has(doc.id)){
        await cloudPfad('auftraege').doc(doc.id).delete();
        verwaisteAuftraegeEntfernt++;
      }
    }
  }
  const bereitsDa = new Set(DB.werkstattImportierteIds);
  let neu = 0, uebersprungen = 0;
  const projekteBetroffen = new Set();
  // Aufträge übernehmen, die in der Werkstatt-App neu angelegt wurden und noch kein lokales Projekt haben
  try{
    const cloudAuftraegeSnap = await cloudPfad('auftraege').get();
    const lokaleProjektIds = new Set(DB.projects.map(p=>p.id));
    let ausAppUebernommen = 0;
    for(const doc of cloudAuftraegeSnap.docs){
      if(lokaleProjektIds.has(doc.id)) continue;
      const cloudAuftrag = doc.data();
      if(!cloudAuftrag.ausApp) continue; // nur Aufträge übernehmen, die tatsächlich aus der App stammen
      DB.projects.push({id:doc.id, name:cloudAuftrag.name||'Unbenannt', kunde:cloudAuftrag.kunde||'', status:cloudAuftrag.status||'Kalkulation', datum:new Date().toISOString().slice(0,10), kalkulation:null});
      ausAppUebernommen++;
    }
    if(ausAppUebernommen>0){ await save('projects'); neu += ausAppUebernommen; } // zählt mit, damit die Seite sich automatisch neu zeichnet
  }catch(err){ console.warn('Übernahme neuer Aufträge aus der App fehlgeschlagen:', err); }
  for(const doc of zeitenSnap.docs){
    const z = {id:doc.id, ...doc.data()};
    if(bereitsDa.has(z.id)){ uebersprungen++; }
    else { cloudProtokolliereNeuenZeitEintrag(z); neu++; }
    if(z.auftragId) projekteBetroffen.add(z.auftragId);
  }
  for(const projId of projekteBetroffen){ await cloudNeuBerechneStundenFuerProjekt(projId); }
  for(const doc of materialSnap.docs){
    const m = {id:doc.id, ...doc.data()};
    if(bereitsDa.has(m.id)){ uebersprungen++; continue; }
    await cloudVerarbeiteMaterialEintrag(m);
    neu++;
  }
  // Löschungen erkennen: lokal aus einem Cloud-Material-Eintrag entstandene Zusatzpositionen, deren Ursprungs-ID
  // in der aktuellen Cloud-Abfrage nicht mehr auftaucht, wurden in der Werkstatt-App gelöscht — hier nachziehen.
  const cloudMaterialIdsAktuell = new Set(materialSnap.docs.map(d=>d.id));
  let geloescht = 0;
  DB.nachkalkulation.forEach(nk=>{
    if(!nk.zusatzpositionenExtra) return;
    const vorherAnzahl = nk.zusatzpositionenExtra.length;
    nk.zusatzpositionenExtra = nk.zusatzpositionenExtra.filter(pos=>!pos.cloudMaterialId || cloudMaterialIdsAktuell.has(pos.cloudMaterialId));
    geloescht += vorherAnzahl - nk.zusatzpositionenExtra.length;
  });
  // Fehlende Preise (0 €) automatisch nachtragen — läuft bei JEDEM Abgleich, nicht nur im Reparatur-Modus,
  // damit ein in der App nachgetragener Preis zeitnah ankommt. Entweder weil in der App inzwischen ein Preis
  // eingetragen wurde, oder weil inzwischen ein passendes Material/Beschlag im eigenen Katalog existiert.
  let preiseNachgetragen = 0;
  {
    const cloudMaterialListeFuerPreise = materialSnap.docs.map(d=>({id:d.id, ...d.data()}));
    DB.nachkalkulation.forEach(nk=>{
      if(!nk.zusatzpositionenExtra) return;
      nk.zusatzpositionenExtra.forEach(pos=>{
        if((pos.preis||0)>0 || !pos.name.endsWith(' (Werkstatt)')) return;
        const ausApp = pos.cloudMaterialId ? cloudMaterialListeFuerPreise.find(m=>m.id===pos.cloudMaterialId) : null;
        if(ausApp && ausApp.preis!==undefined && ausApp.preis!==null && ausApp.preis>0){
          pos.preis = ausApp.preis; preiseNachgetragen++; return;
        }
        const bezeichnung = pos.name.replace(/ \(Werkstatt\)$/, '');
        const passendesMaterial = DB.materials.find(x=>x.name===bezeichnung);
        const passenderBeschlag = DB.beschlaege.find(x=>x.name===bezeichnung);
        const gefundenerPreis = passendesMaterial ? (passendesMaterial.preis||0) : (passenderBeschlag ? (passenderBeschlag.preis||0) : 0);
        if(gefundenerPreis>0){ pos.preis = gefundenerPreis; preiseNachgetragen++; }
      });
    });
  }
  // Reparatur-Modus: ältere Zusatzpositionen ohne gespeicherte Cloud-ID (aus der Zeit vor dieser Funktion) nachträglich
  // zuordnen oder — falls in der Cloud kein passender Eintrag mehr existiert (dort schon gelöscht) — jetzt entfernen.
  if(erzwingen){
    const cloudMaterialListe = materialSnap.docs.map(d=>({id:d.id, ...d.data()}));
    DB.nachkalkulation.forEach(nk=>{
      if(!nk.zusatzpositionenExtra) return;
      const vorherAnzahl = nk.zusatzpositionenExtra.length;
      nk.zusatzpositionenExtra = nk.zusatzpositionenExtra.filter(pos=>{
        if(pos.cloudMaterialId || !pos.name.endsWith(' (Werkstatt)')) return true; // schon zugeordnet oder gar nicht aus der Werkstatt-App
        const bezeichnung = pos.name.replace(/ \(Werkstatt\)$/, '');
        const treffer = cloudMaterialListe.find(m=>m.auftragId===nk.projId && m.bezeichnung===bezeichnung && m.menge===pos.menge && !cloudMaterialIdsAktuell.has('__vergeben_'+m.id));
        if(treffer){ pos.cloudMaterialId = treffer.id; cloudMaterialIdsAktuell.add('__vergeben_'+treffer.id); return true; } // nachträglich zugeordnet, behalten
        return false; // kein passender Cloud-Eintrag mehr vorhanden — wurde vermutlich schon vor der ID-Verknüpfung gelöscht
      });
      geloescht += vorherAnzahl - nk.zusatzpositionenExtra.length;
    });
  }
  if(geloescht>0 || preiseNachgetragen>0){ await save('nachkalkulation'); if(current==='nachkalkulation') renderMain(); }
  for(const doc of kantenIstSnap.docs){
    await cloudVerarbeiteKantenIst(doc.id, doc.data());
  }
  // Fotos übernehmen und danach aus der Cloud löschen — sie liegen ja jetzt lokal in MöbelKalk und sollen den
  // (kostenpflichtigen) Cloud-Speicher nicht dauerhaft belegen.
  let fotosUebernommen = 0;
  try{
    const fotosSnap = await cloudPfad('fotos').get();
    for(const doc of fotosSnap.docs){
      if(DB.fotos.some(f=>f.id===doc.id)) { await cloudPfad('fotos').doc(doc.id).delete().catch(()=>{}); continue; } // schon vorhanden, trotzdem aus der Cloud aufräumen
      const daten = doc.data();
      if(!DB.projects.some(p=>p.id===daten.auftragId)) continue; // Projekt (noch) nicht lokal vorhanden — später erneut versuchen
      DB.fotos.push({id:doc.id, projId:daten.auftragId, mitarbeiter:daten.mitarbeiter, datum:daten.datum, dataUrl:daten.dataUrl, notiz:daten.notiz||'', quelle:'werkstatt'});
      fotosUebernommen++;
      await cloudPfad('fotos').doc(doc.id).delete().catch(err=>console.warn('Cloud-Löschen (Foto nach Übernahme) fehlgeschlagen:', err));
    }
    if(fotosUebernommen>0){ await save('fotos'); neu += fotosUebernommen; if(current==='nachkalkulation') renderMain(); }
  }catch(err){ console.warn('Foto-Abruf fehlgeschlagen:', err); }
  return {neu, uebersprungen, verwaisteAuftraegeEntfernt};
}

let DB = {};

/* ---------------------------- SPEICHERSCHICHT ----------------------------
   Läuft die App hier im Chat, wird Claudes window.storage genutzt.
   Wird die Datei eigenständig im Browser geöffnet (kein window.storage
   vorhanden), springt automatisch eine lokale IndexedDB-Datenbank ein —
   die Daten bleiben dann dauerhaft auf diesem Rechner/in diesem Browser
   gespeichert, ganz ohne Internet oder Chat. */
const IDB_NAME = 'moebelkalk_db';
const IDB_STORE = 'kv';
let _idbPromise = null;
function openIDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB nicht verfügbar')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _idbPromise;
}
async function idbGet(key){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
const HAT_CHAT_STORAGE = typeof window!=='undefined' && !!window.storage && typeof window.storage.get==='function';
window.__moebelkalkSpeicherModus = HAT_CHAT_STORAGE ? 'chat' : 'indexeddb';

async function loadAll(){
  for(const key of Object.keys(DEFAULTS)){
    try{
      let wert = null;
      if(HAT_CHAT_STORAGE){
        const r = await window.storage.get(key);
        wert = r ? r.value : null;
      } else {
        wert = await idbGet(key);
      }
      DB[key] = wert ? JSON.parse(wert) : JSON.parse(JSON.stringify(DEFAULTS[key]));
    }catch(e){
      DB[key] = JSON.parse(JSON.stringify(DEFAULTS[key]));
      // Wichtig: Beim Lesen ist etwas schiefgegangen -> diesen Schlüssel NICHT mit leeren Standardwerten überschreiben
      (window.__ladeFehlerKeys = window.__ladeFehlerKeys || new Set()).add(key);
      if(window.__zeigeFehler) window.__zeigeFehler('Laden fehlgeschlagen für „'+key+'“: '+(e && e.message || e)+' — gespeicherte Daten bleiben unverändert, bitte nichts löschen.');
    }
  }
  // Migration: ältere gespeicherte Einstellungen um neue Felder ergänzen
  DB.settings = {...DEFAULTS.settings, ...DB.settings, kantenRegeln:{...DEFAULTS.settings.kantenRegeln, ...(DB.settings.kantenRegeln||{})}, autoHaken:{...DEFAULTS.settings.autoHaken, ...(DB.settings.autoHaken||{})}};
  // Migration: flexible Mitarbeiterliste (für einen 3. und weitere Mitarbeiter) aus den bestehenden
  // mitarbeiter1/2-Feldern einmalig befüllen — rein additiv, ändert an mitarbeiter1/2 selbst nichts.
  if(!DB.settings.mitarbeiterListe){
    const s = DB.settings;
    DB.settings.mitarbeiterListe = [
      {id:'m1', name:s.mitarbeiter1Name, satz:s.mitarbeiter1Satz, stundenlohnTatsaechlich:s.mitarbeiter1StundenlohnTatsaechlich||0, monatslohn:s.mitarbeiter1Monatslohn||0, beginn:s.mitarbeiter1Beginn||'', basisStunden:s.mitarbeiter1BasisStunden||0, sollMonatManuell:s.mitarbeiter1SollMonatManuell||null},
      {id:'m2', name:s.mitarbeiter2Name, satz:s.mitarbeiter2Satz, stundenlohnTatsaechlich:s.mitarbeiter2StundenlohnTatsaechlich||0, monatslohn:s.mitarbeiter2Monatslohn||0, beginn:s.mitarbeiter2Beginn||'', basisStunden:s.mitarbeiter2BasisStunden||0, sollMonatManuell:s.mitarbeiter2SollMonatManuell||null},
    ];
    await save('settings');
  }
  // Migration: "AV je Fach" war früher in Stunden, ist jetzt in Minuten. Alte, noch nicht umgerechnete
  // Werte (typischerweise < 1, da Stunden-Werte für diese Position immer klein waren) einmalig ×60.
  if(!DB.settings._avJeFachUmgerechnet){
    if(DB.settings.rwAvJeFach!==undefined && DB.settings.rwAvJeFach>0 && DB.settings.rwAvJeFach<1){
      DB.settings.rwAvJeFach = Math.round(DB.settings.rwAvJeFach*60*100)/100;
    }
    DB.settings._avJeFachUmgerechnet = true;
    await save('settings');
  }
  // Migration: Sockelfuß + Sockelclip wurden früher als "Sockel-Set" zusammengefasst — jetzt einzeln aufgeführt.
  // Bei bestehenden, schon gespeicherten Beschlägen die alte Gruppierung entfernen, damit sie wieder getrennt erscheinen.
  if(!DB.settings._sockelGruppeMigriert){
    let geaendert = false;
    (DB.beschlaege||[]).forEach(b=>{
      if((b.id==='b12'||b.id==='b13') && b.gruppe==='Sockel-Set'){ delete b.gruppe; geaendert = true; }
    });
    if(geaendert) await save('beschlaege');
    DB.settings._sockelGruppeMigriert = true;
    await save('settings');
  }
  await bereinigeBaustellenmontageOberflaecheStreuzeilen();
  await bereinigeBeschlaegeInZusatzpositionen();
}
// Eigenständige Funktion, damit sie sowohl beim normalen Laden als auch nach einem "Zurücksichern"
// (das den DB-Stand komplett überschreibt) aufgerufen werden kann.
async function bereinigeBaustellenmontageOberflaecheStreuzeilen(){
  let geaendert = false;
  (DB.nachkalkulation||[]).forEach(nk=>{
    if(!nk.azIst) return;
    const bmZeilen = nk.azIst.filter(r=>(r.name||'').trim().toLowerCase()==='baustellenmontage');
    bmZeilen.forEach(bmZeile=>{
      // Nur addieren, wenn das dedizierte Feld noch leer ist — sonst könnte der gleiche Wert schon dort stehen (Doppel-Zählung vermeiden)
      if(!nk.baustellenmontageIst) nk.baustellenmontageIst = Math.round((bmZeile.std||0)*4)/4;
      if(!nk.baustellenmontageIst2) nk.baustellenmontageIst2 = Math.round((bmZeile.std2||0)*4)/4;
      geaendert = true;
    });
    const obZeilen = nk.azIst.filter(r=>(r.name||'').trim().toLowerCase()==='oberfläche');
    obZeilen.forEach(obZeile=>{
      if(!nk.oberflaecheIst) nk.oberflaecheIst = Math.round((obZeile.std||0)*4)/4;
      if(!nk.oberflaecheIst2) nk.oberflaecheIst2 = Math.round((obZeile.std2||0)*4)/4;
      geaendert = true;
    });
    if(bmZeilen.length || obZeilen.length){
      nk.azIst = nk.azIst.filter(r=>{ const n=(r.name||'').trim().toLowerCase(); return n!=='baustellenmontage' && n!=='oberfläche'; });
    }
  });
  if(geaendert) await save('nachkalkulation');
}
async function bereinigeBeschlaegeInZusatzpositionen(){
  // Ältere Werkstatt-Übernahmen (vor der direkten Soll-vs-Ist-Zuordnung) landeten als Zusatzposition,
  // auch wenn die Bezeichnung eigentlich zu einem Beschlag aus dem Katalog passt — hier nachträglich umziehen.
  let geaendert = false;
  (DB.nachkalkulation||[]).forEach(nk=>{
    if(!nk.zusatzpositionenExtra || !nk.zusatzpositionenExtra.length) return;
    const vorherAnzahl = nk.zusatzpositionenExtra.length;
    nk.zusatzpositionenExtra = nk.zusatzpositionenExtra.filter(pos=>{
      if(!pos.name.endsWith(' (Werkstatt)')) return true; // nicht aus der Werkstatt-App, unberührt lassen
      const bezeichnung = pos.name.replace(/ \(Werkstatt\)$/, '');
      const passenderBeschlag = DB.beschlaege.find(x=>x.name===bezeichnung);
      if(!passenderBeschlag) return true; // kein Katalog-Treffer, bleibt als Zusatzposition
      if(!nk.beschlagIstQty) nk.beschlagIstQty = {};
      const bisher = nk.beschlagIstQty[passenderBeschlag.id] ?? 0;
      nk.beschlagIstQty[passenderBeschlag.id] = Math.round((bisher + (pos.menge||0))*100)/100;
      return false; // aus Zusatzpositionen entfernen, jetzt in Soll-vs-Ist
    });
    if(nk.zusatzpositionenExtra.length!==vorherAnzahl) geaendert = true;
  });
  if(geaendert) await save('nachkalkulation');
}
async function save(key, versuch=1){
  if(window.__ladeFehlerKeys && window.__ladeFehlerKeys.has(key)) return; // Schutz: Ladefehler -> bestehende Daten nicht mit leeren Werten überschreiben
  try{
    const json = JSON.stringify(DB[key]);
    if(HAT_CHAT_STORAGE) await window.storage.set(key, json);
    else await idbSet(key, json);
    verstecktSpeicherWarnung();
    if(['nachkalkulation','projects','settings','materials','beschlaege','arbeitszeiten'].includes(key)) nkZsfAktualisierenPlanen();
    if(key==='materials' || key==='beschlaege') cloudSyncKatalogDebounced();
    if(key==='settings') cloudSyncZeitkontoDebounced();
  }catch(e){
    console.error('Speichern fehlgeschlagen', key, e);
    if(versuch<3){
      await new Promise(r=>setTimeout(r, versuch*800)); // kurz warten, dann erneut versuchen (kurzzeitige Serverfehler)
      return save(key, versuch+1);
    }
    zeigeSpeicherWarnung(key);
  }
}
function zeigeSpeicherWarnung(key){
  let el = document.getElementById('speicherWarnung');
  if(!el){
    el = document.createElement('div');

    document.body.appendChild(el);
  }
  el.innerHTML = `⚠️ Speichern fehlgeschlagen (${key}). Bitte kurz prüfen, ob deine letzte Änderung wirklich gespeichert wurde — notfalls Seite neu laden und erneut versuchen. <button style="margin-left:8px;background:none;border:1px solid #fff;color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer" id="speicherWarnungSchliessen">OK</button>`;

function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }
function rundeViertelstundeAuf(x){ return Math.ceil((x||0)*4)/4; } // für manuelle Eingabe & Stundenvorschlag: immer aufrunden
function rundeViertelstunde(x){ return Math.round((x||0)*4)/4; } // für einzelne Rundung
/* Verteilt einen neuen Gesamtwert proportional auf mehrere bestehende Werte, wobei jeder Einzelwert
   auf eine volle Viertelstunde gerundet wird UND die Summe exakt (bzw. bestmöglich) den Zielwert trifft.
   Reines "jeden Wert einzeln runden" verliert bei vielen Positionen oft kleine Änderungen komplett. */
function verteileViertelstunden(werte, neuerGesamt){
  const n = werte.length;
  if(n===0) return [];
  const zielViertel = Math.round(rundeViertelstunde(neuerGesamt)*4);
  const summeAlt = werte.reduce((a,b)=>a+(b||0),0);
  let rohViertel;
  if(summeAlt>0){
    const faktor = neuerGesamt/summeAlt;
    rohViertel = werte.map(w=>(w||0)*faktor*4);
  } else {
    rohViertel = werte.map(()=>zielViertel/n);
  }
  const abgerundet = rohViertel.map(v=>Math.floor(v));
  let rest = zielViertel - abgerundet.reduce((a,b)=>a+b,0);
  const reihenfolge = rohViertel.map((v,i)=>({i, frac:v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
  const ergebnis = [...abgerundet];
  for(let k=0;k<rest && k<reihenfolge.length;k++){ ergebnis[reihenfolge[k].i]++; }
  for(let k=0;k<-rest && k<reihenfolge.length;k++){ const idx=reihenfolge[reihenfolge.length-1-k].i; ergebnis[idx]=Math.max(0,ergebnis[idx]-1); }
  return ergebnis.map(v=>v/4);
}
/* ------------------- Sicherungsordner (File System Access API) -------------------
   Nur in Chrome/Edge (Desktop) verfügbar, und nur wenn die Datei eigenständig
   (nicht im Chat) geöffnet wird. Erlaubt direktes Schreiben/Lesen in einem
   selbst gewählten Ordner, ohne bei jeder Sicherung erneut nachzufragen. */
const HAT_ORDNERZUGRIFF = typeof window.showDirectoryPicker === 'function';
let sicherungsOrdnerHandle = null;
async function ladeSicherungsOrdnerHandle(){
  if(!HAT_ORDNERZUGRIFF) return null;
  try{
    const db = await openIDB();
    return await new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get('__sicherungsordner_handle');
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>resolve(null);
    });
  }catch(e){ return null; }
}
async function speichereSicherungsOrdnerHandle(handle){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(handle, '__sicherungsordner_handle');
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function pruefeOrdnerBerechtigung(handle){
  if(!handle) return false;
  const opts = {mode:'readwrite'};
  if((await handle.queryPermission(opts))==='granted') return true;
  if((await handle.requestPermission(opts))==='granted') return true;
  return false;
}
async function waehleSicherungsOrdner(){
  if(!HAT_ORDNERZUGRIFF){ alert('Dein Browser unterstützt die direkte Ordnerauswahl nicht (funktioniert in Chrome/Edge am Desktop). Die Sicherung lädt stattdessen wie gewohnt über den Download-Dialog herunter.'); return; }
  try{
    const handle = await window.showDirectoryPicker();
    if(await pruefeOrdnerBerechtigung(handle)){
      sicherungsOrdnerHandle = handle;
      await speichereSicherungsOrdnerHandle(handle);
      alert(`Sicherungsordner „${handle.name}“ festgelegt. „Alles sichern“ speichert ab jetzt direkt dorthin.`);
      renderMain();
    }
  }catch(e){ /* Nutzer hat den Dialog abgebrochen */ }
}

async function importSicherungAusDatei(file){
  if(!file) return;
  const text = await file.text();
  try{
    const data = JSON.parse(text);
    for(const key of Object.keys(DEFAULTS)){ if(data[key]!==undefined){ DB[key]=data[key]; await save(key); } }
    await bereinigeBaustellenmontageOberflaecheStreuzeilen();
    await bereinigeBeschlaegeInZusatzpositionen();
    await bereinigeVerwaisteCloudAuftraege();
    alert('Sicherung importiert.'); renderMain();
  }catch(err){ alert('Ungültige Datei.'); }
}
async function bereinigeVerwaisteCloudAuftraege(){
  // Nach einem "Zurücksichern" (Projektliste wird komplett ersetzt) können Aufträge in der Cloud übrig bleiben,
  // die in der wiederhergestellten Projektliste nicht mehr vorkommen — hier automatisch bereinigen.
  // Zusätzlich: Projekte, die schon VOR Einführung der automatischen Lösch-Synchronisierung auf "abgeschlossen"
  // gesetzt wurden, hatten dadurch nie einen entsprechenden Cloud-Löschvorgang — das hier rückwirkend nachholen.
  if(!cloudVerbunden) return;
  try{
    const auftraegeSnap = await cloudPfad('auftraege').get();
    const projektMap = new Map(DB.projects.map(p=>[p.id, p]));
    for(const doc of auftraegeSnap.docs){
      const projekt = projektMap.get(doc.id);
      if(!projekt || projekt.status==='abgeschlossen') await cloudPfad('auftraege').doc(doc.id).delete();
    }
  }catch(err){ console.warn('Bereinigung verwaister Cloud-Aufträge fehlgeschlagen:', err); }
}

function sicherungsAlterTage(){
  const t = DB.settings && DB.settings.letzteSicherung ? Date.parse(DB.settings.letzteSicherung) : NaN;
  return isNaN(t) ? null : (Date.now()-t)/86400000;
}
function aktualisiereSicherungsHinweis(){
  const el = document.getElementById('sicherungsStatus');
  if(!el) return;
  const d = sicherungsAlterTage();
  const text = d===null ? 'Noch keine Sicherung' : (d<1 ? 'Letzte Sicherung: heute' : 'Letzte Sicherung: vor '+Math.floor(d)+' Tag'+(Math.floor(d)===1?'':'en'));
  const warn = d===null || d>=7;
  el.style.cssText = 'margin-top:8px;padding:6px 8px;border-radius:6px;font-size:11px;line-height:1.3;'+(warn?'background:#8a2b1d;color:#fff;':'background:rgba(255,255,255,.08);');
  el.innerHTML = (warn?'⚠️ ':'💾 ')+text+(warn?'<br><b>Bitte jetzt sichern</b> (Knopf „Sicherung“)':'');
}
async function exportSicherung(){
  const r = await exportSicherungRoh();
  try{ DB.settings.letzteSicherung = new Date().toISOString(); await save('settings'); }catch(e){}
  aktualisiereSicherungsHinweis();
  return r;
}
async function exportSicherungRoh(){
  const datum = new Date().toISOString().slice(0,10);
  const dateiname = `moebelkalk_sicherung_${datum}.json`;
  const inhalt = JSON.stringify(DB,null,2);
  // Beim allerersten Sichern (Chrome/Edge, eigenständiger Betrieb): einmalig nach dem Ordner fragen und merken
  if(!sicherungsOrdnerHandle && HAT_ORDNERZUGRIFF && !HAT_CHAT_STORAGE){
    try{
      const handle = await window.showDirectoryPicker();
      if(await pruefeOrdnerBerechtigung(handle)){
        sicherungsOrdnerHandle = handle;
        await speichereSicherungsOrdnerHandle(handle);
        const ordnerBtn = document.getElementById('globalOrdnerBtn');
        if(ordnerBtn) ordnerBtn.textContent = `📁 Ordner: ${handle.name}`;
      }
    }catch(e){ /* Nutzer hat den Ordnerdialog abgebrochen — Sicherung läuft trotzdem über den normalen Download weiter */ }
  }
  if(sicherungsOrdnerHandle && await pruefeOrdnerBerechtigung(sicherungsOrdnerHandle)){
    try{
      const fileHandle = await sicherungsOrdnerHandle.getFileHandle(dateiname, {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write(inhalt);
      await writable.close();
      return {ort:'ordner', name:dateiname};
    }catch(e){ console.error('Sicherung in Ordner fehlgeschlagen, weiche auf Download aus', e); }
  }
  const blob = new Blob([inhalt],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = dateiname;
  a.click();
  return {ort:'download', name:dateiname};
}

function renderSidebarProjektAuswahl(){
  const host = document.getElementById('sidebarProjektAuswahl');
  if(!host) return;
  if(!DB.projects.length){
    host.innerHTML = `<div class="small" style="opacity:.6;padding:4px 6px">Noch kein Projekt</div>`;
    return;
  }
  const aktuelles = DB.projects.find(p=>p.id===activeProjectId);
  host.innerHTML = `
    <div style="position:relative">
      <input id="sidebarProjSuche" placeholder="Projekt suchen …" value="${aktuelles?(aktuelles.name+(aktuelles.kunde?' ('+aktuelles.kunde+')':'')):''}"
        style="width:100%;font-size:12.5px;padding:6px 8px;background:var(--sidebar-2);color:#fff;border:1px solid var(--sidebar-line);border-radius:8px">
      <div id="sidebarProjListe" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--sidebar-2);border:1px solid var(--sidebar-line);border-radius:8px;margin-top:4px;max-height:280px;overflow-y:auto;box-shadow:var(--shadow)"></div>
    </div>`;
  const sucheEl = host.querySelector('#sidebarProjSuche');
  const listeEl = host.querySelector('#sidebarProjListe');

  function sortierteProjekte(){
    // Zuletzt bearbeitet zuerst (Fallback: neueste zuerst), abgeschlossene Projekte ans Ende
    return [...DB.projects].sort((a,b)=>{
      const aAbgeschlossen = a.status==='abgeschlossen', bAbgeschlossen = b.status==='abgeschlossen';
      if(aAbgeschlossen!==bAbgeschlossen) return aAbgeschlossen?1:-1;
      const aZeit = a._zuletztBearbeitet || a.datum || '';
      const bZeit = b._zuletztBearbeitet || b.datum || '';
      return bZeit.localeCompare(aZeit);
    });
  }
  function zeigeListe(filterText){
    const f = filterText.trim().toLowerCase();
    const treffer = sortierteProjekte().filter(p=>!f || p.name.toLowerCase().includes(f) || (p.kunde||'').toLowerCase().includes(f));
    listeEl.innerHTML = treffer.length ? treffer.map(p=>`
      <div data-sidebar-proj="${p.id}" style="padding:8px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--sidebar-line);opacity:${p.status==='abgeschlossen'?'.55':'1'};${p.id===activeProjectId?'background:rgba(184,118,60,.18)':''}">
        <div style="color:#fff;font-weight:600">${p.name}${p.status==='abgeschlossen'?' ✓':''}</div>
        ${p.kunde?`<div style="color:#c9b89f;opacity:.75;font-size:11px">${p.kunde}</div>`:''}
      </div>`).join('') : `<div style="padding:10px;font-size:12px;opacity:.6">Kein Projekt gefunden.</div>`;
    listeEl.style.display = 'block';
    listeEl.querySelectorAll('[data-sidebar-proj]').forEach(el2=>el2.addEventListener('click', ()=>{
      waehleProjekt(el2.dataset.sidebarProj);
    }));
  }
  function waehleProjekt(id){
    if(window.__autoSaveTimer && window.__autoSaveJetzt){ clearTimeout(window.__autoSaveTimer); window.__autoSaveTimer = null; window.__autoSaveJetzt(); }
    if(window.__nkAutoSaveTimer && window.__nkAutoSaveJetzt){ clearTimeout(window.__nkAutoSaveTimer); window.__nkAutoSaveTimer = null; window.__nkAutoSaveJetzt(); }
    activeProjectId = id || null;
    activeSchrankIndex = 0;
    const p = DB.projects.find(x=>x.id===id);
    if(p){ p._zuletztBearbeitet = new Date().toISOString(); save('projects'); }
    if(!['kalkulation','nachkalkulation','arbeitszeit'].includes(current)) current = 'kalkulation';
    renderNav(); renderMain();
  }
  sucheEl.addEventListener('focus', ()=>{ sucheEl.select(); zeigeListe(''); });
  sucheEl.addEventListener('input', ()=>zeigeListe(sucheEl.value));
  sucheEl.addEventListener('blur', ()=>setTimeout(()=>{ listeEl.style.display='none'; }, 150)); // Verzögerung, damit ein Klick auf ein Listenelement noch ankommt
}
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = VIEWS.map(v=>`<button class="nav-btn ${v.id===current?'active':''}" data-view="${v.id}">
    <span class="nav-icon">${v.icon}</span>${v.label}</button>`).join('');
  nav.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click', ()=>{ goto(b.dataset.view); }));
}
function goto(view){
  if(window.__autoSaveTimer && window.__autoSaveJetzt){
    clearTimeout(window.__autoSaveTimer); window.__autoSaveTimer = null;
    window.__autoSaveJetzt(); // ausstehende Änderung sofort sichern statt auf die Verzögerung zu warten
  }
  if(window.__nkAutoSaveTimer && window.__nkAutoSaveJetzt){
    clearTimeout(window.__nkAutoSaveTimer); window.__nkAutoSaveTimer = null;
    window.__nkAutoSaveJetzt();
  }
  current = view; renderNav(); renderSidebarProjektAuswahl(); renderMain();
}

function gruppiereBeschlagMengen(qtyMap, nurGeplant=true, preisSnapshot=null){
  const preisVon = id => preisSnapshot && preisSnapshot[id]!==undefined ? preisSnapshot[id] : (DB.beschlaege.find(x=>x.id===id)?.preis||0);
  const groups = {};
  DB.beschlaege.forEach(b=>{
    const key = b.gruppe || b.id;
    if(!groups[key]) groups[key] = [];
    groups[key].push(b);
  });
  return Object.values(groups).map(members=>{
    const ids = members.map(m=>m.id);
    const label = members.length>1 ? members[0].gruppe : members[0].name;
    const qty = qtyMap[ids[0]] || 0;
    const kosten = ids.reduce((s,id)=>s + preisVon(id)*(qtyMap[id]||0), 0);
    return {ids, label, members, qty, kosten};
  }).filter(g=>nurGeplant ? g.qty>0 : true)
    .sort((a,b)=>a.label.localeCompare(b.label,'de'));
}

/* Scharnier-Regel — Schwellen und Stückzahlen editierbar unter „Regeln“ */
function scharnierRegelWerte(){
  const def = {h1:900,h2:1600,h3:2100,h4:2400,n1:2,n2:3,n3:4,n4:5,n5:6};
  return {...def, ...(DB.settings?.regelScharnier||{})};
}
function scharnierAnzahl(hoehe){
  const r = scharnierRegelWerte();
  if(hoehe<=r.h1) return r.n1;
  if(hoehe<=r.h2) return r.n2;
  if(hoehe<=r.h3) return r.n3;
  if(hoehe<=r.h4) return r.n4;
  return r.n5;
}
/* Sockelfuß-Regel — Schwellenbreite und Zusatzmenge editierbar */
function sockelRegelWerte(){
  const def = {schwelle:700, zusatzJeSegment:2};
  return {...def, ...(DB.settings?.regelSockel||{})};
}
function sockelAnzahl(breite, mittelseiten){
  const r = sockelRegelWerte();
  const aussenseiten = 2;
  let stk = aussenseiten*2 + mittelseiten*2;
  const segmente = mittelseiten+1;
  const segBreite = breite/segmente;
  let extra = 0;
  if(segBreite>r.schwelle) extra = segmente*r.zusatzJeSegment;
  return {basis:stk, extra, gesamt:stk+extra, segBreite:Math.round(segBreite)};
}
/* Verbinder-Regel — Tiefe-Schwelle und Stückzahlen editierbar */
function verbinderRegelWerte(){
  const def = {schwelle:400, stkBis:4, stkUeber:6};
  return {...def, ...(DB.settings?.regelVerbinder||{})};
}
function verbinderAnzahl(tiefe, mittelseiten, konstruktionsboedenGesamt){
  const r = verbinderRegelWerte();
  const proElement = tiefe<=r.schwelle ? r.stkBis : r.stkUeber;
  const elemente = 2 /* Außenseiten */ + mittelseiten + (konstruktionsboedenGesamt||0);
  return {proElement, elemente, gesamt: elemente*proElement};
}
/* Bodenträger-Regel — Stückzahl je Fachboden editierbar */
function bodentraegerJeFachboden(){

}

/* Richtwerte aus echten Aufträgen ableiten: vergleicht die tatsächlich erfasste Arbeitszeit
   (Seite „Arbeitszeit“) mit den aus der Kalkulation berechneten Kostentreibern (Fläche, Kantenlänge,
   Bauteilanzahl, Bohrpunkte) und leitet daraus realistischere Minuten-/Sekundensätze ab. */
function analysiereSchrankFuerRichtwerte(k){
  const teile = berechneBauteile(k);
  const korpusFl = flaecheBereich(teile,'Korpus');
  const frontFl = flaecheBereich(teile,'Front');
  const rueckFl = flaecheBereich(teile,'Rückwand');
  const gesamtFlaeche = korpusFl+frontFl+rueckFl;
  const kanten = kantenlaenge(teile, k.kantenOverride);
  const anzahlKorpusteile = teile.filter(t=>t.bereich==='Korpus').reduce((s,t)=>s+(t.anzahl||1),0);
  const frontStueck = teile.filter(t=>t.bereich==='Front').reduce((s,t)=>s+(t.anzahl||1),0);
  // Bohrpunkte näherungsweise aus den gespeicherten Beschlagmengen (Scharnier, Verbinder, Bodenträger, Sockel, Kleiderstangenhalter)
  const bq = k.beschlagQty||{};
  const bohrpunkte = (bq.b1||0)+(bq.b10||0)+(bq.b11||0)+(bq.b12||0)+(bq.b14||0);
  return {gesamtFlaeche, kanten, anzahlKorpusteile, frontStueck, bohrpunkte};
}
function ermittleRichtwerteAusPraxis(){
  const zuordnung = [
    {key:'rwZuschnittMinM2', label:'Zuschnitt (Min./m²)', azName:'Zuschnitt', schritt:'Zuschnitt', treiber:'gesamtFlaeche', einheitFaktor:60},
    {key:'rwKantenMinLfm', label:'Kanten (Min./lfm)', azName:'Kanten', schritt:'Kanten', treiber:'kanten', einheitFaktor:60},
    {key:'rwZusammenbauMinStueck', label:'Zusammenbau (Min./Korpusteil)', azName:'Zusammenbau', schritt:'Montage', treiber:'anzahlKorpusteile', einheitFaktor:60},
    {key:'rwCncSekBohrpunkt', label:'CNC/Bohren (Sek./Bohrpunkt)', azName:'CNC-Bearbeitung', schritt:'CNC-Bearbeitung', treiber:'bohrpunkte', einheitFaktor:3600},
    {key:'rwMontageMinFront', label:'Baustellenmontage (Min./Front)', azName:null, schritt:'Einbau', treiber:'frontStueck', einheitFaktor:60},
  ];
  const samples = {}; zuordnung.forEach(z=>samples[z.key]=[]);
  const projekteGenutzt = new Set();
  DB.projects.forEach(p=>{
    const schraenke = p.kalkulation?.schraenke;
    if(!schraenke || !schraenke.length) return;
    let summe = {gesamtFlaeche:0, kanten:0, anzahlKorpusteile:0, frontStueck:0, bohrpunkte:0};
    schraenke.forEach(k=>{
      const a = analysiereSchrankFuerRichtwerte(k);
      summe.gesamtFlaeche += a.gesamtFlaeche; summe.kanten += a.kanten;
      summe.anzahlKorpusteile += a.anzahlKorpusteile; summe.frontStueck += a.frontStueck; summe.bohrpunkte += a.bohrpunkte;
    });
    // Bevorzugte, genauere Quelle: die je Position erfasste Nachkalkulation (Soll-vs-Ist direkt aus der Kalkulation)
    const nk = DB.nachkalkulation.find(x=>x.projId===p.id);
    // Ältere, gröbere Quelle: separat erfasste Arbeitszeiten nach Schritt-Namen
    const zeiten = DB.arbeitszeiten.filter(a=>a.projId===p.id);
    zuordnung.forEach(z=>{
      const treiberWert = summe[z.treiber];
      if(treiberWert<=0) return;
      let stdIst = 0;
      if(nk){
        if(z.azName && Array.isArray(nk.azIst)){
          const treffer = nk.azIst.find(r=>r.name===z.azName);
          if(treffer && treffer.std>0) stdIst = treffer.std;
        }
        else if(!z.azName && nk.baustellenmontageIst>0) stdIst = nk.baustellenmontageIst;
      }
      if(stdIst>0){ samples[z.key].push((stdIst*z.einheitFaktor)/treiberWert); projekteGenutzt.add(p.id); return; }
      // Fallback auf die ältere Arbeitszeit-Erfassung, falls für dieses Projekt keine Nachkalkulation-Werte vorliegen
      if(zeiten.length){
        const stdSchritt = zeiten.filter(zt=>zt.schritt===z.schritt).reduce((s,zt)=>s+(zt.std||0),0);
        if(stdSchritt>0){ samples[z.key].push((stdSchritt*z.einheitFaktor)/treiberWert); projekteGenutzt.add(p.id); }
      }
    });
  });
  const ergebnis = {};
  zuordnung.forEach(z=>{
    const arr = samples[z.key];
    if(arr.length){ ergebnis[z.key] = {label:z.label, alt:DB.settings[z.key], neu:Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100)/100, anzahl:arr.length}; }
  });
  return {ergebnis, projekteAnzahl:projekteGenutzt.size};
}

/* Korpusmaße: Sockelhöhe wird immer von der Höhe abgezogen. Decken-/Seitenblenden werden je nach
   gewähltem Modus entweder vom eingegebenen Gesamtmaß abgezogen (Korpus wird kleiner) oder zusätzlich
   hinzugefügt (Korpus behält das volle Maß, Blenden kommen obendrauf). */
function korpusMasse(k){
  const sockelModus = k.sockelModus || 'abziehen';
  const sockelhoehe = (k.sockeloption==='mit') ? (k.sockelhoehe||0) : 0;
  let hoehe = (sockelModus==='abziehen') ? Math.max(0, (k.hoehe||0) - sockelhoehe) : (k.hoehe||0);
  let breite = k.breite||0;
  const modus = k.blendenModus || 'abziehen';
  const decke = k.deckenblende || {aktiv:false,hoehe:0};
  const links = k.seitenblendeLinks || {aktiv:false,breite:0};
  const rechts = k.seitenblendeRechts || {aktiv:false,breite:0};
  const anstellLinks = k.anstellseiteLinks || {aktiv:false,breite:0};
  const anstellRechts = k.anstellseiteRechts || {aktiv:false,breite:0};
  if(modus==='abziehen'){
    if(decke.aktiv) hoehe = Math.max(0, hoehe - (decke.hoehe||0));
    if(links.aktiv) breite = Math.max(0, breite - (links.breite||0));
    if(rechts.aktiv) breite = Math.max(0, breite - (rechts.breite||0));
    if(anstellLinks.aktiv) breite = Math.max(0, breite - (anstellLinks.breite||0));
    if(anstellRechts.aktiv) breite = Math.max(0, breite - (anstellRechts.breite||0));
  }
  return {breite, hoehe, sockelhoehe};
}

/* Front-Aufteilung: entweder je Fach (zwischen den Mittelseiten) oder – bei „durchgehender Front“ – eine einzige Fläche über die ganze Breite,
   die ebenfalls in Höhe aufgeteilt werden kann (Reihen: Front/Schublade/offen). */
function frontListeVon(k){
  if(k.durchgehendeFront && k.durchgehendeFront.aktiv){
    if(!Array.isArray(k.durchgehendeFront.reihen) || !k.durchgehendeFront.reihen.length) k.durchgehendeFront.reihen = [{typ:'front',hoehe:korpusMasse(k).hoehe||1000}];
    return [k.durchgehendeFront.reihen];
  }
  return k.frontFaecher||[];
}
/* Einzelbreiten der nebeneinander liegenden Stücke einer Reihe: manuell (row.breiten = alle außer dem letzten, der Rest ergibt sich) oder gleichmäßig */
function frontBreitenListe(row, fachBreite){
  if(Array.isArray(row.breiten) && row.breiten.length){
    const summe = row.breiten.reduce((a,b)=>a+(b||0),0);
    return [...row.breiten, Math.max(0, fachBreite-summe)];
  }
  const n = Math.max(1, row.anzahlBreite||1);
  return Array.from({length:n},()=>fachBreite/n);
}
function frontFachBreiteVon(k){
  const km = korpusMasse(k);
  return (k.durchgehendeFront && k.durchgehendeFront.aktiv) ? km.breite : km.breite/((k.mittelseiten||0)+1);
}

/* Bauteile-Berechnung */
function berechneBauteile(k){
  const {tiefe,mittelseiten,fachboedenProFach,konstruktionsboedenProFach,frontFaecher,rueckwand} = k;
  const {breite,hoehe,sockelhoehe} = korpusMasse(k);
  const m2 = mm=>mm/1000;
  const teile = [];
  // Seiten (außen): links und rechts einzeln abschaltbar (z.B. bei Anbau an Wand/Nachbarschrank)
  const seiteLinksAktiv = k.seiteLinksAktiv ?? true;
  const seiteRechtsAktiv = k.seiteRechtsAktiv ?? true;
  if(seiteLinksAktiv) teile.push({name:'Seite links',anzahl:1,b:tiefe,h:hoehe,flaeche:m2(tiefe)*m2(hoehe),bereich:'Korpus',kantentyp:'seite_aussen'});
  if(seiteRechtsAktiv) teile.push({name:'Seite rechts',anzahl:1,b:tiefe,h:hoehe,flaeche:m2(tiefe)*m2(hoehe),bereich:'Korpus',kantentyp:'seite_aussen'});
  if(mittelseiten>0) teile.push({name:'Mittelseite',anzahl:mittelseiten,b:tiefe,h:hoehe,flaeche:mittelseiten*m2(tiefe)*m2(hoehe),bereich:'Korpus',kantentyp:'seite_mittel'});
  // Böden: Boden (unten) und Deckel (oben) einzeln abschaltbar (z.B. Deckel entfällt unter Arbeitsplatte)
  const bodenAktiv = k.bodenAktiv ?? true;
  const deckelAktiv = k.deckelAktiv ?? true;
  if(bodenAktiv) teile.push({name:'Boden',anzahl:1,b:breite,h:tiefe,flaeche:m2(breite)*m2(tiefe),bereich:'Korpus',kantentyp:'boden'});
  if(deckelAktiv) teile.push({name:'Deckel',anzahl:1,b:breite,h:tiefe,flaeche:m2(breite)*m2(tiefe),bereich:'Korpus',kantentyp:'boden'});
  // Fachböden je Fach (Anzahl Fächer = Mittelseiten + 1)
  const fachBreite = breite/(mittelseiten+1);
  (fachboedenProFach||[]).forEach((anz,i)=>{
    if(anz>0) teile.push({name:`Fachboden Fach ${i+1}`,anzahl:anz,b:fachBreite,h:tiefe,flaeche:anz*m2(fachBreite)*m2(tiefe),bereich:'Korpus',kantentyp:'fachboden'});
  });
  // Konstruktionsböden je Fach (stabile, fest eingebaute Böden — eigene Kantenregel)
  (konstruktionsboedenProFach||[]).forEach((anz,i)=>{
    if(anz>0) teile.push({name:`Konstruktionsboden Fach ${i+1}`,anzahl:anz,b:fachBreite,h:tiefe,flaeche:anz*m2(fachBreite)*m2(tiefe),bereich:'Korpus',kantentyp:'konstruktionsboden'});
  });
  // Rückwand
  if(rueckwand) teile.push({name:'Rückwand',anzahl:1,b:breite,h:hoehe,flaeche:m2(breite)*m2(hoehe),bereich:'Rückwand',kantentyp:'rueckwand'});
  // Sockelblende(n): Anzahl Längs (vorne/hinten) und Anzahl Quer (seitlich), analog zum Kanten-Modell
  if(k.sockeloption==='mit' && sockelhoehe>0){
    const sockelLaengs = k.sockelLaengs ?? 1;
    const sockelQuer = k.sockelQuer ?? 0;
    if(sockelLaengs>0) teile.push({name:'Sockelblende Längs',anzahl:sockelLaengs,b:breite,h:sockelhoehe,flaeche:sockelLaengs*m2(breite)*m2(sockelhoehe),bereich:'Front',kantentyp:'sockel'});
    if(sockelQuer>0) teile.push({name:'Sockelblende Quer',anzahl:sockelQuer,b:tiefe,h:sockelhoehe,flaeche:sockelQuer*m2(tiefe)*m2(sockelhoehe),bereich:'Front',kantentyp:'sockel'});
  }
  // Deckenblende: Anzahl Längs und Anzahl Quer, ebenfalls analog zum Kanten-Modell
  if(k.deckenblende?.aktiv && k.deckenblende.hoehe>0){
    const deckeLaengs = k.deckenblende.laengs ?? 1;
    const deckeQuer = k.deckenblende.quer ?? 0;
    if(deckeLaengs>0) teile.push({name:'Deckenblende Längs',anzahl:deckeLaengs,b:breite,h:k.deckenblende.hoehe,flaeche:deckeLaengs*m2(breite)*m2(k.deckenblende.hoehe),bereich:'Front',kantentyp:'blende'});
    if(deckeQuer>0) teile.push({name:'Deckenblende Quer',anzahl:deckeQuer,b:tiefe,h:k.deckenblende.hoehe,flaeche:deckeQuer*m2(tiefe)*m2(k.deckenblende.hoehe),bereich:'Front',kantentyp:'blende'});
  }
  // Seitliche Blende / Anstellseite links und rechts
  if(k.seitenblendeLinks?.aktiv && k.seitenblendeLinks.breite>0){
    const anzL = Math.max(1, k.seitenblendeLinks.anzahl||1);
    teile.push({name:'Seitliche Blende links',anzahl:anzL,b:k.seitenblendeLinks.breite,h:hoehe,flaeche:anzL*m2(k.seitenblendeLinks.breite)*m2(hoehe),bereich:'Front',kantentyp:'blende'});
  }
  if(k.seitenblendeRechts?.aktiv && k.seitenblendeRechts.breite>0){
    const anzR = Math.max(1, k.seitenblendeRechts.anzahl||1);
    teile.push({name:'Seitliche Blende rechts',anzahl:anzR,b:k.seitenblendeRechts.breite,h:hoehe,flaeche:anzR*m2(k.seitenblendeRechts.breite)*m2(hoehe),bereich:'Front',kantentyp:'blende'});
  }
  if(k.anstellseiteLinks?.aktiv && k.anstellseiteLinks.breite>0){
    const anz = Math.max(1, k.anstellseiteLinks.anzahl||1);
    teile.push({name:'Anstellseite links',anzahl:anz,b:k.anstellseiteLinks.breite,h:hoehe,flaeche:anz*m2(k.anstellseiteLinks.breite)*m2(hoehe),bereich:'Front',kantentyp:'anstellseite'});
  }
  if(k.anstellseiteRechts?.aktiv && k.anstellseiteRechts.breite>0){
    const anz = Math.max(1, k.anstellseiteRechts.anzahl||1);
    teile.push({name:'Anstellseite rechts',anzahl:anz,b:k.anstellseiteRechts.breite,h:hoehe,flaeche:anz*m2(k.anstellseiteRechts.breite)*m2(hoehe),bereich:'Front',kantentyp:'anstellseite'});
  }
  if(k.anstellBoden?.aktiv && k.anstellBoden.mass>0){
    const anz = Math.max(1, k.anstellBoden.anzahl||1);
    teile.push({name:'Anstellboden',anzahl:anz,b:breite,h:k.anstellBoden.mass,flaeche:anz*m2(breite)*m2(k.anstellBoden.mass),bereich:'Front',kantentyp:'anstellboden'});
  }
  if(k.anstellDeckel?.aktiv && k.anstellDeckel.mass>0){
    const anz = Math.max(1, k.anstellDeckel.anzahl||1);
    teile.push({name:'Anstelldeckel',anzahl:anz,b:breite,h:k.anstellDeckel.mass,flaeche:anz*m2(breite)*m2(k.anstellDeckel.mass),bereich:'Front',kantentyp:'anstelldeckel'});
  }
  // Frontaufteilung je Fach: pro Reihe wahlweise Front (Tür), Schublade oder offen (kein Material); die eingegebene
  // Höhe ist die Gesamthöhe der Reihe und wird durch die Anzahl (übereinander) geteilt. Die Anzahl (nebeneinander)
  // teilt zusätzlich die Fachbreite auf, damit auch innerhalb eines Fachs mehrere Türen nebeneinander möglich sind.
  const dFront = !!(k.durchgehendeFront && k.durchgehendeFront.aktiv);
  frontListeVon(k).forEach((fach,fi)=>{
    (fach||[]).forEach((row,ri)=>{
      if(row.typ==='offen') return; // offenes Fach: kein Bauteil
      const anzH = row.anzahl||1;
      const anzB = row.anzahlBreite||1;
      const hoeheJeStueck = (row.hoehe||0)/anzH;
      const breiteJeStueck = frontFachBreiteVon(k)/anzB;
      const gesamtStueck = anzH*anzB;
      const label = dFront ? (row.typ==='schublade' ? `Schubladenfront durchgehend ${ri+1}` : `Durchgehende Front ${ri+1}`) : (row.typ==='schublade' ? `Schubladenfront Fach ${fi+1}.${ri+1}` : `Tür Fach ${fi+1}.${ri+1}`);
      if(Array.isArray(row.breiten) && row.breiten.length){
        // Manuell aufgeteilte Breiten: jedes Stück mit eigenem Maß
        frontBreitenListe(row, frontFachBreiteVon(k)).forEach((bj,j)=>{
          teile.push({name:`${label} · Breite ${j+1}`,anzahl:anzH,b:bj,h:hoeheJeStueck,flaeche:anzH*m2(bj)*m2(hoeheJeStueck),bereich:'Front',tuerHoehe:hoeheJeStueck,frontTyp:row.typ,kantentyp:'front'});
        });
        return;
      }
      teile.push({name:label,anzahl:gesamtStueck,b:breiteJeStueck,h:hoeheJeStueck,flaeche:gesamtStueck*m2(breiteJeStueck)*m2(hoeheJeStueck),bereich:'Front',tuerHoehe:hoeheJeStueck,frontTyp:row.typ,kantentyp:'front'});
    });
  });
  // Stückzahl: bei mehreren identischen Schränken alle Bauteilmengen entsprechend vervielfachen
  const stueckzahl = Math.max(0, k.stueckzahl??1);
  if(stueckzahl!==1){
    teile.forEach(t=>{ t.anzahl = t.anzahl*stueckzahl; t.flaeche = t.flaeche*stueckzahl; });
  }
  return teile;
}
function flaecheBereich(teile,bereich){ return teile.filter(t=>t.bereich===bereich).reduce((a,t)=>a+t.flaeche,0); }

/* Kantenregel: je Bauteiltyp wird festgelegt, wie viele Kanten umleimt werden.
   0 = keine, 1 = nur Vorderkante, 2 = zwei Kanten, 4 = umlaufend (alle 4 Kanten). */
const KANTEN_TYP_LABEL = {seite_aussen:'Seiten außen', seite_mittel:'Mittelseite', boden:'Böden (oben/unten)', fachboden:'Fachböden', konstruktionsboden:'Konstruktionsböden', rueckwand:'Rückwand', front:'Türen/Schubladenfronten', sockel:'Sockel', blende:'Blenden (Decke/Seite)', anstellseite:'Anstellseiten', anstellboden:'Anstellboden', anstelldeckel:'Anstelldeckel'};
const TYP_LABEL = {front:'Front (Tür)', schublade:'Schublade', offen:'Offen (kein Material)'};
function kantenRegeln(){
  const def = {
    seite_aussen:{laengs:0,stirn:0,umlaufend:true}, seite_mittel:{laengs:1,stirn:0,umlaufend:false},
    boden:{laengs:1,stirn:0,umlaufend:false}, fachboden:{laengs:0,stirn:0,umlaufend:true},
    konstruktionsboden:{laengs:1,stirn:0,umlaufend:false}, rueckwand:{laengs:0,stirn:0,umlaufend:false},
    front:{laengs:0,stirn:0,umlaufend:true}, sockel:{laengs:0,stirn:0,umlaufend:true},
    blende:{laengs:0,stirn:0,umlaufend:true}, anstellseite:{laengs:0,stirn:0,umlaufend:true},
    anstellboden:{laengs:0,stirn:0,umlaufend:true}, anstelldeckel:{laengs:0,stirn:0,umlaufend:true},
  };
  const gespeichert = DB.settings.kantenRegeln||{};
  const out = {};
  Object.keys(def).forEach(k=>{ out[k] = {...def[k], ...(gespeichert[k]||{})}; });
  return out;
}
function kantenLaengeStueck(t, regel){
  const bM = t.b/1000, hM = t.h/1000;
  if(!regel) return 0;
  if(regel.umlaufend) return 2*(bM+hM);
  // Längskante: bei Seiten die Höhe, sonst die Breite. Stirnkante: jeweils die andere Dimension.
  const laengskante = (t.kantentyp==='seite_aussen' || t.kantentyp==='seite_mittel') ? hM : bM;
  const stirnkante = (t.kantentyp==='seite_aussen' || t.kantentyp==='seite_mittel') ? bM : hM;
  return (regel.laengs||0)*laengskante + (regel.stirn||0)*stirnkante;
}
/* ov = optionale manuelle Kantenlängen je Bauteil (Name → Meter gesamt für diese Zeile), überschreiben die Regel-Berechnung */
function kantenZeileMeter(t, regeln, ov){
  if(ov && ov[t.name]!==undefined && ov[t.name]!==null && !isNaN(ov[t.name])) return ov[t.name];
  return kantenLaengeStueck(t, regeln[t.kantentyp]) * t.anzahl;
}
function kantenlaenge(teile, ov){
  const regeln = kantenRegeln();
  return teile.reduce((sum,t)=> sum + kantenZeileMeter(t, regeln, ov), 0);
}
