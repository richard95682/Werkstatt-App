    function aktualisiereAzZeilenKosten(i){
      const kEl = host.querySelector(`[data-az-kosten="${i}"]`);
      const pos = state.az[i];
      if(kEl) kEl.textContent = `= ${fmtEUR((pos.std||0)*s2.mitarbeiter1Satz + (pos.std2||0)*s2.mitarbeiter2Satz)}`;
    }
    host.querySelectorAll('[data-az-std]').forEach(inp=>inp.addEventListener('input',e=>{
      const i = +e.target.dataset.azStd;
      state.az[i].std = parseFloat(e.target.value)||0;
      aktualisiereAzGesamtfeld(); aktualisiereAzZeilenKosten(i); updateResults();
    }));
    host.querySelectorAll('[data-az-std]').forEach(inp=>inp.addEventListener('blur',e=>{
      const i = +e.target.dataset.azStd;
      const gerundet = rundeViertelstundeAuf(parseFloat(e.target.value)||0);
      e.target.value = gerundet;
      state.az[i].std = gerundet;
      aktualisiereAzZeilenKosten(i); updateResults();
    }));
    host.querySelectorAll('[data-az-std2]').forEach(inp=>inp.addEventListener('input',e=>{
      const i = +e.target.dataset.azStd2;
      state.az[i].std2 = parseFloat(e.target.value)||0;
      aktualisiereAzGesamtfeld(); aktualisiereAzZeilenKosten(i); updateResults();
    }));
    host.querySelectorAll('[data-az-std2]').forEach(inp=>inp.addEventListener('blur',e=>{
      const i = +e.target.dataset.azStd2;
      const gerundet = rundeViertelstundeAuf(parseFloat(e.target.value)||0);
      e.target.value = gerundet;
      state.az[i].std2 = gerundet;
      aktualisiereAzZeilenKosten(i); updateResults();
    }));
    host.querySelectorAll('[data-az-up]').forEach(b=>b.addEventListener('click',e=>{
      const i=+e.target.dataset.azUp; if(i>0){ [state.az[i-1],state.az[i]]=[state.az[i],state.az[i-1]]; renderArbeitszeitListe(); updateResults(); }
    }));
    host.querySelectorAll('[data-az-down]').forEach(b=>b.addEventListener('click',e=>{
      const i=+e.target.dataset.azDown; if(i<state.az.length-1){ [state.az[i+1],state.az[i]]=[state.az[i],state.az[i+1]]; renderArbeitszeitListe(); updateResults(); }
    }));
    host.querySelectorAll('[data-az-del]').forEach(b=>b.addEventListener('click',e=>{
      state.az.splice(+e.target.dataset.azDel,1); renderArbeitszeitListe(); updateResults();
    }));
    const gesamtEl = host.querySelector('#az_gesamt');
    if(gesamtEl) gesamtEl.addEventListener('input',e=>{
      const neuerGesamt = parseFloat(e.target.value)||0;
      if(state.az.length){
        // Beide Felder (Hauptfeld + Mitarbeiter-2-Feld) je Position als eine gemeinsame Liste verteilen
        const werte = state.az.flatMap(p=>[p.std||0, p.std2||0]);
        const neu = verteileViertelstunden(werte, neuerGesamt);
        state.az.forEach((p,i)=>{ p.std = neu[i*2]; p.std2 = neu[i*2+1]; });
      }
      host.querySelectorAll('[data-az-std]').forEach(inp=>{
        const i = +inp.dataset.azStd;
        if(document.activeElement!==inp) inp.value = state.az[i].std;

      host.querySelectorAll('[data-az-std2]').forEach(inp=>{
        const i = +inp.dataset.azStd2;
        if(document.activeElement!==inp) inp.value = state.az[i].std2;
      });
      updateResults();
    });
  }

  // Zusätzliche Platten: eigene Platte mit Material- und Kantenauswahl (echte m²- und Kantenberechnung)
  function zusatzPlatteFlaeche(p){ return p.m2Modus ? (p.m2Direkt||0)*(p.anzahl||1) : ((p.breite||0)/1000)*((p.hoehe||0)/1000)*(p.anzahl||1); }
  function zusatzPlatteKante(p){
    if(p.m2Modus) return 0; // ohne Breite/Höhe lässt sich keine Kantenlänge berechnen
    const bM=(p.breite||0)/1000, hM=(p.hoehe||0)/1000;
    let laenge;
    if(p.umlaufend) laenge = 2*(bM+hM);
    else laenge = (p.laengskanten||0)*Math.max(bM,hM) + (p.stirnkanten||0)*Math.min(bM,hM);
    return laenge*(p.anzahl||1);
  }
  function renderZusatzPlattenListe(){
    if(!state.zusatzPlatten) state.zusatzPlatten = [];
    const host = el.querySelector('#zusatzPlattenList');
    const matOpt = sel => DB.materials.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${m.name} (${fmtEUR(m.preis)}/m²)</option>`).join('') || '<option value="">— keine Materialien —</option>';
    host.innerHTML = state.zusatzPlatten.length ? state.zusatzPlatten.map((p,i)=>{
      const flaeche = zusatzPlatteFlaeche(p);
      const mat = findMat(p.materialId);
      const kosten = flaeche*(mat?.preis||0);
      const umlaufend = !!p.umlaufend;
      const m2Modus = !!p.m2Modus;
      return `<div class="checkline" style="flex-wrap:wrap;row-gap:6px">
        <input type="text" style="width:150px" value="${p.name||''}" data-zp-name="${i}" placeholder="Bezeichnung">

        ${m2Modus ? `
        <input type="number" min="0" step="0.01" style="width:80px" value="${p.m2Direkt||0}" data-zp-m2direkt="${i}" placeholder="m²">
        <span class="small">m² ×</span>
        ` : `
        <input type="number" min="0" style="width:75px" value="${p.breite||0}" data-zp-breite="${i}" placeholder="Breite mm">
        <span class="small">×</span>
        <input type="number" min="0" style="width:75px" value="${p.hoehe||0}" data-zp-hoehe="${i}" placeholder="Höhe mm">
        <span class="small">mm ×</span>
        `}
        <input type="number" min="1" style="width:50px" value="${p.anzahl||1}" data-zp-anzahl="${i}" title="Anzahl Stück">
        <span class="small">Stk</span>
        <span class="small mono" data-zp-summe="${i}">${fmtM2(flaeche)} = ${fmtEUR(kosten)}</span>
        <button class="btn btn-ghost btn-sm" data-zp-del="${i}" style="margin-left:auto">✕</button>
        ${!m2Modus ? `
        <span style="flex-basis:100%"></span>
        <span class="small" style="margin-left:24px">Kanten:</span>
        <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Längskanten <input type="number" min="0" max="2" style="width:45px" value="${p.laengskanten||0}" data-zp-laengs="${i}" ${umlaufend?'disabled':''}></label>
        <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Stirnkanten <input type="number" min="0" max="2" style="width:45px" value="${p.stirnkanten||0}" data-zp-stirn="${i}" ${umlaufend?'disabled':''}></label>
        <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none"><input type="checkbox" style="width:auto" data-zp-umlaufend="${i}" ${umlaufend?'checked':''}> umlaufend</label>
        ` : `<span class="small" style="flex-basis:100%;margin-left:24px">Bei direkter m²-Eingabe ist keine Kantenberechnung möglich (fehlende Maße).</span>`}
      </div>`;
    }).join('') : `<div class="small">Keine Zusatzplatten. Klicke „+ Platte hinzufügen“.</div>`;
    function refreshZeile(i){
      const p = state.zusatzPlatten[i];
      const flaeche = zusatzPlatteFlaeche(p);
      const mat = findMat(p.materialId);
      const kosten = flaeche*(mat?.preis||0);
      const s = host.querySelector(`[data-zp-summe="${i}"]`);
      if(s) s.textContent = `${fmtM2(flaeche)} = ${fmtEUR(kosten)}`;

    host.querySelectorAll('[data-zp-name]').forEach(inp=>inp.addEventListener('input',e=>{
      state.zusatzPlatten[+e.target.dataset.zpName].name = e.target.value; updateResults();

    host.querySelectorAll('[data-zp-mat]').forEach(sel=>sel.addEventListener('change',e=>{

    host.querySelectorAll('[data-zp-m2modus]').forEach(inp=>inp.addEventListener('change',e=>{
      const i=+e.target.dataset.zpM2modus; state.zusatzPlatten[i].m2Modus = e.target.checked; renderZusatzPlattenListe(); updateResults();

    host.querySelectorAll('[data-zp-m2direkt]').forEach(inp=>inp.addEventListener('input',e=>{

    host.querySelectorAll('[data-zp-anzahl]').forEach(inp=>inp.addEventListener('input',e=>{
      const i=+e.target.dataset.zpAnzahl; state.zusatzPlatten[i].anzahl = Math.max(1,parseInt(e.target.value)||1); refreshZeile(i); updateResults();
    }));
    host.querySelectorAll('[data-zp-laengs]').forEach(inp=>inp.addEventListener('input',e=>{
      const i=+e.target.dataset.zpLaengs; state.zusatzPlatten[i].laengskanten = Math.max(0,Math.min(2,parseInt(e.target.value)||0)); updateResults();
    }));
    host.querySelectorAll('[data-zp-stirn]').forEach(inp=>inp.addEventListener('input',e=>{
      const i=+e.target.dataset.zpStirn; state.zusatzPlatten[i].stirnkanten = Math.max(0,Math.min(2,parseInt(e.target.value)||0)); updateResults();
    }));
    host.querySelectorAll('[data-zp-umlaufend]').forEach(cb=>cb.addEventListener('change',e=>{

    host.querySelectorAll('[data-zp-del]').forEach(b=>b.addEventListener('click',e=>{

  el.querySelector('#az_vorschlag').addEventListener('click',()=>{
    readBasics();
    const teile = berechneBauteile(state);
    const korpusFl = flaecheBereich(teile,'Korpus');
    const frontFl = flaecheBereich(teile,'Front');
    const rueckFl = flaecheBereich(teile,'Rückwand');
    const gesamtFlaeche = korpusFl+frontFl+rueckFl;
    const kanten = kantenlaenge(teile);
    const anzahlBauteile = teile.reduce((s,t)=>s+(t.anzahl||1),0);
    const anzahlKorpusteile = teile.filter(t=>t.bereich==='Korpus').reduce((s,t)=>s+(t.anzahl||1),0);
    const frontStueck = teile.filter(t=>t.bereich==='Front').reduce((s,t)=>s+(t.anzahl||1),0);
    const rec = empfohleneBeschlagMengen();
    const bohrpunkte = (rec.b1||0) + (rec.b10||0) + (rec.b11||0) + (rec.b12||0) + (rec.b14||0);

    // Richtwerte aus den Einstellungen (dort kalibrierbar, siehe „Nachkalkulation“)
    const rw = DB.settings;
    const rund = n => rundeViertelstundeAuf(n);
    const vorschlag = {
      AV: rund((rw.rwAvBasis||0) + ((rw.rwAvJeFach||0)/60)*(state.mittelseiten+1)),
      Zuschnitt: rund((anzahlBauteile*(rw.rwZuschnittMinStueck||0) + gesamtFlaeche*(rw.rwZuschnittMinM2||0))/60),
      Kanten: rund((kanten*(rw.rwKantenMinLfm||0))/60),
      Zusammenbau: rund((anzahlKorpusteile*(rw.rwZusammenbauMinStueck||0))/60),
      'CNC-Bearbeitung': rund((bohrpunkte*(rw.rwCncSekBohrpunkt||0))/3600),
    };
    let geaendert = [];
    state.az.forEach(pos=>{
      if(vorschlag[pos.name]!==undefined){ pos.std = vorschlag[pos.name]; geaendert.push(`${pos.name}: ${vorschlag[pos.name]} Std.`); }
    });
    const bmVorschlag = rund((frontStueck*(rw.rwMontageMinFront||0) + (rw.rwMontagePauschaleMin||0))/60);
    state.baustellenmontage.std = bmVorschlag;
    el.querySelector('#bm_std').value = bmVorschlag;
    renderArbeitszeitListe(); updateResults();
    alert('Stundenvorschlag eingefügt:\n' + geaendert.join('\n') + `\nBaustellenmontage (Vorschlag, nicht aktiviert): ${bmVorschlag} Std.`);
  });

  el.querySelector('#bm_km').addEventListener('input',e=>{
    state.baustellenmontage.km = parseFloat(e.target.value)||0;
    const kostenEl = el.querySelector('#bm_km_kosten');
    if(kostenEl) kostenEl.textContent = fmtEUR(state.baustellenmontage.km*DB.settings.kmPauschale);
    updateResults();
  });

  function readBasics(){
    const altKorpus = korpusMasse(state); // vor dieser Änderung — für automatischen Höhenausgleich
    const altTiefe = state.tiefe;
    state.typ = el.querySelector('#k_typ').value;
    { const roh = parseInt(el.querySelector('#k_stueckzahl').value); state.stueckzahl = Math.max(0, isNaN(roh)?1:roh); }
    state.seiteLinksAktiv = el.querySelector('#k_seiteLinks_aktiv').checked;
    state.seiteRechtsAktiv = el.querySelector('#k_seiteRechts_aktiv').checked;
    state.bodenAktiv = el.querySelector('#k_boden_aktiv').checked;
    state.deckelAktiv = el.querySelector('#k_deckel_aktiv').checked;
    state.breite = parseFloat(el.querySelector('#k_breite').value)||0;
    state.hoehe = parseFloat(el.querySelector('#k_hoehe').value)||0;
    state.tiefe = parseFloat(el.querySelector('#k_tiefe').value)||0;
    const neueMittelseiten = parseInt(el.querySelector('#k_mittelseiten').value)||0;
    if(neueMittelseiten !== state.mittelseiten){
      state.fachboedenProFach = resizeFachArray(state.fachboedenProFach, neueMittelseiten+1, 0);
      state.konstruktionsboedenProFach = resizeFachArray(state.konstruktionsboedenProFach, neueMittelseiten+1, 0);
      state.kleiderstangenProFach = resizeFachArray(state.kleiderstangenProFach, neueMittelseiten+1, 0);
      state.frontFaecher = resizeFrontFaecher(state.frontFaecher, neueMittelseiten+1);
    }
    state.mittelseiten = neueMittelseiten;
    state.rueckwand = el.querySelector('#k_rueckwand').value==='1';
    state.sockeloption = el.querySelector('#k_sockeloption').value;
    state.sockelhoehe = parseFloat(el.querySelector('#k_sockelhoehe').value)||0;
    state.sockelModus = el.querySelector('#k_sockelmodus').value;
    state.sockelLaengs = Math.max(0, Math.min(2, parseInt(el.querySelector('#k_sockel_laengs').value)||0));
    state.sockelQuer = Math.max(0, Math.min(2, parseInt(el.querySelector('#k_sockel_quer').value)||0));
    state.blendenModus = el.querySelector('#k_blendenmodus').value;
    state.deckenblende = { aktiv: el.querySelector('#k_deckenblende_aktiv').checked, hoehe: parseFloat(el.querySelector('#k_deckenblende_hoehe').value)||0,
      laengs: Math.max(0, Math.min(2, parseInt(el.querySelector('#k_decke_laengs').value)||0)), quer: Math.max(0, Math.min(2, parseInt(el.querySelector('#k_decke_quer').value)||0)) };
    state.seitenblendeLinks = { aktiv: el.querySelector('#k_seiteL_aktiv').checked, breite: parseFloat(el.querySelector('#k_seiteL_breite').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_seiteL_anzahl').value)||1) };
    state.seitenblendeRechts = { aktiv: el.querySelector('#k_seiteR_aktiv').checked, breite: parseFloat(el.querySelector('#k_seiteR_breite').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_seiteR_anzahl').value)||1) };
    state.anstellseiteLinks = { aktiv: el.querySelector('#k_anstellL_aktiv').checked, breite: parseFloat(el.querySelector('#k_anstellL_breite').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_anstellL_anzahl').value)||1), autoTiefe: state.anstellseiteLinks?.autoTiefe ?? true };
    state.anstellseiteRechts = { aktiv: el.querySelector('#k_anstellR_aktiv').checked, breite: parseFloat(el.querySelector('#k_anstellR_breite').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_anstellR_anzahl').value)||1), autoTiefe: state.anstellseiteRechts?.autoTiefe ?? true };
    state.anstellBoden = { aktiv: el.querySelector('#k_anstellboden_aktiv').checked, mass: parseFloat(el.querySelector('#k_anstellboden_mass').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_anstellboden_anzahl').value)||1), autoTiefe: state.anstellBoden?.autoTiefe ?? true };
    state.anstellDeckel = { aktiv: el.querySelector('#k_anstelldeckel_aktiv').checked, mass: parseFloat(el.querySelector('#k_anstelldeckel_mass').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_anstelldeckel_anzahl').value)||1), autoTiefe: state.anstellDeckel?.autoTiefe ?? true };
    state.lieferkosten = { aktiv: el.querySelector('#lk_aktiv').checked, preis: parseFloat(el.querySelector('#lk_preis').value)||0 };
    state.kleinmaterial = { aktiv: el.querySelector('#km_aktiv').checked, preis: parseFloat(el.querySelector('#km_preis').value)||0 };
    el.querySelector('#lk_preis').disabled = !state.lieferkosten.aktiv;
    el.querySelector('#km_preis').disabled = !state.kleinmaterial.aktiv;
    state.materialKorpusId = el.querySelector('#k_matKorpus').value;
    state.materialFrontId = el.querySelector('#k_matFront').value;
    state.materialRueckwandId = el.querySelector('#k_matRueckwand').value;
    // Sperren/Entsperren abhängiger Felder
    el.querySelector('#k_sockelhoehe').disabled = state.sockeloption!=='mit';
    el.querySelector('#k_sockelmodus').disabled = state.sockeloption!=='mit';
    el.querySelector('#k_sockel_laengs').disabled = state.sockeloption!=='mit';
    el.querySelector('#k_sockel_quer').disabled = state.sockeloption!=='mit';
    el.querySelector('#k_deckenblende_hoehe').disabled = !state.deckenblende.aktiv;
    el.querySelector('#k_decke_laengs').disabled = !state.deckenblende.aktiv;
    el.querySelector('#k_decke_quer').disabled = !state.deckenblende.aktiv;
    el.querySelector('#k_seiteL_breite').disabled = !state.seitenblendeLinks.aktiv;
    el.querySelector('#k_seiteL_anzahl').disabled = !state.seitenblendeLinks.aktiv;
    el.querySelector('#k_seiteR_breite').disabled = !state.seitenblendeRechts.aktiv;
    el.querySelector('#k_seiteR_anzahl').disabled = !state.seitenblendeRechts.aktiv;
    el.querySelector('#k_anstellL_breite').disabled = !state.anstellseiteLinks.aktiv;
    el.querySelector('#k_anstellL_anzahl').disabled = !state.anstellseiteLinks.aktiv;
    el.querySelector('#k_anstellR_breite').disabled = !state.anstellseiteRechts.aktiv;
    el.querySelector('#k_anstellR_anzahl').disabled = !state.anstellseiteRechts.aktiv;
    el.querySelector('#k_anstellboden_mass').disabled = !state.anstellBoden.aktiv;
    el.querySelector('#k_anstellboden_anzahl').disabled = !state.anstellBoden.aktiv;
    el.querySelector('#k_anstelldeckel_mass').disabled = !state.anstellDeckel.aktiv;
    el.querySelector('#k_anstelldeckel_anzahl').disabled = !state.anstellDeckel.aktiv;
    const km = korpusMasse(state);
    el.querySelector('#korpusMasseAnzeige').textContent = `Korpusmaß nach Sockel/Blenden: ${Math.round(km.breite)} × ${Math.round(km.hoehe)} mm (Breite × Höhe)`;
    // Ändert sich die Korpushöhe (z.B. durch Sockelhöhe oder Deckenblende), wird die Differenz automatisch
    // von der ersten Reihe jedes Fachs übernommen, damit die Fronthöhe wieder exakt zur Korpushöhe passt.
    const deltaHoehe = Math.round(km.hoehe - altKorpus.hoehe);
    if(deltaHoehe!==0 && state.frontFaecher){
      state.frontFaecher.forEach(fach=>{
        if(fach && fach.length){ fach[0].hoehe = Math.max(0, Math.round((fach[0].hoehe||0) + deltaHoehe)); }
      });
    }
    // Anstellseiten/Boden/Deckel folgen automatisch der Korpustiefe, solange sie nicht manuell überschrieben wurden
    if(state.tiefe !== altTiefe){
      [['anstellseiteLinks','breite','k_anstellL_breite'],['anstellseiteRechts','breite','k_anstellR_breite'],['anstellBoden','mass','k_anstellboden_mass'],['anstellDeckel','mass','k_anstelldeckel_mass']].forEach(([objKey,feld,inputId])=>{
        if(state[objKey] && state[objKey].autoTiefe){
          state[objKey][feld] = state.tiefe;
          const inp = el.querySelector('#'+inputId);
          if(inp && document.activeElement!==inp) inp.value = state.tiefe;
        }
      });
    }
  }
  ['k_anstellL_breite','k_anstellR_breite','k_anstellboden_mass','k_anstelldeckel_mass'].forEach(id=>{
    el.querySelector('#'+id).addEventListener('input', ()=>{
      const map = {k_anstellL_breite:'anstellseiteLinks', k_anstellR_breite:'anstellseiteRechts', k_anstellboden_mass:'anstellBoden', k_anstelldeckel_mass:'anstellDeckel'};
      const key = map[id];
      if(state[key]) state[key].autoTiefe = false; // Nutzer hat manuell eingegriffen — folgt der Tiefe nicht mehr automatisch
    });
  });
  ['k_typ','k_rueckwand','k_matKorpus','k_matFront','k_matRueckwand','lk_preis','km_preis']
    .forEach(id=>el.querySelector('#'+id).addEventListener('input',()=>{ readBasics(); updateResults(); }));
  el.querySelector('#lk_aktiv').addEventListener('change',e=>{
    if(e.target.checked){
      const preisFeld = el.querySelector('#lk_preis');
      if((parseFloat(preisFeld.value)||0)===0) preisFeld.value = DB.settings.standardLieferkosten||0;
    }
    readBasics(); updateResults();
  });
  el.querySelector('#km_aktiv').addEventListener('change',e=>{
    if(e.target.checked){
      const preisFeld = el.querySelector('#km_preis');
      if((parseFloat(preisFeld.value)||0)===0) preisFeld.value = DB.settings.standardKleinmaterial||0;
    }
    readBasics(); updateResults();
  });
  // Diese Felder verändern Korpusmaße und/oder Fach-Struktur und müssen die Editoren komplett neu aufbauen
  ['k_breite','k_hoehe','k_tiefe','k_mittelseiten','k_stueckzahl','k_seiteLinks_aktiv','k_seiteRechts_aktiv','k_boden_aktiv','k_deckel_aktiv','k_sockeloption','k_sockelhoehe','k_sockelmodus','k_sockel_laengs','k_sockel_quer','k_blendenmodus',
   'k_deckenblende_aktiv','k_deckenblende_hoehe','k_decke_laengs','k_decke_quer','k_seiteL_aktiv','k_seiteL_breite','k_seiteL_anzahl','k_seiteR_aktiv','k_seiteR_breite','k_seiteR_anzahl',
   'k_anstellL_aktiv','k_anstellL_breite','k_anstellL_anzahl','k_anstellR_aktiv','k_anstellR_breite','k_anstellR_anzahl','k_anstellboden_aktiv','k_anstellboden_mass','k_anstellboden_anzahl','k_anstelldeckel_aktiv','k_anstelldeckel_mass','k_anstelldeckel_anzahl']
    .forEach(id=>el.querySelector('#'+id).addEventListener('input',()=>{ readBasics(); renderFachboeden(); renderKonstruktionsboeden(); renderKleiderstangen(); renderFrontFaecher(); renderBeschlagChecklist(); updateResults(); }));

  function resizeFrontFaecher(arr, len){
    const out = (arr||[]).slice(0,len);
    while(out.length<len) out.push([{typ:'front',hoehe:korpusMasse(state).hoehe||1000}]);
    return out;
  }
  // Von oben nach unten: jede Reihe "leiht" sich ihre Höhe von der Reihe direkt darüber (die erste/oberste
  // Reihe hat nichts über sich und bleibt frei). Löscht man eine Reihe, wandert ihre Höhe zurück nach oben.
  // Platzbedarf einer Reihe = Anzahl × Höhe (z.B. 3 gleiche Schubladen à 150 mm = 450 mm).
  function verbrauch(row){ return row.hoehe||0; } // eingegebene Höhe = Gesamthöhe der Reihe
  function proStueck(row){ return (row.hoehe||0)/Math.max(1,row.anzahl||1); } // Höhe je Einzelstück (für Bauteilliste/Scharniere)
  function fachStatus(fach){
    if(!fach.length) return {ok:true, text:''};
    const zielHoehe = korpusMasse(state).hoehe;
    const summe = fach.reduce((s,r)=>s+verbrauch(r),0);
    const diff = summe - zielHoehe;
    if(Math.abs(diff)<1) return {ok:true, text:`Summe ${Math.round(summe)} mm — passt genau auf ${Math.round(zielHoehe)} mm (Korpushöhe)`};
    return {ok:false, text: diff>0 ? `Summe ${Math.round(summe)} mm — ${Math.round(diff)} mm zu hoch` : `Summe ${Math.round(summe)} mm — noch ${Math.round(-diff)} mm frei bis ${Math.round(zielHoehe)} mm (Korpushöhe)`};
  }
  function restNachReihe(fach, ri){
    const summeBis = fach.slice(0,ri+1).reduce((s,r)=>s+verbrauch(r),0);
    return korpusMasse(state).hoehe - summeBis; // Korpushöhe minus Summe aller Reihen bis inkl. dieser (von oben gerechnet)
  }
  function renderFrontFaecher(){
    const host = el.querySelector('#frontFaecherHost');
    const fachBreite = Math.round(korpusMasse(state).breite/(state.mittelseiten+1));
    host.innerHTML = state.frontFaecher.map((fach,fi)=>{
      const status = fachStatus(fach);
      return `<div style="border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <b class="small">Fach ${fi+1}</b><span class="small mono">Breite ${fachBreite} mm</span>
          <span class="small mono" data-fach-summary="${fi}" style="margin-left:auto;color:${status.ok?'var(--sage)':'var(--danger)'}">${status.text}</span>
        </div>
        ${fach.map((row,ri)=>{
          const rest = restNachReihe(fach,ri);
          const anzB = row.anzahlBreite||1;
          const breiteJeStueck = Math.round(fachBreite/anzB);
          return `<div class="checkline" style="flex-wrap:wrap;row-gap:6px">
            <select data-frow-typ="${fi}:${ri}" style="width:180px">
              ${Object.entries(TYP_LABEL).map(([v,l])=>`<option value="${v}" ${row.typ===v?'selected':''}>${l}</option>`).join('')}
            </select>
            <input type="number" min="1" style="width:52px" value="${row.anzahl||1}" data-frow-anzahl="${fi}:${ri}" title="Anzahl übereinander (Höhe wird geteilt)">
            <span class="small">× (übereinander)</span>
            <input type="number" min="0" style="width:90px" value="${row.hoehe}" data-frow-hoehe="${fi}:${ri}" placeholder="Höhe mm (gesamt)">
            <span class="small">mm gesamt${ri===0?' <span class="small">(oberste Reihe)</span>':''} <span class="small mono" data-frow-perstueck="${fi}:${ri}">${(row.anzahl||1)>1?`= ${Math.round(proStueck(row))} mm je Stück`:''}</span></span>
            <span class="small mono" data-frow-rest="${fi}:${ri}" style="color:${rest<0?'var(--danger)':'var(--text-muted)'}">→ Rest ${Math.round(rest)} mm</span>
            <button class="btn btn-ghost btn-sm" data-frow-del="${fi}:${ri}" style="margin-left:auto">✕</button>
            <span style="flex-basis:100%"></span>
            <span class="small" style="margin-left:32px">Nebeneinander in diesem Fach:</span>
            <input type="number" min="1" style="width:52px" value="${anzB}" data-frow-anzahlbreite="${fi}:${ri}" title="Anzahl Türen/Schubladen nebeneinander (Fachbreite wird geteilt)">
            <span class="small mono" data-frow-breitejestueck="${fi}:${ri}">→ ${breiteJeStueck} mm je Stück (Fachbreite ${fachBreite} mm)</span>
            ${row.typ==='front' ? `<span class="small mono" data-frow-scharniere="${fi}:${ri}">${scharnierAnzahl(proStueck(row))} Scharniere${((row.anzahl||1)*anzB)>1?` × ${(row.anzahl||1)*anzB}`:''}</span>` : ''}
          </div>`;
        }).join('')}
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn-ghost btn-sm" data-frow-add="${fi}">+ Reihe (nimmt sich die Resthöhe: Gesamthöhe − Summe aller vorherigen Zeilen)</button>
          <button class="btn btn-ghost btn-sm" data-frow-even="${fi}">↕ Höhen gleichmäßig aufteilen</button>
        </div>
      </div>`;
    }).join('');

    // Leichte Aktualisierung ohne kompletten Neuaufbau (verhindert Fokusverlust beim Tippen)
    function refreshRestDisplays(){
      state.frontFaecher.forEach((fach,fi)=>{
        const status = fachStatus(fach);
        const summaryEl = host.querySelector(`[data-fach-summary="${fi}"]`);
        if(summaryEl){
          summaryEl.textContent = status.text;
          summaryEl.style.color = status.ok? 'var(--sage)':'var(--danger)';
        }
        fach.forEach((row,ri)=>{
          const hEl = host.querySelector(`[data-frow-hoehe="${fi}:${ri}"]`);
          if(hEl && document.activeElement!==hEl) hEl.value = row.hoehe;
          const aEl = host.querySelector(`[data-frow-anzahl="${fi}:${ri}"]`);
          if(aEl && document.activeElement!==aEl) aEl.value = row.anzahl||1;
          const psEl = host.querySelector(`[data-frow-perstueck="${fi}:${ri}"]`);
          if(psEl) psEl.textContent = (row.anzahl||1)>1 ? `= ${Math.round(proStueck(row))} mm je Stück` : '';
          const rest = restNachReihe(fach,ri);
          const rEl = host.querySelector(`[data-frow-rest="${fi}:${ri}"]`);
          if(rEl){ rEl.textContent = `→ Rest ${Math.round(rest)} mm`; rEl.style.color = rest<0?'var(--danger)':'var(--text-muted)'; }
          if(row.typ==='front'){
            const sEl = host.querySelector(`[data-frow-scharniere="${fi}:${ri}"]`);
            if(sEl) sEl.textContent = `${scharnierAnzahl(proStueck(row))} Scharniere${((row.anzahl||1)*(row.anzahlBreite||1))>1?` × ${(row.anzahl||1)*(row.anzahlBreite||1)}`:''}`;
          }
          const abEl = host.querySelector(`[data-frow-anzahlbreite="${fi}:${ri}"]`);
          if(abEl && document.activeElement!==abEl) abEl.value = row.anzahlBreite||1;
          const bpsEl = host.querySelector(`[data-frow-breitejestueck="${fi}:${ri}"]`);
          if(bpsEl) bpsEl.textContent = `→ ${Math.round(fachBreite/(row.anzahlBreite||1))} mm je Stück (Fachbreite ${fachBreite} mm)`;
        });
      });
    }

    // Differenz im Platzbedarf einer Reihe von der Reihe direkt darüber abziehen bzw. zugeben
    // Änderungen an jeder Reihe außer der ersten werden immer von der ERSTEN Reihe im Fach abgezogen/zugegeben.
    function delta_uebertragen(fi, ri, altVerbrauch, neuVerbrauch){
      const fach = state.frontFaecher[fi];
      const delta = neuVerbrauch - altVerbrauch;
      if(ri===0) return; // die erste Reihe selbst ist die "Quelle" — nichts gleicht sie aus
      const ersteRow = fach[0];
      ersteRow.hoehe = Math.max(0, Math.round(verbrauch(ersteRow) - delta));
    }

    host.querySelectorAll('[data-frow-typ]').forEach(sel=>sel.addEventListener('change',e=>{
      const [fi,ri]=e.target.dataset.frowTyp.split(':').map(Number);
      state.frontFaecher[fi][ri].typ = e.target.value;
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-frow-hoehe]').forEach(inp=>{
      inp.addEventListener('input',e=>{
        const [fi,ri]=e.target.dataset.frowHoehe.split(':').map(Number);
        const row = state.frontFaecher[fi][ri];
        const altV = verbrauch(row);
        row.hoehe = parseFloat(e.target.value)||0;
        delta_uebertragen(fi, ri, altV, verbrauch(row));
        refreshRestDisplays(); renderBeschlagChecklist(); updateResults();
      });
    });
    host.querySelectorAll('[data-frow-anzahl]').forEach(inp=>{
      inp.addEventListener('input',e=>{
        const [fi,ri]=e.target.dataset.frowAnzahl.split(':').map(Number);
        const row = state.frontFaecher[fi][ri];
        row.anzahl = Math.max(1, parseInt(e.target.value)||1);
        // Gesamthöhe der Reihe bleibt gleich — wird nur neu durch die Anzahl geteilt
        renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
      });
    });
    host.querySelectorAll('[data-frow-anzahlbreite]').forEach(inp=>{
      inp.addEventListener('input',e=>{
        const [fi,ri]=e.target.dataset.frowAnzahlbreite.split(':').map(Number);
        const row = state.frontFaecher[fi][ri];
        row.anzahlBreite = Math.max(1, parseInt(e.target.value)||1);
        // Fachbreite bleibt gleich — wird nur neu auf die nebeneinander liegenden Stücke geteilt
        renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
      });
    });
    host.querySelectorAll('[data-frow-del]').forEach(b=>b.addEventListener('click',e=>{
      const [fi,ri]=e.target.dataset.frowDel.split(':').map(Number);
      const fach = state.frontFaecher[fi];
      const geloescht = fach[ri];
      if(fach.length>1){
        const empfaenger = ri>0 ? fach[0] : fach[1]; // Höhe wandert zurück zur ersten Reihe (bzw. bei Löschen der ersten Reihe an die neue erste)
        empfaenger.hoehe = Math.round(verbrauch(empfaenger) + verbrauch(geloescht));
      }
      fach.splice(ri,1);
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-frow-add]').forEach(b=>b.addEventListener('click',e=>{
      const fi=+e.target.dataset.frowAdd;
      const fach = state.frontFaecher[fi];
      const summeBisher = fach.reduce((s,r)=>s+verbrauch(r),0);
      const restHoehe = Math.max(0, Math.round(korpusMasse(state).hoehe - summeBisher));
      fach.push({typ:'front',hoehe:restHoehe,anzahl:1});
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-frow-even]').forEach(b=>b.addEventListener('click',e=>{
      const fi=+e.target.dataset.frowEven;
      const rows = state.frontFaecher[fi];
      if(rows.length){ const each = Math.round(korpusMasse(state).hoehe/rows.length); rows.forEach(r=>{ r.hoehe = each; }); }
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
  }

  function empfohleneBeschlagMengen(){
    const alleReihen = state.frontFaecher.flat();
    const frontReihen = alleReihen.filter(r=>r.typ==='front');
    const schubladenReihen = alleReihen.filter(r=>r.typ==='schublade');
    const scharniere = frontReihen.reduce((sum,r)=>sum+scharnierAnzahl((r.hoehe||0)/(r.anzahl||1))*(r.anzahl||1)*(r.anzahlBreite||1),0);
    const sock = sockelAnzahl(korpusMasse(state).breite, state.mittelseiten);
    const konstruktionsboedenGesamt = (state.konstruktionsboedenProFach||[]).reduce((a,n)=>a+n,0);
    const verbinder = verbinderAnzahl(state.tiefe, state.mittelseiten, konstruktionsboedenGesamt).gesamt;
    const bodentraeger = (state.fachboedenProFach||[]).reduce((a,n)=>a+n,0)*bodentraegerJeFachboden();
    const auszuege = schubladenReihen.reduce((sum,r)=>sum+(r.anzahl||1)*(r.anzahlBreite||1),0);
    const proFront = frontReihen.reduce((sum,r)=>sum+(r.anzahl||1)*(r.anzahlBreite||1),0) + auszuege; // Griff/Tip-on je Front- und Schubladenstück
    const fachBreiteM = (korpusMasse(state).breite/(state.mittelseiten+1))/1000;
    const stangenGesamt = (state.kleiderstangenProFach||[]).reduce((a,n)=>a+n,0);
    const stangenLaengeM = Math.round(stangenGesamt*fachBreiteM*100)/100;
    const rec = {
      b1:scharniere, b3:proFront*2, // Scharnier, Dämpfer (2 je Tür/Schublade)
      b4:proFront, b5:proFront, b6:proFront, // Griff, Tip-on, Push-to-open — je 1x pro Front-/Schubladenstück
      b7:auszuege,
      b8:stangenLaengeM, b14:stangenGesamt*2, // Kleiderstange (Meter) + 2 Halter je Stange
      b10:verbinder, b11: bodentraeger,
      b12: state.sockeloption==='mit'? sock.gesamt : 0,
      b13: state.sockeloption==='mit'? Math.ceil(sock.gesamt/2) : 0,
    };
    // Neue, selbst angelegte Beschläge in der Kategorie "Verbinder" bekommen automatisch dieselbe Verbinder-Stückzahl
    DB.beschlaege.filter(b=>b.kategorie==='Verbinder' && !(b.id in rec)).forEach(b=>{ rec[b.id] = verbinder; });
    // Stückzahl: bei mehreren identischen Schränken alle Beschlagmengen entsprechend vervielfachen
    const stueckzahl = Math.max(0, state.stueckzahl??1);
    if(stueckzahl!==1){ Object.keys(rec).forEach(id=>{ rec[id] = Math.round(rec[id]*stueckzahl*100)/100; }); }
    return rec;
  }

  function renderBeschlagChecklist(){
    const rec = empfohleneBeschlagMengen();
    if(!state.beschlagQty) state.beschlagQty = {};
    if(!state.beschlagQtyManual) state.beschlagQtyManual = {};
    if(!state._autoTouched) state._autoTouched = {};
    // Automatisches Ankreuzen bestimmter Beschlag-Gruppen, sobald sie sinnvoll sind — solange nicht manuell abgewählt
    const frontReihenAnzahl = state.frontFaecher.flat().filter(r=>r.typ==='front').length;
    function autoCheckGruppe(schluessel, ids, bedingung){
      if(DB.settings.autoHaken && DB.settings.autoHaken[schluessel]===false) return; // Automatik für diese Gruppe deaktiviert
      if(state._autoTouched[schluessel]) return; // Nutzer hat diese Gruppe schon einmal manuell verändert
      if(bedingung){
        if(!ids.some(id=>state.beschlagQty[id]!==undefined)){ ids.forEach(id=>{ state.beschlagQty[id] = rec[id]||0; }); }
      } else {
        ids.forEach(id=>{ delete state.beschlagQty[id]; }); // nicht mehr nötig — Haken automatisch wieder entfernen
      }
    }
    autoCheckGruppe('scharnier', ['b1'], frontReihenAnzahl>0 && rec.b1>0);
    autoCheckGruppe('griff', ['b4'], rec.b4>0);
    autoCheckGruppe('auszug', ['b7'], rec.b7>0);
    autoCheckGruppe('bodentraeger', ['b11'], rec.b11>0);
    autoCheckGruppe('sockel', ['b12','b13'], state.sockeloption==='mit' && rec.b12>0);
    autoCheckGruppe('kleiderstange', ['b8'], rec.b8>0);
    autoCheckGruppe('kleiderstangenhalter', ['b14'], rec.b14>0);
    // Fixierte (angepinnte) Beschläge: bleiben immer angehakt, unabhängig von allen anderen Bedingungen
    (DB.settings.fixierteBeschlaege||[]).forEach(key=>{
      const ids = key.split(',');
      if(!ids.every(id=>state.beschlagQty[id]!==undefined)){
        ids.forEach(id=>{ if(state.beschlagQty[id]===undefined) state.beschlagQty[id] = rec[id] ?? 1; });
      }
    });
    // Live-Sync: angehakte, aber nicht manuell überschriebene Mengen immer auf dem aktuellen Stand halten
    Object.keys(state.beschlagQty).forEach(id=>{
      if(!state.beschlagQtyManual[id] && rec[id]!==undefined){
        state.beschlagQty[id] = rec[id];
      }
    });
    const cats = [...new Set(DB.beschlaege.map(b=>b.kategorie))];
    const host = el.querySelector('#beschlagList');
    host.innerHTML = cats.map(cat=>{
      const items = DB.beschlaege.filter(b=>b.kategorie===cat);
      const groups = {};
      items.forEach(b=>{ const key=b.gruppe||b.id; (groups[key]=groups[key]||[]).push(b); });
      const rows = Object.values(groups).map(members=>{
        const ids = members.map(m=>m.id);
        const rowKey = ids.join(',');
        const fixiert = (DB.settings.fixierteBeschlaege||[]).includes(rowKey);
        const label = members.length>1 ? members[0].gruppe : members[0].name;
        const checked = ids.every(id=>state.beschlagQty[id]!==undefined) || fixiert;
        const manuell = ids.some(id=>state.beschlagQtyManual[id]);
        const recQty = rec[ids[0]]||0;
        const qty = checked ? (state.beschlagQty[ids[0]] ?? recQty) : recQty;
        const preisSumme = members.reduce((s,m)=>s+m.preis,0);
        const preisFelder = members.map(m=>`<input type="number" min="0" step="0.01" data-bprice="${m.id}" value="${m.preis}" style="width:52px" title="${m.name}">`).join('+');
        return `<div class="checkline" style="padding:2px 0;gap:4px;line-height:1.2">
          <button class="btn btn-ghost btn-sm" data-bpin="${rowKey}" title="${fixiert?'Angepinnt — klicken zum Lösen':'Anpinnen — bleibt dann immer angehakt'}" style="padding:1px 4px;font-size:10px;${fixiert?'opacity:1':'opacity:.3'}">📌</button>
          <input type="checkbox" data-gcheck="${ids.join(',')}" ${checked?'checked':''} ${fixiert?'disabled title="Angepinnt"':''}>
          <span style="font-size:11.5px">${label}${members.length>1?` <span class="small" style="font-size:10px">(${members.map(m=>m.name).join('+')})</span>`:''}</span>
          <span class="qty-price" style="gap:2px">
            <input type="number" min="0" data-gqty="${ids.join(',')}" value="${qty}" style="width:38px;padding:2px 4px" ${checked?'':'disabled'} title="${manuell?'Manuell gesetzt':'Automatisch berechnet'}">
            ${checked?`<span style="color:var(--text-muted);font-size:9px" title="${manuell?'Manuell gesetzt':'Automatisch berechnet'}">${manuell?'✎':'⟳'}</span>`:''}
            <span class="small" style="font-size:10px">×</span>${preisFelder}<span class="small" style="font-size:10px">€</span>
          </span>
        </div>`;
      }).join('');
      return `<div style="margin-bottom:4px">
        <div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:4px 0 1px;font-size:10px">${cat}</div>
        ${rows}
      </div>`;
    }).join('');
    host.querySelectorAll('[data-bpin]').forEach(btn=>btn.addEventListener('click', async e=>{
      const rowKey = e.target.dataset.bpin;
      if(!DB.settings.fixierteBeschlaege) DB.settings.fixierteBeschlaege = [];
      const idx = DB.settings.fixierteBeschlaege.indexOf(rowKey);
      if(idx>=0) DB.settings.fixierteBeschlaege.splice(idx,1);
      else DB.settings.fixierteBeschlaege.push(rowKey);
      await save('settings');
      renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-gcheck]').forEach(cb=>cb.addEventListener('change',e=>{
      const ids = e.target.dataset.gcheck.split(',');
      if(ids.includes('b1')) state._autoTouched.scharnier = true;
      if(ids.includes('b4')) state._autoTouched.griff = true;
      if(ids.includes('b7')) state._autoTouched.auszug = true;
      if(ids.includes('b11')) state._autoTouched.bodentraeger = true;
      if(ids.includes('b12')) state._autoTouched.sockel = true;
      if(ids.includes('b8')) state._autoTouched.kleiderstange = true;
      if(ids.includes('b14')) state._autoTouched.kleiderstangenhalter = true;
      if(e.target.checked) ids.forEach(id=>{ state.beschlagQty[id] = rec[id]||1; delete state.beschlagQtyManual[id]; });
      else ids.forEach(id=>{ delete state.beschlagQty[id]; delete state.beschlagQtyManual[id]; });
      renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-gqty]').forEach(inp=>inp.addEventListener('input',e=>{
      const ids = e.target.dataset.gqty.split(',');
      const v = parseFloat(e.target.value)||0;
      ids.forEach(id=>{ state.beschlagQty[id]=v; state.beschlagQtyManual[id]=true; });
      updateResults();
    }));
    host.querySelectorAll('[data-bprice]').forEach(inp=>inp.addEventListener('input', async e=>{
      const b = DB.beschlaege.find(x=>x.id===e.target.dataset.bprice);
      if(b){ b.preis = parseFloat(e.target.value)||0; await save('beschlaege'); updateResults(); }
    }));

    // hints
    const hintsHost = el.querySelector('#beschlagHints');
    let hints = [];
    state.frontFaecher.forEach((fach,fi)=>fach.forEach((row,ri)=>{
      if(row.typ==='front'){
        const hoeheJeStueck = Math.round((row.hoehe||0)/(row.anzahl||1));
        const gesamtStueck = (row.anzahl||1)*(row.anzahlBreite||1);
        hints.push(`Fach ${fi+1}, Front ${ri+1} · Höhe ${hoeheJeStueck} mm je Stück${gesamtStueck>1?` × ${gesamtStueck} Stück`:''} erkannt → <b>${scharnierAnzahl(hoeheJeStueck)*gesamtStueck} Scharniere</b> empfohlen.`);
      }
    }));
    const alleFrontSchublade = state.frontFaecher.flat().filter(r=>r.typ!=='offen');
    if(!alleFrontSchublade.length){
      hints.push(`Alle Fächer sind offen — keine Front vorhanden.`);
    }
    const sock = sockelAnzahl(korpusMasse(state).breite, state.mittelseiten);
    if(state.sockeloption==='mit' && sock.extra>0) hints.push(`Segmentbreite ${sock.segBreite} mm &gt; 700 mm → <b>+${sock.extra} zusätzliche Sockelfüße</b> empfohlen.`);
    hintsHost.innerHTML = hints.map(h=>`<div class="hint">💡 ${h}</div>`).join('');
  }

  function updateResults(){
    readBasics();
    const teile = berechneBauteile(state);
    const korpusFl = flaecheBereich(teile,'Korpus');
    const frontFl = flaecheBereich(teile,'Front');
    const rueckFl = flaecheBereich(teile,'Rückwand');
    const kanten = kantenlaenge(teile);

    const matK = findMat(state.materialKorpusId), matF = findMat(state.materialFrontId), matR = findMat(state.materialRueckwandId);
    const s = DB.settings;

    const zK = 1 + ((s.zuschlagKorpus||0)/100);
    const zF = 1 + ((s.zuschlagFront||0)/100);
    const zR = 1 + ((s.zuschlagRueckwand||0)/100);
    const zusatzPlattenFlaeche = (state.zusatzPlatten||[]).reduce((sum,p)=>sum+zusatzPlatteFlaeche(p),0);
    const zP = 1 + ((s.zuschlagZusatzplatten||0)/100);
    const zusatzPlattenMaterialKosten = (state.zusatzPlatten||[]).reduce((sum,p)=>{ const mat=findMat(p.materialId); return sum + zusatzPlatteFlaeche(p)*zP*(mat?.preis||0); },0);
    const zusatzPlattenKantenLaenge = (state.zusatzPlatten||[]).reduce((sum,p)=>sum+zusatzPlatteKante(p),0);
    const korpusMaterialKosten = (korpusFl*zK)*(matK?.preis||0);
    const frontMaterialKosten = (frontFl*zF)*(matF?.preis||0);
    const rueckwandMaterialKosten = (rueckFl*zR)*(matR?.preis||0);
    const materialNetto = korpusMaterialKosten + frontMaterialKosten + rueckwandMaterialKosten + zusatzPlattenMaterialKosten;
    const kanten_gesamt = kanten + zusatzPlattenKantenLaenge;
    const kantenKosten = kanten_gesamt*s.kantenpreis;
    const puVerleimungKosten = state.puVerleimung && kanten_gesamt>0 ? Math.ceil(kanten_gesamt/Math.max(1,s.puVerleimungSchwelleLfm))*s.puVerleimungPreis : 0;
    const beschlagKosten = Object.entries(state.beschlagQty||{}).reduce((sum,[id,qty])=>{ const b=DB.beschlaege.find(x=>x.id===id); return sum + (b?b.preis*qty:0); },0);
    const zusatzKosten = (state.zusatzpositionen||[]).reduce((sum,pos)=>sum+((pos.menge||0)*(pos.preis||0)),0);
    const lieferkostenBetrag = state.lieferkosten?.aktiv ? (state.lieferkosten.preis||0) : 0;
    const kmPauschaleBetrag = state.baustellenmontage?.aktiv ? ((state.baustellenmontage.km||0)*DB.settings.kmPauschale) : 0;
    const kleinmaterialBetrag = state.kleinmaterial?.aktiv ? (state.kleinmaterial.preis||0) : 0;
    const stueckzahlAz = Math.max(0, state.stueckzahl??1);
    const stundenOberflaecheJeStueck = state.oberflaeche?.aktiv ? ((state.oberflaeche.std||0)+(state.oberflaeche.std2||0)) : 0;
    const stundenNormalJeStueck = (state.az||[]).reduce((sum,pos)=>sum+(pos.std||0)+(pos.std2||0),0) + stundenOberflaecheJeStueck;
    const stundenBaustelleJeStueck = state.baustellenmontage?.aktiv ? ((state.baustellenmontage.std||0)+(state.baustellenmontage.std2||0)) : 0;
    const stundenOberflaeche = stundenOberflaecheJeStueck*stueckzahlAz;
    const stundenNormal = stundenNormalJeStueck*stueckzahlAz;
    const stundenBaustelle = stundenBaustelleJeStueck*stueckzahlAz;
    const stunden = stundenNormal + stundenBaustelle;
    const azKostenJeStueck = (state.az||[]).reduce((sum,pos)=>sum + (pos.std||0)*s.mitarbeiter1Satz + (pos.std2||0)*s.mitarbeiter2Satz, 0);
    const oberflaecheKostenJeStueck = state.oberflaeche?.aktiv ? ((state.oberflaeche.std||0)*s.mitarbeiter1Satz + (state.oberflaeche.std2||0)*s.mitarbeiter2Satz) : 0;
    const arbeitszeitKosten = (azKostenJeStueck + oberflaecheKostenJeStueck)*stueckzahlAz + stundenBaustelle*(s.stundensatzBaustelle||s.stundensatz);

    // Gewinnzuschlag je Position statt Gemeinkosten + einmaligem Gewinn
    const gewinnMaterialBetrag = materialNetto*((s.gewinnMaterial||0)/100);
    const gewinnKantenBetrag = (kantenKosten+puVerleimungKosten)*((s.gewinnKanten||0)/100);
    const gewinnBeschlaegeBetrag = beschlagKosten*((s.gewinnBeschlaege||0)/100);
    const gewinnZusatzBetrag = (state.zusatzpositionen||[]).reduce((sum,pos)=>sum+((pos.menge||0)*(pos.preis||0))*((pos.gewinnzuschlag??s.gewinnZusatz??0)/100),0);
    const materialKosten = materialNetto + gewinnMaterialBetrag;
    const kantenMitGewinn = kantenKosten + puVerleimungKosten + gewinnKantenBetrag;
    const beschlagMitGewinn = beschlagKosten + gewinnBeschlaegeBetrag;
    const zusatzMitGewinn = zusatzKosten + gewinnZusatzBetrag;
    const verkaufspreis = materialKosten + kantenMitGewinn + beschlagMitGewinn + zusatzMitGewinn + lieferkostenBetrag + kleinmaterialBetrag + kmPauschaleBetrag + arbeitszeitKosten;

    state._result = {teile,korpusFl,frontFl,rueckFl,kanten:kanten_gesamt,materialKosten,beschlagKosten,arbeitszeitKosten,verkaufspreis,
      materialNetto,kantenKosten,puVerleimungKosten,zusatzKosten,azBreakdown:(state.az||[]).map(pos=>({name:pos.name,std:((pos.std||0)+(pos.std2||0))*stueckzahlAz})),
      azBreakdownM1:(state.az||[]).map(pos=>({name:pos.name,std:(pos.std||0)*stueckzahlAz})),
      azBreakdownM2:(state.az||[]).map(pos=>({name:pos.name,std:(pos.std2||0)*stueckzahlAz})),
      baustellenmontageStd:stundenBaustelle, baustellenmontageKm:(state.baustellenmontage?.aktiv?(state.baustellenmontage.km||0):0),
      baustellenmontageStdM1:(state.baustellenmontage?.aktiv?(state.baustellenmontage.std||0):0)*stueckzahlAz,
      baustellenmontageStdM2:(state.baustellenmontage?.aktiv?(state.baustellenmontage.std2||0):0)*stueckzahlAz,
      korpusMaterialKosten,frontMaterialKosten,rueckwandMaterialKosten,zusatzPlattenMaterialKosten,
      materialKorpusId:state.materialKorpusId,materialFrontId:state.materialFrontId,materialRueckwandId:state.materialRueckwandId,
      zusatzPlattenFlaeche,
      zusatzPlattenSnapshot:(state.zusatzPlatten||[]).map(pl=>{
        const flaeche = zusatzPlatteFlaeche(pl);
        return {id:pl.id, name:pl.name, materialId:pl.materialId, flaeche, kosten:flaeche*zP*(findMat(pl.materialId)?.preis||0)};
      }),
      beschlagQtySnapshot:{...(state.beschlagQty||{})},
      beschlagPreisSnapshot: Object.fromEntries(DB.beschlaege.map(b=>[b.id,b.preis])),
      oberflaecheStd:stundenOberflaeche, lieferkostenBetrag, kleinmaterialBetrag, kmPauschaleBetrag,
      oberflaecheStdM1:(state.oberflaeche?.aktiv?(state.oberflaeche.std||0):0)*stueckzahlAz,
      oberflaecheStdM2:(state.oberflaeche?.aktiv?(state.oberflaeche.std2||0):0)*stueckzahlAz,
      zusatzpositionenSnapshot:(state.zusatzpositionen||[]).map(pos=>({id:pos.id, name:pos.name, menge:pos.menge||0, preis:pos.preis||0, gewinnzuschlag:pos.gewinnzuschlag??s.gewinnZusatz}))};

    // material match hint
    const matHint = el.querySelector('#matHint');
    matHint.innerHTML = (state.materialKorpusId && state.materialKorpusId===state.materialFrontId)
      ? `<div class="hint ok">🤖 Korpus und Front nutzen dasselbe Material — Zusammenfassung in der Bestellung vorgeschlagen.</div>` : '';

    const host = el.querySelector('#ergebnisHost');
    const regelnAktuell = kantenRegeln();
    host.innerHTML = `
      <div class="card">
        <h3>📋 Bauteilliste (automatisch)</h3>
        <div class="partlist"><table><thead><tr><th>Bauteil</th><th>Anzahl</th><th>Maße (mm)</th><th>Fläche</th><th>Bereich</th><th>Kante/Stk</th></tr></thead>
        <tbody>${teile.map(t=>`<tr><td>${t.name}</td><td>${t.anzahl}</td><td class="mono">${Math.round(t.b)} × ${Math.round(t.h)}</td><td class="mono">${fmtM2(t.flaeche)}</td><td>${t.bereich}</td><td class="mono">${kantenLaengeStueck(t,regelnAktuell[t.kantentyp]).toFixed(2)} m</td></tr>`).join('')}</tbody></table>
        <div class="parttotal"><span>Kantenlänge gesamt (inkl. Zusatzplatten)</span><span class="mono">${kanten_gesamt.toFixed(2)} m</span></div></div>
      </div>
      <div class="grid cols-2">
        <div class="card">
          <h3>🪵 Materialflächen</h3>
          <div class="checkline"><span>Korpusfläche (exakt)</span><span class="mono" style="margin-left:auto;font-weight:300">${fmtM2(korpusFl)}</span></div>
          <div class="checkline"><span class="small">Verschnittzuschlag Korpus</span><input type="number" min="0" step="1" id="zu_korpus" value="${s.zuschlagKorpus}" style="width:60px;margin-left:auto"><span class="small">%</span></div>
          <div class="checkline"><b class="small">→ Menge / Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto">${fmtM2(korpusFl*zK)} = ${fmtEUR(korpusMaterialKosten)}</b></div>
          <div class="checkline"><span>Frontfläche (exakt)</span><span class="mono" style="margin-left:auto;font-weight:300">${fmtM2(frontFl)}</span></div>
          <div class="checkline"><span class="small">Verschnittzuschlag Front</span><input type="number" min="0" step="1" id="zu_front" value="${s.zuschlagFront}" style="width:60px;margin-left:auto"><span class="small">%</span></div>
          <div class="checkline"><b class="small">→ Menge / Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto">${fmtM2(frontFl*zF)} = ${fmtEUR(frontMaterialKosten)}</b></div>
          <div class="checkline"><span>Rückwandfläche (exakt)</span><span class="mono" style="margin-left:auto;font-weight:300">${fmtM2(rueckFl)}</span></div>
          <div class="checkline"><span class="small">Verschnittzuschlag Rückwand</span><input type="number" min="0" step="1" id="zu_rueckwand" value="${s.zuschlagRueckwand}" style="width:60px;margin-left:auto"><span class="small">%</span></div>
          <div class="checkline"><b class="small">→ Menge / Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto">${fmtM2(rueckFl*zR)} = ${fmtEUR(rueckwandMaterialKosten)}</b></div>
          <div class="kv"><span>Verschnittzuschlag gesamt</span><b>${fmtM2((korpusFl*(zK-1))+(frontFl*(zF-1))+(rueckFl*(zR-1)))}</b></div>
          <div class="checkline"><span>Zusätzliche Platten</span><b class="mono" style="margin-left:auto">${fmtM2(zusatzPlattenFlaeche)} = ${fmtEUR(zusatzPlattenMaterialKosten)}</b></div>
          <div class="checkline"><span class="small">Verschnittzuschlag Zusatzplatten</span><input type="number" min="0" step="1" id="zu_zplatten" value="${s.zuschlagZusatzplatten}" style="width:55px;margin-left:auto"><span class="small">%</span></div>
          <div class="checkline"><b class="small">→ Menge / Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto">${fmtM2(zusatzPlattenFlaeche*zP)} = ${fmtEUR(zusatzPlattenMaterialKosten)}</b></div>

        </div>
        <div class="card">
          <h3>💶 Kalkulation</h3>
          ${stueckzahlAz===0?`<div class="small" style="margin-bottom:8px;color:var(--warn,#b34a3a)">⚠️ Stückzahl 0 — für diesen Schrank wird nichts berechnet (Material, Beschläge, Arbeitszeit = 0). Zusatzplatten und Zusatzpositionen unten laufen trotzdem normal mit.</div>`:''}

    // Automatisches Speichern des Schranks (entkoppelt, damit nicht bei jedem Tastendruck geschrieben wird)
    // Aktualisiert auch den Angebotspreis (geplant) automatisch, damit die Gesamtübersicht immer aktuell ist — ohne Rückfrage.
    async function autoSaveJetzt(){
      const kopie = JSON.parse(JSON.stringify(state));
      delete kopie._result;
      kopie.geplant = baueGeplantSnapshot(state, state._result);
      schraenke[activeSchrankIndex] = kopie;
      p._zuletztBearbeitet = new Date().toISOString();

      cloudSyncProjekt(p).then(()=>cloudNeuBerechneStundenFuerProjekt(p.id)).catch(err=>console.warn('Cloud-Sync fehlgeschlagen:', err));
      if(!document.body.contains(el) || current!=='kalkulation') return; // nur die UI-Aktualisierung überspringen, falls Seite gewechselt
      renderSchrankTabs();
      renderGesamtuebersicht();
      const statusEl = el.querySelector('#autoSaveStatus');
      if(statusEl){ statusEl.textContent = '✓ automatisch gespeichert'; setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 2000); }
    }
    window.__autoSaveJetzt = autoSaveJetzt; // damit der Seitenwechsel (Navigation) ausstehende Änderungen sofort sichern kann
    if(window.__autoSaveTimer) clearTimeout(window.__autoSaveTimer);
    window.__autoSaveTimer = setTimeout(autoSaveJetzt, 700);
  }

  el.querySelector('#k_save').addEventListener('click', async ()=>{
    readBasics();
    const gespeichert = JSON.parse(JSON.stringify(state));
    gespeichert.geplant = baueGeplantSnapshot(state, state._result);
    schraenke[activeSchrankIndex] = gespeichert;
    await save('projects');
    renderSchrankTabs();
    renderGesamtuebersicht();
    const statusEl = document.getElementById('autoSaveStatus');
    if(statusEl){ statusEl.textContent = '✓ Angebotspreis festgeschrieben & Gesamtübersicht aktualisiert'; setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 2500); }
  });
}

/* Mehrere unterschiedliche Schränke je Projekt */
function defaultSchrank(name){
  const d = defaultKalk();
  d.name = name;
  return d;
}
function getSchraenke(p){
  if(!p.kalkulation){
    p.kalkulation = { schraenke: [defaultSchrank('Schrank 1')] };
  } else if(!p.kalkulation.schraenke){
    // Rückwärtskompatibilität: ältere Projekte hatten genau eine Kalkulation direkt unter p.kalkulation
    const alt = p.kalkulation;
    p.kalkulation = { schraenke: [{...alt, name: alt.name || 'Schrank 1'}] };
  }
  return p.kalkulation.schraenke;
}
function projektGeplantGesamt(p){
  const schraenke = p.kalkulation?.schraenke || [];
  const out = schraenke.reduce((sum,s)=>{
    const g = s.geplant||{};
    (g.azBreakdown||[]).forEach(pos=>{ sum.az[pos.name] = (sum.az[pos.name]||0) + (pos.std||0); });
    (g.azBreakdownM1||[]).forEach(pos=>{ sum.azM1[pos.name] = (sum.azM1[pos.name]||0) + (pos.std||0); });
    (g.azBreakdownM2||[]).forEach(pos=>{ sum.azM2[pos.name] = (sum.azM2[pos.name]||0) + (pos.std||0); });
    Object.entries(g.beschlagQtySnapshot||{}).forEach(([id,qty])=>{ sum.beschlagQty[id] = (sum.beschlagQty[id]||0) + (qty||0); });
    Object.entries(g.beschlagPreisSnapshot||{}).forEach(([id,preis])=>{ sum.beschlagPreis[id] = preis; });
    if(g.materialKorpusId) sum.materialKorpusId = g.materialKorpusId;
    if(g.materialFrontId) sum.materialFrontId = g.materialFrontId;
    if(g.materialRueckwandId) sum.materialRueckwandId = g.materialRueckwandId;
    (g.zusatzPlattenSnapshot||[]).forEach(pl=>{ sum.zusatzPlatten.push({...pl, key: s.name+':'+pl.id}); });
    (g.zusatzpositionenSnapshot||[]).forEach(pos=>{ sum.zusatzpositionen.push({...pos, key: s.name+':'+pos.id}); });
    return {
      material: sum.material + (g.material||0),
      materialNetto: sum.materialNetto + (g.materialNetto||0),
      korpusMaterialKosten: sum.korpusMaterialKosten + (g.korpusMaterialKosten||0),
      frontMaterialKosten: sum.frontMaterialKosten + (g.frontMaterialKosten||0),
      rueckwandMaterialKosten: sum.rueckwandMaterialKosten + (g.rueckwandMaterialKosten||0),
      zusatzPlattenMaterialKosten: sum.zusatzPlattenMaterialKosten + (g.zusatzPlattenMaterialKosten||0),
      korpusFl: sum.korpusFl + (g.korpusFl||0),
      frontFl: sum.frontFl + (g.frontFl||0),
      rueckFl: sum.rueckFl + (g.rueckFl||0),
      zusatzPlattenFlaeche: sum.zusatzPlattenFlaeche + (g.zusatzPlattenFlaeche||0),
      kantenKosten: sum.kantenKosten + (g.kantenKosten||0),
      kantenLfm: sum.kantenLfm + (g.kantenLfm||0),
      beschlagKosten: sum.beschlagKosten + (g.beschlagKosten||0),
      zusatzKosten: sum.zusatzKosten + (g.zusatzKosten||0),
      puVerleimung: sum.puVerleimung || !!g.puVerleimung,
      baustellenmontageStd: sum.baustellenmontageStd + (g.baustellenmontageStd||0),
      baustellenmontageStdM1: sum.baustellenmontageStdM1 + (g.baustellenmontageStdM1||0),
      baustellenmontageStdM2: sum.baustellenmontageStdM2 + (g.baustellenmontageStdM2||0),
      oberflaecheStd: sum.oberflaecheStd + (g.oberflaecheStd||0),
      oberflaecheStdM1: sum.oberflaecheStdM1 + (g.oberflaecheStdM1||0),
      oberflaecheStdM2: sum.oberflaecheStdM2 + (g.oberflaecheStdM2||0),
      lieferkostenBetrag: sum.lieferkostenBetrag + (g.lieferkostenBetrag||0),
      kmPauschaleBetrag: sum.kmPauschaleBetrag + (g.kmPauschaleBetrag||0),
      baustellenmontageKm: sum.baustellenmontageKm + (g.baustellenmontageKm||0),
      kleinmaterialBetrag: sum.kleinmaterialBetrag + (g.kleinmaterialBetrag||0),
      zeit: sum.zeit + (g.zeit||0),
      kosten: sum.kosten + (g.kosten||0),
      az: sum.az, azM1: sum.azM1, azM2: sum.azM2, beschlagQty: sum.beschlagQty, beschlagPreis: sum.beschlagPreis, zusatzPlatten: sum.zusatzPlatten, zusatzpositionen: sum.zusatzpositionen,
      materialKorpusId: sum.materialKorpusId, materialFrontId: sum.materialFrontId, materialRueckwandId: sum.materialRueckwandId,
    };
  }, {material:0, materialNetto:0, korpusMaterialKosten:0, frontMaterialKosten:0, rueckwandMaterialKosten:0, zusatzPlattenMaterialKosten:0,
      korpusFl:0, frontFl:0, rueckFl:0, zusatzPlattenFlaeche:0,
      kantenKosten:0, kantenLfm:0, beschlagKosten:0, zusatzKosten:0, puVerleimung:false, baustellenmontageStd:0, baustellenmontageStdM1:0, baustellenmontageStdM2:0, oberflaecheStd:0, oberflaecheStdM1:0, oberflaecheStdM2:0, lieferkostenBetrag:0, kleinmaterialBetrag:0, kmPauschaleBetrag:0, baustellenmontageKm:0, zeit:0, kosten:0, az:{}, azM1:{}, azM2:{}, beschlagQty:{}, beschlagPreis:{}, zusatzPlatten:[], zusatzpositionen:[],
      materialKorpusId:'', materialFrontId:'', materialRueckwandId:''});
  return out;
}
/* Berechnet den tatsächlichen NK-Gesamtpreis (Ist, inkl. Zuschläge) eines Projekts — eigenständig nutzbar,
   z.B. für die Projektübersicht, ohne die komplette Nachkalkulation-Seite rendern zu müssen. */
function berechneNkVerkaufspreis(p){
  const geplant = projektGeplantGesamt(p);
  const nk = DB.nachkalkulation.find(x=>x.projId===p.id);
  if(!nk) return geplant.kosten; // noch keine Nachkalkulation erfasst -> identisch zum VK-Preis
  const findMatLokal = id => DB.materials.find(m=>m.id===id);
  const zPn = 1 + ((DB.settings.zuschlagZusatzplatten||0)/100);
  const zKn = 1 + ((DB.settings.zuschlagKorpus||0)/100);
  const zFn = 1 + ((DB.settings.zuschlagFront||0)/100);
  const zRn = 1 + ((DB.settings.zuschlagRueckwand||0)/100);
  const m2Ist = (feld, sollFl) => nk[feld]===null||nk[feld]===undefined ? sollFl : nk[feld];
  const matKosten = (matId, m2) => (findMatLokal(matId)?.preis||0) * m2;
  const korpusKostenIst = matKosten(nk.korpusMaterialId||geplant.materialKorpusId, m2Ist('korpusM2Ist', geplant.korpusFl*zKn));
  const frontKostenIst = matKosten(nk.frontMaterialId||geplant.materialFrontId, m2Ist('frontM2Ist', geplant.frontFl*zFn));
  const rueckwandKostenIst = matKosten(nk.rueckwandMaterialId||geplant.materialRueckwandId, m2Ist('rueckwandM2Ist', geplant.rueckFl*zRn));
  const zusatzPlattenKostenIst = (geplant.zusatzPlatten||[]).reduce((s,pl)=>{
    const gespeichert = (nk.zusatzPlattenIst||{})[pl.key];
    const materialId = pl.materialId || gespeichert?.materialId;
    const m2 = gespeichert?.m2 ?? (pl.flaeche*zPn);
    return s + matKosten(materialId, m2);
  },0);
  const zusatzPlattenExtraKostenIst = (nk.zusatzPlattenExtra||[]).reduce((s,ex)=>s+matKosten(ex.materialId, ex.m2||0),0);
  const materialNettoIst = korpusKostenIst+frontKostenIst+rueckwandKostenIst+zusatzPlattenKostenIst+zusatzPlattenExtraKostenIst;
  const kantenLfmIst = nk.kantenLfmIst===null||nk.kantenLfmIst===undefined ? geplant.kantenLfm : nk.kantenLfmIst;
  const kantenNettoIst = kantenLfmIst*DB.settings.kantenpreis;
  const puVerleimungIstAktiv = nk.puVerleimungIst!==undefined && nk.puVerleimungIst!==null ? nk.puVerleimungIst : !!geplant.puVerleimung;
  const puVerleimungKostenIst = puVerleimungIstAktiv && kantenLfmIst>0 ? Math.ceil(kantenLfmIst/Math.max(1,DB.settings.puVerleimungSchwelleLfm))*DB.settings.puVerleimungPreis : 0;
  const beschlagGesamtIst = Object.entries(geplant.beschlagQty||{}).reduce((s,[id])=>{
    const preis = (nk.beschlagPreisIst||{})[id] ?? ((geplant.beschlagPreis||{})[id]!==undefined ? geplant.beschlagPreis[id] : (DB.beschlaege.find(x=>x.id===id)?.preis||0));
    const qty = (nk.beschlagIstQty||{})[id] ?? geplant.beschlagQty[id] ?? 0;
    return s+preis*qty;
  },0);
  const zusatzposMitGewinnIst = (geplant.zusatzpositionen||[]).reduce((s,pos)=>{
    const gespeichert = (nk.zusatzpositionenIst||{})[pos.key];
    const menge = gespeichert?.menge ?? pos.menge; const preis = gespeichert?.preis ?? pos.preis;
    return s+(menge*preis)*(1+((pos.gewinnzuschlag??DB.settings.gewinnZusatz)/100));
  },0) + (nk.zusatzpositionenExtra||[]).reduce((s,ex)=>s+((ex.menge||0)*(ex.preis||0))*(1+(DB.settings.gewinnZusatz/100)),0);
  const lieferkostenIst = nk.lieferkostenIst===null||nk.lieferkostenIst===undefined ? geplant.lieferkostenBetrag : (parseFloat(nk.lieferkostenIst)||0);
  const kleinmaterialIst = nk.kleinmaterialIst===null||nk.kleinmaterialIst===undefined ? geplant.kleinmaterialBetrag : (parseFloat(nk.kleinmaterialIst)||0);
  const kmIst = nk.baustellenmontageKmIst===null||nk.baustellenmontageKmIst===undefined ? (geplant.baustellenmontageKm||0) : (parseFloat(nk.baustellenmontageKmIst)||0);
  const azIstListe = (nk.azIst && nk.azIst.length) ? nk.azIst : Object.keys(geplant.az||{}).map(name=>({name, std:geplant.azM1?.[name]||0, std2:geplant.azM2?.[name]||0}));
  const oberflaecheIstM1 = nk.oberflaecheIst===null||nk.oberflaecheIst===undefined ? geplant.oberflaecheStdM1 : (parseFloat(nk.oberflaecheIst)||0);
  const oberflaecheIstM2 = nk.oberflaecheIst2===null||nk.oberflaecheIst2===undefined ? geplant.oberflaecheStdM2 : (parseFloat(nk.oberflaecheIst2)||0);
  const baustellenmontageIstM1 = nk.baustellenmontageIst===null||nk.baustellenmontageIst===undefined ? geplant.baustellenmontageStdM1 : (parseFloat(nk.baustellenmontageIst)||0);
  const baustellenmontageIstM2 = nk.baustellenmontageIst2===null||nk.baustellenmontageIst2===undefined ? geplant.baustellenmontageStdM2 : (parseFloat(nk.baustellenmontageIst2)||0);
  const zeitGesamtIst = nk.nurGesamtstundenModus
    ? (parseFloat(nk.gesamtstundenDirekt)||0)
    : azIstListe.reduce((s,r)=>s+(r.std||0)+(r.std2||0),0) + oberflaecheIstM1+oberflaecheIstM2 + baustellenmontageIstM1+baustellenmontageIstM2;
  const arbeitszeitGesamtIst = nk.nurGesamtstundenModus
    ? zeitGesamtIst*DB.settings.stundensatz
    : azIstListe.reduce((s,r)=>s+(r.std||0)*DB.settings.mitarbeiter1Satz+(r.std2||0)*DB.settings.mitarbeiter2Satz, 0)
      + oberflaecheIstM1*DB.settings.mitarbeiter1Satz + oberflaecheIstM2*DB.settings.mitarbeiter2Satz
      + (baustellenmontageIstM1+baustellenmontageIstM2)*(DB.settings.stundensatzBaustelle||DB.settings.stundensatz);
  return materialNettoIst*(1+DB.settings.gewinnMaterial/100)
    + (kantenNettoIst+puVerleimungKostenIst)*(1+DB.settings.gewinnKanten/100)
    + beschlagGesamtIst*(1+DB.settings.gewinnBeschlaege/100)
    + zusatzposMitGewinnIst
    + lieferkostenIst + kleinmaterialIst + (kmIst*DB.settings.kmPauschale)
    + arbeitszeitGesamtIst + (parseFloat(nk.zusatzarbeiten)||0);
}
function matOptions(selId,bereich){
  let liste = DB.materials.filter(m=>{ const b=bereichAlsArray(m.bereich); return b.includes(bereich) || b.includes('Sondermaterial'); });
  if(!liste.length) liste = DB.materials; // Fallback: falls kein Material für diesen Bereich hinterlegt ist, alle zeigen
  // Bereits zugewiesenes Material nie stillschweigend aus der Liste entfernen, auch wenn Bereich nicht passt
  if(selId && !liste.some(m=>m.id===selId)){
    const gewaehlt = DB.materials.find(m=>m.id===selId);
    if(gewaehlt) liste = [gewaehlt, ...liste];
  }
  return liste.map(m=>{
    const b = bereichAlsArray(m.bereich);
    const zusatz = b.includes(bereich) ? '' : ` — ${b.join(', ')}`;
    return `<option value="${m.id}" ${m.id===selId?'selected':''}>${m.name} (${fmtEUR(m.preis)}/m²)${zusatz}</option>`;
  }).join('')
    + (DB.materials.length? '' : '<option value="">— keine Materialien angelegt —</option>');
}

      <button class="btn btn-primary" id="addMat">+ Material</button></div>
    <div class="card">
      ${DB.materials.length? `<table><thead><tr><th></th><th>Name</th><th>Hersteller</th><th>Dekor</th><th>Stärke</th><th>Preis/m²</th><th>m²/Stk</th><th>Lieferant</th><th>Art.-Nr.</th><th>Bereich</th><th></th></tr></thead>
      <tbody>${DB.materials.map((m,i)=>`<tr>
        <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-matup="${i}" style="padding:2px 6px" ${i===0?'disabled':''}>↑</button><button class="btn btn-ghost btn-sm" data-matdown="${i}" style="padding:2px 6px" ${i===DB.materials.length-1?'disabled':''}>↓</button></td>
        <td>${m.name}</td><td>${m.hersteller||'—'}</td><td>${m.dekor||'—'}</td><td class="mono">${m.staerke||'—'} mm</td>
        <td class="mono">${fmtEUR(m.preis)}</td><td class="mono">${m.m2ProStueck?fmtM2(m.m2ProStueck):'—'}</td><td>${m.lieferant||'—'}</td><td class="mono">${m.artnr||'—'}</td><td>${bereichAnzeige(m.bereich)}</td>
        <td><button class="btn btn-ghost btn-sm" data-editmat="${m.id}">✎</button> <button class="btn btn-ghost btn-sm" data-copymat="${m.id}" title="Material duplizieren">⎘</button> <button class="btn btn-danger btn-sm" data-delmat="${m.id}">✕</button></td>
      </tr>`).join('')}</tbody></table>` : emptyState('🪵','Keine Materialien','Lege dein erstes Material an.')}
    </div>
    <div id="matForm"></div>`;
  el.querySelector('#addMat').addEventListener('click',()=>matForm());
  el.querySelectorAll('[data-editmat]').forEach(b=>b.addEventListener('click',()=>matForm(b.dataset.editmat)));
  el.querySelectorAll('[data-copymat]').forEach(b=>b.addEventListener('click', async ()=>{
    const original = DB.materials.find(m=>m.id===b.dataset.copymat);
    if(!original) return;
    const kopie = {...original, id:uid(), name:original.name+' (Kopie)'};
    const idx = DB.materials.findIndex(m=>m.id===original.id);
    DB.materials.splice(idx+1, 0, kopie);
    await save('materials');
    renderMain();
    setTimeout(()=>matForm(kopie.id), 50);
  }));
  el.querySelectorAll('[data-delmat]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Material löschen?')){ DB.materials=DB.materials.filter(m=>m.id!==b.dataset.delmat); await save('materials'); renderMain(); }
  }));
  el.querySelectorAll('[data-matup]').forEach(b=>b.addEventListener('click', async ()=>{
    const i = +b.dataset.matup;
    if(i>0){ [DB.materials[i-1],DB.materials[i]] = [DB.materials[i],DB.materials[i-1]]; await save('materials'); renderMain(); }
  }));
  el.querySelectorAll('[data-matdown]').forEach(b=>b.addEventListener('click', async ()=>{
    const i = +b.dataset.matdown;
    if(i<DB.materials.length-1){ [DB.materials[i+1],DB.materials[i]] = [DB.materials[i],DB.materials[i+1]]; await save('materials'); renderMain(); }
  }));
  function matForm(id){
    const m = id? DB.materials.find(x=>x.id===id): null;
    const aktuelleBereiche = m ? bereichAlsArray(m.bereich) : [];
    const host = document.getElementById('matForm');
    host.innerHTML = `<div class="card"><h3>${m?'Material bearbeiten':'Neues Material'}</h3>
      <div class="grid cols-4">
        <div class="field"><label>Name</label><input id="mf_name" value="${m?.name||''}"></div>
        <div class="field"><label>Hersteller</label><input id="mf_hersteller" value="${m?.hersteller||''}"></div>
        <div class="field"><label>Dekor</label><input id="mf_dekor" value="${m?.dekor||''}"></div>
        <div class="field"><label>Stärke (mm)</label><input type="number" id="mf_staerke" value="${m?.staerke||19}"></div>
        <div class="field"><label>Preis/m² (€)</label><input type="number" step="0.01" id="mf_preis" value="${m?.preis||0}"></div>
        <div class="field"><label>m² pro Stück (Platte)</label><input type="number" step="0.001" id="mf_m2ProStueck" value="${m?.m2ProStueck||''}" placeholder="z. B. 5,58">
          <div class="small" style="margin-top:3px;font-weight:400;text-transform:none">Standardgröße einer ganzen Platte — ermöglicht in der Werkstatt-App die Eingabe in Stück statt m².</div>
        </div>
        <div class="field"><label>Lieferant</label><input id="mf_lieferant" value="${m?.lieferant||''}"></div>
        <div class="field"><label>Artikelnummer</label><input id="mf_artnr" value="${m?.artnr||''}"></div>
        <div class="field">
          <label>Bereich (mehrere möglich)</label>
          <div style="display:flex;gap:12px;flex-wrap:wrap;padding-top:6px">
            ${['Korpus','Front','Rückwand','Sondermaterial'].map(b=>`
              <label style="display:flex;align-items:center;gap:5px;font-weight:400;text-transform:none;font-size:13px;color:var(--text)">
                <input type="checkbox" class="mf_bereich_cb" value="${b}" style="width:auto" ${aktuelleBereiche.includes(b)?'checked':''}> ${b}
              </label>`).join('')}
          </div>
        </div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="mf_save">Speichern</button><button class="btn btn-ghost" id="mf_cancel">Abbrechen</button></div>
    </div>`;
    host.scrollIntoView({behavior:'smooth', block:'center'});
    document.getElementById('mf_cancel').addEventListener('click',()=>renderMain());
    document.getElementById('mf_save').addEventListener('click', async ()=>{
      const bereich = Array.from(host.querySelectorAll('.mf_bereich_cb:checked')).map(cb=>cb.value);
      if(!bereich.length){ alert('Bitte mindestens einen Bereich auswählen (Korpus, Front, Rückwand oder Sondermaterial) — sonst landet das Material in keiner Auswahlliste.'); return; }
      const data = {name:g('mf_name'),hersteller:g('mf_hersteller'),dekor:g('mf_dekor'),staerke:parseFloat(g('mf_staerke'))||0,
        preis:parseFloat(g('mf_preis'))||0,m2ProStueck:parseFloat(g('mf_m2ProStueck'))||0,lieferant:g('mf_lieferant'),artnr:g('mf_artnr'),bereich};
      if(m) Object.assign(m,data); else DB.materials.push({id:uid(),...data});
      await save('materials'); renderMain();
    });
  }
  function g(id){ return document.getElementById(id).value.trim(); }
}

/* ---------------------------- BESCHLÄGE ---------------------------- */
function renderBeschlaege(el){
  if(!DB.settings.beschlagKategorien) DB.settings.beschlagKategorien = [...new Set(DB.beschlaege.map(b=>b.kategorie))];
  // Falls irgendwo (z.B. Altdaten) eine Kategorie in Benutzung ist, die noch nicht in der Liste steht, automatisch ergänzen
  const genutzt = [...new Set(DB.beschlaege.map(b=>b.kategorie))];
  genutzt.forEach(c=>{ if(!DB.settings.beschlagKategorien.includes(c)) DB.settings.beschlagKategorien.push(c); });
  const cats = DB.settings.beschlagKategorien;
  el.innerHTML = `
    <div class="pagehead"><div><h1>Beschläge</h1><p>Türen, Fronten, Schubladen, Schränke, Korpus und Sockel.</p></div></div>
    <div class="card" style="padding:12px 14px;max-width:480px">
      <h3 style="font-size:13px;margin-bottom:6px">🏷️ Kategorien verwalten</h3>
      <div class="checkline" style="flex-wrap:wrap;gap:6px">
        ${cats.map(c=>`<span class="chip" style="display:inline-flex;align-items:center;gap:4px">${catIcon(c)} ${c}${DB.beschlaege.some(b=>b.kategorie===c)?'':` <button data-delkat="${c}" style="border:none;background:none;cursor:pointer;color:inherit;font-size:11px" title="Leere Kategorie entfernen">✕</button>`}</span>`).join('')}
      </div>
      <div class="checkline" style="margin-top:8px">
        <input type="text" id="neueKategorie" placeholder="Neue Kategorie, z. B. Elektro" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="addKategorie">+ Kategorie anlegen</button>
      </div>
      <div class="btn-row" style="margin-top:10px;border-top:1px dashed var(--border);padding-top:10px">
        <button class="btn btn-primary" id="addBeschlag">+ Beschlag</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">
    ${cats.filter(cat=>DB.beschlaege.some(b=>b.kategorie===cat)).map(cat=>`<div class="card" style="padding:12px 14px;margin-bottom:0">
      <h3 style="font-size:13px;margin-bottom:6px">${catIcon(cat)} ${cat}</h3>
      ${DB.beschlaege.filter(b=>b.kategorie===cat).map(b=>`
        <div class="checkline" style="padding:4px 0">
          <span style="font-size:12.5px">${b.name} <span class="small">(${b.einheit})</span></span>
          <span class="mono" style="margin-left:auto;font-size:12.5px">${fmtEUR(b.preis)}</span>
          <button class="btn btn-ghost btn-sm" data-editb="${b.id}" style="padding:2px 6px">✎</button>
          <button class="btn btn-danger btn-sm" data-delb="${b.id}" style="padding:2px 6px">✕</button>
        </div>`).join('')}
    </div>`).join('')}
    </div>
    <div id="bForm"></div>`;
  el.querySelector('#addBeschlag').addEventListener('click',()=>bForm());
  el.querySelectorAll('[data-editb]').forEach(b=>b.addEventListener('click',()=>bForm(b.dataset.editb)));
  el.querySelectorAll('[data-delb]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Beschlag löschen?')){ DB.beschlaege=DB.beschlaege.filter(x=>x.id!==b.dataset.delb); await save('beschlaege'); renderMain(); }
  }));
  el.querySelector('#addKategorie').addEventListener('click', async ()=>{
    const name = el.querySelector('#neueKategorie').value.trim();
    if(!name){ return; }
    if(DB.settings.beschlagKategorien.includes(name)){ alert('Diese Kategorie gibt es schon.'); return; }
    DB.settings.beschlagKategorien.push(name);
    await save('settings');
    renderMain();
  });
  el.querySelectorAll('[data-delkat]').forEach(b=>b.addEventListener('click', async ()=>{
    const name = b.dataset.delkat;
    DB.settings.beschlagKategorien = DB.settings.beschlagKategorien.filter(c=>c!==name);
    await save('settings');
    renderMain();
  }));
  function catIcon(c){ return {Türen:'🚪',Fronten:'🎚️',Schubladen:'🗄️',Schränke:'👕',Verbinder:'🔩',Korpus:'📦',Sockel:'🦶',Sonstiges:'🔧'}[c]||'🏷️'; }
  function bForm(id){
    const b = id? DB.beschlaege.find(x=>x.id===id):null;
    const host = document.getElementById('bForm');
    host.innerHTML = `<div class="card"><h3>${b?'Beschlag bearbeiten':'Neuer Beschlag'}</h3>
      <div class="grid cols-4">
        <div class="field"><label>Kategorie</label><select id="bf_kat">${DB.settings.beschlagKategorien.map(c=>`<option ${b?.kategorie===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Name</label><input id="bf_name" value="${b?.name||''}"></div>
        <div class="field"><label>Einheit</label><input id="bf_einheit" value="${b?.einheit||'Stk'}"></div>
        <div class="field"><label>Preis (€)</label><input type="number" step="0.01" id="bf_preis" value="${b?.preis||0}"></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="bf_save">Speichern</button><button class="btn btn-ghost" id="bf_cancel">Abbrechen</button></div></div>`;
    host.scrollIntoView({behavior:'smooth', block:'center'});
    document.getElementById('bf_cancel').addEventListener('click',()=>renderMain());
    document.getElementById('bf_save').addEventListener('click', async ()=>{
      const data={kategorie:document.getElementById('bf_kat').value,name:document.getElementById('bf_name').value.trim(),
        einheit:document.getElementById('bf_einheit').value.trim(),preis:parseFloat(document.getElementById('bf_preis').value)||0};
      if(b) Object.assign(b,data); else DB.beschlaege.push({id:uid(),...data});
      await save('beschlaege'); renderMain();
    });
  }
}

/* ---------------------------- REGELN ---------------------------- */
let regelnTab = 'sockel';
function renderRegeln(el){

  const sSch = scharnierRegelWerte();

    {id:'sockel', label:'🦶 Sockelfüße'},

    {id:'bodentraeger', label:'🔩 Bodenträger'},

      <div class="checkline"><span>Zusatz ab Segmentbreite &gt;</span><input type="number" min="0" id="rg_sockel_schwelle" value="${sSock.schwelle}" style="width:80px;margin-left:auto"><span class="small">mm</span></div>

    <div class="card" data-regelpanel="scharnier" style="${regelnTab==='scharnier'?'':'display:none'}">

      <table><thead><tr><th>Türhöhe bis</th><th>Scharniere</th></tr></thead><tbody>
        <tr><td><input type="number" min="0" id="rg_sch_h1" value="${sSch.h1}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n1" value="${sSch.n1}" style="width:60px"></td></tr>
        <tr><td><input type="number" min="0" id="rg_sch_h2" value="${sSch.h2}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n2" value="${sSch.n2}" style="width:60px"></td></tr>
        <tr><td><input type="number" min="0" id="rg_sch_h3" value="${sSch.h3}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n3" value="${sSch.n3}" style="width:60px"></td></tr>
        <tr><td><input type="number" min="0" id="rg_sch_h4" value="${sSch.h4}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n4" value="${sSch.n4}" style="width:60px"></td></tr>
        <tr><td>darüber</td><td><input type="number" min="0" id="rg_sch_n5" value="${sSch.n5}" style="width:60px"></td></tr>
      </tbody></table>
      <div class="small" style="margin-top:8px">Geplante Erweiterung: Gewicht, Türbreite, Material fließen zusätzlich ein.</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="rg_sch_save">Speichern</button></div>

    <div class="card" data-regelpanel="verbinder" style="${regelnTab==='verbinder'?'':'display:none'}">

      <div class="checkline"><span>Schranktiefe darüber</span><span class="small mono" style="margin-left:auto">→</span><input type="number" min="0" id="rg_verb_ueber" value="${sVerb.stkUeber}" style="width:60px"><span class="small">Stück</span></div>
      <div class="small" style="margin-top:8px">Je Außenseite, Mittelseite und Konstruktionsboden. Fachböden zählen hier nicht mit (siehe „Konstruktionsböden je Fach“ in der Kalkulation).</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="rg_verb_save">Speichern</button></div>
