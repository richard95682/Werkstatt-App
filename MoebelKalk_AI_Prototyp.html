function globalHints(nurProjekt){
  const hints = [];
  const relevanteProjekte = nurProjekt ? [nurProjekt] : DB.projects;
  relevanteProjekte.forEach(p=>{
    (p.kalkulation?.schraenke||[]).forEach(k=>{
      const label = nurProjekt ? (k.name||'Schrank') : `${p.name}${k.name?` / ${k.name}`:''}`;
      if(k.materialKorpusId && k.materialFrontId && k.materialKorpusId===k.materialFrontId){
        hints.push(`<b>${label}:</b> Korpus und Front nutzen dasselbe Material — Materialbestellung zusammenfassen?`);
      }
      const sock = sockelAnzahl(k.breite, k.mittelseiten||0);
      if(sock.extra>0) hints.push(`<b>${label}:</b> Segmentbreite ${sock.segBreite} mm &gt; 700 mm — zusätzliche Sockelfüße empfohlen (+${sock.extra} Stk).`);
    });
  });
  if(!hints.length) return `<div class="small">Aktuell keine Hinweise${nurProjekt?' für dieses Projekt':''}. Hinweise erscheinen automatisch, sobald Projekte kalkuliert werden.</div>`;
  return hints.slice(0,5).map(h=>`<div class="hint">💡 ${h}</div>`).join('');
}

/* ---------------------------- PROJEKTE ---------------------------- */
function projekteSortiertNachZuletztBearbeitet(){
  // Zuletzt bearbeitet zuerst (Fallback: Anlagedatum), abgeschlossene Projekte ans Ende — dieselbe Logik wie die Sidebar-Suche
  return [...DB.projects].sort((a,b)=>{
    const aAbgeschlossen = a.status==='abgeschlossen', bAbgeschlossen = b.status==='abgeschlossen';
    if(aAbgeschlossen!==bAbgeschlossen) return aAbgeschlossen?1:-1;
    const aZeit = a._zuletztBearbeitet || a.datum || '';
    const bZeit = b._zuletztBearbeitet || b.datum || '';
    return bZeit.localeCompare(aZeit);
  });
}
function bindeProjektTabelle(el){
  el.querySelectorAll('[data-open-project]').forEach(b=>b.addEventListener('click',()=>{ activeProjectId=b.dataset.openProject; goto('kalkulation'); }));
  el.querySelectorAll('[data-edit-project]').forEach(b=>b.addEventListener('click',()=>openProjectForm(b.dataset.editProject)));
  el.querySelectorAll('[data-del-project]').forEach(b=>b.addEventListener('click', async ()=>{ if(await loescheProjektMitRueckfrage(b.dataset.delProject)) renderMain(); }));
  el.querySelectorAll('[data-nk-zsf-check]').forEach(cb=>cb.addEventListener('change', e=>{
    const id = e.target.dataset.nkZsfCheck;
    if(e.target.checked) nkZusammenfassungAuswahl.add(id); else nkZusammenfassungAuswahl.delete(id);
    aktualisiereNkZsfLeiste(el);
    aktualisiereNkZsfKopfCheckbox(el);
  }));
  // Kopf-Kästchen: alle aktuell angezeigten (z. B. nach Kundensuche gefilterten) Projekte an-/abwählen
  el.querySelector('#nkZsfAlle')?.addEventListener('change', e=>{
    const an = e.target.checked;
    el.querySelectorAll('[data-nk-zsf-check]:not(:disabled)').forEach(cb=>{
      cb.checked = an;
      if(an) nkZusammenfassungAuswahl.add(cb.dataset.nkZsfCheck); else nkZusammenfassungAuswahl.delete(cb.dataset.nkZsfCheck);
    });
    aktualisiereNkZsfLeiste(el);
    aktualisiereNkZsfKopfCheckbox(el);
  });
  aktualisiereNkZsfKopfCheckbox(el);
  el.querySelectorAll('[data-status-projekt]').forEach(sel=>sel.addEventListener('change', async e=>{
    const projId = e.target.dataset.statusProjekt;
    const p = DB.projects.find(x=>x.id===projId);
    if(!p) return;
    p.status = e.target.value;
    await save('projects');
    if(p.status==='abgeschlossen' && cloudVerbunden){
      cloudPfad('auftraege').doc(projId).delete().catch(err=>console.warn('Cloud-Löschen (abgeschlossenes Projekt) fehlgeschlagen:', err));
    } else if(cloudVerbunden){
      cloudSyncProjekt(p).catch(err=>console.warn('Cloud-Sync (Statusänderung) fehlgeschlagen:', err));
    }
    renderMain();
  }));
}
function aktualisiereNkZsfKopfCheckbox(el){
  const kopf = el.querySelector('#nkZsfAlle');
  if(!kopf) return;
  const boxen = [...el.querySelectorAll('[data-nk-zsf-check]:not(:disabled)')];
  const gewaehlt = boxen.filter(b=>b.checked).length;
  kopf.disabled = !boxen.length;
  kopf.checked = boxen.length>0 && gewaehlt===boxen.length;
  kopf.indeterminate = gewaehlt>0 && gewaehlt<boxen.length;
}
async function loescheProjektMitRueckfrage(id){
  const p = DB.projects.find(x=>x.id===id);
  if(!p) return false;
  const nkAnz = DB.nachkalkulation.filter(x=>x.projId===id).length;
  const azAnz = (DB.arbeitszeiten||[]).filter(a=>a.projId===id).length;
  const foAnz = (DB.fotos||[]).filter(f=>f.projId===id).length;
  const hatKalk = (p.kalkulation?.schraenke||[]).length>0;
  const mitgeloescht = [hatKalk?'Kalkulation':'', nkAnz?'Nachkalkulation':'', azAnz?azAnz+' Arbeitszeit-Einträge':'', foAnz?foAnz+' Foto'+(foAnz===1?'':'s'):''].filter(Boolean);
  const text = 'Projekt „'+p.name+'“'+(p.kunde?' ('+p.kunde+')':'')+' wirklich löschen?'
    + (mitgeloescht.length ? '\n\nDabei werden auch gelöscht: '+mitgeloescht.join(', ')+'.' : '')
    + '\n\nDas kann nicht rückgängig gemacht werden.';
  if(!confirm(text)) return false;
  DB.projects = DB.projects.filter(x=>x.id!==id);
  DB.nachkalkulation = DB.nachkalkulation.filter(x=>x.projId!==id);
  DB.arbeitszeiten = (DB.arbeitszeiten||[]).filter(a=>a.projId!==id);
  DB.fotos = (DB.fotos||[]).filter(f=>f.projId!==id);
  if(DB.werkstattImportHistorie) DB.werkstattImportHistorie = DB.werkstattImportHistorie.filter(h=>h.projId!==id);
  Object.values(DB.kundenpreislisten||{}).forEach(l=>{ if(l.zeilen) delete l.zeilen[id]; });
  nkZusammenfassungAuswahl.delete(id);
  if(activeProjectId===id) activeProjectId = null;
  await Promise.all(['projects','nachkalkulation','arbeitszeiten','fotos','werkstattImportHistorie','kundenpreislisten'].map(k=>save(k)));
  if(cloudVerbunden) cloudPfad('auftraege').doc(id).delete().catch(err=>console.warn('Cloud-Löschen (Auftrag) fehlgeschlagen:', err));
  return true;
}

    </tr>`;}).join('')}
  </tbody></table>`;
}

// Live-Aktualisierung: Das offene Zusammenfassungs-Fenster rechnet sich neu, sobald sich Preise/Kalkulationen ändern
let nkZsfOffen = null, nkZsfTimer = null;
function nkZsfSignatur(ids){
  try{ return JSON.stringify(DB.projects.filter(p=>ids.includes(p.id)).map(p=>[p.id, p.name, p.kunde, berechneNkKennzahlenVoll(p)])); }catch(e){ return String(Math.random()); }
}
function nkZsfAktualisierenPlanen(verzoegerung=600){
  if(!nkZsfOffen) return;
  clearTimeout(nkZsfTimer); nkZsfTimer = setTimeout(nkZsfAktualisieren, verzoegerung);
}
function nkZsfAktualisieren(){
  const z = nkZsfOffen;
  if(!z) return;
  if(!z.fenster || z.fenster.closed){ nkZsfOffen = null; return; }
  const ids = z.ids.filter(id=>DB.projects.some(p=>p.id===id));
  if(!ids.length) return;
  const neu = nkZsfSignatur(ids);
  if(neu===z.signatur && ids.length===z.ids.length) return; // nichts hat sich geändert (z. B. Cloud-Sync ohne neue Werte)
  try{
    const fdx = z.fenster.document, a = fdx.activeElement;
    if(fdx.hasFocus() && a && /^(INPUT|TEXTAREA)$/.test(a.tagName)){ nkZsfAktualisierenPlanen(2000); return; } // gerade Eingabe im Fenster -> nicht stören
    z.flush?.();
    oeffneNkZusammenfassung({fenster:z.fenster, ids, ansicht:fdx.body?.dataset.view, scroll:z.fenster.scrollY});
  }catch(e){ console.warn('Zusammenfassung konnte nicht aktualisiert werden:', e); }
}
function oeffneNkZusammenfassung(aktualisierung){
  const idsAuswahl = aktualisierung ? new Set(aktualisierung.ids) : nkZusammenfassungAuswahl;
  const projekte = DB.projects.filter(p=>idsAuswahl.has(p.id));
  if(!projekte.length){ alert('Bitte mindestens ein Projekt auswählen.'); return; }
  const zeilen = projekte.map(p=>{
    const k = berechneNkKennzahlenVoll(p);
    const diffPreis = k.verkaufspreisIst - k.verkaufspreisSoll;
    // Bei einem sehr niedrigen Soll-Preis (meist eine unvollständig gespeicherte Kalkulation ohne Material/Maße)
    // wird die Prozentzahl sinnlos groß — dann lieber als Hinweis markieren statt eine irreführende Zahl zeigen.
    const sollUnplausibel = k.verkaufspreisSoll < 10;
    const diffPreisProzent = (k.verkaufspreisSoll && !sollUnplausibel) ? (diffPreis/k.verkaufspreisSoll*100) : null;
    const diffMaterial = k.materialIst - k.materialSoll;
    const diffZeit = k.zeitIst - k.zeitSoll;
    return { p, k, diffPreis, diffPreisProzent, diffMaterial, diffZeit, sollUnplausibel };
  });
  const summe = (feld) => zeilen.reduce((s,z)=>s + (typeof feld==='function' ? feld(z) : z[feld]), 0);
  const gesamtPreisSoll = summe(z=>z.k.verkaufspreisSoll);
  const gesamtPreisIst = summe(z=>z.k.verkaufspreisIst);
  const gesamtGewinnIst = summe(z=>z.k.gewinnIst);
  const gesamtMargeIst = gesamtPreisIst ? (gesamtGewinnIst/gesamtPreisIst*100) : 0;
  const heute = new Date().toLocaleDateString('de-DE');
  const vzKlasse = n => n>0 ? 'zsf-neg' : (n<0 ? 'zsf-pos' : ''); // bei Preis/Zeit ist ein Plus (über Plan) ungünstig -> rot
  const eur = n => fmtEUR(n);
  const std = n => n.toFixed(2).replace('.',',')+' Std.';
  const pct = n => n.toFixed(1).replace('.',',')+' %';
  const eurStd = n => fmtEUR(n)+'/Std.';
  const lohn = (betrag, zeit) => zeit>0 ? betrag/zeit : 0; // Ø Stundenlohn (bei mehreren Mitarbeitern mit unterschiedlichen Sätzen gewichtet)
  const vz = (n, hoeherIstGut) => { if(Math.abs(n)<0.005) return ''; return (n>0)===!!hoeherIstGut ? 'zsf-pos' : 'zsf-neg'; };
  // Eine Zeile: Bezeichnung | Soll | Ist | Diff.   (hoeherIstGut: bei Gewinn/Marge ist ein Plus gut, bei Kosten/Zeit schlecht)
  const zeile = (label, soll, ist, fmt, opt={}) => {
    const d = ist - soll;
    const dTxt = (d>=0?'+':'')+fmt(d);
    return `<tr class="${opt.fett?'fett':''} ${opt.klein?'klein':''}"><td class="lbl">${label}</td><td class="mono">${fmt(soll)}</td><td class="mono">${fmt(ist)}</td><td class="mono ${vz(d,opt.gut)}">${dTxt}${opt.prozent!==undefined&&opt.prozent!==null?` <span class="proz">(${(d>=0?'+':'')+pct(opt.prozent)})</span>`:''}</td></tr>`;
  };
  const block = (titel, untertitel, rows, extraKlasse='') => `<section class="proj ${extraKlasse}">
      <div class="kopf"><div class="titel">${titel}</div>${untertitel?`<div class="unter">${untertitel}</div>`:''}</div>
      <table><thead><tr><th></th><th>Soll</th><th>Ist</th><th>Abweichung</th></tr></thead><tbody>${rows}</tbody></table>
    </section>`;
  const zeilenHtml = z => {
    const k = z.k;
    return zeile('Verkaufspreis', k.verkaufspreisSoll, k.verkaufspreisIst, eur, {fett:true, prozent:z.diffPreisProzent})
      + zeile('Arbeitszeit', k.zeitSoll, k.zeitIst, std)

  const sum = f => summe(z=>f(z.k));
  const gPreisS = sum(k=>k.verkaufspreisSoll), gGewS = sum(k=>k.gewinnSoll), gGewI = sum(k=>k.gewinnIst);
  const gesamtRows =
      zeile('Verkaufspreis', gPreisS, gesamtPreisIst, eur, {fett:true, prozent: gPreisS>=10 ? (gesamtPreisIst-gPreisS)/gPreisS*100 : null})
    + zeile('Arbeitszeit', sum(k=>k.zeitSoll), sum(k=>k.zeitIst), std)
    + zeile('Stundenbetrag', sum(k=>k.stundenbetragSoll), sum(k=>k.stundenbetragIst), eur, {fett:true})

  const gesamtBlock = zeilen.length>1 ? block('Gesamt', `alle ${zeilen.length} Projekte`, gesamtRows, 'gesamt') : '';

  const kundenEinzeln = kundenEindeutig.length ? kundenEindeutig : [''];

  const kundenListeHtml = `<div class="kunden-logo"><img src="${FIRMENLOGO_DATAURI}" alt="Söllner Schreinerei"></div>

  const html = `<!doctype html><html lang="de"><head><meta charset="utf-8">

  const fenster = aktualisierung ? aktualisierung.fenster : window.open('', '_blank');

  const zahl = txt => {

  const summeAktualisieren = () => { const el2 = fd.getElementById('kpSumme'); if(el2) el2.textContent = fmtEUR(alleFelder().reduce((s,f)=>s+zahl(f.value),0)); speichernDebounced(); };
  const zahlText = n => n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});

  // Eigene (manuelle) Zeilen: Projektname, Kommentar und Preis frei eintragbar, mit ✕ wieder löschbar

  };
  fd.getElementById('kpZeileNeu')?.addEventListener('click',()=>{ manuelleZeileErzeugen().querySelector('.kp-name').focus(); });
  // Gespeicherte Kundenpreis-Liste dieses Kunden wiederherstellen
  const standardTitel = kundenTitelEl ? kundenTitelEl.value : '';
  const gespeichert = (DB.kundenpreislisten||{})[kundenSchluessel];
  if(gespeichert){
    wiederherstellenLaeuft = true;
    if(kundenTitelEl && gespeichert.titel!==undefined && gespeichert.titel!==null) kundenTitelEl.value = gespeichert.titel;
    fd.querySelectorAll('#kpBody tr[data-pid]').forEach(tr=>{
      const info = gespeichert.zeilen?.[tr.dataset.pid]; if(!info) return;
      if(info.name) tr.querySelector('.kp-name').value = info.name;
      tr.querySelector('.kp-kommentar').value = info.kommentar||'';
      const f = tr.querySelector('.kp-input'); f.value = info.preis||'';
      if(info.vkUebernommen && f.dataset.vk!==undefined) f.value = zahlText(parseFloat(f.dataset.vk)||0)+' €'; // „VK übernehmen“ bleibt aktiv -> aktueller VK-Preis
      f._chkAbgleichen?.();
      if(info.entfernt){ entfernt.push({tr, vorher:tr.nextElementSibling}); tr.remove(); }
    });
    (gespeichert.manuell||[]).forEach(m=>manuelleZeileErzeugen(m));
    wiederherstellenLaeuft = false;
    fensterTitelSetzen(); summeAktualisieren(); wiederBtnAktualisieren();
    alleKommentare().forEach(hoeheAnpassen);
    const h = fd.getElementById('kpGespeichertHinweis'); if(h && gespeichert.gespeichert) h.textContent = '💾 gespeicherte Liste geladen (' + new Date(gespeichert.gespeichert).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}) + ')';
  }
  fd.getElementById('kpZuruecksetzen')?.addEventListener('click',()=>{
    if(!fenster.confirm('Gespeicherte Kundenpreis-Liste für diesen Kunden zurücksetzen? Preise, Kommentare, eigene Zeilen und entfernte Projekte werden verworfen.')) return;
    wiederherstellenLaeuft = true;
    const body = fd.getElementById('kpBody');
    entfernt.splice(0).reverse().forEach(({tr, vorher})=>{ body.insertBefore(tr, vorher && vorher.parentNode===body ? vorher : null); });
    fd.querySelectorAll('#kpBody tr.kp-manuell').forEach(tr=>tr.remove());
    fd.querySelectorAll('#kpBody tr[data-pid]').forEach(tr=>{ const nm=tr.querySelector('.kp-name'); nm.value=nm.defaultValue; tr.querySelector('.kp-kommentar').value=''; const f=tr.querySelector('.kp-input'); f.value=''; f._chkAbgleichen?.(); });
    if(kundenTitelEl) kundenTitelEl.value = standardTitel;
    wiederherstellenLaeuft = false;
    if(DB.kundenpreislisten) delete DB.kundenpreislisten[kundenSchluessel];
    save('kundenpreislisten');
    fensterTitelSetzen(); summeAktualisieren(); wiederBtnAktualisieren(); alleKommentare().forEach(hoeheAnpassen);
    clearTimeout(speicherTimer); speicherTimer = null; if(DB.kundenpreislisten) delete DB.kundenpreislisten[kundenSchluessel];
    const h = fd.getElementById('kpGespeichertHinweis'); if(h) h.textContent = '';
  });
  // Vor dem Drucken: Kommentare in voller Höhe, komplett leere eigene Zeilen ausblenden
  fenster.addEventListener('beforeprint', ()=>{
    alleKommentare().forEach(hoeheAnpassen);
    fd.querySelectorAll('tr.kp-manuell').forEach(tr=>{
      const leer = !tr.querySelector('.kp-name').value.trim() && !tr.querySelector('.kp-kommentar').value.trim() && !tr.querySelector('.kp-input').value.trim();
      tr.dataset.leer = leer ? '1' : '';
    });
  });
  fd.querySelectorAll('[data-ansicht]').forEach(b=>b.addEventListener('click',()=>setTimeout(()=>alleKommentare().forEach(hoeheAnpassen),0)));
  fd.getElementById('kpVkUebernehmen')?.addEventListener('click',()=>{ alleFelder().forEach(f=>{ if(f.dataset.vk!==undefined) f.value = zahlText(parseFloat(f.dataset.vk)||0)+' €'; f._chkAbgleichen?.(); }); summeAktualisieren(); });
  fd.getElementById('kpAuswahlEntfernen')?.addEventListener('click',()=>{
    alleFelder().forEach(f=>{ const chk = f.closest('td')?.querySelector('.kp-chk'); if(chk && chk.checked){ f.value=''; chk.checked=false; } });
    summeAktualisieren();
  });
  fd.getElementById('kpLeeren')?.addEventListener('click',()=>{ alleFelder().forEach(f=>{ f.value=''; f._chkAbgleichen?.(); }); summeAktualisieren(); });
  if(aktualisierung?.scroll) fenster.scrollTo(0, aktualisierung.scroll);
  if(aktualisierung){ const st = fd.getElementById('zsfStand'); if(st) st.textContent = ' · 🔄 Preise aktualisiert um ' + new Date().toLocaleTimeString('de-DE'); }
  nkZsfOffen = {fenster, ids:projekte.map(p=>p.id), signatur:nkZsfSignatur(projekte.map(p=>p.id)), flush:()=>{ if(speicherTimer) speichernJetzt(); }};
}

  statusEl.querySelector('#vorschau_uebernehmen').addEventListener('click', async ()=>{

    };
    const blob = new Blob([JSON.stringify(gefiltertesDaten)], {type:'application/json'});
    const fakeFile = new File([blob], 'auswahl.json', {type:'application/json'});

  });
}
function exportiereProjektlisteFuerWerkstatt(){
  const laufendeProjekte = DB.projects.filter(p=>p.status!=='abgeschlossen');
  const payload = {
    typ: 'moebelkalk-projektliste',
    version: 1,
    exportZeitpunkt: new Date().toISOString(),
    materialKatalog: DB.materials.map(m=>({name:m.name, m2ProStueck:m.m2ProStueck||0, preis:m.preis||0})),
    beschlagKatalog: DB.beschlaege.map(b=>({name:b.name, einheit:b.einheit||'Stk', kategorie:b.kategorie||'Sonstige', preis:b.preis||0})),
    projekte: laufendeProjekte.map(p=>{
      const geplant = projektGeplantGesamt(p);
      const matIds = new Set();
      [geplant.materialKorpusId, geplant.materialFrontId, geplant.materialRueckwandId].forEach(id=>{ if(id) matIds.add(id); });
      (geplant.zusatzPlatten||[]).forEach(pl=>{ if(pl.materialId) matIds.add(pl.materialId); });
      const materialien = [...matIds].map(id=>{
        const m = DB.materials.find(x=>x.id===id);
        return m ? m.name : null;
      }).filter(Boolean);
      const beschlaege = Object.entries(geplant.beschlagQty||{})
        .filter(([id,menge])=>menge>0)
        .map(([id,menge])=>{
          const b = DB.beschlaege.find(x=>x.id===id);
          return b ? { name:b.name, sollMenge:menge, einheit:b.einheit||'Stk' } : null;
        }).filter(Boolean);
      return { id:p.id, name:p.name, kunde:p.kunde||'', sollProSchritt: geplant.az||{}, materialien, beschlaege };
    })
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `MoebelKalk-Projektliste_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function importiereWerkstattDaten(file, statusEl){
  try{
    const text = await file.text();
    const daten = JSON.parse(text);
    if(daten.typ !== 'moebelkalk-werkstatt-export'){
      if(statusEl) statusEl.innerHTML = `<div class="hint warn">⚠️ Das ist keine gültige Werkstatt-Export-Datei.</div>`;
      return;
    }
    if(!DB.werkstattImportierteIds) DB.werkstattImportierteIds = [];
    if(!DB.werkstattImportHistorie) DB.werkstattImportHistorie = [];
    const bereitsImportiert = new Set(DB.werkstattImportierteIds);
    let projekteAktualisiert = 0, zeitenUebernommen = 0, materialUebernommen = 0, fotosUebernommen = 0, uebersprungenSchonDa = 0;
    const unbekannteProjekte = [];
    const neuImportierteIds = [];
    const proProjektBatch = {}; // projId -> {schritte:{name:std}, material:[{bezeichnung,menge}], mitarbeiter:Set}
    const holeBatch = projId => proProjektBatch[projId] || (proProjektBatch[projId] = {schritte:{}, material:[], mitarbeiter:new Set()});
    (daten.zeiten||[]).forEach(z=>{
      if(bereitsImportiert.has(z.id)){ uebersprungenSchonDa++; return; } // schon in einem früheren Import übernommen
      const projekt = DB.projects.find(p=>p.id===z.auftragId);
      if(!projekt){ if(!unbekannteProjekte.includes(z.auftragId)) unbekannteProjekte.push(z.auftragId); return; }
      let nk = DB.nachkalkulation.find(x=>x.projId===projekt.id);
      if(!nk){ nk = {projId:projekt.id, azIst:[]}; DB.nachkalkulation.push(nk); }
      if(!nk.azIst) nk.azIst = [];
      // Mitarbeiter anhand des Namens zuordnen (Mitarbeiter 1/2 oder weiterer Mitarbeiter) — bei fehlender/unbekannter Zuordnung als Mitarbeiter 1 verbucht
      const istMitarbeiter2 = z.mitarbeiter && DB.settings.mitarbeiter2Name && z.mitarbeiter.trim().toLowerCase()===DB.settings.mitarbeiter2Name.trim().toLowerCase();
      const weitererTreffer = !istMitarbeiter2 && z.mitarbeiter ? (DB.settings.mitarbeiterListe||[]).find(m=>m.id!=='m1' && m.id!=='m2' && m.name && z.mitarbeiter.trim().toLowerCase()===m.name.trim().toLowerCase()) : null;
      const stunden = z.dauerMin/60;
      if(z.schritt==='Baustellenmontage'){
        // Baustellenmontage hat eigene Felder für Stunden je Mitarbeiter + Kilometer, statt in die allgemeine Liste zu wandern
        if(istMitarbeiter2) nk.baustellenmontageIst2 = Math.round(((parseFloat(nk.baustellenmontageIst2)||0) + stunden)*4)/4;
        else if(weitererTreffer){
          if(!nk.baustellenmontageIstWeitere) nk.baustellenmontageIstWeitere = {};
          nk.baustellenmontageIstWeitere[weitererTreffer.id] = Math.round(((nk.baustellenmontageIstWeitere[weitererTreffer.id]||0) + stunden)*4)/4;
        }
        else nk.baustellenmontageIst = Math.round(((parseFloat(nk.baustellenmontageIst)||0) + stunden)*4)/4;
        if(z.km) nk.baustellenmontageKmIst = Math.round((parseFloat(nk.baustellenmontageKmIst)||0) + z.km);
      } else {
        let pos = nk.azIst.find(r=>r.name===z.schritt);
        if(!pos){ pos = {name:z.schritt, std:0, std2:0}; nk.azIst.push(pos); }
        if(istMitarbeiter2) pos.std2 = Math.round(((pos.std2||0) + stunden)*4)/4;
        else if(weitererTreffer){
          if(!pos.weitereStunden) pos.weitereStunden = {};
          pos.weitereStunden[weitererTreffer.id] = Math.round(((pos.weitereStunden[weitererTreffer.id]||0) + stunden)*4)/4;
        }
        else pos.std = Math.round(((pos.std||0) + stunden)*4)/4;
      }
      zeitenUebernommen++;
      neuImportierteIds.push(z.id);
      const batch = holeBatch(projekt.id);
      batch.schritte[z.schritt] = (batch.schritte[z.schritt]||0) + stunden;
      if(z.mitarbeiter) batch.mitarbeiter.add(z.mitarbeiter);
    });
    (daten.material||[]).forEach(m=>{
      if(bereitsImportiert.has(m.id)){ uebersprungenSchonDa++; return; }
      const projekt = DB.projects.find(p=>p.id===m.auftragId);
      if(!projekt) return;
      let nk = DB.nachkalkulation.find(x=>x.projId===projekt.id);
      if(!nk){ nk = {projId:projekt.id}; DB.nachkalkulation.push(nk); }
      if(!nk.zusatzpositionenExtra) nk.zusatzpositionenExtra = [];
      const gefundenerPreis = (m.preis!==undefined && m.preis!==null) ? m.preis : 0;
      nk.zusatzpositionenExtra.push({name:`${m.bezeichnung} (Werkstatt)`, menge:m.menge, preis:gefundenerPreis});
      materialUebernommen++;
      neuImportierteIds.push(m.id);
      const batch = holeBatch(projekt.id);
      batch.material.push({bezeichnung:m.bezeichnung, menge:m.menge});
      if(m.mitarbeiter) batch.mitarbeiter.add(m.mitarbeiter);
    });
    (daten.fotos||[]).forEach(f=>{
      const projekt = DB.projects.find(p=>p.id===f.auftragId);
      if(!projekt) return;
      if(DB.fotos.some(x=>x.id===f.id)) return; // schon importiert, nicht doppelt anlegen
      DB.fotos.push({id:f.id, projId:f.auftragId, mitarbeiter:f.mitarbeiter, datum:f.datum, dataUrl:f.dataUrl, notiz:f.notiz||'', quelle:'werkstatt'});
      fotosUebernommen++;
    });
    DB.werkstattImportierteIds.push(...neuImportierteIds);
    // Für jedes betroffene Projekt einen Verlaufs-Eintrag anlegen, damit erkennbar wird, wann (und wie oft übers Jahr) an einem Auftrag gearbeitet wurde
    Object.entries(proProjektBatch).forEach(([projId,batch])=>{
      const stunden = Object.values(batch.schritte).reduce((s,v)=>s+v,0);
      if(stunden===0 && batch.material.length===0) return;
      DB.werkstattImportHistorie.push({
        projId, importZeitpunkt:new Date().toISOString(), stunden:Math.round(stunden*100)/100,
        schritte: Object.entries(batch.schritte).map(([name,std])=>({name,std:Math.round(std*100)/100})),
        material: batch.material, mitarbeiterListe:[...batch.mitarbeiter]
      });
    });
    projekteAktualisiert = new Set([...(daten.zeiten||[]).map(z=>z.auftragId), ...(daten.material||[]).map(m=>m.auftragId), ...(daten.fotos||[]).map(f=>f.auftragId)].filter(id=>DB.projects.some(p=>p.id===id))).size;
    await save('nachkalkulation');
    if(fotosUebernommen>0) await save('fotos');
    await save('werkstattImportierteIds');
    await save('werkstattImportHistorie');
    letzterWerkstattImportHinweis = `<div class="hint ok">✅ Übernommen: ${zeitenUebernommen} Zeiterfassung(en), ${materialUebernommen} Materialposition(en) und ${fotosUebernommen} Foto(s) in ${projekteAktualisiert} Projekt(en).
      ${materialUebernommen>0?' Materialpositionen wurden ohne Preis als „Zusätzliche Materialien/Leistungen" in der Nachkalkulation angelegt — Preis bitte dort ergänzen.':''}
      ${fotosUebernommen>0?' Fotos findest du in der Nachkalkulation des jeweiligen Projekts.':''}
      ${uebersprungenSchonDa>0?` <b>${uebersprungenSchonDa} Eintrag/Einträge wurden übersprungen</b>, da sie schon aus einem früheren Import übernommen waren (kein doppeltes Zählen).`:''}
      ${unbekannteProjekte.length?` ⚠️ ${unbekannteProjekte.length} Auftrag/Aufträge aus der Werkstatt-Datei wurden hier nicht gefunden (evtl. lokal in der Werkstatt-App neu angelegt) — diese Einträge wurden übersprungen.`:''}
      ${(zeitenUebernommen+materialUebernommen+fotosUebernommen)>0?` <div style="margin-top:8px">💡 <b>Empfehlung:</b> Geh jetzt in der Werkstatt-App zum Export-Tab und lösche dort die übertragenen Daten auf dem Handy (Button „🗑 Alle Daten auf diesem Handy löschen"), um Platz zu schaffen und Verwechslungen zu vermeiden. Ein erneuter Import derselben Datei würde ohnehin automatisch übersprungen — löschen ist also unbedenklich.</div>`:''}</div>`;
    renderMain();
  }catch(e){
    letzterWerkstattImportHinweis = `<div class="hint warn">⚠️ Datei konnte nicht gelesen werden: ${e.message}</div>`;
    renderMain();
  }
}

function openProjectForm(id){
  const p = id?proj(id):null;
  const host = document.getElementById('formHost') || document.getElementById('main');
  const div = document.createElement('div');
  div.className='card';
  div.innerHTML = `
    <h3>${p?'Projekt bearbeiten':'Neues Projekt'}</h3>
    <div class="grid cols-2">
      <div class="field"><label>Kunde</label><input id="f_kunde" value="${p?.kunde||''}"></div>
      <div class="field"><label>Projektname</label><input id="f_name" value="${p?.name||''}"></div>
      <div class="field"><label>Datum</label><input type="date" id="f_datum" value="${p?.datum||new Date().toISOString().slice(0,10)}"></div>

      <div class="field"><label>Status</label><select id="f_status">${['Kalkulation','Fertigung','Fertig','abgeschlossen'].map(s=>`<option ${p?.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Kalkulationsversion</label><input type="number" id="f_version" value="${p?.version||1}" min="1"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="f_save">Speichern</button>
      <button class="btn btn-ghost" id="f_cancel">Abbrechen</button>
      ${p?'<button class="btn btn-danger" id="f_del">Löschen</button>':''}
    </div>`;
  (host===document.getElementById('main')) ? host.appendChild(div) : host.replaceChildren(div);
  div.scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('f_cancel').addEventListener('click',()=>renderMain());
  document.getElementById('f_save').addEventListener('click',async ()=>{
    const data = {
      kunde:document.getElementById('f_kunde').value.trim(),
      name:document.getElementById('f_name').value.trim()||'Unbenanntes Projekt',
      datum:document.getElementById('f_datum').value,
      status:document.getElementById('f_status').value,
      version:parseInt(document.getElementById('f_version').value)||1,
    };
    if(p){ Object.assign(p,data); } else {
      const neuesProjekt = {id:uid(),...data,kalkulation:null};
      DB.projects.push(neuesProjekt);
      activeProjectId = neuesProjekt.id; // sonst bleibt beim nächsten Seitenwechsel versehentlich das vorherige Projekt aktiv
    }
    await save('projects');
    if(data.status==='abgeschlossen' && cloudVerbunden){
      const projId = p ? p.id : DB.projects[DB.projects.length-1].id;
      cloudPfad('auftraege').doc(projId).delete().catch(err=>console.warn('Cloud-Löschen (abgeschlossenes Projekt) fehlgeschlagen:', err));
    }
    renderMain();
  });
  if(p) document.getElementById('f_del').addEventListener('click', async ()=>{
    if(await loescheProjektMitRueckfrage(p.id)) renderMain();
  });
}

    }));
  }

        <input type="number" step="0.25" min="0" style="width:75px" value="${pos.weitereStunden?.[m.id]||0}" data-az-weiter="${i}" data-az-weiter-ma="${m.id}">

    host.querySelectorAll('[data-az-weiter]').forEach(inp=>inp.addEventListener('input',e=>{

    host.querySelectorAll('[data-az-std]').forEach(inp=>inp.addEventListener('blur',e=>{
      const i = +e.target.dataset.azStd;
      const gerundet = rundeViertelstundeAuf(parseFloat(e.target.value)||0);

    host.querySelectorAll('[data-az-std2]').forEach(inp=>inp.addEventListener('input',e=>{

    }));
    host.querySelectorAll('[data-az-std2]').forEach(inp=>inp.addEventListener('blur',e=>{
      const i = +e.target.dataset.azStd2;
      const gerundet = rundeViertelstundeAuf(parseFloat(e.target.value)||0);
      e.target.value = gerundet;
      state.az[i].std2 = gerundet;
      aktualisiereAzZeilenKosten(i); updateResults();
    }));
    host.querySelectorAll('[data-az-up]').forEach(b=>b.addEventListener('click',e=>{
      const i=+e.target.dataset.azUp; if(i>0){ [state.az[i-1],state.az[i]]=[state.az[i],state.az[i-1]]; renderArbeitszeitListe(); updateResults(); }
    }));
    host.querySelectorAll('[data-az-down]').forEach(b=>b.addEventListener('click',e=>{
      const i=+e.target.dataset.azDown; if(i<state.az.length-1){ [state.az[i+1],state.az[i]]=[state.az[i],state.az[i+1]]; renderArbeitszeitListe(); updateResults(); }
    }));
    host.querySelectorAll('[data-az-del]').forEach(b=>b.addEventListener('click',e=>{
      state.az.splice(+e.target.dataset.azDel,1); renderArbeitszeitListe(); updateResults();
    }));
    const gesamtEl = host.querySelector('#az_gesamt');
    if(gesamtEl) gesamtEl.addEventListener('input',e=>{
      const neuerGesamt = parseFloat(e.target.value)||0;
      if(state.az.length){
        // Beide Felder (Hauptfeld + Mitarbeiter-2-Feld) je Position als eine gemeinsame Liste verteilen
        const werte = state.az.flatMap(p=>[p.std||0, p.std2||0]);
        const neu = verteileViertelstunden(werte, neuerGesamt);
        state.az.forEach((p,i)=>{ p.std = neu[i*2]; p.std2 = neu[i*2+1]; });
      }
      host.querySelectorAll('[data-az-std]').forEach(inp=>{
        const i = +inp.dataset.azStd;
        if(document.activeElement!==inp) inp.value = state.az[i].std;
      });
      host.querySelectorAll('[data-az-std2]').forEach(inp=>{
        const i = +inp.dataset.azStd2;
        if(document.activeElement!==inp) inp.value = state.az[i].std2;
      });
      updateResults();
    });
  }

  // Zusätzliche Platten: eigene Platte mit Material- und Kantenauswahl (echte m²- und Kantenberechnung)
  function zusatzPlatteFlaeche(p){ return p.m2Modus ? (p.m2Direkt||0)*(p.anzahl||1) : ((p.breite||0)/1000)*((p.hoehe||0)/1000)*(p.anzahl||1); }
  function zusatzPlatteKanteAuto(p){
    if(p.m2Modus) return 0; // ohne Breite/Höhe lässt sich keine Kantenlänge berechnen
    const bM=(p.breite||0)/1000, hM=(p.hoehe||0)/1000;
    let laenge;
    if(p.umlaufend) laenge = 2*(bM+hM);
    else laenge = (p.laengskanten||0)*Math.max(bM,hM) + (p.stirnkanten||0)*Math.min(bM,hM);
    return laenge*(p.anzahl||1);
  }
  // Manuell gesetzte Kantenlänge (Meter gesamt für diese Platte) überschreibt die Automatik
  function zusatzPlatteKante(p){
    return (p.kanteManuell!==undefined && p.kanteManuell!==null && !isNaN(p.kanteManuell)) ? p.kanteManuell : zusatzPlatteKanteAuto(p);
  }
  function renderZusatzPlattenListe(){

    host.innerHTML = state.zusatzPlatten.length ? state.zusatzPlatten.map((p,i)=>{
      const flaeche = zusatzPlatteFlaeche(p);
      const mat = findMat(p.materialId);
      const kosten = flaeche*(mat?.preis||0);
      const umlaufend = !!p.umlaufend;
      const m2Modus = !!p.m2Modus;
      return `<div class="checkline" style="flex-wrap:wrap;row-gap:6px">

        <span class="small">mm ×</span>
        `}
        <input type="number" min="1" style="width:50px" value="${p.anzahl||1}" data-zp-anzahl="${i}" title="Anzahl Stück">
        <span class="small">Stk</span>
        <span class="small mono" data-zp-summe="${i}">${fmtM2(flaeche)} = ${fmtEUR(kosten)}</span>

        <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Längskanten <input type="number" min="0" max="2" style="width:45px" value="${p.laengskanten||0}" data-zp-laengs="${i}" ${umlaufend?'disabled':''}></label>
        <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Stirnkanten <input type="number" min="0" max="2" style="width:45px" value="${p.stirnkanten||0}" data-zp-stirn="${i}" ${umlaufend?'disabled':''}></label>

        ` : `<span class="small" style="flex-basis:100%;margin-left:24px">Bei direkter m²-Eingabe ist keine Kantenberechnung möglich (fehlende Maße).</span>`}
      </div>`;
    }).join('') : `<div class="small">Keine Zusatzplatten. Klicke „+ Platte hinzufügen“.</div>`;
    function refreshZeile(i){
      const p = state.zusatzPlatten[i];
      const flaeche = zusatzPlatteFlaeche(p);

    host.querySelectorAll('[data-zp-m2direkt]').forEach(inp=>inp.addEventListener('input',e=>{

    host.querySelectorAll('[data-zp-breite]').forEach(inp=>inp.addEventListener('input',e=>{
      const i=+e.target.dataset.zpBreite; state.zusatzPlatten[i].breite = parseFloat(e.target.value)||0; refreshZeile(i); updateResults();
    }));
    host.querySelectorAll('[data-zp-hoehe]').forEach(inp=>inp.addEventListener('input',e=>{
      const i=+e.target.dataset.zpHoehe; state.zusatzPlatten[i].hoehe = parseFloat(e.target.value)||0; refreshZeile(i); updateResults();
    }));
    host.querySelectorAll('[data-zp-anzahl]').forEach(inp=>inp.addEventListener('input',e=>{
      const i=+e.target.dataset.zpAnzahl; state.zusatzPlatten[i].anzahl = Math.max(1,parseInt(e.target.value)||1); refreshZeile(i); updateResults();
    }));
    host.querySelectorAll('[data-zp-laengs]').forEach(inp=>inp.addEventListener('input',e=>{

  // Tab im letzten Feld der letzten Zeile springt auf den Knopf „+ Position hinzufügen“ bzw. „+ Platte hinzufügen“
  // (Enter/Leertaste legt dann die nächste Zeile an und setzt den Cursor in deren Bezeichnung).
  el.addEventListener('keydown', e=>{
    if(e.key!=='Tab' || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey || e.defaultPrevented) return;
    const t = e.target;
    if(current!=='kalkulation' || !t.isConnected) return;
    // Zusätzliche Materialien (Kalkulation): Tab im Preisfeld springt direkt zur nächsten Position (Gewinnzuschlag wird
    // übersprungen und bleibt per Klick oder Shift+Tab erreichbar). In der letzten Zeile geht es auf „+ Position hinzufügen“.
    if(t.dataset?.zuPreis!==undefined){
      const alleP = [...el.querySelectorAll('[data-zu-preis]')];
      const nr = alleP.indexOf(t);
      if(nr<alleP.length-1){
        e.preventDefault();
        const naechste = el.querySelector(`[data-zu-name="${alleP[nr+1].dataset.zuPreis}"]`);
        naechste?.focus(); naechste?.select?.();
      } else {
        e.preventDefault(); el.querySelector('#zusatz_add')?.focus();
      }
      return;
    }
    if(t.dataset?.zuGewinn!==undefined){
      const alle = [...el.querySelectorAll('[data-zu-gewinn]')];
      if(alle[alle.length-1]===t){ e.preventDefault(); el.querySelector('#zusatz_add')?.focus(); }
      return;
    }
    const zeile = t.closest?.('#zusatzPlattenList > .checkline');
    if(zeile){
      const zeilen = [...el.querySelectorAll('#zusatzPlattenList > .checkline')];
      const felder = [...zeile.querySelectorAll('input:not([disabled])')].filter(x=>x.tabIndex>=0); // Checkboxen/✕ haben tabindex -1 (werden beim Tab übersprungen)
      if(zeilen[zeilen.length-1]===zeile && felder[felder.length-1]===t){

      laengs: Math.max(0, Math.min(2, parseInt(el.querySelector('#k_decke_laengs').value)||0)), quer: Math.max(0, Math.min(2, parseInt(el.querySelector('#k_decke_quer').value)||0)) };
    state.seitenblendeLinks = { aktiv: el.querySelector('#k_seiteL_aktiv').checked, breite: parseFloat(el.querySelector('#k_seiteL_breite').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_seiteL_anzahl').value)||1) };

    state.anstellseiteLinks = { aktiv: el.querySelector('#k_anstellL_aktiv').checked, breite: parseFloat(el.querySelector('#k_anstellL_breite').value)||0, anzahl: Math.max(1, parseInt(el.querySelector('#k_anstellL_anzahl').value)||1), autoTiefe: state.anstellseiteLinks?.autoTiefe ?? true };

    el.querySelector('#k_seiteR_anzahl').disabled = !state.seitenblendeRechts.aktiv;
    el.querySelector('#k_anstellL_breite').disabled = !state.anstellseiteLinks.aktiv;
    el.querySelector('#k_anstellL_anzahl').disabled = !state.anstellseiteLinks.aktiv;

    .forEach(id=>el.querySelector('#'+id).addEventListener('input',()=>{ readBasics(); renderFachboeden(); renderKonstruktionsboeden(); renderKleiderstangen(); renderFrontFaecher(); renderBeschlagChecklist(); updateResults(); }));

  function dfAenderung(){
    state.durchgehendeFront = { aktiv: el.querySelector('#df_aktiv').checked, ohneBeschlaege: el.querySelector('#df_ohne').checked, reihen: state.durchgehendeFront?.reihen };
    el.querySelector('#df_ohne').disabled = !state.durchgehendeFront.aktiv;
    if(state.durchgehendeFront.aktiv){
      // Reihen an die aktuelle Korpushöhe anpassen (Differenz geht in die erste Reihe)
      const reihen = frontListeVon(state)[0];
      const diff = Math.round(korpusMasse(state).hoehe - reihen.reduce((a,r)=>a+(r.hoehe||0),0));
      if(diff!==0) reihen[0].hoehe = Math.max(0, (reihen[0].hoehe||0)+diff);

  function frontListe(){ return frontListeVon(state); }
  function breitenText(row, fachBreite){
    if(Array.isArray(row.breiten) && row.breiten.length){
      const l = frontBreitenListe(row, fachBreite);
      const rest = fachBreite - row.breiten.reduce((a,b)=>a+(b||0),0);
      return '→ '+l.map(x=>Math.round(x)).join(' + ')+' mm'+(rest<0?' ⚠️ zu breit (Fachbreite '+fachBreite+' mm)':' (Fachbreite '+fachBreite+' mm)');
    }
    return `→ ${Math.round(fachBreite/(row.anzahlBreite||1))} mm je Stück (Fachbreite ${fachBreite} mm)`;
  }
  function frontBreite(){ return frontFachBreiteVon(state); }
  function resizeFrontFaecher(arr, len){
    const out = (arr||[]).slice(0,len);
    while(out.length<len) out.push([{typ:'front',hoehe:korpusMasse(state).hoehe||1000}]);
    return out;
  }
  // Von oben nach unten: jede Reihe "leiht" sich ihre Höhe von der Reihe direkt darüber (die erste/oberste
  // Reihe hat nichts über sich und bleibt frei). Löscht man eine Reihe, wandert ihre Höhe zurück nach oben.
  // Platzbedarf einer Reihe = Anzahl × Höhe (z.B. 3 gleiche Schubladen à 150 mm = 450 mm).
  function verbrauch(row){ return row.hoehe||0; } // eingegebene Höhe = Gesamthöhe der Reihe
  function proStueck(row){ return (row.hoehe||0)/Math.max(1,row.anzahl||1); } // Höhe je Einzelstück (für Bauteilliste/Scharniere)
  function fachStatus(fach){
    if(!fach.length) return {ok:true, text:''};
    const zielHoehe = korpusMasse(state).hoehe;
    const summe = fach.reduce((s,r)=>s+verbrauch(r),0);
    const diff = summe - zielHoehe;
    if(Math.abs(diff)<1) return {ok:true, text:`Summe ${Math.round(summe)} mm — passt genau auf ${Math.round(zielHoehe)} mm (Korpushöhe)`};
    return {ok:false, text: diff>0 ? `Summe ${Math.round(summe)} mm — ${Math.round(diff)} mm zu hoch` : `Summe ${Math.round(summe)} mm — noch ${Math.round(-diff)} mm frei bis ${Math.round(zielHoehe)} mm (Korpushöhe)`};
  }
  function restNachReihe(fach, ri){
    const summeBis = fach.slice(0,ri+1).reduce((s,r)=>s+verbrauch(r),0);
    return korpusMasse(state).hoehe - summeBis; // Korpushöhe minus Summe aller Reihen bis inkl. dieser (von oben gerechnet)
  }

        </div>
        ${fach.map((row,ri)=>{
          const rest = restNachReihe(fach,ri);
          const anzB = row.anzahlBreite||1;
          const breiteJeStueck = Math.round(fachBreite/anzB);
          return `<div class="checkline" style="flex-wrap:wrap;row-gap:6px">

            <span class="small">× (übereinander)</span>
            <input type="number" min="0" style="width:90px" value="${row.hoehe}" data-frow-hoehe="${fi}:${ri}" placeholder="Höhe mm (gesamt)">
            <span class="small">mm gesamt${ri===0?' <span class="small">(oberste Reihe)</span>':''} <span class="small mono" data-frow-perstueck="${fi}:${ri}">${(row.anzahl||1)>1?`= ${Math.round(proStueck(row))} mm je Stück`:''}</span></span>
            <span class="small mono" data-frow-rest="${fi}:${ri}" style="color:${rest<0?'var(--danger)':'var(--text-muted)'}">→ Rest ${Math.round(rest)} mm</span>
            <button class="btn btn-ghost btn-sm" data-frow-del="${fi}:${ri}" style="margin-left:auto">✕</button>
            <span style="flex-basis:100%"></span>
            <span class="small" style="margin-left:32px">Nebeneinander in diesem Fach:</span>
            <input type="number" min="1" style="width:52px" value="${anzB}" data-frow-anzahlbreite="${fi}:${ri}" title="Anzahl Türen/Schubladen nebeneinander (Fachbreite wird geteilt)">
            <span class="small mono" data-frow-breitejestueck="${fi}:${ri}">${breitenText(row,fachBreite)}</span>
            <span style="flex-basis:100%"></span>
            <span class="small" style="margin-left:32px">oder Breiten manuell (mm, mit / getrennt, letzte Breite = Rest):</span>
            <input type="text" style="width:150px" value="${(row.breiten||[]).join(' / ')}" placeholder="z. B. 600 / 500" data-frow-breiten="${fi}:${ri}" title="Alle Breiten außer der letzten eingeben — die letzte ergibt sich aus der Restbreite. Leer lassen = gleichmäßig.">
            ${row.typ==='front' ? `<span class="small mono" data-frow-scharniere="${fi}:${ri}">${scharnierAnzahl(proStueck(row))} Scharniere${((row.anzahl||1)*anzB)>1?` × ${(row.anzahl||1)*anzB}`:''}</span>` : ''}
          </div>`;
        }).join('')}
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn-ghost btn-sm" data-frow-add="${fi}">+ Reihe (nimmt sich die Resthöhe: Gesamthöhe − Summe aller vorherigen Zeilen)</button>
          <button class="btn btn-ghost btn-sm" data-frow-even="${fi}">↕ Höhen gleichmäßig aufteilen</button>
        </div>
      </div>`;
    }).join('');

    // Leichte Aktualisierung ohne kompletten Neuaufbau (verhindert Fokusverlust beim Tippen)
    function refreshRestDisplays(){
      frontListe().forEach((fach,fi)=>{
        const status = fachStatus(fach);
        const summaryEl = host.querySelector(`[data-fach-summary="${fi}"]`);
        if(summaryEl){
          summaryEl.textContent = status.text;
          summaryEl.style.color = status.ok? 'var(--sage)':'var(--danger)';
        }
        fach.forEach((row,ri)=>{
          const hEl = host.querySelector(`[data-frow-hoehe="${fi}:${ri}"]`);
          if(hEl && document.activeElement!==hEl) hEl.value = row.hoehe;
          const aEl = host.querySelector(`[data-frow-anzahl="${fi}:${ri}"]`);
          if(aEl && document.activeElement!==aEl) aEl.value = row.anzahl||1;
          const psEl = host.querySelector(`[data-frow-perstueck="${fi}:${ri}"]`);
          if(psEl) psEl.textContent = (row.anzahl||1)>1 ? `= ${Math.round(proStueck(row))} mm je Stück` : '';
          const rest = restNachReihe(fach,ri);
          const rEl = host.querySelector(`[data-frow-rest="${fi}:${ri}"]`);
          if(rEl){ rEl.textContent = `→ Rest ${Math.round(rest)} mm`; rEl.style.color = rest<0?'var(--danger)':'var(--text-muted)'; }
          if(row.typ==='front'){
            const sEl = host.querySelector(`[data-frow-scharniere="${fi}:${ri}"]`);
            if(sEl) sEl.textContent = `${scharnierAnzahl(proStueck(row))} Scharniere${((row.anzahl||1)*(row.anzahlBreite||1))>1?` × ${(row.anzahl||1)*(row.anzahlBreite||1)}`:''}`;
          }
          const abEl = host.querySelector(`[data-frow-anzahlbreite="${fi}:${ri}"]`);
          if(abEl && document.activeElement!==abEl) abEl.value = row.anzahlBreite||1;
          const bpsEl = host.querySelector(`[data-frow-breitejestueck="${fi}:${ri}"]`);
          if(bpsEl) bpsEl.textContent = breitenText(row,fachBreite);
        });
      });
    }

    // Differenz im Platzbedarf einer Reihe von der Reihe direkt darüber abziehen bzw. zugeben
    // Änderungen an jeder Reihe außer der ersten werden immer von der ERSTEN Reihe im Fach abgezogen/zugegeben.
    function delta_uebertragen(fi, ri, altVerbrauch, neuVerbrauch){
      const fach = frontListe()[fi];
      const delta = neuVerbrauch - altVerbrauch;
      if(ri===0) return; // die erste Reihe selbst ist die "Quelle" — nichts gleicht sie aus
      const ersteRow = fach[0];
      ersteRow.hoehe = Math.max(0, Math.round(verbrauch(ersteRow) - delta));
    }

    host.querySelectorAll('[data-frow-typ]').forEach(sel=>sel.addEventListener('change',e=>{
      const [fi,ri]=e.target.dataset.frowTyp.split(':').map(Number);
      frontListe()[fi][ri].typ = e.target.value;
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-frow-hoehe]').forEach(inp=>{
      inp.addEventListener('input',e=>{
        const [fi,ri]=e.target.dataset.frowHoehe.split(':').map(Number);
        const row = frontListe()[fi][ri];
        const altV = verbrauch(row);
        row.hoehe = parseFloat(e.target.value)||0;
        delta_uebertragen(fi, ri, altV, verbrauch(row));
        refreshRestDisplays(); renderBeschlagChecklist(); updateResults();
      });
    });
    host.querySelectorAll('[data-frow-anzahl]').forEach(inp=>{
      inp.addEventListener('input',e=>{
        const [fi,ri]=e.target.dataset.frowAnzahl.split(':').map(Number);
        const row = frontListe()[fi][ri];
        row.anzahl = Math.max(1, parseInt(e.target.value)||1);
        // Gesamthöhe der Reihe bleibt gleich — wird nur neu durch die Anzahl geteilt
        renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
      });
    });
    host.querySelectorAll('[data-frow-anzahlbreite]').forEach(inp=>{
      inp.addEventListener('input',e=>{
        const [fi,ri]=e.target.dataset.frowAnzahlbreite.split(':').map(Number);
        const row = frontListe()[fi][ri];
        row.anzahlBreite = Math.max(1, parseInt(e.target.value)||1);
        delete row.breiten; // zurück zur gleichmäßigen Teilung
        // Fachbreite bleibt gleich — wird nur neu auf die nebeneinander liegenden Stücke geteilt
        renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
      });
    });
    host.querySelectorAll('[data-frow-breiten]').forEach(inp=>{
      inp.addEventListener('input',e=>{
        const [fi,ri]=e.target.dataset.frowBreiten.split(':').map(Number);
        const row = frontListe()[fi][ri];
        const zahlen = e.target.value.split(/[\/;,\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>!isNaN(x) && x>0);
        if(zahlen.length){ row.breiten = zahlen; row.anzahlBreite = zahlen.length+1; }
        else { delete row.breiten; }
        const abEl = host.querySelector(`[data-frow-anzahlbreite="${fi}:${ri}"]`);
        if(abEl) abEl.value = row.anzahlBreite||1;
        refreshRestDisplays(); renderBeschlagChecklist(); updateResults();
      });
    });
    host.querySelectorAll('[data-frow-del]').forEach(b=>b.addEventListener('click',e=>{
      const [fi,ri]=e.target.dataset.frowDel.split(':').map(Number);
      const fach = frontListe()[fi];
      const geloescht = fach[ri];
      if(fach.length>1){
        const empfaenger = ri>0 ? fach[0] : fach[1]; // Höhe wandert zurück zur ersten Reihe (bzw. bei Löschen der ersten Reihe an die neue erste)
        empfaenger.hoehe = Math.round(verbrauch(empfaenger) + verbrauch(geloescht));
      }
      fach.splice(ri,1);
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-frow-add]').forEach(b=>b.addEventListener('click',e=>{
      const fi=+e.target.dataset.frowAdd;
      const fach = frontListe()[fi];
      const summeBisher = fach.reduce((s,r)=>s+verbrauch(r),0);
      const restHoehe = Math.max(0, Math.round(korpusMasse(state).hoehe - summeBisher));
      fach.push({typ:'front',hoehe:restHoehe,anzahl:1});
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-frow-even]').forEach(b=>b.addEventListener('click',e=>{
      const fi=+e.target.dataset.frowEven;
      const rows = frontListe()[fi];
      if(rows.length){ const each = Math.round(korpusMasse(state).hoehe/rows.length); rows.forEach(r=>{ r.hoehe = each; }); }
      renderFrontFaecher(); renderBeschlagChecklist(); updateResults();
    }));
  }

  function empfohleneBeschlagMengen(){
    const df = state.durchgehendeFront && state.durchgehendeFront.aktiv;
    const alleReihen = frontListe().flat();
    const frontReihen = alleReihen.filter(r=>r.typ==='front' && !(df && state.durchgehendeFront.ohneBeschlaege));
    const schubladenReihen = alleReihen.filter(r=>r.typ==='schublade');
    const scharniere = frontReihen.reduce((sum,r)=>sum+scharnierAnzahl((r.hoehe||0)/(r.anzahl||1))*(r.anzahl||1)*(r.anzahlBreite||1),0);
    const sock = sockelAnzahl(korpusMasse(state).breite, state.mittelseiten);
    const konstruktionsboedenGesamt = (state.konstruktionsboedenProFach||[]).reduce((a,n)=>a+n,0);
    const verbinder = verbinderAnzahl(state.tiefe, state.mittelseiten, konstruktionsboedenGesamt).gesamt;
    const bodentraeger = (state.fachboedenProFach||[]).reduce((a,n)=>a+n,0)*bodentraegerJeFachboden();
    const auszuege = schubladenReihen.reduce((sum,r)=>sum+(r.anzahl||1)*(r.anzahlBreite||1),0);
    const proFront = frontReihen.reduce((sum,r)=>sum+(r.anzahl||1)*(r.anzahlBreite||1),0) + auszuege; // Griff/Tip-on je Front- und Schubladenstück
    const fachBreiteM = (korpusMasse(state).breite/(state.mittelseiten+1))/1000;
    const stangenGesamt = (state.kleiderstangenProFach||[]).reduce((a,n)=>a+n,0);
    const stangenLaengeM = Math.round(stangenGesamt*fachBreiteM*100)/100;
    const rec = {
      b1:scharniere, b3:proFront*2, // Scharnier, Dämpfer (2 je Tür/Schublade)
      b4:proFront, b5:proFront, b6:proFront, // Griff, Tip-on, Push-to-open — je 1x pro Front-/Schubladenstück
      b7:auszuege,
      b8:stangenLaengeM, b14:stangenGesamt*2, // Kleiderstange (Meter) + 2 Halter je Stange
      b10:verbinder, b11: bodentraeger,
      b12: state.sockeloption==='mit'? sock.gesamt : 0,
      b13: state.sockeloption==='mit'? Math.ceil(sock.gesamt/2) : 0,
    };
    // Neue, selbst angelegte Beschläge in der Kategorie "Verbinder" bekommen automatisch dieselbe Verbinder-Stückzahl
    DB.beschlaege.filter(b=>b.kategorie==='Verbinder' && !(b.id in rec)).forEach(b=>{ rec[b.id] = verbinder; });
    // Stückzahl: bei mehreren identischen Schränken alle Beschlagmengen entsprechend vervielfachen
    const stueckzahl = Math.max(0, state.stueckzahl??1);
    if(stueckzahl!==1){ Object.keys(rec).forEach(id=>{ rec[id] = Math.round(rec[id]*stueckzahl*100)/100; }); }
    return rec;
  }

  function renderBeschlagChecklist(){
    const rec = empfohleneBeschlagMengen();
    if(!state.beschlagQty) state.beschlagQty = {};
    if(!state.beschlagQtyManual) state.beschlagQtyManual = {};
    if(!state._autoTouched) state._autoTouched = {};
    // Automatisches Ankreuzen bestimmter Beschlag-Gruppen, sobald sie sinnvoll sind — solange nicht manuell abgewählt
    const frontReihenAnzahl = frontListe().flat().filter(r=>r.typ==='front' && !(state.durchgehendeFront?.aktiv && state.durchgehendeFront.ohneBeschlaege)).length;
    function autoCheckGruppe(schluessel, ids, bedingung){
      if(state._autoTouched[schluessel]) return; // Nutzer hat diese Gruppe schon einmal manuell verändert
      if(bedingung){
        if(!ids.some(id=>state.beschlagQty[id]!==undefined)){ ids.forEach(id=>{ state.beschlagQty[id] = rec[id]||0; }); }
      } else {
        ids.forEach(id=>{ delete state.beschlagQty[id]; }); // nicht mehr nötig — Haken automatisch wieder entfernen
      }
    }
    autoCheckGruppe('scharnier', ['b1'], frontReihenAnzahl>0 && rec.b1>0);
    autoCheckGruppe('griff', ['b4'], rec.b4>0);
    autoCheckGruppe('auszug', ['b7'], rec.b7>0);
    autoCheckGruppe('bodentraeger', ['b11'], rec.b11>0);
    autoCheckGruppe('sockel', ['b12','b13'], state.sockeloption==='mit' && rec.b12>0);
    autoCheckGruppe('kleiderstange', ['b8'], rec.b8>0);
    autoCheckGruppe('kleiderstangenhalter', ['b14'], rec.b14>0);
    // Fixierte (angepinnte) Beschläge: bleiben immer angehakt, unabhängig von allen anderen Bedingungen
    (DB.settings.fixierteBeschlaege||[]).forEach(key=>{
      const ids = key.split(',');
      if(!ids.every(id=>state.beschlagQty[id]!==undefined)){
        ids.forEach(id=>{ if(state.beschlagQty[id]===undefined) state.beschlagQty[id] = rec[id] ?? 1; });
      }
    });
    // Live-Sync: angehakte, aber nicht manuell überschriebene Mengen immer auf dem aktuellen Stand halten
    Object.keys(state.beschlagQty).forEach(id=>{
      if(!state.beschlagQtyManual[id] && rec[id]!==undefined){
        state.beschlagQty[id] = rec[id];
      }
    });
    const cats = [...new Set(DB.beschlaege.map(b=>b.kategorie))];
    const host = el.querySelector('#beschlagList');
    host.innerHTML = cats.map(cat=>{
      const items = DB.beschlaege.filter(b=>b.kategorie===cat);
      const groups = {};
      items.forEach(b=>{ const key=b.gruppe||b.id; (groups[key]=groups[key]||[]).push(b); });
      const rows = Object.values(groups).map(members=>{
        const ids = members.map(m=>m.id);
        const rowKey = ids.join(',');
        const fixiert = (DB.settings.fixierteBeschlaege||[]).includes(rowKey);
        const label = members.length>1 ? members[0].gruppe : members[0].name;
        const checked = ids.every(id=>state.beschlagQty[id]!==undefined) || fixiert;
        const manuell = ids.some(id=>state.beschlagQtyManual[id]);
        const recQty = rec[ids[0]]||0;
        const qty = checked ? (state.beschlagQty[ids[0]] ?? recQty) : recQty;
        const preisSumme = members.reduce((s,m)=>s+m.preis,0);
        const preisFelder = members.map(m=>`<input type="number" min="0" step="0.01" data-bprice="${m.id}" value="${m.preis}" style="width:52px" title="${m.name}">`).join('+');
        return `<div class="checkline" style="padding:2px 0;gap:4px;line-height:1.2">
          <button class="btn btn-ghost btn-sm" data-bpin="${rowKey}" title="${fixiert?'Angepinnt — klicken zum Lösen':'Anpinnen — bleibt dann immer angehakt'}" style="padding:1px 4px;font-size:10px;${fixiert?'opacity:1':'opacity:.3'}">📌</button>
          <input type="checkbox" data-gcheck="${ids.join(',')}" ${checked?'checked':''} ${fixiert?'disabled title="Angepinnt"':''}>
          <span style="font-size:11.5px">${label}${members.length>1?` <span class="small" style="font-size:10px">(${members.map(m=>m.name).join('+')})</span>`:''}</span>
          <span class="qty-price" style="gap:2px">
            <input type="number" min="0" data-gqty="${ids.join(',')}" value="${qty}" style="width:38px;padding:2px 4px" ${checked?'':'disabled'} title="${manuell?'Manuell gesetzt':'Automatisch berechnet'}">
            ${checked?`<span style="color:var(--text-muted);font-size:9px" title="${manuell?'Manuell gesetzt':'Automatisch berechnet'}">${manuell?'✎':'⟳'}</span>`:''}
            <span class="small" style="font-size:10px">×</span>${preisFelder}<span class="small" style="font-size:10px">€</span>
          </span>
        </div>`;
      }).join('');
      return `<div style="margin-bottom:4px">
        <div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:4px 0 1px;font-size:10px">${cat}</div>
        ${rows}
      </div>`;
    }).join('');
    host.querySelectorAll('[data-bpin]').forEach(btn=>btn.addEventListener('click', async e=>{
      const rowKey = e.target.dataset.bpin;
      if(!DB.settings.fixierteBeschlaege) DB.settings.fixierteBeschlaege = [];
      const idx = DB.settings.fixierteBeschlaege.indexOf(rowKey);
      if(idx>=0) DB.settings.fixierteBeschlaege.splice(idx,1);
      else DB.settings.fixierteBeschlaege.push(rowKey);
      await save('settings');
      renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-gcheck]').forEach(cb=>cb.addEventListener('change',e=>{
      const ids = e.target.dataset.gcheck.split(',');
      if(ids.includes('b1')) state._autoTouched.scharnier = true;
      if(ids.includes('b4')) state._autoTouched.griff = true;
      if(ids.includes('b7')) state._autoTouched.auszug = true;
      if(ids.includes('b11')) state._autoTouched.bodentraeger = true;
      if(ids.includes('b12')) state._autoTouched.sockel = true;
      if(ids.includes('b8')) state._autoTouched.kleiderstange = true;
      if(ids.includes('b14')) state._autoTouched.kleiderstangenhalter = true;
      if(ids.includes('b10')) state._autoTouched.verbinder = true;
      if(e.target.checked) ids.forEach(id=>{ state.beschlagQty[id] = rec[id]||1; delete state.beschlagQtyManual[id]; });
      else ids.forEach(id=>{ delete state.beschlagQty[id]; delete state.beschlagQtyManual[id]; });
      renderBeschlagChecklist(); updateResults();
    }));
    host.querySelectorAll('[data-gqty]').forEach(inp=>inp.addEventListener('input',e=>{
      const ids = e.target.dataset.gqty.split(',');
      const v = parseFloat(e.target.value)||0;
      ids.forEach(id=>{ state.beschlagQty[id]=v; state.beschlagQtyManual[id]=true; });
      updateResults();
    }));
    host.querySelectorAll('[data-bprice]').forEach(inp=>inp.addEventListener('input', async e=>{
      const b = DB.beschlaege.find(x=>x.id===e.target.dataset.bprice);
      if(b){ b.preis = parseFloat(e.target.value)||0; await save('beschlaege'); updateResults(); }
    }));

    // hints
    const hintsHost = el.querySelector('#beschlagHints');
    let hints = [];
    frontListe().forEach((fach,fi)=>fach.forEach((row,ri)=>{
      if(row.typ==='front' && !(state.durchgehendeFront?.aktiv && state.durchgehendeFront.ohneBeschlaege)){
        const hoeheJeStueck = Math.round((row.hoehe||0)/(row.anzahl||1));
        const gesamtStueck = (row.anzahl||1)*(row.anzahlBreite||1);
        hints.push(`Fach ${fi+1}, Front ${ri+1} · Höhe ${hoeheJeStueck} mm je Stück${gesamtStueck>1?` × ${gesamtStueck} Stück`:''} erkannt → <b>${scharnierAnzahl(hoeheJeStueck)*gesamtStueck} Scharniere</b> empfohlen.`);
      }
    }));
    const alleFrontSchublade = frontListe().flat().filter(r=>r.typ!=='offen');
    if(!alleFrontSchublade.length){
      hints.push(`Alle Fächer sind offen — keine Front vorhanden.`);
    }
    const sock = sockelAnzahl(korpusMasse(state).breite, state.mittelseiten);
    if(state.sockeloption==='mit' && sock.extra>0) hints.push(`Segmentbreite ${sock.segBreite} mm &gt; 700 mm → <b>+${sock.extra} zusätzliche Sockelfüße</b> empfohlen.`);
    hintsHost.innerHTML = hints.map(h=>`<div class="hint">💡 ${h}</div>`).join('');
  }

  function pruefeAzHinweis(){
    const h = el.querySelector('#azHinweis'); if(!h) return;
    const b = state._azBasis;
    const abweichend = b && (b.breite!==state.breite || b.hoehe!==state.hoehe || b.tiefe!==state.tiefe || b.mittelseiten!==state.mittelseiten);
    if(!abweichend){ h.innerHTML=''; return; }
    h.innerHTML = '<div class="hint" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">📐 Grundmaße gegenüber der Kopie geändert — Arbeitszeit neu vorschlagen? <button class="btn btn-primary btn-sm" id="az_hinweis_ja">Ja, neu vorschlagen</button> <button class="btn btn-ghost btn-sm" id="az_hinweis_nein">Nein, behalten</button></div>';
    h.querySelector('#az_hinweis_ja').addEventListener('click',()=>{ el.querySelector('#az_vorschlag').click(); });
    h.querySelector('#az_hinweis_nein').addEventListener('click',()=>{ delete state._azBasis; h.innerHTML=''; updateResults(); });
  }
  function updateResults(){
    readBasics();
    pruefeAzHinweis();
    const teile = berechneBauteile(state);
    const korpusFl = flaecheBereich(teile,'Korpus');
    const frontFl = flaecheBereich(teile,'Front');
    const rueckFl = flaecheBereich(teile,'Rückwand');
    const kanten = kantenlaenge(teile, state.kantenOverride);

    const matK = findMat(state.materialKorpusId), matF = findMat(state.materialFrontId), matR = findMat(state.materialRueckwandId);
    const s = DB.settings;

    const zK = 1 + ((s.zuschlagKorpus||0)/100);
    const zF = 1 + ((s.zuschlagFront||0)/100);
    const zR = 1 + ((s.zuschlagRueckwand||0)/100);
    const zusatzPlattenFlaeche = (state.zusatzPlatten||[]).reduce((sum,p)=>sum+zusatzPlatteFlaeche(p),0);
    const zP = 1 + ((s.zuschlagZusatzplatten||0)/100);
    const zusatzPlattenMaterialKosten = (state.zusatzPlatten||[]).reduce((sum,p)=>{ const mat=findMat(p.materialId); return sum + zusatzPlatteFlaeche(p)*zP*(mat?.preis||0); },0);
    const zusatzPlattenKantenLaenge = (state.zusatzPlatten||[]).reduce((sum,p)=>sum+zusatzPlatteKante(p),0);
    const korpusMaterialKosten = (korpusFl*zK)*(matK?.preis||0);
    const frontMaterialKosten = (frontFl*zF)*(matF?.preis||0);
    const rueckwandMaterialKosten = (rueckFl*zR)*(matR?.preis||0);
    const materialNetto = korpusMaterialKosten + frontMaterialKosten + rueckwandMaterialKosten + zusatzPlattenMaterialKosten;
    const kanten_gesamt = kanten + zusatzPlattenKantenLaenge;
    const kantenKosten = kanten_gesamt*s.kantenpreis;
    const puVerleimungKosten = state.puVerleimung && kanten_gesamt>0 ? Math.ceil(kanten_gesamt/Math.max(1,s.puVerleimungSchwelleLfm))*s.puVerleimungPreis : 0;
    const beschlagKosten = Object.entries(state.beschlagQty||{}).reduce((sum,[id,qty])=>{ const b=DB.beschlaege.find(x=>x.id===id); return sum + (b?b.preis*qty:0); },0);
    const zusatzKosten = (state.zusatzpositionen||[]).reduce((sum,pos)=>sum+((pos.menge||0)*(pos.preis||0)),0);
    const lieferkostenBetrag = state.lieferkosten?.aktiv ? (state.lieferkosten.preis||0) : 0;
    const kmPauschaleBetrag = state.baustellenmontage?.aktiv ? ((state.baustellenmontage.km||0)*DB.settings.kmPauschale) : 0;
    const kleinmaterialBetrag = state.kleinmaterial?.aktiv ? (state.kleinmaterial.preis||0) : 0;
    const stueckzahlAz = Math.max(0, state.stueckzahl??1);
    const weitereMitarbeiterFuerPreis = (DB.settings.mitarbeiterListe||[]).filter(m=>m.id!=='m1' && m.id!=='m2');
    const summeWeitereStunden = pos => Object.values(pos.weitereStunden||{}).reduce((a,b)=>a+(b||0),0);
    const kostenWeitereStunden = pos => weitereMitarbeiterFuerPreis.reduce((s,m)=>s+((pos.weitereStunden?.[m.id]||0)*(m.satz||0)),0);
    const stundenOberflaecheJeStueck = state.oberflaeche?.aktiv ? ((state.oberflaeche.std||0)+(state.oberflaeche.std2||0)+summeWeitereStunden(state.oberflaeche)) : 0;
    const stundenNormalJeStueck = (state.az||[]).reduce((sum,pos)=>sum+(pos.std||0)+(pos.std2||0)+summeWeitereStunden(pos),0) + stundenOberflaecheJeStueck;

    const stundenBaustelle = stundenBaustelleJeStueck*stueckzahlAz;
    const stunden = stundenNormal + stundenBaustelle;
    const azKostenJeStueck = (state.az||[]).reduce((sum,pos)=>sum + (pos.std||0)*s.mitarbeiter1Satz + (pos.std2||0)*s.mitarbeiter2Satz + kostenWeitereStunden(pos), 0);

          <div class="checkline"><span class="small">Gewinnzuschlag Kante</span><input type="number" min="0" step="1" id="gw_kanten" value="${s.gewinnKanten}" style="width:60px;margin-left:auto"><span class="small">%</span></div>

    // Aktualisiert auch den Angebotspreis (geplant) automatisch, damit die Gesamtübersicht immer aktuell ist — ohne Rückfrage.
    async function autoSaveJetzt(){
      const kopie = JSON.parse(JSON.stringify(state));
      delete kopie._result;
      kopie.geplant = baueGeplantSnapshot(state, state._result);
      schraenke[activeSchrankIndex] = kopie;

      if(!document.body.contains(el) || current!=='kalkulation') return; // nur die UI-Aktualisierung überspringen, falls Seite gewechselt
      renderSchrankTabs();
      renderGesamtuebersicht();
      const statusEl = el.querySelector('#autoSaveStatus');
      if(statusEl){ statusEl.textContent = '✓ automatisch gespeichert'; setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 2000); }

    window.__autoSaveJetzt = autoSaveJetzt; // damit der Seitenwechsel (Navigation) ausstehende Änderungen sofort sichern kann
    if(window.__autoSaveTimer) clearTimeout(window.__autoSaveTimer);
    window.__autoSaveTimer = setTimeout(autoSaveJetzt, 700);
  }

    readBasics();
    const gespeichert = JSON.parse(JSON.stringify(state));
    gespeichert.geplant = baueGeplantSnapshot(state, state._result);

  });
}
// Bereich kann (neu) ein Array mehrerer Kategorien sein oder (alt, aus vorherigen Speicherständen) ein einzelner String
function bereichAlsArray(bereich){
  if(Array.isArray(bereich)) return bereich;
  if(typeof bereich==='string' && bereich) return [bereich];
  return [];
}
function bereichAnzeige(bereich){ return bereichAlsArray(bereich).join(', ') || '—'; }
function ersteMaterialFuerBereich(bereich){
  return DB.materials.find(m=>bereichAlsArray(m.bereich).includes(bereich))?.id || DB.materials[0]?.id || '';
}

    p.kalkulation = { schraenke: [{...alt, name: alt.name || 'Schrank 1'}] };

    (g.azBreakdownM2||[]).forEach(pos=>{ sum.azM2[pos.name] = (sum.azM2[pos.name]||0) + (pos.std||0); });
    (g.azBreakdownWeitere||[]).forEach(pos=>{

    if(g.materialFrontId) sum.materialFrontId = g.materialFrontId;
    if(g.materialRueckwandId) sum.materialRueckwandId = g.materialRueckwandId;
    (g.zusatzPlattenSnapshot||[]).forEach(pl=>{ sum.zusatzPlatten.push({...pl, key: s.name+':'+pl.id}); });

      korpusFl: sum.korpusFl + (g.korpusFl||0),

      rueckFl: sum.rueckFl + (g.rueckFl||0),
      zusatzPlattenFlaeche: sum.zusatzPlattenFlaeche + (g.zusatzPlattenFlaeche||0),
      kantenKosten: sum.kantenKosten + (g.kantenKosten||0),
      kantenLfm: sum.kantenLfm + (g.kantenLfm||0),
      beschlagKosten: sum.beschlagKosten + (g.beschlagKosten||0),
      zusatzKosten: sum.zusatzKosten + (g.zusatzKosten||0),
      puVerleimung: sum.puVerleimung || !!g.puVerleimung,
      baustellenmontageStd: sum.baustellenmontageStd + (g.baustellenmontageStd||0),
      baustellenmontageStdM1: sum.baustellenmontageStdM1 + (g.baustellenmontageStdM1||0),
      baustellenmontageStdM2: sum.baustellenmontageStdM2 + (g.baustellenmontageStdM2||0),
      oberflaecheStd: sum.oberflaecheStd + (g.oberflaecheStd||0),
      oberflaecheStdM1: sum.oberflaecheStdM1 + (g.oberflaecheStdM1||0),
      oberflaecheStdM2: sum.oberflaecheStdM2 + (g.oberflaecheStdM2||0),
      lieferkostenBetrag: sum.lieferkostenBetrag + (g.lieferkostenBetrag||0),

      baustellenmontageKm: sum.baustellenmontageKm + (g.baustellenmontageKm||0),
      kleinmaterialBetrag: sum.kleinmaterialBetrag + (g.kleinmaterialBetrag||0),
      zeit: sum.zeit + (g.zeit||0),
      kosten: sum.kosten + (g.kosten||0),
      az: sum.az, azM1: sum.azM1, azM2: sum.azM2, azWeitere: sum.azWeitere, beschlagQty: sum.beschlagQty, beschlagPreis: sum.beschlagPreis, zusatzPlatten: sum.zusatzPlatten, zusatzpositionen: sum.zusatzpositionen,
      materialKorpusId: sum.materialKorpusId, materialFrontId: sum.materialFrontId, materialRueckwandId: sum.materialRueckwandId,
    };
  }, {material:0, materialNetto:0, korpusMaterialKosten:0, frontMaterialKosten:0, rueckwandMaterialKosten:0, zusatzPlattenMaterialKosten:0,
      korpusFl:0, frontFl:0, rueckFl:0, zusatzPlattenFlaeche:0,
      kantenKosten:0, kantenLfm:0, beschlagKosten:0, zusatzKosten:0, puVerleimung:false, baustellenmontageStd:0, baustellenmontageStdM1:0, baustellenmontageStdM2:0, oberflaecheStd:0, oberflaecheStdM1:0, oberflaecheStdM2:0, lieferkostenBetrag:0, kleinmaterialBetrag:0, kmPauschaleBetrag:0, baustellenmontageKm:0, zeit:0, kosten:0, az:{}, azM1:{}, azM2:{}, azWeitere:{}, beschlagQty:{}, beschlagPreis:{}, zusatzPlatten:[], zusatzpositionen:[],
      materialKorpusId:'', materialFrontId:'', materialRueckwandId:''});

/* Vollständige NK-Kennzahlen (Soll & Ist) eines Projekts — eigenständig nutzbar, z.B. für die
   Projektübersicht oder die Mehrprojekt-Zusammenfassung, ohne die komplette Nachkalkulation-Seite
   rendern zu müssen. "Gewinn" = Verkaufspreis minus Material-/Zeitkosten (dieselbe Definition wird
   für Soll wie für Ist verwendet, damit beide Seiten vergleichbar bleiben). */
function berechneNkKennzahlenVoll(p){
  const geplant = projektGeplantGesamt(p);
  const materialGesamtSoll = geplant.materialNetto+geplant.kantenKosten+geplant.beschlagKosten+geplant.zusatzKosten+geplant.lieferkostenBetrag+geplant.kleinmaterialBetrag;
  const zeitGesamtSoll = geplant.zeit;
  const weitereMitarbeiterFuerNk = (DB.settings.mitarbeiterListe||[]).filter(m=>m.id!=='m1' && m.id!=='m2');
  const azSollM1Gesamt = Object.values(geplant.azM1||{}).reduce((s,v)=>s+v,0) + geplant.oberflaecheStdM1;
  const azSollM2Gesamt = Object.values(geplant.azM2||{}).reduce((s,v)=>s+v,0) + geplant.oberflaecheStdM2;
  const azSollWeitereKosten = weitereMitarbeiterFuerNk.reduce((sum,m)=>{
    const std = Object.values(geplant.azWeitere||{}).reduce((s,pos)=>s+(pos[m.id]||0),0);
    return sum + std*(m.satz||0);
  },0);
  const arbeitszeitGesamtSoll = azSollM1Gesamt*DB.settings.mitarbeiter1Satz + azSollM2Gesamt*DB.settings.mitarbeiter2Satz
    + geplant.baustellenmontageStd * (DB.settings.stundensatzBaustelle||DB.settings.stundensatz) + azSollWeitereKosten;
  const gewinnSoll = geplant.kosten - materialGesamtSoll - arbeitszeitGesamtSoll;
  // Materialpreis inkl. Zuschlag (Soll): alles außer Arbeitszeit und Kilometerpauschale — Material, Kanten, Beschläge, Zusatzpositionen, Liefer-/Kleinmaterial jeweils mit ihren Zuschlägen
  const materialInklSoll = geplant.kosten - arbeitszeitGesamtSoll - (geplant.baustellenmontageKm||0)*DB.settings.kmPauschale;
  const margeSollProzent = geplant.kosten>0 ? (gewinnSoll/geplant.kosten*100) : 0;

  const nk = DB.nachkalkulation.find(x=>x.projId===p.id);
  if(!nk){
    // Noch keine Nachkalkulation erfasst -> Ist identisch zum Soll
    return {
      verkaufspreisSoll:geplant.kosten, verkaufspreisIst:geplant.kosten,
      materialSoll:materialGesamtSoll, materialIst:materialGesamtSoll,
      zeitSoll:zeitGesamtSoll, zeitIst:zeitGesamtSoll,
      bmZeitSoll:geplant.baustellenmontageStd, bmZeitIst:geplant.baustellenmontageStd,
      stundenbetragSoll:arbeitszeitGesamtSoll, stundenbetragIst:arbeitszeitGesamtSoll,
      materialInklSoll:materialInklSoll, materialInklIst:materialInklSoll,
      gewinnSoll, gewinnIst:gewinnSoll, margeSollProzent, margeIstProzent:margeSollProzent,
      erfasst:false,
    };
  }
  const findMatLokal = id => DB.materials.find(m=>m.id===id);
  const zPn = 1 + ((DB.settings.zuschlagZusatzplatten||0)/100);
  const zKn = 1 + ((DB.settings.zuschlagKorpus||0)/100);
  const zFn = 1 + ((DB.settings.zuschlagFront||0)/100);
  const zRn = 1 + ((DB.settings.zuschlagRueckwand||0)/100);
  const m2Ist = (feld, sollFl) => nk[feld]===null||nk[feld]===undefined ? sollFl : nk[feld];
  const matKosten = (matId, m2) => (findMatLokal(matId)?.preis||0) * m2;
  const korpusKostenIst = matKosten(nk.korpusMaterialId||geplant.materialKorpusId, m2Ist('korpusM2Ist', geplant.korpusFl*zKn));
  const frontKostenIst = matKosten(nk.frontMaterialId||geplant.materialFrontId, m2Ist('frontM2Ist', geplant.frontFl*zFn));
  const rueckwandKostenIst = matKosten(nk.rueckwandMaterialId||geplant.materialRueckwandId, m2Ist('rueckwandM2Ist', geplant.rueckFl*zRn));
  const zusatzPlattenKostenIst = (geplant.zusatzPlatten||[]).reduce((s,pl)=>{
    const gespeichert = (nk.zusatzPlattenIst||{})[pl.key];
    const materialId = pl.materialId || gespeichert?.materialId;
    const m2 = gespeichert?.m2 ?? (pl.flaeche*zPn);
    return s + matKosten(materialId, m2);
  },0);
  const zusatzPlattenExtraKostenIst = (nk.zusatzPlattenExtra||[]).reduce((s,ex)=>s+matKosten(ex.materialId, ex.m2||0),0);
  const materialNettoIst = korpusKostenIst+frontKostenIst+rueckwandKostenIst+zusatzPlattenKostenIst+zusatzPlattenExtraKostenIst;
  const kantenLfmIst = nk.kantenLfmIst===null||nk.kantenLfmIst===undefined ? geplant.kantenLfm : nk.kantenLfmIst;
  const kantenNettoIst = kantenLfmIst*DB.settings.kantenpreis;
  const puVerleimungIstAktiv = nk.puVerleimungIst!==undefined && nk.puVerleimungIst!==null ? nk.puVerleimungIst : !!geplant.puVerleimung;
  const puVerleimungKostenIst = puVerleimungIstAktiv && kantenLfmIst>0 ? Math.ceil(kantenLfmIst/Math.max(1,DB.settings.puVerleimungSchwelleLfm))*DB.settings.puVerleimungPreis : 0;
  const beschlagGesamtIst = Object.entries(geplant.beschlagQty||{}).reduce((s,[id])=>{
    const preis = (nk.beschlagPreisIst||{})[id] ?? ((geplant.beschlagPreis||{})[id]!==undefined ? geplant.beschlagPreis[id] : (DB.beschlaege.find(x=>x.id===id)?.preis||0));
    const qty = (nk.beschlagIstQty||{})[id] ?? geplant.beschlagQty[id] ?? 0;
    return s+preis*qty;
  },0);
  const zusatzpositionenNettoIst = (geplant.zusatzpositionen||[]).reduce((s,pos)=>{
    const gespeichert = (nk.zusatzpositionenIst||{})[pos.key];
    const menge = gespeichert?.menge ?? pos.menge; const preis = gespeichert?.preis ?? pos.preis;
    return s+(menge*preis);
  },0) + (nk.zusatzpositionenExtra||[]).reduce((s,ex)=>s+((ex.menge||0)*(ex.preis||0)),0);
  const zusatzposMitGewinnIst = (geplant.zusatzpositionen||[]).reduce((s,pos)=>{
    const gespeichert = (nk.zusatzpositionenIst||{})[pos.key];
    const menge = gespeichert?.menge ?? pos.menge; const preis = gespeichert?.preis ?? pos.preis;
    return s+(menge*preis)*(1+((pos.gewinnzuschlag??DB.settings.gewinnZusatz)/100));
  },0) + (nk.zusatzpositionenExtra||[]).reduce((s,ex)=>s+((ex.menge||0)*(ex.preis||0))*(1+(DB.settings.gewinnZusatz/100)),0);
  const lieferkostenIst = nk.lieferkostenIst===null||nk.lieferkostenIst===undefined ? geplant.lieferkostenBetrag : (parseFloat(nk.lieferkostenIst)||0);
  const kleinmaterialIst = nk.kleinmaterialIst===null||nk.kleinmaterialIst===undefined ? geplant.kleinmaterialBetrag : (parseFloat(nk.kleinmaterialIst)||0);
  const kmIst = nk.baustellenmontageKmIst===null||nk.baustellenmontageKmIst===undefined ? (geplant.baustellenmontageKm||0) : (parseFloat(nk.baustellenmontageKmIst)||0);
  const azIstListe = (nk.azIst && nk.azIst.length) ? nk.azIst : Object.keys(geplant.az||{}).map(name=>({name, std:geplant.azM1?.[name]||0, std2:geplant.azM2?.[name]||0}));
  const oberflaecheIstM1 = nk.oberflaecheIst===null||nk.oberflaecheIst===undefined ? geplant.oberflaecheStdM1 : (parseFloat(nk.oberflaecheIst)||0);
  const oberflaecheIstM2 = nk.oberflaecheIst2===null||nk.oberflaecheIst2===undefined ? geplant.oberflaecheStdM2 : (parseFloat(nk.oberflaecheIst2)||0);
  const baustellenmontageIstM1 = nk.baustellenmontageIst===null||nk.baustellenmontageIst===undefined ? geplant.baustellenmontageStdM1 : (parseFloat(nk.baustellenmontageIst)||0);
  const baustellenmontageIstM2 = nk.baustellenmontageIst2===null||nk.baustellenmontageIst2===undefined ? geplant.baustellenmontageStdM2 : (parseFloat(nk.baustellenmontageIst2)||0);
  const summeWeitereIst = r => Object.values(r.weitereStunden||{}).reduce((a,b)=>a+(b||0),0);
  const kostenWeitereIst = r => weitereMitarbeiterFuerNk.reduce((s,m)=>s+((r.weitereStunden?.[m.id]||0)*(m.satz||0)),0);
  const bmWeitereIstGesamt = weitereMitarbeiterFuerNk.reduce((s,m)=>s+(nk.baustellenmontageIstWeitere?.[m.id]||0),0);
  const bmWeitereIstKosten = weitereMitarbeiterFuerNk.reduce((s,m)=>s+((nk.baustellenmontageIstWeitere?.[m.id]||0)*(m.satz||0)),0);
  const zeitGesamtIstRoh = nk.nurGesamtstundenModus
    ? (parseFloat(nk.gesamtstundenDirekt)||0)
    : azIstListe.reduce((s,r)=>s+(r.std||0)+(r.std2||0)+summeWeitereIst(r),0) + oberflaecheIstM1+oberflaecheIstM2 + baustellenmontageIstM1+baustellenmontageIstM2+bmWeitereIstGesamt;
  // Erst hier, bei der GESAMTSUMME aller Fertigungsschritte, wird auf volle Viertelstunden aufgerundet —
  // jede einzelne Position bleibt exakt/roh, wie tatsächlich erfasst.
  const zeitGesamtIst = Math.ceil(zeitGesamtIstRoh*4)/4;
  const arbeitszeitGesamtIstRoh = nk.nurGesamtstundenModus
    ? zeitGesamtIstRoh*DB.settings.stundensatz
    : azIstListe.reduce((s,r)=>s+(r.std||0)*DB.settings.mitarbeiter1Satz+(r.std2||0)*DB.settings.mitarbeiter2Satz+kostenWeitereIst(r), 0)
      + oberflaecheIstM1*DB.settings.mitarbeiter1Satz + oberflaecheIstM2*DB.settings.mitarbeiter2Satz
      + (baustellenmontageIstM1+baustellenmontageIstM2)*(DB.settings.stundensatzBaustelle||DB.settings.stundensatz)
      + bmWeitereIstKosten;
  // Die Aufrundung auf volle Viertelstunden wird hier proportional auf den Euro-Betrag übertragen (statt
  // separat neu zu berechnen) — so bleiben Stunden- und Euro-Anzeige immer konsistent zueinander, auch
  // wenn mehrere Mitarbeiter mit unterschiedlichem Stundensatz beteiligt sind.
  const rundungsFaktor = zeitGesamtIstRoh>0 ? zeitGesamtIst/zeitGesamtIstRoh : 1;
  const arbeitszeitGesamtIst = arbeitszeitGesamtIstRoh * rundungsFaktor;
  const zusatzarbeiten = parseFloat(nk.zusatzarbeiten)||0;
  const verkaufspreisIst = materialNettoIst*(1+DB.settings.gewinnMaterial/100)
    + (kantenNettoIst+puVerleimungKostenIst)*(1+DB.settings.gewinnKanten/100)
    + beschlagGesamtIst*(1+DB.settings.gewinnBeschlaege/100)
    + zusatzposMitGewinnIst
    + lieferkostenIst + kleinmaterialIst + (kmIst*DB.settings.kmPauschale)
    + arbeitszeitGesamtIst + zusatzarbeiten;
  // Materialgesamt (Ist) exakt wie in der Nachkalkulation-Ansicht definiert: alle Netto-Kosten
  // ohne Zuschläge, inkl. Kanten, Beschläge, Zusatzpositionen, Lieferkosten und Kleinmaterial.
  const materialGesamtIst = materialNettoIst + kantenNettoIst + beschlagGesamtIst + zusatzpositionenNettoIst + lieferkostenIst + kleinmaterialIst;
  const gewinnIst = verkaufspreisIst - materialGesamtIst - arbeitszeitGesamtIst - zusatzarbeiten;
  const margeIstProzent = verkaufspreisIst>0 ? (gewinnIst/verkaufspreisIst*100) : 0;
  const bmZeitIst = baustellenmontageIstM1 + baustellenmontageIstM2 + bmWeitereIstGesamt;
  return {
    verkaufspreisSoll:geplant.kosten, verkaufspreisIst,
    materialSoll:materialGesamtSoll, materialIst:materialGesamtIst,
    zeitSoll:zeitGesamtSoll, zeitIst:zeitGesamtIst,
    bmZeitSoll:geplant.baustellenmontageStd, bmZeitIst,
    stundenbetragSoll:arbeitszeitGesamtSoll, stundenbetragIst:arbeitszeitGesamtIst,
    materialInklSoll, materialInklIst: verkaufspreisIst - arbeitszeitGesamtIst - zusatzarbeiten - kmIst*DB.settings.kmPauschale,
    gewinnSoll, gewinnIst, margeSollProzent, margeIstProzent,
    erfasst:true,
  };
}
/* Dünner Wrapper für bestehende Aufrufer, die nur den NK-Gesamtpreis (Ist) brauchen. */
function berechneNkVerkaufspreis(p){ return berechneNkKennzahlenVoll(p).verkaufspreisIst; }
function matOptions(selId,bereich){
  let liste = DB.materials.filter(m=>{ const b=bereichAlsArray(m.bereich); return b.includes(bereich) || b.includes('Sondermaterial'); });
  if(!liste.length) liste = DB.materials; // Fallback: falls kein Material für diesen Bereich hinterlegt ist, alle zeigen
  // Bereits zugewiesenes Material nie stillschweigend aus der Liste entfernen, auch wenn Bereich nicht passt
  if(selId && !liste.some(m=>m.id===selId)){
    const gewaehlt = DB.materials.find(m=>m.id===selId);
    if(gewaehlt) liste = [gewaehlt, ...liste];
  }
  return liste.map(m=>{
    const b = bereichAlsArray(m.bereich);
    const zusatz = b.includes(bereich) ? '' : ` — ${b.join(', ')}`;
    return `<option value="${m.id}" ${m.id===selId?'selected':''}>${m.name} (${fmtEUR(m.preis)}/m²)${zusatz}</option>`;
  }).join('')
    + (DB.materials.length? '' : '<option value="">— keine Materialien angelegt —</option>');
}
