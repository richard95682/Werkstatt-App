    <div class="card" data-regelpanel="bodentraeger" style="${regelnTab==='bodentraeger'?'':'display:none'}">
      <h3>🔩 Bodenträger</h3>
      <div class="checkline"><span>Je Fachboden</span><input type="number" min="0" id="rg_bod_wert" value="${sBod}" style="width:80px;margin-left:auto"><span class="small">Stück</span></div>
      <div class="small" style="margin-top:8px">Gesamt = Anzahl Fachböden aller Fächer × dieser Wert. Für die Basis (Böden oben/unten) werden keine Bodenträger benötigt.</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="rg_bod_save">Speichern</button></div>
    </div>

    <div class="card" data-regelpanel="kanten" style="${regelnTab==='kanten'?'':'display:none'}">
      <h3>✂️ Kantenbearbeitung</h3>
      <p class="small">Legt fest, wie viele Kanten je Bauteiltyp umleimt werden. Fließt direkt in Kantenlänge und Materialkosten der Kalkulation ein.</p>
      <div id="kantenRegelnHost"></div>
      <div class="btn-row"><button class="btn btn-primary" id="kr_save">Speichern</button></div>
    </div>

    <div class="card" data-regelpanel="sonstiges" style="${regelnTab==='sonstiges'?'':'display:none'}">
      <h3>🪵 Materialregel</h3>
      <div class="hint">💡 Wenn Korpus- und Frontmaterial identisch sind, schlägt der Assistent vor, die Bestellung zusammenzufassen.</div>
      <h3 style="margin-top:16px">🧠 Lernfunktion (Grundlage)</h3>
      <p class="small">Bestätigte Anpassungen (z. B. zusätzliche Sockelfüße, abweichende Scharnieranzahl) werden je Projekt gespeichert und in „Nachkalkulation“ ausgewertet, um künftig bessere Vorschläge abzuleiten.</p>

  el.querySelectorAll('[data-regeltab]').forEach(tabEl=>tabEl.addEventListener('click',()=>{
    regelnTab = tabEl.dataset.regeltab;

  }));

  document.getElementById('rg_sockel_save').addEventListener('click', async ()=>{
    DB.settings.regelSockel = {
      schwelle: parseFloat(document.getElementById('rg_sockel_schwelle').value)||0,
      zusatzJeSegment: parseFloat(document.getElementById('rg_sockel_zusatz').value)||0,
    };
    await save('settings'); alert('Sockelfuß-Regel gespeichert.');
  });
  document.getElementById('rg_sch_save').addEventListener('click', async ()=>{
    DB.settings.regelScharnier = {
      h1: parseFloat(document.getElementById('rg_sch_h1').value)||0,
      h2: parseFloat(document.getElementById('rg_sch_h2').value)||0,
      h3: parseFloat(document.getElementById('rg_sch_h3').value)||0,
      h4: parseFloat(document.getElementById('rg_sch_h4').value)||0,
      n1: parseFloat(document.getElementById('rg_sch_n1').value)||0,
      n2: parseFloat(document.getElementById('rg_sch_n2').value)||0,
      n3: parseFloat(document.getElementById('rg_sch_n3').value)||0,
      n4: parseFloat(document.getElementById('rg_sch_n4').value)||0,
      n5: parseFloat(document.getElementById('rg_sch_n5').value)||0,
    };
    await save('settings'); alert('Scharnier-Regel gespeichert.');
  });
  document.getElementById('rg_verb_save').addEventListener('click', async ()=>{
    DB.settings.regelVerbinder = {
      schwelle: parseFloat(document.getElementById('rg_verb_schwelle').value)||0,
      stkBis: parseFloat(document.getElementById('rg_verb_bis').value)||0,
      stkUeber: parseFloat(document.getElementById('rg_verb_ueber').value)||0,
    };
    await save('settings'); alert('Verbinder-Regel gespeichert.');
  });
  document.getElementById('rg_bod_save').addEventListener('click', async ()=>{
    DB.settings.regelBodentraeger = { jeFachboden: parseFloat(document.getElementById('rg_bod_wert').value)||0 };
    await save('settings'); alert('Bodenträger-Regel gespeichert.');
  });

  const regeln = kantenRegeln();
  const KANTEN_GRUPPEN = [
    {titel:'Korpus', typen:['seite_aussen','seite_mittel','boden','fachboden','konstruktionsboden']},
    {titel:'Front & Rückwand', typen:['front','rueckwand']},
    {titel:'Sockel & Blenden', typen:['sockel','blende','anstellseite','anstellboden','anstelldeckel']},
  ];
  document.getElementById('kantenRegelnHost').innerHTML = `
    <div class="small" style="margin-bottom:10px">Längskanten/Stirnkanten je 0–2 frei kombinierbar, oder „umlaufend“ für alle vier Kanten.</div>
    ${KANTEN_GRUPPEN.map(g=>`
    <div style="margin-bottom:14px">
      <div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">${g.titel}</div>
      ${g.typen.map(typ=>{ const r = regeln[typ]; return `
        <div class="checkline" style="gap:8px">
          <span class="small" style="width:150px">${KANTEN_TYP_LABEL[typ]}</span>
          <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Längs <input type="number" min="0" max="2" style="width:44px" data-kr-laengs="${typ}" value="${r.laengs}" ${r.umlaufend?'disabled':''}></label>
          <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Stirn <input type="number" min="0" max="2" style="width:44px" data-kr-stirn="${typ}" value="${r.stirn}" ${r.umlaufend?'disabled':''}></label>
          <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none;margin-left:auto"><input type="checkbox" style="width:auto" data-kr-umlaufend="${typ}" ${r.umlaufend?'checked':''}> umlaufend</label>
        </div>`; }).join('')}
    </div>`).join('')}`;
  document.querySelectorAll('[data-kr-umlaufend]').forEach(cb=>cb.addEventListener('change',e=>{
    const typ = e.target.dataset.krUmlaufend;
    const laengsInp = document.querySelector(`[data-kr-laengs="${typ}"]`);
    const stirnInp = document.querySelector(`[data-kr-stirn="${typ}"]`);
    if(e.target.checked){ laengsInp.value=2; stirnInp.value=2; laengsInp.disabled=true; stirnInp.disabled=true; }
    else { laengsInp.disabled=false; stirnInp.disabled=false; }
  }));
  document.getElementById('kr_save').addEventListener('click', async ()=>{
    const neu = {};
    const typen = KANTEN_GRUPPEN.flatMap(g=>g.typen);
    typen.forEach(typ=>{
      const umlaufend = document.querySelector(`[data-kr-umlaufend="${typ}"]`).checked;
      neu[typ] = {
        laengs: parseInt(document.querySelector(`[data-kr-laengs="${typ}"]`).value)||0,
        stirn: parseInt(document.querySelector(`[data-kr-stirn="${typ}"]`).value)||0,
        umlaufend,
      };
    });
    DB.settings.kantenRegeln = neu;
    await save('settings');
    alert('Kantenregeln gespeichert.');
  });
}

/* ---------------------------- ARBEITSZEIT ---------------------------- */
function fmtStdMin(std){
  const gesamtMin = Math.round((std||0)*60);
  const vorzeichen = gesamtMin<0 ? '-' : '';
  const abs = Math.abs(gesamtMin);
  const h = Math.floor(abs/60), m = abs%60;
  if(h===0) return `${vorzeichen}${m} Min.`;
  if(m===0) return `${vorzeichen}${h} Std.`;
  return `${vorzeichen}${h} Std. ${m} Min.`;
}

/* ---------------------------- NACHKALKULATION ---------------------------- */
function renderNachkalkulation(el){
  const meineGeneration = ++nkRenderGeneration;
  const hatGespeicherteSchraenke = p=>p.kalkulation?.schraenke?.some(s=>s.geplant);
  if(!DB.projects.some(hatGespeicherteSchraenke)){
    el.innerHTML = `<div class="pagehead"><div><h1>Nachkalkulation</h1><p>Geplant vs. tatsächlich vergleichen.</p></div></div>
    <div class="card">${emptyState('📊','Noch keine Kalkulation','Speichere zuerst eine Kalkulation unter „Kalkulation“.')}</div>`;
    return;
  }
  const kalkProjekte = DB.projects.filter(hatGespeicherteSchraenke);
  if(!activeProjectId || !kalkProjekte.find(p=>p.id===activeProjectId)) activeProjectId = kalkProjekte[kalkProjekte.length-1].id;
  const p = proj(activeProjectId);
  const gespeichertesNk = DB.nachkalkulation.find(x=>x.projId===p.id);
  const geplant = projektGeplantGesamt(p);
  const azNamenSoll = Object.keys(geplant.az); // Positionsnamen aus der Kalkulation, über alle Schränke summiert (z.B. AV, Zuschnitt, Kanten, Zusammenbau, CNC-Bearbeitung)
  const nk = {
    projId:p.id,
    korpusM2Ist:null, frontM2Ist:null, rueckwandM2Ist:null,
    kantenLfmIst:null, baustellenmontageIst:null, baustellenmontageIst2:null, baustellenmontageKmIst:null, oberflaecheIst:null, oberflaecheIst2:null, lieferkostenIst:null, kleinmaterialIst:null, zusatzarbeiten:0, notiz:'',
    ...(gespeichertesNk||{}),
    beschlagIstQty:{...(gespeichertesNk?.beschlagIstQty||{})},
    beschlagPreisIst:{...(gespeichertesNk?.beschlagPreisIst||{})},
    zusatzPlattenIst:{...(gespeichertesNk?.zusatzPlattenIst||{})},
    zusatzPlattenExtra: gespeichertesNk?.zusatzPlattenExtra && Array.isArray(gespeichertesNk.zusatzPlattenExtra) ? gespeichertesNk.zusatzPlattenExtra.map(r=>({...r})) : [],
    zusatzpositionenIst: {...(gespeichertesNk?.zusatzpositionenIst||{})},
    zusatzpositionenExtra: gespeichertesNk?.zusatzpositionenExtra && Array.isArray(gespeichertesNk.zusatzpositionenExtra) ? gespeichertesNk.zusatzpositionenExtra.map(r=>({...r})) : [],
    nurGesamtstundenModus: gespeichertesNk?.nurGesamtstundenModus || false,
    gesamtstundenDirekt: gespeichertesNk?.gesamtstundenDirekt ?? null,
    azIst: (()=>{
      if(gespeichertesNk?.azIst && Array.isArray(gespeichertesNk.azIst) && gespeichertesNk.azIst.length){
        // Bestehende Ist-Werte behalten, aber neu hinzugekommene Kalkulations-Positionen automatisch mit dem Soll-Wert ergänzen
        const bestehend = gespeichertesNk.azIst.map(r=>({...r}));
        azNamenSoll.forEach(name=>{ if(!bestehend.some(r=>r.name===name)) bestehend.push({name, std: geplant.azM1?.[name]||0, std2: geplant.azM2?.[name]||0}); });
        return bestehend;
      }
      // Erststart: Positionen 1:1 aus der Kalkulation übernehmen (Summe aller Schränke) — Ist-Stunden starten beim Soll-Wert,
      // sonst wirkt die Nachkalkulation sofort "abweichend", obwohl noch gar nichts geändert wurde.
      return azNamenSoll.map(name=>({name, std: geplant.azM1?.[name]||0, std2: geplant.azM2?.[name]||0}));
    })(),
  };
  const beschlagGruppenSoll = gruppiereBeschlagMengen(geplant.beschlagQty, false, geplant.beschlagPreis);

  // Immer das aktuell in der Kalkulation geplante Material zeigen — nicht an einem alten, längst überholten Wert festhalten
  nk.korpusMaterialId = geplant.materialKorpusId || nk.korpusMaterialId;
  nk.kantenLfmIst = nk.kantenLfmIst===null || nk.kantenLfmIst===undefined ? geplant.kantenLfm : nk.kantenLfmIst;
  nk.baustellenmontageIst = nk.baustellenmontageIst===null || nk.baustellenmontageIst===undefined ? geplant.baustellenmontageStdM1 : nk.baustellenmontageIst;
  nk.baustellenmontageIst2 = nk.baustellenmontageIst2===null || nk.baustellenmontageIst2===undefined ? geplant.baustellenmontageStdM2 : nk.baustellenmontageIst2;
  nk.baustellenmontageKmIst = nk.baustellenmontageKmIst===null || nk.baustellenmontageKmIst===undefined ? geplant.baustellenmontageKm : nk.baustellenmontageKmIst;
  nk.oberflaecheIst = nk.oberflaecheIst===null || nk.oberflaecheIst===undefined ? geplant.oberflaecheStdM1 : nk.oberflaecheIst;
  nk.oberflaecheIst2 = nk.oberflaecheIst2===null || nk.oberflaecheIst2===undefined ? geplant.oberflaecheStdM2 : nk.oberflaecheIst2;
  nk.lieferkostenIst = nk.lieferkostenIst===null || nk.lieferkostenIst===undefined ? geplant.lieferkostenBetrag : nk.lieferkostenIst;
  nk.kleinmaterialIst = nk.kleinmaterialIst===null || nk.kleinmaterialIst===undefined ? geplant.kleinmaterialBetrag : nk.kleinmaterialIst;
  nk.frontMaterialId = geplant.materialFrontId || nk.frontMaterialId;
  nk.rueckwandMaterialId = geplant.materialRueckwandId || nk.rueckwandMaterialId;
  // Verschnittzuschlag einrechnen: die Soll-Fläche/-Menge muss zum Soll-Preis passen (der den Zuschlag schon enthält),
  // sonst weicht der vorbefüllte Ist-Wert sofort vom Soll-Preis ab, ohne dass etwas geändert wurde.
  const zKn = 1 + ((DB.settings.zuschlagKorpus||0)/100);
  const zFn = 1 + ((DB.settings.zuschlagFront||0)/100);
  const zRn = 1 + ((DB.settings.zuschlagRueckwand||0)/100);
  const zPn = 1 + ((DB.settings.zuschlagZusatzplatten||0)/100);
  const korpusFlInkl = geplant.korpusFl*zKn, frontFlInkl = geplant.frontFl*zFn, rueckFlInkl = geplant.rueckFl*zRn;
  const m2Ist = (feld, sollFl) => nk[feld]===null||nk[feld]===undefined ? sollFl : nk[feld];
  const materialZeileKosten = (matId, m2) => (findMat(matId)?.preis||0) * m2;
  const korpusKostenIst = materialZeileKosten(nk.korpusMaterialId, m2Ist('korpusM2Ist', korpusFlInkl));
  const frontKostenIst = materialZeileKosten(nk.frontMaterialId, m2Ist('frontM2Ist', frontFlInkl));
  const rueckwandKostenIst = materialZeileKosten(nk.rueckwandMaterialId, m2Ist('rueckwandM2Ist', rueckFlInkl));
  const zusatzPlattenIstWert = pl => {
    const gespeichert = nk.zusatzPlattenIst[pl.key];
    return { materialId: pl.materialId || gespeichert?.materialId, m2: gespeichert?.m2 ?? (pl.flaeche*zPn) };
  };
  const zusatzPlattenKostenIst = (geplant.zusatzPlatten||[]).reduce((s,pl)=>{ const w=zusatzPlattenIstWert(pl); return s + materialZeileKosten(w.materialId, w.m2); },0);
  const zusatzPlattenExtraKostenIst = nk.zusatzPlattenExtra.reduce((s,ex)=>s+materialZeileKosten(ex.materialId, ex.m2||0),0);
  const zusatzpositionIstWert = pos => {
    const gespeichert = nk.zusatzpositionenIst[pos.key];
    return { menge: gespeichert?.menge ?? pos.menge, preis: gespeichert?.preis ?? pos.preis };
  };
  const zusatzpositionenKostenIst = (geplant.zusatzpositionen||[]).reduce((s,pos)=>{ const w=zusatzpositionIstWert(pos); return s+(w.menge*w.preis); },0);
  const zusatzpositionenExtraKostenIst = nk.zusatzpositionenExtra.reduce((s,ex)=>s+((ex.menge||0)*(ex.preis||0)),0);

  const beschlagGesamtIst = beschlagGruppenSoll.reduce((s,g)=>s+g.ids.reduce((s2,id)=>{ const preis = nk.beschlagPreisIst[id] ?? (geplant.beschlagPreis?.[id]!==undefined ? geplant.beschlagPreis[id] : (DB.beschlaege.find(x=>x.id===id)?.preis||0)); return s2+preis*(nk.beschlagIstQty[id]??g.qty); },0),0);
  const nurMaterialGesamtIst = korpusKostenIst+frontKostenIst+rueckwandKostenIst+zusatzPlattenKostenIst+zusatzPlattenExtraKostenIst+((parseFloat(nk.kantenLfmIst)||0)*DB.settings.kantenpreis)+zusatzpositionenKostenIst+zusatzpositionenExtraKostenIst+(parseFloat(nk.lieferkostenIst)||0)+(parseFloat(nk.kleinmaterialIst)||0);
  const nurMaterialGesamtSoll = geplant.materialNetto+geplant.kantenKosten+geplant.zusatzKosten+geplant.lieferkostenBetrag+geplant.kleinmaterialBetrag;
  const materialGesamtIst = nurMaterialGesamtIst + beschlagGesamtIst;
  const materialGesamtSoll = geplant.materialNetto+geplant.kantenKosten+geplant.beschlagKosten+geplant.zusatzKosten+geplant.lieferkostenBetrag+geplant.kleinmaterialBetrag;
  const zeitGesamtIst = nk.nurGesamtstundenModus
    ? (parseFloat(nk.gesamtstundenDirekt)||0)
    : nk.azIst.reduce((s,r)=>s+(r.std||0)+(r.std2||0),0) + (parseFloat(nk.oberflaecheIst)||0)+(parseFloat(nk.oberflaecheIst2)||0) + (parseFloat(nk.baustellenmontageIst)||0)+(parseFloat(nk.baustellenmontageIst2)||0);
  const zeitGesamtSoll = geplant.zeit;
  const azSollM1Gesamt = Object.values(geplant.azM1||{}).reduce((s,v)=>s+v,0) + geplant.oberflaecheStdM1;
  const azSollM2Gesamt = Object.values(geplant.azM2||{}).reduce((s,v)=>s+v,0) + geplant.oberflaecheStdM2;
  const arbeitszeitGesamtSoll = azSollM1Gesamt*DB.settings.mitarbeiter1Satz + azSollM2Gesamt*DB.settings.mitarbeiter2Satz
    + geplant.baustellenmontageStd * (DB.settings.stundensatzBaustelle||DB.settings.stundensatz);
  // Tatsächlicher Ist-Gesamtpreis (fehlte bisher komplett — Änderungen bei den Stunden wirkten sich auf keinen angezeigten Preis aus).
  // Wichtig: mit denselben Gewinnzuschlägen je Kategorie rechnen wie die Kalkulation, sonst entsteht eine Lücke zum VK-Preis,
  // auch wenn es gar keine echte Abweichung gibt. Je Mitarbeiter mit dessen eigenem Satz, Baustellenmontage weiterhin mit ihrem eigenen Satz.
  const arbeitszeitGesamtIst = nk.nurGesamtstundenModus
    ? zeitGesamtIst * DB.settings.stundensatz
    : nk.azIst.reduce((s,r)=>s + (r.std||0)*DB.settings.mitarbeiter1Satz + (r.std2||0)*DB.settings.mitarbeiter2Satz, 0)
      + (parseFloat(nk.oberflaecheIst)||0)*DB.settings.mitarbeiter1Satz + (parseFloat(nk.oberflaecheIst2)||0)*DB.settings.mitarbeiter2Satz
      + ((parseFloat(nk.baustellenmontageIst)||0)+(parseFloat(nk.baustellenmontageIst2)||0)) * (DB.settings.stundensatzBaustelle||DB.settings.stundensatz);
  const materialNettoIst = korpusKostenIst+frontKostenIst+rueckwandKostenIst+zusatzPlattenKostenIst+zusatzPlattenExtraKostenIst;
  const kantenNettoIst = (parseFloat(nk.kantenLfmIst)||0)*DB.settings.kantenpreis;
  const puVerleimungIstAktiv = nk.puVerleimungIst!==undefined && nk.puVerleimungIst!==null ? nk.puVerleimungIst : !!geplant.puVerleimung;
  const puVerleimungKostenIst = puVerleimungIstAktiv && (parseFloat(nk.kantenLfmIst)||0)>0 ? Math.ceil((parseFloat(nk.kantenLfmIst)||0)/Math.max(1,DB.settings.puVerleimungSchwelleLfm))*DB.settings.puVerleimungPreis : 0;
  const zusatzposMitGewinnIst = (geplant.zusatzpositionen||[]).reduce((s,pos)=>{ const w=zusatzpositionIstWert(pos); const netto=w.menge*w.preis; return s+netto*(1+((pos.gewinnzuschlag??DB.settings.gewinnZusatz)/100)); },0)
    + nk.zusatzpositionenExtra.reduce((s,ex)=>{ const netto=(ex.menge||0)*(ex.preis||0); return s+netto*(1+(DB.settings.gewinnZusatz/100)); },0);
  const verkaufspreisIst = materialNettoIst*(1+DB.settings.gewinnMaterial/100)
    + (kantenNettoIst+puVerleimungKostenIst)*(1+DB.settings.gewinnKanten/100)
    + beschlagGesamtIst*(1+DB.settings.gewinnBeschlaege/100)
    + zusatzposMitGewinnIst
    + (parseFloat(nk.lieferkostenIst)||0) + (parseFloat(nk.kleinmaterialIst)||0) + ((parseFloat(nk.baustellenmontageKmIst)||0)*DB.settings.kmPauschale)
    + arbeitszeitGesamtIst + (parseFloat(nk.zusatzarbeiten)||0);

  const materialZeile = (label, feld, matFeld, sollFl, sollKosten, bereich, istKosten) => `
    <div class="checkline" style="flex-wrap:wrap;row-gap:4px">
      <span style="width:150px">${label}</span>
      <span class="small mono" style="margin-left:auto">Soll: ${sollFl.toFixed(2)} m² / ${fmtEUR(sollKosten)}</span>
      <select data-nk-mat="${matFeld}" style="width:220px">${matOptions(nk[matFeld], bereich)}</select>
      <input type="number" step="0.01" min="0" data-nk-m2="${feld}" value="${m2Ist(feld, sollFl).toFixed(2)}" style="width:75px">
      <span class="small">m² (inkl. Zuschlag)</span>
      <span class="small mono" data-nk-matkosten="${feld}" style="width:80px;text-align:right">${fmtEUR(istKosten)}</span>
    </div>`;
  const matOptAlle = sel => DB.materials.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${m.name} (${fmtEUR(m.preis)}/m²)</option>`).join('') || '<option value="">— keine Materialien —</option>';
  // Alle materialverbrauchenden Positionen (Korpus/Front/Rückwand + jede Zusatzplatte) EINHEITLICH zusammenfassen,
  // damit z.B. auch eine Zusatzplatte mit demselben Material wie Korpus/Front mit hineinfällt.
  const materialItems = [
    {key:'korpusM2Ist', label:'Korpusmaterial', sollFl:korpusFlInkl, sollKosten:geplant.korpusMaterialKosten, bereich:'Korpus', matId:geplant.materialKorpusId, ist:()=>({materialId:nk.korpusMaterialId, m2:m2Ist('korpusM2Ist',korpusFlInkl)})},
    {key:'frontM2Ist', label:'Frontmaterial', sollFl:frontFlInkl, sollKosten:geplant.frontMaterialKosten, bereich:'Front', matId:geplant.materialFrontId, ist:()=>({materialId:nk.frontMaterialId, m2:m2Ist('frontM2Ist',frontFlInkl)})},
    {key:'rueckwandM2Ist', label:'Rückwandmaterial', sollFl:rueckFlInkl, sollKosten:geplant.rueckwandMaterialKosten, bereich:'Rückwand', matId:geplant.materialRueckwandId, ist:()=>({materialId:nk.rueckwandMaterialId, m2:m2Ist('rueckwandM2Ist',rueckFlInkl)})},
    ...(geplant.zusatzPlatten||[]).map(pl=>({key:pl.key, label:pl.name||'Zusatzplatte', sollFl:pl.flaeche*zPn, sollKosten:pl.kosten, bereich:null, matId:pl.materialId, ist:()=>zusatzPlattenIstWert(pl)})),
  ];
  const materialGruppenAlle = [];
  const bereitsGruppiert = new Set();
  materialItems.forEach((it,i)=>{
    if(bereitsGruppiert.has(i)) return;
    const passende = [i];
    materialItems.forEach((it2,j)=>{ if(j>i && !bereitsGruppiert.has(j) && it.matId && it2.matId===it.matId) passende.push(j); });
    passende.forEach(m=>bereitsGruppiert.add(m));
    materialGruppenAlle.push(passende.map(idx=>materialItems[idx]));
  });
  const materialZeileEinheitlich = gruppe => {
    const erste = gruppe[0];
    const mehrfach = gruppe.length>1;
    const label = mehrfach ? gruppe.map(g=>g.label.replace('material','')).join(' + ') + ' (gleiches Material)' : erste.label;
    const sollFl = gruppe.reduce((s,g)=>s+g.sollFl,0);
    const sollKosten = gruppe.reduce((s,g)=>s+g.sollKosten,0);
    const ersteIst = erste.ist();
    const combinedM2 = gruppe.reduce((s,g)=>s+g.ist().m2,0);
    const kosten = materialZeileKosten(ersteIst.materialId, combinedM2);
    const keys = gruppe.map(g=>g.key).join(',');
    // Sobald eine Zusatzplatte Teil der Gruppe ist, alle Materialien zur Auswahl anbieten (nicht auf einen Bereich beschränkt)
    const hatZusatzplatte = gruppe.some(g=>g.bereich===null);
    const optionenHtml = hatZusatzplatte ? matOptAlle(ersteIst.materialId) : matOptions(ersteIst.materialId, erste.bereich);
    const m2ProStueck = findMat(ersteIst.materialId)?.m2ProStueck||0;
    return `<div class="nk-matgruppe">
    <div class="checkline" style="flex-wrap:wrap;row-gap:4px">
      <span style="width:150px">${label}</span>
      <select data-nk-mat="${keys}" style="width:220px">${optionenHtml}</select>
      <input type="number" step="0.01" min="0" data-nk-m2="${keys}" value="${combinedM2.toFixed(2)}" style="width:75px">
      <span class="small">m² (inkl. Zuschlag)</span>
      <span class="small mono" style="margin-left:auto">Soll: ${sollFl.toFixed(2)} m² / ${fmtEUR(sollKosten*(1+DB.settings.gewinnMaterial/100))}</span>
      <span class="small mono" data-nk-matkosten="${keys}" style="width:80px;text-align:right">${fmtEUR(kosten)}</span>
    </div>
    ${m2ProStueck>0 ? (()=>{
      const rekonstruiertStk = Math.round((combinedM2/m2ProStueck)*100)/100;
      const passtGenau = Math.abs(rekonstruiertStk - Math.round(rekonstruiertStk)) < 0.02;
      const stkAnzeige = passtGenau ? Math.round(rekonstruiertStk) : '';
      return `<div class="checkline" style="padding-left:24px">
      <span class="small">oder ganze Platten:</span>
      <input type="number" step="1" min="0" data-nk-stueck="${keys}" data-nk-stueck-m2="${m2ProStueck}" placeholder="0" value="${stkAnzeige}" style="width:60px">
      <span class="small">Stk × ${fmtM2(m2ProStueck)} = <span data-nk-stueck-ergebnis="${keys}">${stkAnzeige!==''?fmtM2(stkAnzeige*m2ProStueck):'—'}</span></span>
    </div>`;
    })() : ''}
    <div class="checkline"><b class="small">→ Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto" data-nk-matkosten-inkl="${keys}">${fmtEUR(kosten*(1+DB.settings.gewinnMaterial/100))}</b></div>
    </div>`;
  };
  // Reine Korpus/Front/Rückwand-Gruppen (keine Zusatzplatte dabei) oben in der Material-Karte zeigen;
  // Gruppen mit mind. einer Zusatzplatte (egal ob kombiniert mit Korpus/Front/Rückwand oder pur) unten bei den Zusatzplatten.
  const materialZeilenHtml = materialGruppenAlle.filter(g=>!g.some(it=>it.bereich===null)).map(materialZeileEinheitlich).join('');
  const zusatzPlattenZeilenHtml = (()=>{
    const gruppen = materialGruppenAlle.filter(g=>g.some(it=>it.bereich===null));
    if(!gruppen.length) return '';
    return gruppen.map(materialZeileEinheitlich).join('');
  })();
  const zusatzPlatteExtraZeile = (ex,i) => {
    const kosten = materialZeileKosten(ex.materialId, ex.m2||0);
    const m2ProStueck = findMat(ex.materialId)?.m2ProStueck||0;
    const rekonstruiertStk = m2ProStueck>0 ? Math.round(((ex.m2||0)/m2ProStueck)*100)/100 : 0;
    const passtGenau = m2ProStueck>0 && Math.abs(rekonstruiertStk - Math.round(rekonstruiertStk)) < 0.02;
    const stkAnzeige = passtGenau ? Math.round(rekonstruiertStk) : '';
    return `<div class="checkline" style="flex-wrap:wrap;row-gap:4px">
      <input type="text" style="width:150px" value="${ex.name||''}" data-nkzpx-name="${i}" placeholder="Bezeichnung">
      <select data-nkzpx-mat="${i}" style="width:220px">${matOptAlle(ex.materialId)}</select>
      <input type="number" step="0.01" min="0" data-nkzpx-m2="${i}" value="${ex.m2||0}" style="width:75px">
      <span class="small">m²</span>
      <span class="small mono" style="margin-left:auto">ungeplant, zusätzlich</span>
      <span class="small mono" data-nkzpx-kosten="${i}" style="width:80px;text-align:right">${fmtEUR(kosten)}</span>
      <button class="btn btn-ghost btn-sm" data-nkzpx-del="${i}">✕</button>
    </div>
    ${m2ProStueck>0 ? `<div class="checkline" style="padding-left:24px">
      <span class="small">oder ganze Platten:</span>
      <input type="number" step="1" min="0" data-nkzpx-stueck="${i}" data-nkzpx-stueck-m2="${m2ProStueck}" placeholder="0" value="${stkAnzeige}" style="width:60px">
      <span class="small">Stk × ${fmtM2(m2ProStueck)} = <span data-nkzpx-stueck-ergebnis="${i}">${stkAnzeige!==''?fmtM2(stkAnzeige*m2ProStueck):'—'}</span></span>
    </div>` : ''}
    <div class="checkline"><b class="small">→ Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto" data-nkzpx-kosten-inkl="${i}">${fmtEUR(kosten*(1+DB.settings.gewinnMaterial/100))}</b></div>`;
  };

  el.innerHTML = `
    <div class="pagehead"><div><h1>Nachkalkulation</h1><p>Vergleich geplant vs. tatsächlich, je Position — fließt in „Aus echten Aufträgen ableiten“ (Einstellungen) ein.</p></div>
      <select id="nkProjSelect">${kalkProjekte.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}</option>`).join('')}</select></div>

    <div class="card">
      <h3>🪵 Material — Soll vs. Ist</h3>
      <div class="small" style="margin-bottom:8px">Material frei wählbar (Standard = geplantes Material), Fläche in m² eintragen — der Preis wird automatisch berechnet.</div>
      ${materialZeilenHtml}
      ${zusatzPlattenZeilenHtml ? `<div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 4px;border-top:1px dashed var(--border);padding-top:10px">🪵 Zusätzliche Platten</div>
      <div id="nkZusatzPlattenList">${zusatzPlattenZeilenHtml}</div>` : ''}
      <div id="nkZusatzPlattenExtraList" style="margin-top:6px">
        ${nk.zusatzPlattenExtra.map(zusatzPlatteExtraZeile).join('')}
      </div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="nkzpx_add">+ Platte hinzufügen</button></div>
      <div class="checkline" style="border-top:1px dashed var(--border);padding-top:8px;margin-top:8px"><span>Kantenmaterial</span><span class="small mono" style="margin-left:auto">Soll: ${geplant.kantenLfm.toFixed(1)} lfm = ${fmtEUR(geplant.kantenKosten*(1+DB.settings.gewinnKanten/100))}</span><input type="number" step="0.1" min="0" id="nk_kanten" value="${nk.kantenLfmIst}" style="width:80px"><span class="small">lfm Ist = <b data-nk-kanten-kosten>${fmtEUR(nk.kantenLfmIst*DB.settings.kantenpreis)}</b></span></div>
      <div class="checkline"><label class="small" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="nk_chk_puVerleimung_top" ${puVerleimungIstAktiv?'checked':''}> PU-Verleimung</label><span class="small mono" style="margin-left:auto">alle ${DB.settings.puVerleimungSchwelleLfm} lfm = ${fmtEUR(DB.settings.puVerleimungPreis)}</span></div>
      <div class="checkline"><b class="small">→ Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto" data-nk-kanten-kosten-inkl>${fmtEUR(nk.kantenLfmIst*DB.settings.kantenpreis*(1+DB.settings.gewinnKanten/100))}</b></div>
      <div class="checkline"><span>Zusätzliche Materialien/Leistungen</span><span class="small mono" style="margin-left:auto">Soll: ${fmtEUR(geplant.zusatzKosten)}</span></div>
      <div id="nkZusatzpositionenList" style="margin-left:12px">
        ${(geplant.zusatzpositionen||[]).length ? (geplant.zusatzpositionen||[]).map(pos=>{
          const w = zusatzpositionIstWert(pos);
          const betrag = w.menge*w.preis;
          const zuschlagPos = pos.gewinnzuschlag??DB.settings.gewinnZusatz;
          return `<div class="checkline" style="flex-wrap:wrap;row-gap:4px">
            <span style="width:150px">${pos.name||'Position'}</span>
            <span class="small mono" style="margin-left:auto">Soll: ${pos.menge} × ${fmtEUR(pos.preis)} = ${fmtEUR(pos.menge*pos.preis*(1+zuschlagPos/100))}</span>
            <input type="number" step="0.01" min="0" data-nk-zpos-menge="${pos.key}" value="${w.menge}" style="width:55px" title="Menge">
            <span class="small">×</span>
            <input type="number" step="0.01" min="0" data-nk-zpos-preis="${pos.key}" value="${w.preis}" style="width:65px" title="Preis">
            <span class="small">€ = <b data-nk-zpos-kosten="${pos.key}">${fmtEUR(betrag)}</b> <span class="small">(+${zuschlagPos}% = <b data-nk-zpos-kosten-inkl="${pos.key}">${fmtEUR(betrag*(1+zuschlagPos/100))}</b>)</span></span>
          </div>`;
        }).join('') : `<div class="small">Keine zusätzlichen Positionen geplant.</div>`}
      </div>
      <div id="nkZusatzpositionenExtraList" style="margin-left:12px">
        ${nk.zusatzpositionenExtra.map((ex,i)=>{
          const betrag = (ex.menge||0)*(ex.preis||0);
          return `<div class="checkline" style="flex-wrap:wrap;row-gap:4px">
            <input type="text" style="width:150px" value="${ex.name||''}" data-nkzposx-name="${i}" placeholder="Bezeichnung">
            <span class="small mono" style="margin-left:auto">ungeplant, zusätzlich</span>
            <input type="number" step="0.01" min="0" data-nkzposx-menge="${i}" value="${ex.menge||0}" style="width:55px" title="Menge">
            <span class="small">×</span>
            <input type="number" step="0.01" min="0" data-nkzposx-preis="${i}" value="${ex.preis||0}" style="width:65px" title="Preis">
            <span class="small">€ = <b data-nkzposx-kosten="${i}">${fmtEUR(betrag)}</b> <span class="small">(+${DB.settings.gewinnZusatz}% = <b data-nkzposx-kosten-inkl="${i}">${fmtEUR(betrag*(1+DB.settings.gewinnZusatz/100))}</b>)</span></span>
            <button class="btn btn-ghost btn-sm" data-nkzposx-del="${i}">✕</button>
          </div>`;
        }).join('')}
      </div>
      <div class="btn-row" style="margin-left:12px;margin-top:4px"><button class="btn btn-ghost btn-sm" id="nkzposx_add">+ Position hinzufügen</button></div>
      <div class="checkline" style="border-top:1px dashed var(--border);padding-top:8px"><span>🚚 Lieferkosten</span><span class="small mono" style="margin-left:auto">Soll: ${fmtEUR(geplant.lieferkostenBetrag)}</span><input type="number" step="0.01" id="nk_lk" value="${nk.lieferkostenIst}" style="width:100px"><span class="small">€ Ist</span><button class="btn btn-ghost btn-sm" id="nk_lk_reset" title="Soll-Wert übernehmen" style="padding:2px 6px">↺</button></div>
      <div class="checkline"><span>🔩 Kleinmaterial</span><span class="small mono" style="margin-left:auto">Soll: ${fmtEUR(geplant.kleinmaterialBetrag)}</span><input type="number" step="0.01" id="nk_km" value="${nk.kleinmaterialIst}" style="width:100px"><span class="small">€ Ist</span><button class="btn btn-ghost btn-sm" id="nk_km_reset" title="Soll-Wert übernehmen" style="padding:2px 6px">↺</button></div>
      <div class="kv total"><span>Material gesamt</span><b>Soll ${fmtEUR(nurMaterialGesamtSoll)} · Ist ${fmtEUR(nurMaterialGesamtIst)} · Δ ${fmtEUR(nurMaterialGesamtIst-nurMaterialGesamtSoll)}</b></div>
    </div>

    <div class="card">
      <h3>🔩 Beschläge — Soll vs. Ist</h3>
      <div class="small" style="margin-bottom:8px">Menge je Position wie in der Kalkulation — Standard ist die geplante Menge, bei Abweichung einfach überschreiben.</div>
      <div id="nkBeschlagList">
        ${(()=>{
          const kategorien = {};
          beschlagGruppenSoll.forEach(g=>{ const kat=g.members[0].kategorie||'Sonstige'; if(!kategorien[kat]) kategorien[kat]=[]; kategorien[kat].push(g); });

              </div>`;
            }).join('')}`).join('');
        })()}

    <div class="card">
      <h3>🕐 Werkstatt-Verlauf — ${p.name}</h3>
      ${(()=>{
        const verlauf = (DB.werkstattImportHistorie||[]).filter(h=>h.projId===p.id);
        if(!verlauf.length) return `<div class="small">Noch keine Werkstatt-Übernahmen — jeder „📲 Werkstatt-Daten importieren"-Vorgang erscheint hier mit Datum, damit erkennbar ist, wann an diesem Auftrag gearbeitet wurde (z. B. bei mehreren Terminen übers Jahr verteilt).</div>`;
        // Nach Tag + Tätigkeit zusammenfassen, statt jeden einzelnen Werkstatt-Eintrag separat aufzulisten
        const gruppen = {};
        verlauf.forEach(h=>{
          const datum = new Date(h.importZeitpunkt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
          (h.schritte.length?h.schritte:[null]).forEach(s=>{
            const schrittName = s?.name || (h.material.length?'Material':'—');
            const key = datum+'|'+schrittName;
            if(!gruppen[key]) gruppen[key] = {datum, schritt:schrittName, std:0, material:[], mitarbeiterSet:new Set()};
            if(s) gruppen[key].std += s.std;
            h.material.forEach(m=>gruppen[key].material.push(m));
            h.mitarbeiterListe.forEach(mi=>gruppen[key].mitarbeiterSet.add(mi));
          });
        });
        const gruppenListe = Object.values(gruppen).sort((x,y)=>y.datum.localeCompare(x.datum));
        const tagesgesamt = {};
        gruppenListe.forEach(g=>{ tagesgesamt[g.datum] = (tagesgesamt[g.datum]||0) + g.std; });
        let letztesDatum = null;
        return gruppenListe.map(g=>{
          const tagWechsel = g.datum !== letztesDatum;
          letztesDatum = g.datum;
          return `${tagWechsel ? `<div class="checkline" style="border-top:1px dashed var(--border);padding-top:8px;margin-top:8px"><b class="small">${g.datum}</b>${tagesgesamt[g.datum]>0?`<span class="small mono" style="margin-left:auto;opacity:.75">Tagesgesamt: ${fmtStdMin(tagesgesamt[g.datum])}</span>`:''}</div>` : ''}

            <span style="width:80px;flex-shrink:0"></span>
            <div style="flex:1;min-width:180px">
              <div class="small">${g.schritt}${g.std>0?`: <b>${fmtStdMin(g.std)}</b>`:''}</div>
              ${g.material.length?g.material.map(m=>`<div class="small">📦 ${m.bezeichnung}: <b>${m.menge}</b></div>`).join(''):''}
              ${g.mitarbeiterSet.size?`<div class="small" style="color:var(--text-muted)">von ${[...g.mitarbeiterSet].join(', ')}</div>`:''}
            </div>
          </div>`;}).join('');
      })()}

  (function zeigeAutomatischenVerbesserungsvorschlag(){
    const host = el.querySelector('#nkVerbesserungsvorschlagHost');
    const {ergebnis, projekteAnzahl} = ermittleRichtwerteAusPraxis();
    const keys = Object.keys(ergebnis); // immer alle Positionen mit echter Datengrundlage vorschlagen, auch bei kleinen Abweichungen
    if(!keys.length){
      host.innerHTML = `<div class="card"><h3>💡 Automatischer Verbesserungsvorschlag</h3>
        <div class="small">Noch keine Datengrundlage — trage oben bei Zuschnitt, Kanten, Zusammenbau, CNC-Bearbeitung oder Baustellenmontage einen Ist-Wert &gt; 0 ein und speichere, dann erscheint hier automatisch ein Vorschlag.</div></div>`;
      return;
    }
    host.innerHTML = `
      <div class="card">
        <h3>💡 Automatischer Verbesserungsvorschlag</h3>
        <div class="small" style="margin-bottom:8px">Basierend auf ${projekteAnzahl} Auftrag/Aufträgen mit erfasster Ist-Zeit weichen diese Richtwerte spürbar vom aktuellen Wert ab. Häkchen entfernen bei Positionen, die nicht übernommen werden sollen:</div>
        <table><thead><tr><th></th><th>Position</th><th>Bisher</th><th>Vorschlag</th><th>Datenpunkte</th></tr></thead><tbody>
          ${keys.map(k=>{ const e=ergebnis[k]; return `<tr><td><input type="checkbox" data-vorschlag-key="${k}" checked></td><td>${e.label}</td><td class="mono">${e.alt}</td><td class="mono"><b>${e.neu}</b></td><td class="mono">${e.anzahl}</td></tr>`; }).join('')}
        </tbody></table>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn-ghost btn-sm" id="nk_vorschlag_alle">Alle</button>
          <button class="btn btn-ghost btn-sm" id="nk_vorschlag_keine">Keine</button>
          <button class="btn btn-primary btn-sm" id="nk_vorschlag_uebernehmen">Ausgewählte übernehmen</button>
        </div>
      </div>`;
    host.querySelector('#nk_vorschlag_alle').addEventListener('click', ()=>{
      host.querySelectorAll('[data-vorschlag-key]').forEach(cb=>cb.checked=true);
    });
    host.querySelector('#nk_vorschlag_keine').addEventListener('click', ()=>{
      host.querySelectorAll('[data-vorschlag-key]').forEach(cb=>cb.checked=false);
    });
    host.querySelector('#nk_vorschlag_uebernehmen').addEventListener('click', async ()=>{
      const ausgewaehlteKeys = [...host.querySelectorAll('[data-vorschlag-key]:checked')].map(cb=>cb.dataset.vorschlagKey);
      if(!ausgewaehlteKeys.length){ alert('Bitte mindestens eine Position auswählen.'); return; }
      ausgewaehlteKeys.forEach(k=>{ DB.settings[k] = ergebnis[k].neu; });
      await save('settings');
      alert(`${ausgewaehlteKeys.length} Richtwert(e) übernommen.`);
      renderMain();
    });
  })();

  function leseAktuellenNkStand(){
    const beschlagIstQty = {};
    el.querySelectorAll('[data-nk-besch]').forEach(inp=>{
      inp.dataset.nkBesch.split(',').forEach(id=>{ beschlagIstQty[id] = parseFloat(inp.value)||0; });
    });
    const beschlagPreisIst = {};
    el.querySelectorAll('[data-nk-besch-preis]').forEach(inp=>{
      const ersteId = inp.dataset.nkBeschPreis.split(',')[0];
      beschlagPreisIst[ersteId] = parseFloat(inp.value)||0;
    });
    const azIst = [];
    let azFelderGefunden = false;
    el.querySelectorAll('#nkAzList [data-nkaz-name]').forEach(inp=>{
      azFelderGefunden = true;
      const i = inp.dataset.nkazName;
      const stdInp = el.querySelector(`[data-nkaz-std="${i}"]`);
      const std2Inp = el.querySelector(`[data-nkaz-std2="${i}"]`);
      azIst.push({name: inp.value, std: parseFloat(stdInp?.value)||0, std2: parseFloat(std2Inp?.value)||0});
    });
    const azIstFinal = azFelderGefunden ? azIst : nk.azIst;
    const zusatzPlattenExtra = [];
    el.querySelectorAll('[data-nkzpx-name]').forEach(inp=>{
      const i = inp.dataset.nkzpxName;
      const matEl = el.querySelector(`[data-nkzpx-mat="${i}"]`);
      const m2El = el.querySelector(`[data-nkzpx-m2="${i}"]`);
      zusatzPlattenExtra.push({name: inp.value, materialId: matEl?.value||'', m2: parseFloat(m2El?.value)||0});
    });
    // Einheitliches Einlesen: jeder Schlüssel ist entweder Korpus/Front/Rückwand ODER eine Zusatzplatte —
    // dieselbe select/Eingabe-Zeile kann beides gemischt enthalten, wenn Materialien zusammengefasst wurden.
    const materialFelder = {korpusMaterialId:'', korpusM2Ist:0, frontMaterialId:'', frontM2Ist:0, rueckwandMaterialId:'', rueckwandM2Ist:0};
    const zusatzPlattenIst = {};
    const matKeyZuFeld = {korpusM2Ist:'korpusMaterialId', frontM2Ist:'frontMaterialId', rueckwandM2Ist:'rueckwandMaterialId'};
    el.querySelectorAll('[data-nk-mat]').forEach(sel=>{
      const keys = sel.dataset.nkMat.split(',');
      const m2El = el.querySelector(`[data-nk-m2="${sel.dataset.nkMat}"]`);
      const wert = parseFloat(m2El?.value)||0;
      keys.forEach((key,idx)=>{
        const m2 = idx===0 ? wert : 0; // bei zusammengefassten Feldern trägt nur das erste die Menge — sonst doppelte Zählung
        if(matKeyZuFeld[key]){ materialFelder[matKeyZuFeld[key]] = sel.value; materialFelder[key] = m2; }
        else { zusatzPlattenIst[key] = {materialId: sel.value, m2}; }
      });
    });
    const zusatzpositionenIst = {};
    el.querySelectorAll('[data-nk-zpos-menge]').forEach(inp=>{
      const key = inp.dataset.nkZposMenge;
      const preisEl = el.querySelector(`[data-nk-zpos-preis="${key}"]`);
      zusatzpositionenIst[key] = {menge: parseFloat(inp.value)||0, preis: parseFloat(preisEl?.value)||0};
    });
    const zusatzpositionenExtra = [];
    el.querySelectorAll('[data-nkzposx-name]').forEach(inp=>{
      const i = inp.dataset.nkzposxName;
      const mengeEl = el.querySelector(`[data-nkzposx-menge="${i}"]`);
      const preisEl = el.querySelector(`[data-nkzposx-preis="${i}"]`);
      zusatzpositionenExtra.push({name: inp.value, menge: parseFloat(mengeEl?.value)||0, preis: parseFloat(preisEl?.value)||0});
    });
    return {
      ...materialFelder,
      zusatzPlattenIst, zusatzPlattenExtra, zusatzpositionenIst, zusatzpositionenExtra,
      kantenLfmIst:parseFloat(document.getElementById('nk_kanten').value)||0,
      puVerleimungIst: document.getElementById('nk_chk_puVerleimung_top') ? document.getElementById('nk_chk_puVerleimung_top').checked : nk.puVerleimungIst,
      lieferkostenIst:parseFloat(document.getElementById('nk_lk').value)||0,
      kleinmaterialIst:parseFloat(document.getElementById('nk_km').value)||0,
      beschlagIstQty, beschlagPreisIst, azIst: azIstFinal,
      oberflaecheIst: document.getElementById('nk_ob') ? (parseFloat(document.getElementById('nk_ob').value)||0) : nk.oberflaecheIst,
      oberflaecheIst2: document.getElementById('nk_ob2') ? (parseFloat(document.getElementById('nk_ob2').value)||0) : nk.oberflaecheIst2,
      baustellenmontageIst: document.getElementById('nk_bm') ? (parseFloat(document.getElementById('nk_bm').value)||0) : nk.baustellenmontageIst,
      baustellenmontageIst2: document.getElementById('nk_bm2') ? (parseFloat(document.getElementById('nk_bm2').value)||0) : nk.baustellenmontageIst2,
      baustellenmontageKmIst:parseFloat(document.getElementById('nk_bm_km')?.value)||0,
      nurGesamtstundenModus: nk.nurGesamtstundenModus,
      gesamtstundenDirekt: document.getElementById('nk_gesamt_direkt') ? (parseFloat(document.getElementById('nk_gesamt_direkt').value)||0) : nk.gesamtstundenDirekt,
      zusatzarbeiten:parseFloat(document.getElementById('nk_zusatzarbeiten').value)||0,
      notiz:document.getElementById('nk_notiz').value.trim()};
  }
  function nkSpeichernImHintergrund(){
    // Wichtig: nicht nur die Seite prüfen, sondern auch, ob dieser (u.U. veraltete) Aufruf noch zum
    // aktuell angezeigten PROJEKT gehört — sonst könnten alte Verweise Werte ins falsche Projekt schreiben.
    if(current!=='nachkalkulation' || !document.body.contains(el) || p.id!==activeProjectId || meineGeneration!==nkRenderGeneration) return;
    const idx = DB.nachkalkulation.findIndex(x=>x.projId===p.id);
    const bisher = idx>=0 ? DB.nachkalkulation[idx] : null;
    const data = {projId:p.id, ...leseAktuellenNkStand()};
    if(bisher) Object.keys(bisher).forEach(k=>{ if(k.startsWith('_') && data[k]===undefined) data[k]=bisher[k]; }); // interne Felder (z.B. _cloudSchatten) nicht verlieren
    if(idx>=0) DB.nachkalkulation[idx]=data; else DB.nachkalkulation.push(data);
  }
  async function nkAutoSaveJetzt(){
    if(current!=='nachkalkulation' || !document.body.contains(el) || p.id!==activeProjectId || meineGeneration!==nkRenderGeneration) return;
    nkSpeichernImHintergrund();
    p._zuletztBearbeitet = new Date().toISOString();
    await save('projects');
    await save('nachkalkulation');
    if(!document.body.contains(el) || current!=='nachkalkulation' || p.id!==activeProjectId || meineGeneration!==nkRenderGeneration) return;
    // Zusätzlich zum reinen Speichern auch die Anzeige (Auswertung, Zusammenfassungen) aktualisieren —
    // so wirkt sich eine Eingabe auch dann zuverlässig aus, wenn aus irgendeinem Grund kein "change"/Blur-Event ausgelöst wurde
    // (z.B. bei manchen mobilen Tastaturen). Aktives Element merken, damit der Fokus danach wiederhergestellt werden kann.
    const aktivEl = document.activeElement;
    const aktivesId = aktivEl?.id;
    const aktivesDataAttr = aktivEl && aktivEl.attributes ? [...aktivEl.attributes].find(a=>a.name.startsWith('data-'))?.name : null;
    const aktivesDataWert = aktivesDataAttr ? aktivEl.getAttribute(aktivesDataAttr) : null;
    const cursorPos = aktivEl?.selectionStart;
    renderMain();
    const statusEl = document.getElementById('nkAutoSaveStatus');
    if(statusEl){ statusEl.textContent = '✓ automatisch gespeichert'; setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 2000); }
    let wiederherstellen = null;
    if(aktivesId) wiederherstellen = document.getElementById(aktivesId);
    else if(aktivesDataAttr) wiederherstellen = document.querySelector(`[${aktivesDataAttr}="${aktivesDataWert}"]`);
    if(wiederherstellen){
      wiederherstellen.focus();
      if(cursorPos!=null && wiederherstellen.setSelectionRange){ try{ wiederherstellen.setSelectionRange(cursorPos, cursorPos); }catch(e){} }
    }
  }
  window.__nkAutoSaveJetzt = nkAutoSaveJetzt;
  const stdMinAnzeigeZuordnung = {
    'nk_ob':'nk_ob_stdmin', 'nk_ob2':'nk_ob2_stdmin', 'nk_bm':'nk_bm_stdmin', 'nk_bm2':'nk_bm2_stdmin',
  };
  const istStundenFeld = t => t.dataset.nkazStd!==undefined || t.dataset.nkazStd2!==undefined || stdMinAnzeigeZuordnung[t.id]!==undefined;
  el.addEventListener('input', e=>{
    if(window.__nkAutoSaveTimer) clearTimeout(window.__nkAutoSaveTimer);
    window.__nkAutoSaveTimer = setTimeout(nkAutoSaveJetzt, 700);
    // Std./Min.-Live-Anzeige direkt bei jedem Tastendruck aktualisieren, unabhängig vom Autosave-Timer
    if(e.target.dataset.nkazStd!==undefined){
      const anzeige = el.querySelector(`[data-nkaz-stdmin="${e.target.dataset.nkazStd}"]`);
      if(anzeige) anzeige.textContent = `= ${fmtStdMin(parseFloat(e.target.value)||0)}`;
    } else if(e.target.dataset.nkazStd2!==undefined){
      const anzeige = el.querySelector(`[data-nkaz-stdmin2="${e.target.dataset.nkazStd2}"]`);
      if(anzeige) anzeige.textContent = `= ${fmtStdMin(parseFloat(e.target.value)||0)}`;
    } else if(stdMinAnzeigeZuordnung[e.target.id]){
      const anzeige = document.getElementById(stdMinAnzeigeZuordnung[e.target.id]);
      if(anzeige) anzeige.textContent = `= ${fmtStdMin(parseFloat(e.target.value)||0)}`;
    }
  });
  el.addEventListener('change', e=>{
    // Stunden-Eingaben werden beim Verlassen des Feldes automatisch auf die nächste volle
    // Viertelstunde AUFgerundet (nie abgerundet) — z.B. 3.1 → 3.25, 3.26 → 3.5.
    if(istStundenFeld(e.target)){
      const wert = parseFloat(e.target.value)||0;
      const aufgerundet = Math.ceil(wert*4)/4;
      if(aufgerundet!==wert){
        e.target.value = aufgerundet;
        e.target.dispatchEvent(new Event('input', {bubbles:false})); // nur die Live-Anzeige aktualisieren, kein zweites bubbling nötig
        if(e.target.dataset.nkazStd!==undefined){
          const anzeige = el.querySelector(`[data-nkaz-stdmin="${e.target.dataset.nkazStd}"]`);
          if(anzeige) anzeige.textContent = `= ${fmtStdMin(aufgerundet)}`;
        } else if(e.target.dataset.nkazStd2!==undefined){
          const anzeige = el.querySelector(`[data-nkaz-stdmin2="${e.target.dataset.nkazStd2}"]`);
          if(anzeige) anzeige.textContent = `= ${fmtStdMin(aufgerundet)}`;
        } else if(stdMinAnzeigeZuordnung[e.target.id]){
          const anzeige = document.getElementById(stdMinAnzeigeZuordnung[e.target.id]);
          if(anzeige) anzeige.textContent = `= ${fmtStdMin(aufgerundet)}`;
        }
      }
    }
    // Sobald ein Feld verlassen wird (nicht bei jedem Tastendruck): komplett neu berechnen,
    // damit die Auswertungs-Karte (Gesamtpreis VK/NK) immer den aktuellen Stand zeigt.
    // Wichtig: nur ausführen, wenn dieser (u.U. veraltete) Listener noch zum aktuell angezeigten Projekt gehört.
    // #nk_nur_gesamt hat einen eigenen dedizierten Handler, der bereits komplett neu rendert — hier ausschließen,
    // sonst rendert die Seite doppelt hintereinander und ein Handler arbeitet auf veraltetem Stand.
    if(e.target.matches('input, select') && e.target.id!=='nk_nur_gesamt' && e.target.id!=='nkProjSelect' && current==='nachkalkulation' && document.body.contains(el) && p.id===activeProjectId && meineGeneration===nkRenderGeneration){
      if(window.__nkAutoSaveTimer){ clearTimeout(window.__nkAutoSaveTimer); window.__nkAutoSaveTimer = null; }
      nkSpeichernImHintergrund();
      save('nachkalkulation');
      renderMain();
    }
  });
  el.addEventListener('blur', e=>{
    if(e.target.matches('[data-nkaz-std], [data-nkaz-std2], #nk_ob, #nk_ob2, #nk_bm, #nk_bm2')){
      e.target.value = rundeViertelstundeAuf(parseFloat(e.target.value)||0);
    }
  }, true);
  function aktualisiereGesamtstunden(){
    const gesamtEl = el.querySelector('#nkaz_gesamt');
    if(!gesamtEl || document.activeElement===gesamtEl) return;
    const stdSumme = Array.from(el.querySelectorAll('#nkAzList [data-nkaz-std], #nkAzList [data-nkaz-std2]')).reduce((s,i)=>s+(parseFloat(i.value)||0),0);
    const obWert = (parseFloat(el.querySelector('#nk_ob')?.value)||0) + (parseFloat(el.querySelector('#nk_ob2')?.value)||0);
    const bmWert = (parseFloat(el.querySelector('#nk_bm')?.value)||0) + (parseFloat(el.querySelector('#nk_bm2')?.value)||0);
    gesamtEl.value = rundeViertelstunde(stdSumme+obWert+bmWert);
  }
  el.querySelectorAll('#nkAzList [data-nkaz-std], #nkAzList [data-nkaz-std2], #nk_ob, #nk_ob2, #nk_bm, #nk_bm2').forEach(inp=>inp.addEventListener('input', aktualisiereGesamtstunden));
  el.querySelector('#nkaz_add')?.addEventListener('click',()=>{
    nkSpeichernImHintergrund();
    const data = DB.nachkalkulation.find(x=>x.projId===p.id);
    data.azIst.push({name:'Neue Position', std:0, std2:0});
    renderMain();
  });
  el.querySelectorAll('[data-nkaz-sync-std]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const i = btn.dataset.nkazSyncStd;
    const row = nk.azIst[i];
    const wert = nk._cloudSchatten?.az?.[row.name]?.std;
    if(wert===undefined) return;
    el.querySelector(`[data-nkaz-std="${i}"]`).value = wert.toFixed(2);
    nkSpeichernImHintergrund(); await save('nachkalkulation'); renderMain();
  }));
  el.querySelectorAll('[data-nkaz-sync-std2]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const i = btn.dataset.nkazSyncStd2;
    const row = nk.azIst[i];
    const wert = nk._cloudSchatten?.az?.[row.name]?.std2;
    if(wert===undefined) return;
    el.querySelector(`[data-nkaz-std2="${i}"]`).value = wert.toFixed(2);
    nkSpeichernImHintergrund(); await save('nachkalkulation'); renderMain();
  }));
  el.querySelector('#nk_ob_sync')?.addEventListener('click', async ()=>{
    el.querySelector('#nk_ob').value = nk._cloudSchatten.ob.std.toFixed(2);
    nkSpeichernImHintergrund(); await save('nachkalkulation'); renderMain();
  });
  el.querySelector('#nk_ob2_sync')?.addEventListener('click', async ()=>{
    el.querySelector('#nk_ob2').value = nk._cloudSchatten.ob.std2.toFixed(2);
    nkSpeichernImHintergrund(); await save('nachkalkulation'); renderMain();
  });
  el.querySelector('#nk_bm_sync')?.addEventListener('click', async ()=>{
    el.querySelector('#nk_bm').value = nk._cloudSchatten.bm.std.toFixed(2);
    nkSpeichernImHintergrund(); await save('nachkalkulation'); renderMain();
  });
  el.querySelector('#nk_bm2_sync')?.addEventListener('click', async ()=>{
    el.querySelector('#nk_bm2').value = nk._cloudSchatten.bm.std2.toFixed(2);
    nkSpeichernImHintergrund(); await save('nachkalkulation'); renderMain();
  });
  el.querySelector('#nk_bm_km_sync')?.addEventListener('click', async ()=>{
    el.querySelector('#nk_bm_km').value = nk._cloudSchatten.bm.km;
    nkSpeichernImHintergrund(); await save('nachkalkulation'); renderMain();
  });
  el.querySelector('#nkaz_gesamt')?.addEventListener('input',e=>{
    const neuerGesamt = parseFloat(e.target.value)||0;
    const stdInputs = Array.from(el.querySelectorAll('#nkAzList [data-nkaz-std], #nkAzList [data-nkaz-std2]'));
    const obInput = el.querySelector('#nk_ob');
    const ob2Input = el.querySelector('#nk_ob2');
    const bmInput = el.querySelector('#nk_bm');
    const bm2Input = el.querySelector('#nk_bm2');
    const alleInputs = [...stdInputs, obInput, ob2Input, bmInput, bm2Input];
    const werte = alleInputs.map(i=>parseFloat(i.value)||0);
    const neu = verteileViertelstunden(werte, neuerGesamt);
    alleInputs.forEach((i,idx)=>{ i.value = neu[idx]; aktualisiereStdMinAnzeige(i); });
  });
  el.querySelector('#nk_gesamt_direkt')?.addEventListener('input',e=>{
    nkSpeichernImHintergrund();
    const data = DB.nachkalkulation.find(x=>x.projId===p.id);
    data.gesamtstundenDirekt = parseFloat(e.target.value)||0;
  });
  el.querySelector('#nk_nur_gesamt')?.addEventListener('change',e=>{
    nkSpeichernImHintergrund();
    const data = DB.nachkalkulation.find(x=>x.projId===p.id);
    data.nurGesamtstundenModus = e.target.checked;
    if(e.target.checked && data.gesamtstundenDirekt===null){
      // Beim ersten Umschalten den aktuell aus den Positionen berechneten Wert übernehmen, statt bei 0 anzufangen
      data.gesamtstundenDirekt = nk.azIst.reduce((s,r)=>s+(r.std||0),0) + (parseFloat(nk.oberflaecheIst)||0) + (parseFloat(nk.baustellenmontageIst)||0);
    }
    renderMain();
  });
  el.querySelectorAll('[data-nkaz-del]').forEach(b=>b.addEventListener('click',e=>{
    nkSpeichernImHintergrund();
    const data = DB.nachkalkulation.find(x=>x.projId===p.id);
    data.azIst.splice(+e.target.dataset.nkazDel,1);
    renderMain();
  }));
  el.querySelectorAll('[data-foto-gross]').forEach(t=>t.querySelector('img').addEventListener('click',()=>{
    const foto = DB.fotos.find(f=>f.id===t.dataset.fotoGross);
    if(!foto) return;
    const box = document.createElement('div');
    box.className = 'fotoLightbox';
    box.innerHTML = `<img src="${foto.dataUrl}">`;
    box.addEventListener('click', ()=>box.remove());
    document.body.appendChild(box);
  }));
  el.querySelectorAll('[data-foto-del]').forEach(b=>b.addEventListener('click', async e=>{
    e.stopPropagation();
    if(!confirm('Dieses Foto löschen?')) return;
    DB.fotos = DB.fotos.filter(f=>f.id!==b.dataset.fotoDel);
    await save('fotos');
    renderMain();
  }));
  el.querySelector('#nk_save').addEventListener('click', async ()=>{
    const idx = DB.nachkalkulation.findIndex(x=>x.projId===p.id);
    const bisher = idx>=0 ? DB.nachkalkulation[idx] : null;
    const data = {projId:p.id, ...leseAktuellenNkStand()};
    if(bisher) Object.keys(bisher).forEach(k=>{ if(k.startsWith('_') && data[k]===undefined) data[k]=bisher[k]; });
    if(idx>=0) DB.nachkalkulation[idx]=data; else DB.nachkalkulation.push(data);
    await save('nachkalkulation'); renderMain();
  });
}

      host.innerHTML = `<div class="hint warn">💡 Noch keine Grundlage vorhanden. Dafür braucht es mindestens ein Projekt mit gespeicherter Kalkulation UND unter „Arbeitszeit“ erfasster Ist-Zeit (Schritte: Zuschnitt, Kanten, CNC-Bearbeitung, Montage, Einbau).</div>`;
      return;
    }
    host.innerHTML = `
      <div class="hint ok">📊 Auswertung aus ${projekteAnzahl} Projekt(en):</div>
      <table><thead><tr><th>Position</th><th>Bisher</th><th>Neu (aus Praxis)</th><th>Datenpunkte</th></tr></thead><tbody>
        ${keys.map(k=>{ const e=ergebnis[k]; return `<tr><td>${e.label}</td><td class="mono">${e.alt}</td><td class="mono"><b>${e.neu}</b></td><td class="mono">${e.anzahl}</td></tr>`; }).join('')}
      </tbody></table>
      <div class="small" style="margin-top:8px">Keine Datengrundlage für: AV (pauschal), Zuschnitt je Bauteil, Baustellenmontage-Pauschale — diese lassen sich aus Ist-Zeiten nicht eindeutig herausrechnen und bleiben unverändert.</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="s_lernen_uebernehmen">Übernehmen</button></div>`;
    document.getElementById('s_lernen_uebernehmen').addEventListener('click', async ()=>{
      keys.forEach(k=>{ DB.settings[k] = ergebnis[k].neu; });
      await save('settings');
      alert('Richtwerte aus echten Aufträgen übernommen.');
      renderMain();
    });
  });
  const AUTOHAKEN_LABEL = {scharnier:'Topfscharnier-Set', griff:'Möbelgriff', auszug:'Vollauszug Set', bodentraeger:'Bodenträger', sockel:'Sockelfuß + Clip', kleiderstange:'Kleiderstange', kleiderstangenhalter:'Kleiderstangenhalter'};
  document.getElementById('autoHakenHost').innerHTML = Object.keys(AUTOHAKEN_LABEL).map(schluessel=>`
    <div class="checkline">
      <input type="checkbox" class="autohaken-cb" data-ah="${schluessel}" ${s.autoHaken?.[schluessel]!==false?'checked':''}>
      <span>${AUTOHAKEN_LABEL[schluessel]}</span>
    </div>`).join('');
  document.getElementById('s_save_autohaken').addEventListener('click', async ()=>{
    const neu = {};
    document.querySelectorAll('.autohaken-cb').forEach(cb=>{ neu[cb.dataset.ah] = cb.checked; });
    DB.settings.autoHaken = neu;
    await save('settings');
    alert('Einstellung für automatische Häkchen gespeichert.');
  });
  el.querySelector('#s_save').addEventListener('click', async ()=>{
    DB.settings = {
      ...DB.settings,
      stundensatz:parseFloat(document.getElementById('s_stundensatz').value)||0,
      stundensatzBaustelle:parseFloat(document.getElementById('s_stundensatzBaustelle').value)||0,
      mitarbeiter1Name:document.getElementById('s_ma1name').value.trim()||'Mitarbeiter 1',
      mitarbeiter1Satz:parseFloat(document.getElementById('s_ma1satz').value)||0,
      mitarbeiter2Name:document.getElementById('s_ma2name').value.trim()||'Mitarbeiter 2',
      mitarbeiter2Satz:parseFloat(document.getElementById('s_ma2satz').value)||0,
      kantenpreis:parseFloat(document.getElementById('s_kantenpreis').value)||0,
      puVerleimungSchwelleLfm:parseFloat(document.getElementById('s_puSchwelle').value)||130,
      puVerleimungPreis:parseFloat(document.getElementById('s_puPreis').value)||0,
      kmPauschale:parseFloat(document.getElementById('s_kmPauschale').value)||0,
      zuschlagKorpus:parseFloat(document.getElementById('s_zuschlagKorpus').value)||0,
      zuschlagFront:parseFloat(document.getElementById('s_zuschlagFront').value)||0,
      zuschlagRueckwand:parseFloat(document.getElementById('s_zuschlagRueckwand').value)||0,
      zuschlagZusatzplatten:parseFloat(document.getElementById('s_zuschlagZusatzplatten').value)||0,
      gewinnMaterial:parseFloat(document.getElementById('s_gewinnMaterial').value)||0,
      gewinnKanten:parseFloat(document.getElementById('s_gewinnKanten').value)||0,
      gewinnBeschlaege:parseFloat(document.getElementById('s_gewinnBeschlaege').value)||0,
      gewinnZusatz:parseFloat(document.getElementById('s_gewinnZusatz').value)||0,
      standardLieferkosten:parseFloat(document.getElementById('s_standardLieferkosten').value)||0,
      standardKleinmaterial:parseFloat(document.getElementById('s_standardKleinmaterial').value)||0,
    };
    await save('settings'); alert('Einstellungen gespeichert.'); renderMain();
  });
  el.querySelector('#s_export').addEventListener('click', exportSicherung);
  el.querySelector('#s_import').addEventListener('change',e=>{
    importSicherungAusDatei(e.target.files[0]);
  });
}

/* ---------------------------- INIT ---------------------------- */
(async function init(){
  document.addEventListener('wheel', e=>{
    if(e.target && e.target.tagName==='INPUT' && e.target.type==='number'){ e.preventDefault(); }
  }, {passive:false});
  function flushAusstehendeSpeicherung(){
    if(window.__autoSaveTimer && window.__autoSaveJetzt){
      clearTimeout(window.__autoSaveTimer); window.__autoSaveTimer = null;
      window.__autoSaveJetzt();
    }
    if(window.__nkAutoSaveTimer && window.__nkAutoSaveJetzt){
      clearTimeout(window.__nkAutoSaveTimer); window.__nkAutoSaveTimer = null;
      window.__nkAutoSaveJetzt();
    }
  }
  window.addEventListener('beforeunload', flushAusstehendeSpeicherung);
  // Zusätzliches, verlässlicheres Sicherheitsnetz: "visibilitychange" feuert schon beim Wechsel/Minimieren/Schließen
  // des Tabs und lässt asynchronen Speicherungen (IndexedDB) mehr Zeit als "beforeunload", das oft zu früh abbricht.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden') flushAusstehendeSpeicherung();
  });
  document.getElementById('main').innerHTML = '<div class="small" style="padding:30px">Lade …</div>';
  // Tab-Taste soll nur zwischen echten Eingabefeldern springen (Text/Zahl/Select/Textarea),
  // Buttons und Checkboxen werden aus der Tab-Reihenfolge genommen — schnelleres Ausfüllen.
  function ausTabreihenfolgeNehmen(root){
    root.querySelectorAll('button, input[type="checkbox"]').forEach(elx=>{
      if(elx.tabIndex!==-1) elx.tabIndex = -1;
    });
  }
  const tabBeobachter = new MutationObserver(muts=>{
    for(const m of muts){ if(m.addedNodes.length){ ausTabreihenfolgeNehmen(document.body); break; } }
  });
  tabBeobachter.observe(document.body, {childList:true, subtree:true});
  await loadAll();
  cloudListenerStarten();
  DB.projects.filter(p=>p.status!=='abgeschlossen').forEach(p=>cloudSyncProjekt(p).then(()=>cloudNeuBerechneStundenFuerProjekt(p.id)).catch(err=>console.warn('Initialer Cloud-Sync fehlgeschlagen:', err)));
  cloudSyncKatalogDebounced();
  cloudSyncZeitkontoDebounced();
  cloudDatenJetztAbrufen().then(({neu})=>{ if(neu>0) renderMain(); }).catch(err=>console.warn('Initialer Cloud-Abruf fehlgeschlagen:', err));
  bereinigeVerwaisteCloudAuftraege().catch(()=>{});
  // Zusätzlich zum Echtzeit-Listener regelmäßig automatisch nachfragen — falls der Listener aus irgendeinem
  // Grund mal nichts meldet (z.B. kurzer Verbindungsaussetzer), holt das hier zuverlässig alles nach, ganz ohne Klick.
  setInterval(()=>{
    cloudDatenJetztAbrufen().then(({neu})=>{ if(neu>0) renderMain(); }).catch(()=>{});
  }, 30000);
  const hinweis = document.getElementById('speicherHinweis');
  if(hinweis){
    hinweis.innerHTML = HAT_CHAT_STORAGE
      ? 'Gespeichert im Chat<br>(Claude-Speicher)'
      : 'Lokale Datenbank (IndexedDB)<br>Läuft eigenständig in diesem Browser';
  }
  renderNav();
  renderMain();
  sicherungsOrdnerHandle = await ladeSicherungsOrdnerHandle();
  const ordnerBtn = document.getElementById('globalOrdnerBtn');
  if(!HAT_ORDNERZUGRIFF || HAT_CHAT_STORAGE){ ordnerBtn.style.display = 'none'; }
  else if(sicherungsOrdnerHandle){ ordnerBtn.textContent = `📁 Ordner: ${sicherungsOrdnerHandle.name}`; }
  ordnerBtn.addEventListener('click', waehleSicherungsOrdner);

  document.getElementById('globalBackupBtn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const alterText = btn.textContent;
    const ergebnis = await exportSicherung();
    btn.textContent = ergebnis.ort==='ordner' ? '✓ im Ordner gespeichert' : '✓ heruntergeladen';
    setTimeout(()=>{ btn.textContent = alterText; }, 1800);
  });
  document.getElementById('globalCloudBackupBtn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const alterText = btn.textContent;
    if(!cloudVerbunden){ alert('⚠️ Cloud-Sync ist gerade nicht verbunden.'); return; }
    btn.textContent = '⏳ lädt …';
    try{
      await cloudDatenSichern();
      btn.textContent = '✓ heruntergeladen';
    }catch(err){
      alert('⚠️ Cloud-Sicherung fehlgeschlagen: ' + (err.message||err));
      btn.textContent = alterText;
    }
    setTimeout(()=>{ btn.textContent = alterText; }, 1800);
  });
  document.getElementById('globalCloudRestoreBtn').addEventListener('click', ()=>{
    document.getElementById('globalCloudRestoreInput').click();
  });
  document.getElementById('globalCloudRestoreInput').addEventListener('change', async e=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(!confirm('Zeiten/Material aus dieser Sicherungsdatei zurück in die Cloud schreiben? Bereits vorhandene, neuere Einträge werden dabei nicht verändert oder dupliziert.')) return;
    await cloudDatenAusSicherungWiederherstellen(file);
  });
  document.getElementById('globalRestoreBtn').addEventListener('click', async ()=>{
    if(HAT_ORDNERZUGRIFF && window.showOpenFilePicker){
      try{
        const [fileHandle] = await window.showOpenFilePicker({startIn:'downloads', types:[{description:'Sicherung', accept:{'application/json':['.json']}}]});
        const file = await fileHandle.getFile();
        await importSicherungAusDatei(file);
        return;
      }catch(e){ /* Nutzer hat abgebrochen — Fallback unten */ }
    }
    document.getElementById('globalRestoreInput').click();
  });
  document.getElementById('globalRestoreInput').addEventListener('change',e=>{
    importSicherungAusDatei(e.target.files[0]);
  });
})();
</script>
</body>
