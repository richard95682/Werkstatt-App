        <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-matup="${i}" style="padding:2px 6px" ${i===0?'disabled':''}>↑</button><button class="btn btn-ghost btn-sm" data-matdown="${i}" style="padding:2px 6px" ${i===DB.materials.length-1?'disabled':''}>↓</button></td>

        <td class="mono">${fmtEUR(m.preis)}</td><td class="mono">${m.m2ProStueck?fmtM2(m.m2ProStueck):'—'}</td><td>${m.lieferant||'—'}</td><td class="mono">${m.artnr||'—'}</td><td>${bereichAnzeige(m.bereich)}</td>
        <td><button class="btn btn-ghost btn-sm" data-editmat="${m.id}">✎</button> <button class="btn btn-ghost btn-sm" data-copymat="${m.id}" title="Material duplizieren">⎘</button> <button class="btn btn-danger btn-sm" data-delmat="${m.id}">✕</button></td>
      </tr>`).join('')}</tbody></table>` : emptyState('🪵','Keine Materialien','Lege dein erstes Material an.')}
    </div>
    <div id="matForm"></div>`;
  el.querySelector('#addMat').addEventListener('click',()=>matForm());
  el.querySelectorAll('[data-editmat]').forEach(b=>b.addEventListener('click',()=>matForm(b.dataset.editmat)));
  el.querySelectorAll('[data-copymat]').forEach(b=>b.addEventListener('click', async ()=>{
    const original = DB.materials.find(m=>m.id===b.dataset.copymat);
    if(!original) return;
    const kopie = {...original, id:uid(), name:original.name+' (Kopie)'};
    const idx = DB.materials.findIndex(m=>m.id===original.id);
    DB.materials.splice(idx+1, 0, kopie);
    await save('materials');
    renderMain();
    setTimeout(()=>matForm(kopie.id), 50);
  }));
  el.querySelectorAll('[data-delmat]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Material löschen?')){ DB.materials=DB.materials.filter(m=>m.id!==b.dataset.delmat); await save('materials'); renderMain(); }
  }));
  el.querySelectorAll('[data-matup]').forEach(b=>b.addEventListener('click', async ()=>{
    const i = +b.dataset.matup;
    if(i>0){ [DB.materials[i-1],DB.materials[i]] = [DB.materials[i],DB.materials[i-1]]; await save('materials'); renderMain(); }
  }));
  el.querySelectorAll('[data-matdown]').forEach(b=>b.addEventListener('click', async ()=>{
    const i = +b.dataset.matdown;
    if(i<DB.materials.length-1){ [DB.materials[i+1],DB.materials[i]] = [DB.materials[i],DB.materials[i+1]]; await save('materials'); renderMain(); }
  }));
  function matForm(id){
    const m = id? DB.materials.find(x=>x.id===id): null;
    const aktuelleBereiche = m ? bereichAlsArray(m.bereich) : [];
    const host = document.getElementById('matForm');
    host.innerHTML = `<div class="card"><h3>${m?'Material bearbeiten':'Neues Material'}</h3>
      <div class="grid cols-4">
        <div class="field"><label>Name</label><input id="mf_name" value="${m?.name||''}"></div>
        <div class="field"><label>Hersteller</label><input id="mf_hersteller" value="${m?.hersteller||''}"></div>
        <div class="field"><label>Dekor</label><input id="mf_dekor" value="${m?.dekor||''}"></div>
        <div class="field"><label>Stärke (mm)</label><input type="number" id="mf_staerke" value="${m?.staerke||19}"></div>
        <div class="field"><label>Preis/m² (€)</label><input type="number" step="0.01" id="mf_preis" value="${m?.preis||0}"></div>
        <div class="field"><label>m² pro Stück (Platte)</label><input type="number" step="0.001" id="mf_m2ProStueck" value="${m?.m2ProStueck||''}" placeholder="z. B. 5,58">
          <div class="small" style="margin-top:3px;font-weight:400;text-transform:none">Standardgröße einer ganzen Platte — ermöglicht in der Werkstatt-App die Eingabe in Stück statt m².</div>
        </div>
        <div class="field"><label>Lieferant</label><input id="mf_lieferant" value="${m?.lieferant||''}"></div>
        <div class="field"><label>Artikelnummer</label><input id="mf_artnr" value="${m?.artnr||''}"></div>
        <div class="field">
          <label>Bereich (mehrere möglich)</label>
          <div style="display:flex;gap:12px;flex-wrap:wrap;padding-top:6px">
            ${['Korpus','Front','Rückwand','Sondermaterial'].map(b=>`
              <label style="display:flex;align-items:center;gap:5px;font-weight:400;text-transform:none;font-size:13px;color:var(--text)">
                <input type="checkbox" class="mf_bereich_cb" value="${b}" style="width:auto" ${aktuelleBereiche.includes(b)?'checked':''}> ${b}
              </label>`).join('')}
          </div>
        </div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="mf_save">Speichern</button><button class="btn btn-ghost" id="mf_cancel">Abbrechen</button></div>
    </div>`;
    host.scrollIntoView({behavior:'smooth', block:'center'});
    document.getElementById('mf_cancel').addEventListener('click',()=>renderMain());
    document.getElementById('mf_save').addEventListener('click', async ()=>{
      const bereich = Array.from(host.querySelectorAll('.mf_bereich_cb:checked')).map(cb=>cb.value);
      if(!bereich.length){ alert('Bitte mindestens einen Bereich auswählen (Korpus, Front, Rückwand oder Sondermaterial) — sonst landet das Material in keiner Auswahlliste.'); return; }
      const data = {name:g('mf_name'),hersteller:g('mf_hersteller'),dekor:g('mf_dekor'),staerke:parseFloat(g('mf_staerke'))||0,
        preis:parseFloat(g('mf_preis'))||0,m2ProStueck:parseFloat(g('mf_m2ProStueck'))||0,lieferant:g('mf_lieferant'),artnr:g('mf_artnr'),bereich};
      if(m) Object.assign(m,data); else DB.materials.push({id:uid(),...data});
      await save('materials'); renderMain();
    });
  }
  function g(id){ return document.getElementById(id).value.trim(); }
}

/* ---------------------------- BESCHLÄGE ---------------------------- */
function renderBeschlaege(el){
  if(!DB.settings.beschlagKategorien) DB.settings.beschlagKategorien = [...new Set(DB.beschlaege.map(b=>b.kategorie))];
  // Falls irgendwo (z.B. Altdaten) eine Kategorie in Benutzung ist, die noch nicht in der Liste steht, automatisch ergänzen
  const genutzt = [...new Set(DB.beschlaege.map(b=>b.kategorie))];
  genutzt.forEach(c=>{ if(!DB.settings.beschlagKategorien.includes(c)) DB.settings.beschlagKategorien.push(c); });
  const cats = DB.settings.beschlagKategorien;
  el.innerHTML = `
    <div class="pagehead"><div><h1>Beschläge</h1><p>Türen, Fronten, Schubladen, Schränke, Korpus und Sockel.</p></div></div>
    <div class="card" style="padding:12px 14px;max-width:480px">
      <h3 style="font-size:13px;margin-bottom:6px">🏷️ Kategorien verwalten</h3>
      <div class="checkline" style="flex-wrap:wrap;gap:6px">
        ${cats.map(c=>`<span class="chip" style="display:inline-flex;align-items:center;gap:4px">${catIcon(c)} ${c}${DB.beschlaege.some(b=>b.kategorie===c)?'':` <button data-delkat="${c}" style="border:none;background:none;cursor:pointer;color:inherit;font-size:11px" title="Leere Kategorie entfernen">✕</button>`}</span>`).join('')}
      </div>
      <div class="checkline" style="margin-top:8px">
        <input type="text" id="neueKategorie" placeholder="Neue Kategorie, z. B. Elektro" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="addKategorie">+ Kategorie anlegen</button>
      </div>
      <div class="btn-row" style="margin-top:10px;border-top:1px dashed var(--border);padding-top:10px">
        <button class="btn btn-primary" id="addBeschlag">+ Beschlag</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">
    ${cats.filter(cat=>DB.beschlaege.some(b=>b.kategorie===cat)).map(cat=>`<div class="card" style="padding:12px 14px;margin-bottom:0">
      <h3 style="font-size:13px;margin-bottom:6px">${catIcon(cat)} ${cat}</h3>
      ${DB.beschlaege.filter(b=>b.kategorie===cat).map(b=>`
        <div class="checkline" style="padding:4px 0">
          <span style="font-size:12.5px">${b.name} <span class="small">(${b.einheit})</span></span>
          <span class="mono" style="margin-left:auto;font-size:12.5px">${fmtEUR(b.preis)}</span>
          <button class="btn btn-ghost btn-sm" data-editb="${b.id}" style="padding:2px 6px">✎</button>
          <button class="btn btn-danger btn-sm" data-delb="${b.id}" style="padding:2px 6px">✕</button>
        </div>`).join('')}
    </div>`).join('')}
    </div>
    <div id="bForm"></div>`;
  el.querySelector('#addBeschlag').addEventListener('click',()=>bForm());
  el.querySelectorAll('[data-editb]').forEach(b=>b.addEventListener('click',()=>bForm(b.dataset.editb)));
  el.querySelectorAll('[data-delb]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Beschlag löschen?')){ DB.beschlaege=DB.beschlaege.filter(x=>x.id!==b.dataset.delb); await save('beschlaege'); renderMain(); }
  }));
  el.querySelector('#addKategorie').addEventListener('click', async ()=>{
    const name = el.querySelector('#neueKategorie').value.trim();
    if(!name){ return; }
    if(DB.settings.beschlagKategorien.includes(name)){ alert('Diese Kategorie gibt es schon.'); return; }
    DB.settings.beschlagKategorien.push(name);
    await save('settings');
    renderMain();
  });
  el.querySelectorAll('[data-delkat]').forEach(b=>b.addEventListener('click', async ()=>{
    const name = b.dataset.delkat;
    DB.settings.beschlagKategorien = DB.settings.beschlagKategorien.filter(c=>c!==name);
    await save('settings');
    renderMain();
  }));
  function catIcon(c){ return {Türen:'🚪',Fronten:'🎚️',Schubladen:'🗄️',Schränke:'👕',Verbinder:'🔩',Korpus:'📦',Sockel:'🦶',Sonstiges:'🔧'}[c]||'🏷️'; }
  function bForm(id){
    const b = id? DB.beschlaege.find(x=>x.id===id):null;
    const host = document.getElementById('bForm');
    host.innerHTML = `<div class="card"><h3>${b?'Beschlag bearbeiten':'Neuer Beschlag'}</h3>
      <div class="grid cols-4">
        <div class="field"><label>Kategorie</label><select id="bf_kat">${DB.settings.beschlagKategorien.map(c=>`<option ${b?.kategorie===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Name</label><input id="bf_name" value="${b?.name||''}"></div>
        <div class="field"><label>Einheit</label><input id="bf_einheit" value="${b?.einheit||'Stk'}"></div>
        <div class="field"><label>Preis (€)</label><input type="number" step="0.01" id="bf_preis" value="${b?.preis||0}"></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="bf_save">Speichern</button><button class="btn btn-ghost" id="bf_cancel">Abbrechen</button></div></div>`;
    host.scrollIntoView({behavior:'smooth', block:'center'});
    document.getElementById('bf_cancel').addEventListener('click',()=>renderMain());
    document.getElementById('bf_save').addEventListener('click', async ()=>{
      const data={kategorie:document.getElementById('bf_kat').value,name:document.getElementById('bf_name').value.trim(),
        einheit:document.getElementById('bf_einheit').value.trim(),preis:parseFloat(document.getElementById('bf_preis').value)||0};
      if(b) Object.assign(b,data); else DB.beschlaege.push({id:uid(),...data});
      await save('beschlaege'); renderMain();
    });
  }
}

/* ---------------------------- REGELN ---------------------------- */
let regelnTab = 'sockel';
function renderRegeln(el){
  const sSock = sockelRegelWerte();
  const sSch = scharnierRegelWerte();
  const sVerb = verbinderRegelWerte();
  const sBod = bodentraegerJeFachboden();
  const TABS = [
    {id:'sockel', label:'🦶 Sockelfüße'},
    {id:'scharnier', label:'🔗 Scharniere'},
    {id:'verbinder', label:'🔩 Verbinder'},
    {id:'bodentraeger', label:'🔩 Bodenträger'},
    {id:'kanten', label:'✂️ Kanten'},
    {id:'sonstiges', label:'🧠 Sonstiges'},
  ];
  el.innerHTML = `
    <div class="pagehead"><div><h1>Regeln</h1><p>Automatische Vorschläge des KI-Assistenten — nachvollziehbar und anpassbar.</p></div></div>
    <div class="tabs">${TABS.map(t=>`<div class="tab ${regelnTab===t.id?'active':''}" data-regeltab="${t.id}">${t.label}</div>`).join('')}</div>

    <div class="card" data-regelpanel="sockel" style="${regelnTab==='sockel'?'':'display:none'}">
      <h3>🦶 Sockelfüße</h3>
      <div class="kv"><span>Jede Außenseite</span><b>2 Stück</b></div>
      <div class="kv"><span>Jede Mittelseite</span><b>2 Stück</b></div>
      <div class="checkline"><span>Zusatz ab Segmentbreite &gt;</span><input type="number" min="0" id="rg_sockel_schwelle" value="${sSock.schwelle}" style="width:80px;margin-left:auto"><span class="small">mm</span></div>
      <div class="checkline"><span>Zusatzmenge je Segment</span><input type="number" min="0" id="rg_sockel_zusatz" value="${sSock.zusatzJeSegment}" style="width:80px;margin-left:auto"><span class="small">Stück</span></div>
      <div class="small" style="margin-top:8px">Optionen: mit Sockelfüßen · ohne Sockelfüße · wandhängend</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="rg_sockel_save">Speichern</button></div>
    </div>

    <div class="card" data-regelpanel="scharnier" style="${regelnTab==='scharnier'?'':'display:none'}">
      <h3>🔗 Scharniere nach Türhöhe</h3>
      <table><thead><tr><th>Türhöhe bis</th><th>Scharniere</th></tr></thead><tbody>
        <tr><td><input type="number" min="0" id="rg_sch_h1" value="${sSch.h1}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n1" value="${sSch.n1}" style="width:60px"></td></tr>
        <tr><td><input type="number" min="0" id="rg_sch_h2" value="${sSch.h2}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n2" value="${sSch.n2}" style="width:60px"></td></tr>
        <tr><td><input type="number" min="0" id="rg_sch_h3" value="${sSch.h3}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n3" value="${sSch.n3}" style="width:60px"></td></tr>
        <tr><td><input type="number" min="0" id="rg_sch_h4" value="${sSch.h4}" style="width:90px"> mm</td><td><input type="number" min="0" id="rg_sch_n4" value="${sSch.n4}" style="width:60px"></td></tr>
        <tr><td>darüber</td><td><input type="number" min="0" id="rg_sch_n5" value="${sSch.n5}" style="width:60px"></td></tr>
      </tbody></table>
      <div class="small" style="margin-top:8px">Geplante Erweiterung: Gewicht, Türbreite, Material fließen zusätzlich ein.</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="rg_sch_save">Speichern</button></div>
    </div>

    <div class="card" data-regelpanel="verbinder" style="${regelnTab==='verbinder'?'':'display:none'}">
      <h3>🔩 Verbinder (Exzenterverbinder)</h3>
      <div class="checkline"><span>Schranktiefe bis</span><input type="number" min="0" id="rg_verb_schwelle" value="${sVerb.schwelle}" style="width:80px;margin-left:auto"><span class="small">mm →</span><input type="number" min="0" id="rg_verb_bis" value="${sVerb.stkBis}" style="width:60px"><span class="small">Stück</span></div>
      <div class="checkline"><span>Schranktiefe darüber</span><span class="small mono" style="margin-left:auto">→</span><input type="number" min="0" id="rg_verb_ueber" value="${sVerb.stkUeber}" style="width:60px"><span class="small">Stück</span></div>
      <div class="small" style="margin-top:8px">Je Außenseite, Mittelseite und Konstruktionsboden. Fachböden zählen hier nicht mit (siehe „Konstruktionsböden je Fach“ in der Kalkulation).</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="rg_verb_save">Speichern</button></div>
    </div>

    <div class="card" data-regelpanel="bodentraeger" style="${regelnTab==='bodentraeger'?'':'display:none'}">
      <h3>🔩 Bodenträger</h3>
      <div class="checkline"><span>Je Fachboden</span><input type="number" min="0" id="rg_bod_wert" value="${sBod}" style="width:80px;margin-left:auto"><span class="small">Stück</span></div>
      <div class="small" style="margin-top:8px">Gesamt = Anzahl Fachböden aller Fächer × dieser Wert. Für die Basis (Böden oben/unten) werden keine Bodenträger benötigt.</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="rg_bod_save">Speichern</button></div>
    </div>

    <div class="card" data-regelpanel="kanten" style="${regelnTab==='kanten'?'':'display:none'}">
      <h3>✂️ Kantenbearbeitung</h3>
      <p class="small">Legt fest, wie viele Kanten je Bauteiltyp umleimt werden. Fließt direkt in Kantenlänge und Materialkosten der Kalkulation ein.</p>
      <div id="kantenRegelnHost"></div>
      <div class="btn-row"><button class="btn btn-primary" id="kr_save">Speichern</button></div>
    </div>

    <div class="card" data-regelpanel="sonstiges" style="${regelnTab==='sonstiges'?'':'display:none'}">
      <h3>🪵 Materialregel</h3>
      <div class="hint">💡 Wenn Korpus- und Frontmaterial identisch sind, schlägt der Assistent vor, die Bestellung zusammenzufassen.</div>
      <h3 style="margin-top:16px">🧠 Lernfunktion (Grundlage)</h3>
      <p class="small">Bestätigte Anpassungen (z. B. zusätzliche Sockelfüße, abweichende Scharnieranzahl) werden je Projekt gespeichert und in „Nachkalkulation“ ausgewertet, um künftig bessere Vorschläge abzuleiten.</p>
    </div>`;

  el.querySelectorAll('[data-regeltab]').forEach(tabEl=>tabEl.addEventListener('click',()=>{
    regelnTab = tabEl.dataset.regeltab;
    renderMain();
  }));

  document.getElementById('rg_sockel_save').addEventListener('click', async ()=>{
    DB.settings.regelSockel = {
      schwelle: parseFloat(document.getElementById('rg_sockel_schwelle').value)||0,
      zusatzJeSegment: parseFloat(document.getElementById('rg_sockel_zusatz').value)||0,
    };
    await save('settings'); alert('Sockelfuß-Regel gespeichert.');
  });
  document.getElementById('rg_sch_save').addEventListener('click', async ()=>{
    DB.settings.regelScharnier = {
      h1: parseFloat(document.getElementById('rg_sch_h1').value)||0,
      h2: parseFloat(document.getElementById('rg_sch_h2').value)||0,
      h3: parseFloat(document.getElementById('rg_sch_h3').value)||0,
      h4: parseFloat(document.getElementById('rg_sch_h4').value)||0,
      n1: parseFloat(document.getElementById('rg_sch_n1').value)||0,
      n2: parseFloat(document.getElementById('rg_sch_n2').value)||0,
      n3: parseFloat(document.getElementById('rg_sch_n3').value)||0,
      n4: parseFloat(document.getElementById('rg_sch_n4').value)||0,
      n5: parseFloat(document.getElementById('rg_sch_n5').value)||0,
    };
    await save('settings'); alert('Scharnier-Regel gespeichert.');
  });
  document.getElementById('rg_verb_save').addEventListener('click', async ()=>{
    DB.settings.regelVerbinder = {
      schwelle: parseFloat(document.getElementById('rg_verb_schwelle').value)||0,
      stkBis: parseFloat(document.getElementById('rg_verb_bis').value)||0,
      stkUeber: parseFloat(document.getElementById('rg_verb_ueber').value)||0,
    };
    await save('settings'); alert('Verbinder-Regel gespeichert.');
  });
  document.getElementById('rg_bod_save').addEventListener('click', async ()=>{
    DB.settings.regelBodentraeger = { jeFachboden: parseFloat(document.getElementById('rg_bod_wert').value)||0 };
    await save('settings'); alert('Bodenträger-Regel gespeichert.');
  });

  const regeln = kantenRegeln();
  const KANTEN_GRUPPEN = [
    {titel:'Korpus', typen:['seite_aussen','seite_mittel','boden','fachboden','konstruktionsboden']},
    {titel:'Front & Rückwand', typen:['front','rueckwand']},
    {titel:'Sockel & Blenden', typen:['sockel','blende','anstellseite','anstellboden','anstelldeckel']},
  ];
  document.getElementById('kantenRegelnHost').innerHTML = `
    <div class="small" style="margin-bottom:10px">Längskanten/Stirnkanten je 0–2 frei kombinierbar, oder „umlaufend“ für alle vier Kanten.</div>
    ${KANTEN_GRUPPEN.map(g=>`
    <div style="margin-bottom:14px">
      <div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">${g.titel}</div>
      ${g.typen.map(typ=>{ const r = regeln[typ]; return `
        <div class="checkline" style="gap:8px">
          <span class="small" style="width:150px">${KANTEN_TYP_LABEL[typ]}</span>
          <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Längs <input type="number" min="0" max="2" style="width:44px" data-kr-laengs="${typ}" value="${r.laengs}" ${r.umlaufend?'disabled':''}></label>
          <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none">Stirn <input type="number" min="0" max="2" style="width:44px" data-kr-stirn="${typ}" value="${r.stirn}" ${r.umlaufend?'disabled':''}></label>
          <label class="small" style="display:flex;align-items:center;gap:4px;font-weight:400;text-transform:none;margin-left:auto"><input type="checkbox" style="width:auto" data-kr-umlaufend="${typ}" ${r.umlaufend?'checked':''}> umlaufend</label>
        </div>`; }).join('')}
    </div>`).join('')}`;
  document.querySelectorAll('[data-kr-umlaufend]').forEach(cb=>cb.addEventListener('change',e=>{
    const typ = e.target.dataset.krUmlaufend;
    const laengsInp = document.querySelector(`[data-kr-laengs="${typ}"]`);
    const stirnInp = document.querySelector(`[data-kr-stirn="${typ}"]`);
    if(e.target.checked){ laengsInp.value=2; stirnInp.value=2; laengsInp.disabled=true; stirnInp.disabled=true; }
    else { laengsInp.disabled=false; stirnInp.disabled=false; }
  }));
  document.getElementById('kr_save').addEventListener('click', async ()=>{
    const neu = {};
    const typen = KANTEN_GRUPPEN.flatMap(g=>g.typen);
    typen.forEach(typ=>{
      const umlaufend = document.querySelector(`[data-kr-umlaufend="${typ}"]`).checked;
      neu[typ] = {
        laengs: parseInt(document.querySelector(`[data-kr-laengs="${typ}"]`).value)||0,
        stirn: parseInt(document.querySelector(`[data-kr-stirn="${typ}"]`).value)||0,
        umlaufend,
      };
    });
    DB.settings.kantenRegeln = neu;
    await save('settings');
    alert('Kantenregeln gespeichert.');
  });
}

/* ---------------------------- ARBEITSZEIT ---------------------------- */
function fmtStdMin(std){
  const gesamtMin = Math.round((std||0)*60);
  const vorzeichen = gesamtMin<0 ? '-' : '';
  const abs = Math.abs(gesamtMin);
  const h = Math.floor(abs/60), m = abs%60;
  if(h===0) return `${vorzeichen}${m} Min.`;
  if(m===0) return `${vorzeichen}${h} Std.`;
  return `${vorzeichen}${h} Std. ${m} Min.`;
}
function renderArbeitszeit(el){
  const s = DB.settings;
  const istStdFuerMitarbeiter = (r, m) => m.id==='m1' ? (r.std||0) : m.id==='m2' ? (r.std2||0) : (r.weitereStunden?.[m.id]||0);
  const zeitkontoZeile = m => {
    const monatslohn = m.monatslohn, satz = m.stundenlohnTatsaechlich;
    if(!monatslohn || !satz) return '';
    const sollMonatAuto = monatslohn/satz;
    const sollMonatManuell = m.sollMonatManuell;
    const sollMonat = (sollMonatManuell!==null && sollMonatManuell!==undefined && sollMonatManuell!=='') ? parseFloat(sollMonatManuell) : sollMonatAuto;
    const heute = new Date();
    let monate = 1;
    const beginn = m.beginn;
    if(beginn){
      const start = new Date(beginn);
      monate = Math.max(1, (heute.getFullYear()-start.getFullYear())*12 + (heute.getMonth()-start.getMonth()) + 1);
    }
    const sollGesamt = sollMonat*monate;
    let istAutomatisch = 0;
    DB.nachkalkulation.forEach(nk=>{
      (nk.azIst||[]).forEach(r=>{ istAutomatisch += istStdFuerMitarbeiter(r, m); });
      if(m.id==='m1') istAutomatisch += (parseFloat(nk.oberflaecheIst)||0);
      if(m.id==='m2') istAutomatisch += (parseFloat(nk.oberflaecheIst2)||0);
      if(m.id==='m1') istAutomatisch += (parseFloat(nk.baustellenmontageIst)||0);
      else if(m.id==='m2') istAutomatisch += (parseFloat(nk.baustellenmontageIst2)||0);
      else istAutomatisch += (nk.baustellenmontageIstWeitere?.[m.id]||0);
    });
    const basisStunden = parseFloat(m.basisStunden) || 0;
    const istGesamt = istAutomatisch + basisStunden;
    const diff = istGesamt-sollGesamt;
    const balkenProzent = sollGesamt>0 ? Math.min(100, (istGesamt/sollGesamt)*100) : 0;
    const key = m.id;
    return `<div style="border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:18px">
      <div style="font-weight:700;font-size:18px;margin-bottom:12px">${m.name}${beginn?` <span style="font-weight:400;opacity:.7;font-size:14px">· beschäftigt seit ${new Date(beginn).toLocaleDateString('de-DE')}</span>`:''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:14px;font-size:15px">
        <div>
          <div style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;opacity:.6;margin-bottom:8px;font-size:13px">Soll</div>
          <div style="margin-bottom:8px">Monate seit Beginn: <b>${monate}</b></div>
          <div class="field" style="margin:0 0 8px 0;max-width:170px"><label style="font-size:14px">Soll-Std./Monat <span style="font-weight:400;opacity:.7">(auto: ${sollMonatAuto.toFixed(1)})</span></label>
            <input type="number" step="0.5" id="zk_sollmonat_${key}" value="${sollMonat.toFixed(1)}" style="font-size:16px;padding:8px"></div>
          ${sollMonatManuell ? `<div style="margin-bottom:8px"><a href="#" data-zk-reset-sollmonat="${key}" style="color:var(--accent)">🔄 zurücksetzen auf ${sollMonatAuto.toFixed(1)}</a></div>` : ''}
          <div>Soll-Stunden gesamt: <b>${fmtStdMin(sollGesamt)}</b></div>
        </div>
        <div>
          <div style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;opacity:.6;margin-bottom:8px;font-size:13px">Ist</div>
          <div style="margin-bottom:8px">Automatisch erfasst: <b>${fmtStdMin(istAutomatisch)}</b></div>
          <div class="field" style="margin:0 0 8px 0;max-width:170px"><label style="font-size:14px">Basis-Stunden <span style="font-weight:400;opacity:.7">(vor App)</span></label>
            <input type="number" step="0.5" id="zk_basis_${key}" value="${basisStunden||''}" placeholder="0" style="font-size:16px;padding:8px"></div>
          <div>Ist-Stunden gesamt: <b>${fmtStdMin(istGesamt)}</b></div>
        </div>
      </div>
      <div class="soll-ist-balken" style="background:var(--border);border-radius:6px;height:30px;overflow:hidden;position:relative;margin-bottom:8px">
        <div style="background:${diff>=0?'var(--sage)':'var(--danger)'};height:100%;width:${balkenProzent}%;transition:width .3s"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text)">${fmtStdMin(istGesamt)} / ${fmtStdMin(sollGesamt)}</div>
      </div>
      <div class="mono" style="font-size:14px">Δ <b style="color:${diff>=0?'var(--sage)':'var(--danger)'}">${diff>=0?'+':''}${fmtStdMin(diff)}</b> ${diff>0?'über Soll':'unter Soll'}</div>
    </div>`;
  };
  // Je Mitarbeiter: an welchen Projekten wie lange gearbeitet wurde (aus allen Nachkalkulationen zusammengetragen)
  const projektUebersichtJeMitarbeiter = m => {
    const zeilen = [];
    DB.nachkalkulation.forEach(nk=>{
      const projekt = DB.projects.find(p=>p.id===nk.projId);
      if(!projekt) return;
      let summe = 0;
      const posDetails = [];
      (nk.azIst||[]).forEach(r=>{
        const std = istStdFuerMitarbeiter(r, m);
        if(std>0){ summe += std; posDetails.push(`${r.name}: ${fmtStdMin(std)}`); }
      });
      if(m.id==='m1'){ const ob=(parseFloat(nk.oberflaecheIst)||0); if(ob>0){ summe += ob; posDetails.push(`Oberfläche: ${fmtStdMin(ob)}`); } }
      if(m.id==='m2'){ const ob=(parseFloat(nk.oberflaecheIst2)||0); if(ob>0){ summe += ob; posDetails.push(`Oberfläche: ${fmtStdMin(ob)}`); } }
      const bm = m.id==='m1' ? (parseFloat(nk.baustellenmontageIst)||0) : m.id==='m2' ? (parseFloat(nk.baustellenmontageIst2)||0) : (nk.baustellenmontageIstWeitere?.[m.id]||0);
      if(bm>0){ summe += bm; posDetails.push(`Baustellenmontage: ${fmtStdMin(bm)}`); }
      if(summe>0) zeilen.push({projekt, kunde:projekt.kunde||'—', datum:projekt.datum||'', summe, posDetails});
    });
    const spalte = arbeitszeitSortSpalte, richtung = arbeitszeitSortRichtung;
    zeilen.sort((a,b)=>{
      let vergleich;
      if(spalte==='projekt') vergleich = a.projekt.name.localeCompare(b.projekt.name);
      else if(spalte==='kunde') vergleich = a.kunde.localeCompare(b.kunde);
      else if(spalte==='datum') vergleich = a.datum.localeCompare(b.datum);
      else vergleich = a.summe-b.summe;
      return richtung==='auf' ? vergleich : -vergleich;
    });
    return zeilen;
  };
  const pfeil = spalte => arbeitszeitSortSpalte===spalte ? (arbeitszeitSortRichtung==='auf'?' ▲':' ▼') : '';
  const uebersichtHtml = m => {
    const zeilen = projektUebersichtJeMitarbeiter(m);
    if(!zeilen.length) return '';
    const gesamt = zeilen.reduce((s,z)=>s+z.summe,0);
    return `<div style="margin-bottom:18px">
      <div style="font-weight:700;margin-bottom:6px">${m.name} <span class="small mono" style="font-weight:400;opacity:.75">— insgesamt ${fmtStdMin(gesamt)} über ${zeilen.length} Projekt(e)</span></div>
      <table><thead><tr>
        <th style="cursor:pointer" data-az-sort="datum">Datum${pfeil('datum')}</th>
        <th style="cursor:pointer" data-az-sort="kunde">Kunde${pfeil('kunde')}</th>
        <th style="cursor:pointer" data-az-sort="projekt">Projekt${pfeil('projekt')}</th>
        <th style="cursor:pointer" data-az-sort="stunden">Stunden${pfeil('stunden')}</th>
        <th>Details</th>
      </tr></thead><tbody>
        ${zeilen.map(z=>`<tr><td class="mono small">${z.datum||'—'}</td><td>${z.kunde}</td><td>${z.projekt.name}</td><td class="mono">${fmtStdMin(z.summe)}</td><td class="small">${z.posDetails.join(', ')}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  };
  const alleMitarbeiterFuerZeitkonto = s.mitarbeiterListe || [];
  const uebersichtenJeMitarbeiter = alleMitarbeiterFuerZeitkonto.map(m=>({m, html:uebersichtHtml(m)}));
  el.innerHTML = `
    <div class="pagehead"><div><h1>Arbeitszeit</h1><p>Zeitkonto-Verwaltung und Übersicht, an welchen Projekten die Mitarbeiter gearbeitet haben.</p></div></div>
    <div class="card">
      <h3>🕐 Zeitkonto-Einstellungen (für Minijob/Teilzeit mit festem Monatslohn)</h3>
      <div class="small" style="margin-bottom:12px">Soll-Stunden pro Monat werden automatisch aus Monatslohn ÷ tatsächlichem Stundenlohn berechnet. Das ist der reale Lohn, NICHT der Verrechnungssatz aus den Einstellungen (der für die Preiskalkulation genutzt wird). Leer lassen, wenn kein Zeitkonto benötigt wird.</div>
      ${(s.mitarbeiterListe||[]).map((m,i)=>`
        <div style="margin-bottom:8px${i<s.mitarbeiterListe.length-1?';border-bottom:1px dashed var(--border);padding-bottom:12px':''}">
          <div class="field-row-inline" style="display:flex;gap:10px;align-items:flex-end;margin-bottom:8px">
            <div class="field" style="flex:1;margin:0"><label>Name</label><input type="text" data-zk-ma-name="${m.id}" value="${m.name}"></div>
            <div class="field" style="width:130px;margin:0"><label>Verrechnungssatz</label><input type="number" step="0.5" data-zk-ma-vsatz="${m.id}" value="${m.satz||0}"></div>
            <span class="small" style="padding-bottom:10px">€/Std.</span>
            ${(m.id!=='m1' && m.id!=='m2') ? `<button class="btn btn-ghost btn-sm" data-zk-ma-loeschen="${m.id}" style="margin-bottom:0">✕ entfernen</button>` : ''}
          </div>
          <div class="field-row-inline" style="display:flex;gap:10px;align-items:flex-end">
            <div class="field" style="flex:1;margin:0"><label>Monatslohn (fürs Zeitkonto)</label><input type="number" step="1" data-zk-ma-lohn="${m.id}" value="${m.monatslohn||''}" placeholder="z. B. 605"></div>
            <span class="small" style="padding-bottom:10px">€</span>
            <div class="field" style="width:130px;margin:0"><label>Tatsächlicher Lohn</label><input type="number" step="0.5" data-zk-ma-satz="${m.id}" value="${m.stundenlohnTatsaechlich||''}" placeholder="z. B. 14"></div>
            <span class="small" style="padding-bottom:10px">€/Std.</span>
            <div class="field" style="flex:1;margin:0"><label>Beschäftigt seit</label><input type="date" data-zk-ma-beginn="${m.id}" value="${m.beginn||''}"></div>
          </div>
        </div>`).join('')}
      <div class="btn-row" style="margin-top:4px">
        <button class="btn btn-primary" id="az_ma_save">Speichern</button>
        <button class="btn btn-ghost" id="az_ma_neu">+ Mitarbeiter hinzufügen</button>
      </div>
    </div>
    ${alleMitarbeiterFuerZeitkonto.some(m=>m.monatslohn && m.stundenlohnTatsaechlich) ? `<div class="card">
      <h3>🕐 Zeitkonto-Übersicht</h3>
      <div class="small" style="margin-bottom:12px">Läuft komplett automatisch aus Monatslohn, tatsächlichem Stundenlohn, Beschäftigt-seit-Datum und den tatsächlich in der Nachkalkulation erfassten Stunden.</div>
      ${alleMitarbeiterFuerZeitkonto.map(m=>zeitkontoZeile(m)).join('')}
    </div>` : ''}
    <div class="card">
      <h3>📋 Übersicht — Stunden je Mitarbeiter und Projekt</h3>
      ${uebersichtenJeMitarbeiter.some(u=>u.html) ? `<div class="field" style="max-width:220px;margin-bottom:12px"><label>Mitarbeiter</label>
        <select id="az_ma_filter">
          <option value="alle" ${arbeitszeitMitarbeiterFilter==='alle'?'selected':''}>Alle</option>
          ${uebersichtenJeMitarbeiter.filter(u=>u.html).map(u=>`<option value="${u.m.id}" ${arbeitszeitMitarbeiterFilter===u.m.id?'selected':''}>${u.m.name}</option>`).join('')}
        </select></div>
        ${arbeitszeitMitarbeiterFilter==='alle' ? uebersichtenJeMitarbeiter.map(u=>u.html).join('') : (uebersichtenJeMitarbeiter.find(u=>u.m.id===arbeitszeitMitarbeiterFilter)?.html || uebersichtenJeMitarbeiter.map(u=>u.html).join(''))}`
        : emptyState('⏱️','Noch keine Stunden erfasst','Sobald in der Nachkalkulation Ist-Stunden stehen (automatisch aus der Werkstatt-App oder manuell eingetragen), erscheint hier die Übersicht je Mitarbeiter.')}
    </div>`;
  el.querySelector('#az_ma_filter')?.addEventListener('change', e=>{
    arbeitszeitMitarbeiterFilter = e.target.value;
    renderMain();
  });
  el.querySelectorAll('[data-az-sort]').forEach(th=>th.addEventListener('click', ()=>{
    const spalte = th.dataset.azSort;
    if(arbeitszeitSortSpalte===spalte) arbeitszeitSortRichtung = arbeitszeitSortRichtung==='auf' ? 'ab' : 'auf';
    else { arbeitszeitSortSpalte = spalte; arbeitszeitSortRichtung = 'auf'; }
    renderMain();
  }));
  el.querySelector('#az_ma_neu')?.addEventListener('click', async ()=>{
    const name = prompt('Name des neuen Mitarbeiters:');
    if(!name || !name.trim()) return;
    const satzText = prompt('Verrechnungssatz (€/Std., für die Preiskalkulation):', '42');
    const satz = parseFloat(satzText)||0;
    if(!DB.settings.mitarbeiterListe) DB.settings.mitarbeiterListe = [];
    DB.settings.mitarbeiterListe.splice(2, 0, {id:'m_'+uid(), name:name.trim(), satz, stundenlohnTatsaechlich:0, monatslohn:0, beginn:'', basisStunden:0, sollMonatManuell:null});
    await save('settings');
    renderMain();
  });
  el.querySelectorAll('[data-zk-ma-loeschen]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const id = btn.dataset.zkMaLoeschen;
    if(!confirm('Diesen Mitarbeiter wirklich entfernen?')) return;
    DB.settings.mitarbeiterListe = DB.settings.mitarbeiterListe.filter(x=>x.id!==id);
    await save('settings');
    renderMain();
  }));
  el.querySelector('#az_ma_save').addEventListener('click', async ()=>{
    (DB.settings.mitarbeiterListe||[]).forEach(m=>{
      const nameFeld = el.querySelector(`[data-zk-ma-name="${m.id}"]`);
      const vsatzFeld = el.querySelector(`[data-zk-ma-vsatz="${m.id}"]`);
      const lohnFeld = el.querySelector(`[data-zk-ma-lohn="${m.id}"]`);
      const satzFeld = el.querySelector(`[data-zk-ma-satz="${m.id}"]`);
      const beginnFeld = el.querySelector(`[data-zk-ma-beginn="${m.id}"]`);
      if(!lohnFeld) return;
      m.name = nameFeld.value.trim() || m.name;
      m.satz = parseFloat(vsatzFeld.value)||0;
      m.monatslohn = parseFloat(lohnFeld.value)||0;
      m.stundenlohnTatsaechlich = parseFloat(satzFeld.value)||0;
      m.beginn = beginnFeld.value;
      // Mitarbeiter 1/2 zusätzlich in die ursprünglichen Einzelfelder spiegeln — die werden an vielen
      // Stellen (Kalkulation, Zeitkonto-Übersicht, Cloud-Sync zur Werkstatt-App) noch direkt gelesen.
      if(m.id==='m1'){ DB.settings.mitarbeiter1Name=m.name; DB.settings.mitarbeiter1Satz=m.satz; DB.settings.mitarbeiter1Monatslohn=m.monatslohn; DB.settings.mitarbeiter1StundenlohnTatsaechlich=m.stundenlohnTatsaechlich; DB.settings.mitarbeiter1Beginn=m.beginn; }
      if(m.id==='m2'){ DB.settings.mitarbeiter2Name=m.name; DB.settings.mitarbeiter2Satz=m.satz; DB.settings.mitarbeiter2Monatslohn=m.monatslohn; DB.settings.mitarbeiter2StundenlohnTatsaechlich=m.stundenlohnTatsaechlich; DB.settings.mitarbeiter2Beginn=m.beginn; }
    });
    await save('settings'); renderMain();
  });
  el.querySelectorAll('[id^="zk_basis_"]').forEach(inp=>inp.addEventListener('change', async e=>{
    const key = e.target.id.replace('zk_basis_', '');
    const m = DB.settings.mitarbeiterListe.find(x=>x.id===key);
    if(!m) return;
    m.basisStunden = parseFloat(e.target.value)||0;
    if(key==='m1') DB.settings.mitarbeiter1BasisStunden = m.basisStunden;
    if(key==='m2') DB.settings.mitarbeiter2BasisStunden = m.basisStunden;
    await save('settings'); renderMain();
  }));
  el.querySelectorAll('[id^="zk_sollmonat_"]').forEach(inp=>inp.addEventListener('change', async e=>{
    const key = e.target.id.replace('zk_sollmonat_', '');
    const m = DB.settings.mitarbeiterListe.find(x=>x.id===key);
    if(!m) return;
    m.sollMonatManuell = e.target.value;
    if(key==='m1') DB.settings.mitarbeiter1SollMonatManuell = e.target.value;
    if(key==='m2') DB.settings.mitarbeiter2SollMonatManuell = e.target.value;
    await save('settings'); renderMain();
  }));
  el.querySelectorAll('[data-zk-reset-sollmonat]').forEach(link=>link.addEventListener('click', async e=>{
    e.preventDefault();
    const key = e.currentTarget.dataset.zkResetSollmonat;
    const m = DB.settings.mitarbeiterListe.find(x=>x.id===key);
    if(m) m.sollMonatManuell = null;
    if(key==='m1') DB.settings.mitarbeiter1SollMonatManuell = null;
    if(key==='m2') DB.settings.mitarbeiter2SollMonatManuell = null;
    await save('settings'); renderMain();
  }));
}

/* ---------------------------- NACHKALKULATION ---------------------------- */
function renderNachkalkulation(el){
  const meineGeneration = ++nkRenderGeneration;
  const hatGespeicherteSchraenke = p=>p.kalkulation?.schraenke?.some(s=>s.geplant);
  if(!DB.projects.some(hatGespeicherteSchraenke)){
    el.innerHTML = `<div class="pagehead"><div><h1>Nachkalkulation</h1><p>Geplant vs. tatsächlich vergleichen.</p></div></div>
    <div class="card">${emptyState('📊','Noch keine Kalkulation','Speichere zuerst eine Kalkulation unter „Kalkulation“.')}</div>`;
    return;
  }
  const kalkProjekte = DB.projects.filter(hatGespeicherteSchraenke);
  if(!activeProjectId || !kalkProjekte.find(p=>p.id===activeProjectId)) activeProjectId = kalkProjekte[kalkProjekte.length-1].id;
  const p = proj(activeProjectId);
  const gespeichertesNk = DB.nachkalkulation.find(x=>x.projId===p.id);
  const geplant = projektGeplantGesamt(p);
  const azNamenSoll = Object.keys(geplant.az); // Positionsnamen aus der Kalkulation, über alle Schränke summiert (z.B. AV, Zuschnitt, Kanten, Zusammenbau, CNC-Bearbeitung)
  const nk = {
    projId:p.id,
    korpusM2Ist:null, frontM2Ist:null, rueckwandM2Ist:null,
    kantenLfmIst:null, baustellenmontageIst:null, baustellenmontageIst2:null, baustellenmontageKmIst:null, oberflaecheIst:null, oberflaecheIst2:null, lieferkostenIst:null, kleinmaterialIst:null, zusatzarbeiten:0, notiz:'',
    ...(gespeichertesNk||{}),
    beschlagIstQty:{...(gespeichertesNk?.beschlagIstQty||{})},
    beschlagPreisIst:{...(gespeichertesNk?.beschlagPreisIst||{})},
    zusatzPlattenIst:{...(gespeichertesNk?.zusatzPlattenIst||{})},
    zusatzPlattenExtra: gespeichertesNk?.zusatzPlattenExtra && Array.isArray(gespeichertesNk.zusatzPlattenExtra) ? gespeichertesNk.zusatzPlattenExtra.map(r=>({...r})) : [],
    zusatzpositionenIst: {...(gespeichertesNk?.zusatzpositionenIst||{})},
    zusatzpositionenExtra: gespeichertesNk?.zusatzpositionenExtra && Array.isArray(gespeichertesNk.zusatzpositionenExtra) ? gespeichertesNk.zusatzpositionenExtra.map(r=>({...r})) : [],
    nurGesamtstundenModus: gespeichertesNk?.nurGesamtstundenModus || false,
    gesamtstundenDirekt: gespeichertesNk?.gesamtstundenDirekt ?? null,
    azIst: (()=>{
      if(gespeichertesNk?.azIst && Array.isArray(gespeichertesNk.azIst) && gespeichertesNk.azIst.length){
        // Bestehende Ist-Werte behalten, aber neu hinzugekommene Kalkulations-Positionen automatisch mit dem Soll-Wert ergänzen
        const bestehend = gespeichertesNk.azIst.map(r=>({...r}));
        azNamenSoll.forEach(name=>{ if(!bestehend.some(r=>r.name===name)) bestehend.push({name, std: geplant.azM1?.[name]||0, std2: geplant.azM2?.[name]||0}); });
        return bestehend;
      }
      // Erststart: Positionen 1:1 aus der Kalkulation übernehmen (Summe aller Schränke) — Ist-Stunden starten beim Soll-Wert,
      // sonst wirkt die Nachkalkulation sofort "abweichend", obwohl noch gar nichts geändert wurde.
      return azNamenSoll.map(name=>({name, std: geplant.azM1?.[name]||0, std2: geplant.azM2?.[name]||0}));
    })(),
  };
  const beschlagGruppenSoll = gruppiereBeschlagMengen(geplant.beschlagQty, false, geplant.beschlagPreis);

  // Immer das aktuell in der Kalkulation geplante Material zeigen — nicht an einem alten, längst überholten Wert festhalten
  nk.korpusMaterialId = geplant.materialKorpusId || nk.korpusMaterialId;
  nk.kantenLfmIst = nk.kantenLfmIst===null || nk.kantenLfmIst===undefined ? geplant.kantenLfm : nk.kantenLfmIst;
  nk.baustellenmontageIst = nk.baustellenmontageIst===null || nk.baustellenmontageIst===undefined ? geplant.baustellenmontageStdM1 : nk.baustellenmontageIst;
  nk.baustellenmontageIst2 = nk.baustellenmontageIst2===null || nk.baustellenmontageIst2===undefined ? geplant.baustellenmontageStdM2 : nk.baustellenmontageIst2;
  nk.baustellenmontageKmIst = nk.baustellenmontageKmIst===null || nk.baustellenmontageKmIst===undefined ? geplant.baustellenmontageKm : nk.baustellenmontageKmIst;
  nk.oberflaecheIst = nk.oberflaecheIst===null || nk.oberflaecheIst===undefined ? geplant.oberflaecheStdM1 : nk.oberflaecheIst;
  nk.oberflaecheIst2 = nk.oberflaecheIst2===null || nk.oberflaecheIst2===undefined ? geplant.oberflaecheStdM2 : nk.oberflaecheIst2;
  nk.lieferkostenIst = nk.lieferkostenIst===null || nk.lieferkostenIst===undefined ? geplant.lieferkostenBetrag : nk.lieferkostenIst;
  nk.kleinmaterialIst = nk.kleinmaterialIst===null || nk.kleinmaterialIst===undefined ? geplant.kleinmaterialBetrag : nk.kleinmaterialIst;
  nk.frontMaterialId = geplant.materialFrontId || nk.frontMaterialId;
  nk.rueckwandMaterialId = geplant.materialRueckwandId || nk.rueckwandMaterialId;
  // Verschnittzuschlag einrechnen: die Soll-Fläche/-Menge muss zum Soll-Preis passen (der den Zuschlag schon enthält),
  // sonst weicht der vorbefüllte Ist-Wert sofort vom Soll-Preis ab, ohne dass etwas geändert wurde.
  const zKn = 1 + ((DB.settings.zuschlagKorpus||0)/100);
  const zFn = 1 + ((DB.settings.zuschlagFront||0)/100);
  const zRn = 1 + ((DB.settings.zuschlagRueckwand||0)/100);
  const zPn = 1 + ((DB.settings.zuschlagZusatzplatten||0)/100);
  const korpusFlInkl = geplant.korpusFl*zKn, frontFlInkl = geplant.frontFl*zFn, rueckFlInkl = geplant.rueckFl*zRn;
  const m2Ist = (feld, sollFl) => nk[feld]===null||nk[feld]===undefined ? sollFl : nk[feld];
  const materialZeileKosten = (matId, m2) => (findMat(matId)?.preis||0) * m2;
  const korpusKostenIst = materialZeileKosten(nk.korpusMaterialId, m2Ist('korpusM2Ist', korpusFlInkl));
  const frontKostenIst = materialZeileKosten(nk.frontMaterialId, m2Ist('frontM2Ist', frontFlInkl));
  const rueckwandKostenIst = materialZeileKosten(nk.rueckwandMaterialId, m2Ist('rueckwandM2Ist', rueckFlInkl));
  const zusatzPlattenIstWert = pl => {
    const gespeichert = nk.zusatzPlattenIst[pl.key];
    return { materialId: pl.materialId || gespeichert?.materialId, m2: gespeichert?.m2 ?? (pl.flaeche*zPn) };
  };
  const zusatzPlattenKostenIst = (geplant.zusatzPlatten||[]).reduce((s,pl)=>{ const w=zusatzPlattenIstWert(pl); return s + materialZeileKosten(w.materialId, w.m2); },0);
  const zusatzPlattenExtraKostenIst = nk.zusatzPlattenExtra.reduce((s,ex)=>s+materialZeileKosten(ex.materialId, ex.m2||0),0);
  const zusatzpositionIstWert = pos => {
    const gespeichert = nk.zusatzpositionenIst[pos.key];
    return { menge: gespeichert?.menge ?? pos.menge, preis: gespeichert?.preis ?? pos.preis };
  };
  const zusatzpositionenKostenIst = (geplant.zusatzpositionen||[]).reduce((s,pos)=>{ const w=zusatzpositionIstWert(pos); return s+(w.menge*w.preis); },0);
  const zusatzpositionenExtraKostenIst = nk.zusatzpositionenExtra.reduce((s,ex)=>s+((ex.menge||0)*(ex.preis||0)),0);

  const beschlagGesamtIst = beschlagGruppenSoll.reduce((s,g)=>s+g.ids.reduce((s2,id)=>{ const preis = nk.beschlagPreisIst[id] ?? (geplant.beschlagPreis?.[id]!==undefined ? geplant.beschlagPreis[id] : (DB.beschlaege.find(x=>x.id===id)?.preis||0)); return s2+preis*(nk.beschlagIstQty[id]??g.qty); },0),0);
  const nurMaterialGesamtIst = korpusKostenIst+frontKostenIst+rueckwandKostenIst+zusatzPlattenKostenIst+zusatzPlattenExtraKostenIst+((parseFloat(nk.kantenLfmIst)||0)*DB.settings.kantenpreis)+zusatzpositionenKostenIst+zusatzpositionenExtraKostenIst+(parseFloat(nk.lieferkostenIst)||0)+(parseFloat(nk.kleinmaterialIst)||0);
  const nurMaterialGesamtSoll = geplant.materialNetto+geplant.kantenKosten+geplant.zusatzKosten+geplant.lieferkostenBetrag+geplant.kleinmaterialBetrag;
  const materialGesamtIst = nurMaterialGesamtIst + beschlagGesamtIst;
  const materialGesamtSoll = geplant.materialNetto+geplant.kantenKosten+geplant.beschlagKosten+geplant.zusatzKosten+geplant.lieferkostenBetrag+geplant.kleinmaterialBetrag;
  const weitereMitarbeiterFuerNk2 = (DB.settings.mitarbeiterListe||[]).filter(m=>m.id!=='m1' && m.id!=='m2');
  const summeWeitereIst2 = r => Object.values(r.weitereStunden||{}).reduce((a,b)=>a+(b||0),0);
  const kostenWeitereIst2 = r => weitereMitarbeiterFuerNk2.reduce((s,m)=>s+((r.weitereStunden?.[m.id]||0)*(m.satz||0)),0);
  const bmWeitereIstGesamt2 = weitereMitarbeiterFuerNk2.reduce((s,m)=>s+(nk.baustellenmontageIstWeitere?.[m.id]||0),0);
  const bmWeitereIstKosten2 = weitereMitarbeiterFuerNk2.reduce((s,m)=>s+((nk.baustellenmontageIstWeitere?.[m.id]||0)*(m.satz||0)),0);
  // Baustellenmontage separat ausgewiesen (eigener Stundensatz) statt nur in der Gesamt-Arbeitszeit enthalten.
  const bmStundenIstAnzeige = (parseFloat(nk.baustellenmontageIst)||0) + (parseFloat(nk.baustellenmontageIst2)||0) + bmWeitereIstGesamt2;
  const bmKostenIstAnzeige = ((parseFloat(nk.baustellenmontageIst)||0)+(parseFloat(nk.baustellenmontageIst2)||0))*(DB.settings.stundensatzBaustelle||DB.settings.stundensatz) + bmWeitereIstKosten2;
  const zeitGesamtIstRoh = nk.nurGesamtstundenModus
    ? (parseFloat(nk.gesamtstundenDirekt)||0)
    : nk.azIst.reduce((s,r)=>s+(r.std||0)+(r.std2||0)+summeWeitereIst2(r),0) + (parseFloat(nk.oberflaecheIst)||0)+(parseFloat(nk.oberflaecheIst2)||0) + (parseFloat(nk.baustellenmontageIst)||0)+(parseFloat(nk.baustellenmontageIst2)||0)+bmWeitereIstGesamt2;
  // Erst hier, bei der GESAMTSUMME aller Fertigungsschritte, wird auf volle Viertelstunden aufgerundet —
  // jede einzelne Position bleibt exakt/roh, wie tatsächlich erfasst.
  const zeitGesamtIst = Math.ceil(zeitGesamtIstRoh*4)/4;
  const zeitGesamtSoll = geplant.zeit;
  const azSollM1Gesamt = Object.values(geplant.azM1||{}).reduce((s,v)=>s+v,0) + geplant.oberflaecheStdM1;
  const azSollM2Gesamt = Object.values(geplant.azM2||{}).reduce((s,v)=>s+v,0) + geplant.oberflaecheStdM2;
  const azSollWeitereKosten = weitereMitarbeiterFuerNk2.reduce((sum,m)=>{
    const std = Object.values(geplant.azWeitere||{}).reduce((s,pos)=>s+(pos[m.id]||0),0);
    return sum + std*(m.satz||0);
  },0);
  const arbeitszeitGesamtSoll = azSollM1Gesamt*DB.settings.mitarbeiter1Satz + azSollM2Gesamt*DB.settings.mitarbeiter2Satz
    + geplant.baustellenmontageStd * (DB.settings.stundensatzBaustelle||DB.settings.stundensatz) + azSollWeitereKosten;
  // Tatsächlicher Ist-Gesamtpreis (fehlte bisher komplett — Änderungen bei den Stunden wirkten sich auf keinen angezeigten Preis aus).
  // Wichtig: mit denselben Gewinnzuschlägen je Kategorie rechnen wie die Kalkulation, sonst entsteht eine Lücke zum VK-Preis,
  // auch wenn es gar keine echte Abweichung gibt. Je Mitarbeiter mit dessen eigenem Satz, Baustellenmontage weiterhin mit ihrem eigenen Satz.
  const arbeitszeitGesamtIstRoh = nk.nurGesamtstundenModus
    ? zeitGesamtIstRoh * DB.settings.stundensatz
    : nk.azIst.reduce((s,r)=>s + (r.std||0)*DB.settings.mitarbeiter1Satz + (r.std2||0)*DB.settings.mitarbeiter2Satz + kostenWeitereIst2(r), 0)
      + (parseFloat(nk.oberflaecheIst)||0)*DB.settings.mitarbeiter1Satz + (parseFloat(nk.oberflaecheIst2)||0)*DB.settings.mitarbeiter2Satz
      + ((parseFloat(nk.baustellenmontageIst)||0)+(parseFloat(nk.baustellenmontageIst2)||0)) * (DB.settings.stundensatzBaustelle||DB.settings.stundensatz)
      + bmWeitereIstKosten2;
  // Die Aufrundung auf volle Viertelstunden wird proportional auf den Euro-Betrag übertragen, statt separat
  // neu zu berechnen — so bleiben Stunden- und Euro-Anzeige immer konsistent, auch bei unterschiedlichen Sätzen.
  const rundungsFaktorNk = zeitGesamtIstRoh>0 ? zeitGesamtIst/zeitGesamtIstRoh : 1;
  const arbeitszeitGesamtIst = arbeitszeitGesamtIstRoh * rundungsFaktorNk;
  const materialNettoIst = korpusKostenIst+frontKostenIst+rueckwandKostenIst+zusatzPlattenKostenIst+zusatzPlattenExtraKostenIst;
  const kantenNettoIst = (parseFloat(nk.kantenLfmIst)||0)*DB.settings.kantenpreis;
  const puVerleimungIstAktiv = nk.puVerleimungIst!==undefined && nk.puVerleimungIst!==null ? nk.puVerleimungIst : !!geplant.puVerleimung;
  const puVerleimungKostenIst = puVerleimungIstAktiv && (parseFloat(nk.kantenLfmIst)||0)>0 ? Math.ceil((parseFloat(nk.kantenLfmIst)||0)/Math.max(1,DB.settings.puVerleimungSchwelleLfm))*DB.settings.puVerleimungPreis : 0;
  const zusatzposMitGewinnIst = (geplant.zusatzpositionen||[]).reduce((s,pos)=>{ const w=zusatzpositionIstWert(pos); const netto=w.menge*w.preis; return s+netto*(1+((pos.gewinnzuschlag??DB.settings.gewinnZusatz)/100)); },0)
    + nk.zusatzpositionenExtra.reduce((s,ex)=>{ const netto=(ex.menge||0)*(ex.preis||0); return s+netto*(1+(DB.settings.gewinnZusatz/100)); },0);
  const verkaufspreisIst = materialNettoIst*(1+DB.settings.gewinnMaterial/100)
    + (kantenNettoIst+puVerleimungKostenIst)*(1+DB.settings.gewinnKanten/100)
    + beschlagGesamtIst*(1+DB.settings.gewinnBeschlaege/100)
    + zusatzposMitGewinnIst
    + (parseFloat(nk.lieferkostenIst)||0) + (parseFloat(nk.kleinmaterialIst)||0) + ((parseFloat(nk.baustellenmontageKmIst)||0)*DB.settings.kmPauschale)
    + arbeitszeitGesamtIst + (parseFloat(nk.zusatzarbeiten)||0);

  const materialZeile = (label, feld, matFeld, sollFl, sollKosten, bereich, istKosten) => `
    <div class="checkline" style="flex-wrap:wrap;row-gap:4px">
      <span style="width:150px">${label}</span>
      <span class="small mono" style="margin-left:auto">Soll: ${sollFl.toFixed(2)} m² / ${fmtEUR(sollKosten)}</span>
      <select data-nk-mat="${matFeld}" style="width:220px">${matOptions(nk[matFeld], bereich)}</select>
      <input type="number" step="0.01" min="0" data-nk-m2="${feld}" value="${m2Ist(feld, sollFl).toFixed(2)}" style="width:75px">
      <span class="small">m² (inkl. Zuschlag)</span>
      <span class="small mono" data-nk-matkosten="${feld}" style="width:80px;text-align:right">${fmtEUR(istKosten)}</span>
    </div>`;
  const matOptAlle = sel => DB.materials.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${m.name} (${fmtEUR(m.preis)}/m²)</option>`).join('') || '<option value="">— keine Materialien —</option>';
  // Alle materialverbrauchenden Positionen (Korpus/Front/Rückwand + jede Zusatzplatte) EINHEITLICH zusammenfassen,
  // damit z.B. auch eine Zusatzplatte mit demselben Material wie Korpus/Front mit hineinfällt.
  const materialItems = [
    {key:'korpusM2Ist', label:'Korpusmaterial', sollFl:korpusFlInkl, sollKosten:geplant.korpusMaterialKosten, bereich:'Korpus', matId:geplant.materialKorpusId, ist:()=>({materialId:nk.korpusMaterialId, m2:m2Ist('korpusM2Ist',korpusFlInkl)})},
    {key:'frontM2Ist', label:'Frontmaterial', sollFl:frontFlInkl, sollKosten:geplant.frontMaterialKosten, bereich:'Front', matId:geplant.materialFrontId, ist:()=>({materialId:nk.frontMaterialId, m2:m2Ist('frontM2Ist',frontFlInkl)})},
    {key:'rueckwandM2Ist', label:'Rückwandmaterial', sollFl:rueckFlInkl, sollKosten:geplant.rueckwandMaterialKosten, bereich:'Rückwand', matId:geplant.materialRueckwandId, ist:()=>({materialId:nk.rueckwandMaterialId, m2:m2Ist('rueckwandM2Ist',rueckFlInkl)})},
    ...(geplant.zusatzPlatten||[]).map(pl=>({key:pl.key, label:pl.name||'Zusatzplatte', sollFl:pl.flaeche*zPn, sollKosten:pl.kosten, bereich:null, matId:pl.materialId, ist:()=>zusatzPlattenIstWert(pl)})),
  ];
  const materialGruppenAlle = [];
  const bereitsGruppiert = new Set();
  materialItems.forEach((it,i)=>{
    if(bereitsGruppiert.has(i)) return;
    const passende = [i];
    materialItems.forEach((it2,j)=>{ if(j>i && !bereitsGruppiert.has(j) && it.matId && it2.matId===it.matId) passende.push(j); });
    passende.forEach(m=>bereitsGruppiert.add(m));
    materialGruppenAlle.push(passende.map(idx=>materialItems[idx]));
  });
  const materialZeileEinheitlich = gruppe => {
    const erste = gruppe[0];
    const mehrfach = gruppe.length>1;
    const label = mehrfach ? gruppe.map(g=>g.label.replace('material','')).join(' + ') + ' (gleiches Material)' : erste.label;
    const sollFl = gruppe.reduce((s,g)=>s+g.sollFl,0);
    const sollKosten = gruppe.reduce((s,g)=>s+g.sollKosten,0);
    const ersteIst = erste.ist();
    const combinedM2 = gruppe.reduce((s,g)=>s+g.ist().m2,0);
    const kosten = materialZeileKosten(ersteIst.materialId, combinedM2);
    const keys = gruppe.map(g=>g.key).join(',');
    // Sobald eine Zusatzplatte Teil der Gruppe ist, alle Materialien zur Auswahl anbieten (nicht auf einen Bereich beschränkt)
    const hatZusatzplatte = gruppe.some(g=>g.bereich===null);
    const optionenHtml = hatZusatzplatte ? matOptAlle(ersteIst.materialId) : matOptions(ersteIst.materialId, erste.bereich);
    const m2ProStueck = findMat(ersteIst.materialId)?.m2ProStueck||0;
    return `<div class="nk-matgruppe">
    <div class="checkline" style="flex-wrap:wrap;row-gap:4px">
      <span style="width:150px">${label}</span>
      <select data-nk-mat="${keys}" style="width:220px">${optionenHtml}</select>
      <input type="number" step="0.01" min="0" data-nk-m2="${keys}" value="${combinedM2.toFixed(2)}" style="width:75px">
      <span class="small">m² (inkl. Zuschlag)</span>
      <span class="small mono" style="margin-left:auto">Soll: ${sollFl.toFixed(2)} m² / ${fmtEUR(sollKosten*(1+DB.settings.gewinnMaterial/100))}</span>
      <span class="small mono" data-nk-matkosten="${keys}" style="width:80px;text-align:right">${fmtEUR(kosten)}</span>
    </div>
    ${m2ProStueck>0 ? (()=>{
      const rekonstruiertStk = Math.round((combinedM2/m2ProStueck)*100)/100;
      const passtGenau = Math.abs(rekonstruiertStk - Math.round(rekonstruiertStk)) < 0.02;
      const stkAnzeige = passtGenau ? Math.round(rekonstruiertStk) : '';
      return `<div class="checkline" style="padding-left:24px">
      <span class="small">oder ganze Platten:</span>
      <input type="number" step="1" min="0" data-nk-stueck="${keys}" data-nk-stueck-m2="${m2ProStueck}" placeholder="0" value="${stkAnzeige}" style="width:60px">
      <span class="small">Stk × ${fmtM2(m2ProStueck)} = <span data-nk-stueck-ergebnis="${keys}">${stkAnzeige!==''?fmtM2(stkAnzeige*m2ProStueck):'—'}</span></span>
    </div>`;
    })() : ''}
    <div class="checkline"><b class="small">→ Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto" data-nk-matkosten-inkl="${keys}">${fmtEUR(kosten*(1+DB.settings.gewinnMaterial/100))}</b></div>
    </div>`;
  };
  // Reine Korpus/Front/Rückwand-Gruppen (keine Zusatzplatte dabei) oben in der Material-Karte zeigen;
  // Gruppen mit mind. einer Zusatzplatte (egal ob kombiniert mit Korpus/Front/Rückwand oder pur) unten bei den Zusatzplatten.
  const materialZeilenHtml = materialGruppenAlle.filter(g=>!g.some(it=>it.bereich===null)).map(materialZeileEinheitlich).join('');
  const zusatzPlattenZeilenHtml = (()=>{
    const gruppen = materialGruppenAlle.filter(g=>g.some(it=>it.bereich===null));
    if(!gruppen.length) return '';
    return gruppen.map(materialZeileEinheitlich).join('');
  })();
  const zusatzPlatteExtraZeile = (ex,i) => {
    const kosten = materialZeileKosten(ex.materialId, ex.m2||0);
    const m2ProStueck = findMat(ex.materialId)?.m2ProStueck||0;
    const rekonstruiertStk = m2ProStueck>0 ? Math.round(((ex.m2||0)/m2ProStueck)*100)/100 : 0;
    const passtGenau = m2ProStueck>0 && Math.abs(rekonstruiertStk - Math.round(rekonstruiertStk)) < 0.02;
    const stkAnzeige = passtGenau ? Math.round(rekonstruiertStk) : '';
    return `<div class="checkline" style="flex-wrap:wrap;row-gap:4px">
      <input type="text" style="width:150px" value="${ex.name||''}" data-nkzpx-name="${i}" placeholder="Bezeichnung">
      <select data-nkzpx-mat="${i}" style="width:220px">${matOptAlle(ex.materialId)}</select>
      <input type="number" step="0.01" min="0" data-nkzpx-m2="${i}" value="${ex.m2||0}" style="width:75px">
      <span class="small">m²</span>
      <span class="small mono" style="margin-left:auto">ungeplant, zusätzlich</span>
      <span class="small mono" data-nkzpx-kosten="${i}" style="width:80px;text-align:right">${fmtEUR(kosten)}</span>
      <button class="btn btn-ghost btn-sm" data-nkzpx-del="${i}">✕</button>
    </div>
    ${m2ProStueck>0 ? `<div class="checkline" style="padding-left:24px">
      <span class="small">oder ganze Platten:</span>
      <input type="number" step="1" min="0" data-nkzpx-stueck="${i}" data-nkzpx-stueck-m2="${m2ProStueck}" placeholder="0" value="${stkAnzeige}" style="width:60px">
      <span class="small">Stk × ${fmtM2(m2ProStueck)} = <span data-nkzpx-stueck-ergebnis="${i}">${stkAnzeige!==''?fmtM2(stkAnzeige*m2ProStueck):'—'}</span></span>
    </div>` : ''}
    <div class="checkline"><b class="small">→ Preis inkl. Zuschlag</b><b class="mono" style="margin-left:auto" data-nkzpx-kosten-inkl="${i}">${fmtEUR(kosten*(1+DB.settings.gewinnMaterial/100))}</b></div>`;
  };

  el.innerHTML = `
    <div class="pagehead"><div><h1>Nachkalkulation</h1><p>Vergleich geplant vs. tatsächlich, je Position — fließt in „Aus echten Aufträgen ableiten“ (Einstellungen) ein.</p></div>
      <select id="nkProjSelect">${kalkProjekte.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}</option>`).join('')}</select></div>

    <div class="card">
      <h3>🪵 Material — Soll vs. Ist</h3>
      <div class="small" style="margin-bottom:8px">Material frei wählbar (Standard = geplantes Material), Fläche in m² eintragen — der Preis wird automatisch berechnet.</div>
      ${materialZeilenHtml}
      ${zusatzPlattenZeilenHtml ? `<div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 4px;border-top:1px dashed var(--border);padding-top:10px">🪵 Zusätzliche Platten</div>
      <div id="nkZusatzPlattenList">${zusatzPlattenZeilenHtml}</div>` : ''}
      <div id="nkZusatzPlattenExtraList" style="margin-top:6px">
        ${nk.zusatzPlattenExtra.map(zusatzPlatteExtraZeile).join('')}

    <div class="card">
      <h3>🕐 Werkstatt-Verlauf — ${p.name}</h3>
      ${(()=>{
        const verlauf = nk.werkstattVerlauf || [];
        if(!verlauf.length) return `<div class="small">Noch keine Zeiterfassungen aus der Werkstatt-App — erscheinen hier automatisch (alle 30 Sekunden geprüft, kein Import nötig), inklusive eventueller Notizen.</div>`;
        // Nach Tag + Tätigkeit zusammenfassen, statt jeden einzelnen Werkstatt-Eintrag separat aufzulisten
        const gruppen = {};
        verlauf.forEach(z=>{
          const datum = z.datum ? new Date(z.datum).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
          const key = datum+'|'+z.schritt;
          if(!gruppen[key]) gruppen[key] = {datum, datumIso:z.datum||'', schritt:z.schritt, std:0, mitarbeiterSet:new Set(), notizen:[], ids:[]};
          gruppen[key].std += (z.dauerMin||0)/60;
          if(z.mitarbeiter) gruppen[key].mitarbeiterSet.add(z.mitarbeiter);
          if(z.notiz) gruppen[key].notizen.push(z.notiz);
          if(z.id) gruppen[key].ids.push(z.id);
        });
        const gruppenListe = Object.values(gruppen).sort((x,y)=>{
          if(x.datumIso!==y.datumIso) return y.datumIso.localeCompare(x.datumIso);
          // Bei gleichem Datum: die Gruppe mit dem zuletzt angelegten Eintrag zuerst zeigen (IDs enthalten
          // einen Zeitstempel-Anteil) — sonst würde der aktuellste Eintrag eines Tages immer ganz unten landen.
          const xNeuesteId = x.ids.reduce((a,b)=>a>b?a:b, '');
          const yNeuesteId = y.ids.reduce((a,b)=>a>b?a:b, '');
          return yNeuesteId.localeCompare(xNeuesteId);
        });
        const tagesgesamt = {};
        gruppenListe.forEach(g=>{ tagesgesamt[g.datum] = (tagesgesamt[g.datum]||0) + g.std; });
        let letztesDatum = null;
        return gruppenListe.map(g=>{
          const tagWechsel = g.datum !== letztesDatum;
          letztesDatum = g.datum;
          return `${tagWechsel ? `<div class="checkline" style="border-top:1px dashed var(--border);padding-top:8px;margin-top:8px"><b class="small">${g.datum}</b>${tagesgesamt[g.datum]>0?`<span class="small mono" style="margin-left:auto;opacity:.75">Tagesgesamt: ${fmtStdMin(tagesgesamt[g.datum])}</span>`:''}</div>` : ''}
          <div class="checkline" style="flex-wrap:wrap;row-gap:2px;align-items:flex-start">
            <span style="width:80px;flex-shrink:0"></span>
            <div style="flex:1;min-width:180px">
              <div class="small">${g.schritt}${g.std>0?`: <b>${fmtStdMin(g.std)}</b>`:''}</div>
              ${g.mitarbeiterSet.size?`<div class="small" style="color:var(--text-muted)">von ${[...g.mitarbeiterSet].join(', ')}</div>`:''}
              ${g.notizen.length?g.notizen.map(n=>`<div class="small" style="color:var(--accent-dark)">📝 ${escapeHtml(n)}</div>`).join(''):''}

          </div>`;}).join('');
      })()}

        </div>
